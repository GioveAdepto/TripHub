function cdfRows(){ return (CURRENT_DATA && CURRENT_DATA.CoseDaFare) || []; }
function cdfDated(rows){ return (rows||[]).filter(r=>toISODate(r.data)); }
function cdfIdeas(rows){ return (rows||[]).filter(r=>!toISODate(r.data)); }

/* ---------- durata: il campo resta testo libero, qui lo traduco in minuti ---------- */
const CDF_DURATE = ['30m','45m','1h','1h30','2h','3h','4h','Mezza giornata','Giornata intera'];
const CDF_DUR_DEF = 120;   // se non lo dici, conto due ore

function cdfDurMin(raw){
  const s = String(raw||'').trim().toLowerCase();
  if(!s) return null;
  if(/mezz[ao]\s*giornat/.test(s)) return 240;
  if(/giornat|tutto il giorno|full day/.test(s)) return 480;
  let m = s.match(/^(\d{1,2})\s*[h:]\s*(\d{1,2})\s*(?:m|min)?$/);        // 1h30 · 1:30
  if(m) return Number(m[1])*60 + Number(m[2]);
  m = s.match(/(\d{1,3})\s*(?:h\b|ore\b|ora\b)/);                        // 2h · 3 ore
  if(m) return Number(m[1])*60;
  m = s.match(/(\d{1,4})\s*(?:m\b|min)/);                                // 90m · 45 min
  if(m) return Number(m[1]);
  m = s.match(/^(\d{1,2})(?:[.,](\d))?$/);                               // "2" · "1,5" → ore
  if(m) return Math.round((Number(m[1]) + (m[2]?Number(m[2])/10:0))*60);
  return null;
}
function cdfNeed(r){ return cdfDurMin(r && r.durata) || CDF_DUR_DEF; }

/* ---------- fascia oraria preferita (campo "quando") ---------- */
const CDF_FASCE = {
  'Mattina presto':  [ 6*60, 10*60],
  'Mattina':         [ 9*60, 13*60],
  'Pranzo':          [12*60, 14*60+30],
  'Pomeriggio':      [14*60, 19*60],
  'Aperitivo':       [18*60, 20*60+30],
  'Sera':            [19*60, 23*60],
  'Tutto il giorno': [ 9*60, 19*60],
  'Indifferente':    [ 9*60, 21*60]
};
const CDF_FASCE_LIST = Object.keys(CDF_FASCE);
function cdfFascia(r){
  const q = String((r && r.quando) || '').trim().toLowerCase();
  return CDF_FASCE_LIST.find(k=>k.toLowerCase()===q) || 'Indifferente';
}
function cdfWin(r){ return CDF_FASCE[cdfFascia(r)]; }
// come lo diciamo all'utente: "in fascia indifferente" non vuol dire niente
function cdfFasciaLabel(r){
  const f = cdfFascia(r);
  return f==='Indifferente' ? 'a qualsiasi ora' : 'in fascia ' + f.toLowerCase();
}

function cdfCapFirst(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function hmToMin(hm){ const m = String(hm||'').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : null; }
function minToHM(v){
  const t = Math.max(0, Math.min(23*60+59, Math.round(Number(v)||0)));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

/* ---------- il perimetro: giorni del viaggio e orari dei voli scelti ---------- */
function cdfTripDays(){
  const t = CURRENT_TRIP || {};
  let a = toISODate(t.data_inizio), b = toISODate(t.data_fine);
  const dated = cdfDated(cdfRows()).map(r=>toISODate(r.data)).sort();
  if(!a) a = dated[0] || '';
  if(!b) b = dated[dated.length-1] || '';
  if(!a) return [];
  if(!b || b < a) b = isoAddDays(a, 6);
  const days = [];
  for(let d=a; d<=b && days.length<90; d=isoAddDays(d,1)) days.push(d);
  return days;
}

// Atterraggio dell'andata e decollo del ritorno (solo dai voli SCELTI):
// il primo e l'ultimo giorno non sono giornate piene e non vanno riempite.
function cdfTravelBounds(){
  const out = { arrISO:'', arrMin:null, depISO:'', depMin:null };
  const d = CURRENT_DATA; if(!d) return out;
  const groups = voliGroups(d.Voli||[]);
  Object.keys(groups).forEach(k=>{
    const legs = groups[k];
    if(!groupChosen(legs)) return;
    const A = legsOfDir(legs,'Andata'), R = legsOfDir(legs,'Ritorno');
    if(A.length){
      const last = A[A.length-1], iso = rowArrISO(last);
      if(iso && (!out.arrISO || iso > out.arrISO)){ out.arrISO = iso; out.arrMin = hmToMin(toHM(last.ora_arr)); }
    }
    if(R.length){
      const first = R[0], iso = toISODate(first.data_part);
      if(iso && (!out.depISO || iso < out.depISO)){ out.depISO = iso; out.depMin = hmToMin(toHM(first.ora_part)); }
    }
  });
  return out;
}

// Finestra utile della giornata, già tolti atterraggio (+1h30) e rientro (−3h).
function cdfDayWindow(iso, tb){
  tb = tb || cdfTravelBounds();
  let ws = 8*60, we = 23*60;
  const arrivo = !!(tb.arrISO && iso===tb.arrISO), partenza = !!(tb.depISO && iso===tb.depISO);
  if(arrivo   && tb.arrMin!=null) ws = Math.max(ws, tb.arrMin + 90);
  if(partenza && tb.depMin!=null) we = Math.min(we, tb.depMin - 180);
  return { ws, we, arrivo, partenza };
}

/* ---------- che cosa c'è già quel giorno ----------
   `extra` serve alla pianificazione in blocco: sono le attività appena
   proposte, non ancora salvate, che però devono già occupare spazio. */
function cdfDayItems(iso, exceptId, extra){
  const skip = String(exceptId||'');
  const add  = (extra||[]).filter(r=>toISODate(r.data)===iso && String(r.id)!==skip);
  const ids  = add.map(r=>String(r.id));
  return cdfRows()
    .filter(r=>toISODate(r.data)===iso && String(r.id)!==skip && ids.indexOf(String(r.id))<0)
    .concat(add);
}
function cdfBusy(items){
  return (items||[]).map(r=>{
    const s = hmToMin(toHM(r.ora));
    return s==null ? null : [s, s + cdfNeed(r)];
  }).filter(Boolean).sort((a,b)=>a[0]-b[0]);
}
const CDF_GAP = 30;   // mezz'ora di respiro fra una cosa e l'altra
function cdfGaps(ws, we, busy){
  const out = [];
  let cur = ws;
  busy.forEach(b=>{
    if(b[0] - CDF_GAP > cur) out.push([cur, b[0] - CDF_GAP]);
    cur = Math.max(cur, b[1] + CDF_GAP);
  });
  if(we > cur) out.push([cur, we]);
  return out.filter(g=>g[1] > g[0]);
}

// Miglior orario per QUESTA attività in QUEL giorno (null se non ci sta).
function cdfSlotFor(row, iso, tb, extra){
  const w = cdfDayWindow(iso, tb);
  if(w.we - w.ws < 45) return null;                   // giornata mangiata dal volo
  const items = cdfDayItems(iso, row && row.id, extra);
  const need  = cdfNeed(row);
  const gaps  = cdfGaps(w.ws, w.we, cdfBusy(items));
  const f = cdfWin(row), fs = f[0], fe = f[1];
  let best = null;
  gaps.forEach(g=>{
    const gs = g[0], ge = g[1];
    if(ge - gs < need) return;
    let st = Math.ceil(Math.max(gs, fs)/15)*15;
    if(st + need > ge) st = Math.floor((ge - need)/15)*15;
    if(st < gs || st + need > ge) return;
    const fuori = (st < fs ? fs - st : 0) + (st + need > fe ? (st + need) - fe : 0);
    if(!best || fuori < best.fuori || (fuori===best.fuori && st < best.start)) best = { start: st, fuori: fuori };
  });
  if(!best) return null;
  best.items   = items;
  best.busyMin = items.reduce((s,r)=>s + cdfNeed(r), 0);
  best.window  = w;
  return best;
}

/* ---------- il punteggio: perché un giorno è meglio di un altro ---------- */
function cdfScoreDay(row, iso, slot){
  const items = slot.items, why = [];
  let score = 100;

  score -= Math.min(24, Math.round(slot.busyMin/30) * 2);
  if(!items.length) why.push('giornata ancora libera');
  else if(items.length <= 2) why.push(items.length===1 ? 'una sola cosa già in programma' : 'giornata ancora tranquilla');
  else { score -= 12; why.push(items.length + ' attività già in programma'); }

  if(slot.fuori === 0) why.push(cdfFasciaLabel(row));
  else { score -= Math.min(30, Math.round(slot.fuori/8)); why.push('un po\' fuori dalla fascia preferita'); }

  const tipo = String(row.tipo||'').trim().toLowerCase();
  if(tipo && items.some(r=>String(r.tipo||'').trim().toLowerCase()===tipo)){
    score -= 8; why.push('stesso tipo di un\'altra attività del giorno');
  }
  const pos = String(row.posizione||'').trim().toLowerCase();
  if(pos && items.some(r=>String(r.posizione||'').trim().toLowerCase()===pos)){
    score += 10; why.push('stessa zona di quel giorno');
  }
  if(slot.window.arrivo){   score -= 14; why.push('giorno di arrivo'); }
  if(slot.window.partenza){ score -= 16; why.push('giorno di partenza'); }
  if(truthy(row.prenotazione_req) && !truthy(row.confermata) && slot.window.arrivo) score -= 6;

  const need = cdfNeed(row), tol = CDF_GAP + 15;
  if(items.some(r=>{
      const s = hmToMin(toHM(r.ora));
      if(s==null) return false;
      return Math.abs((s + cdfNeed(r)) - slot.start) <= tol || Math.abs((slot.start + need) - s) <= tol;
    })){ score += 6; why.push('si incastra con quello che c\'è già'); }

  return { score, why };
}

// Le proposte migliori, una per giorno, dalla più convincente.
function cdfSuggest(row, max, extra){
  const days = cdfTripDays();
  if(!days.length) return { days: 0, list: [], motivo: 'nodate' };
  const tb = cdfTravelBounds(), oggi = todayISO();
  const out = [];
  let futuri = 0;
  days.forEach(iso=>{
    if(iso < oggi) return;
    futuri++;
    const slot = cdfSlotFor(row, iso, tb, extra);
    if(!slot) return;
    const s = cdfScoreDay(row, iso, slot);
    out.push({ iso, start: slot.start, need: cdfNeed(row), score: s.score, why: s.why });
  });
  out.sort((a,b)=> b.score - a.score || a.iso.localeCompare(b.iso));
  return { days: days.length, list: out.slice(0, max||3), motivo: futuri ? (out.length?'':'pieno') : 'passato' };
}

      </div>

function ensureCdfMonth(){

    CDF_MONTH = new Date(base.getFullYear(), base.getMonth(), 1);
  }
}
function cdfMonthShift(delta){
  ensureCdfMonth();
  CDF_MONTH = new Date(CDF_MONTH.getFullYear(), CDF_MONTH.getMonth()+delta, 1);

// Prima quelle da prenotare (hanno una scadenza implicita), poi le più lunghe.
function cdfSortIdee(idee){
  return idee.slice().sort((a,b)=>{
    const p = (truthy(b.prenotazione_req)?1:0) - (truthy(a.prenotazione_req)?1:0);
    if(p) return p;
    const d = cdfNeed(b) - cdfNeed(a);
    if(d) return d;
    return String(a.attivita||'').localeCompare(String(b.attivita||''),'it');
  });
}

/* ---------- VISTA PROGRAMMA ---------- */
function cdfList(rows, tid){
  const withDate = cdfDated(rows).sort((a,b)=>{
    const d = toISODate(a.data).localeCompare(toISODate(b.data));
    return d!==0 ? d : (toHM(a.ora)||'99:99').localeCompare(toHM(b.ora)||'99:99');
  });
  const idee = cdfIdeas(rows);
  if(!withDate.length){
    return `<div class="sheet empty">
      <div class="big">Ancora niente in agenda</div>
      <div>${idee.length ? `Hai ${idee.length} ide${idee.length===1?'a':'e'} da collocare: apri <strong>Idee</strong> e usa ✨ per farti proporre giorno e ora.`
                         : 'Aggiungi la prima attività.'}</div></div>`;
  }
  const groups = {};
  withDate.forEach(r=>{ const k=toISODate(r.data); (groups[k] = groups[k] || []).push(r); });
  const dayBlocks = Object.keys(groups).sort().map(k=>{
    const min = groups[k].reduce((s,r)=>s + cdfNeed(r), 0);
    return `<div class="mb-3">
      <p class="eyebrow mb-2">${toITDateLong(k)}
        <span class="mono" style="text-transform:none;letter-spacing:0;color:var(--muted)">· ${groups[k].length} · ${fmtDur(min)}</span></p>
      ${groups[k].map(r=>cdfItem(r, false)).join('')}
    </div>`;
  }).join('');
  const link = idee.length ? `
    <div class="mt-2 pt-2" style="border-top:1px dashed var(--line)">
      <button class="btn btn-ghost btn-sm" onclick="setCdfView('idee')">
        💡 ${idee.length} ide${idee.length===1?'a':'e'} ancora senza data</button>
    </div>` : '';
  return `<div class="sheet p-3">${dayBlocks}${link}</div>`;
}

/* ---------- riga singola ---------- */
function cdfItem(r, isIdea){
  const conf = truthy(r.confermata);
  const ora  = toHM(r.ora);
  const dur  = cdfDurMin(r.durata);
  const meta = [
    r.posizione ? esc(r.posizione) : '',
    r.durata ? esc(r.durata) : '',
    isIdea ? (cdfFascia(r)!=='Indifferente' ? esc(cdfFascia(r).toLowerCase()) : '') : (r.quando ? esc(r.quando) : ''),
    num(r.costo) ? eur(r.costo) + (num(r.prezzo_testa)?` (${eur(r.prezzo_testa)} a testa)`:'') : ''
  ].filter(Boolean).join(' · ');
  const fine = (!isIdea && ora && dur) ? `<span class="mono" style="font-size:.7rem;color:var(--muted)"> → ${minToHM(hmToMin(ora)+dur)}</span>` : '';
  return `<div class="cdf-row">
    <span class="cdf-ico">${tipoIcon(r.tipo)}</span>
    <div class="cdf-main">
      <div style="font-weight:600">${ora?`<span class="mono" style="color:var(--stamp);font-size:.85rem">${esc(ora)}</span> `:''}${esc(r.attivita||'')}${fine}
        ${conf?'<span class="chip pick ms-1">✓</span>':''}
        ${truthy(r.prenotazione_req)&&!conf?'<span class="chip pri-cons ms-1">prenota</span>':''}</div>
      ${meta?`<div style="font-size:.82rem;color:var(--ink-soft)">${meta}</div>`:''}
      ${r.note?`<div style="font-size:.78rem;color:var(--muted);margin-top:.15rem">${esc(r.note)}</div>`:''}
    </div>
    <div class="cdf-acts">

}

/* ---------- VISTA CALENDARIO (+ striscia delle idee) ---------- */
function cdfCalendar(rows, tid){
  ensureCdfMonth();
  const y = CDF_MONTH.getFullYear(), mo = CDF_MONTH.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay()+6)%7;      // lun=0
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthName = CDF_MONTH.toLocaleDateString('it-IT', {month:'long', year:'numeric'});

  const byDay = {};
  cdfDated(rows).forEach(r=>{ const k=toISODate(r.data); (byDay[k] = byDay[k] || []).push(r); });

  const vStart = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio), vEnd = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine);
  const dow = ['lun','mar','mer','gio','ven','sab','dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = (byDay[iso]||[]).slice().sort((a,b)=>(toHM(a.ora)||'99:99').localeCompare(toHM(b.ora)||'99:99'));
    const inTrip = vStart && vEnd && iso>=vStart && iso<=vEnd;
    const chips = items.slice(0,3).map(r=>
      `<div class="cal-ev" title="${esc(r.attivita)}" onclick="event.stopPropagation();editRowById('CoseDaFare','${jsArg(r.id)}')">${tipoIcon(r.tipo)} ${esc((r.attivita||'').slice(0,14))}</div>`).join('');
    const more = items.length>3 ? `<div class="cal-more">+${items.length-3}</div>` : '';
    cells += `<div class="cal-cell${inTrip?' in-trip':''}${CDF_PICK?' droppable':''}"
      ondblclick="cdfQuickAdd('${iso}','${jsArg(tid)}')"
      onclick="cdfDayClick('${iso}')"
      ondragover="cdfDragOver(event)" ondragleave="this.classList.remove('over')"
      ondrop="cdfDrop(event,'${iso}')">
      <div class="cal-num">${d}</div>${chips}${more}
    </div>`;
  }

  return `
    <div class="sheet p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(-1)">‹</button>
        <strong style="font-family:'Fraunces',serif;text-transform:capitalize">${esc(monthName)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(1)">›</button>
      </div>
      <div class="cal-grid cal-head">${dow}</div>
      <div class="cal-grid">${cells}</div>
      <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
        doppio click su un giorno per aggiungere · giorni evidenziati = durata vacanza
      </p>
    </div>
    ${cdfRail(rows, tid)}`;
}

// La striscia delle idee sotto al calendario: trascinale su un giorno,
// oppure toccale (si "alzano") e poi tocca il giorno.
function cdfRail(rows, tid){
  const idee = cdfSortIdee(cdfIdeas(rows));
  if(!idee.length) return '';
  const chips = idee.map(r=>{
    const on = CDF_PICK && String(CDF_PICK)===String(r.id);
    return `<button class="cdf-chip${on?' on':''}" draggable="true"
      ondragstart="cdfDragStart(event,'${jsArg(r.id)}')" ondragend="cdfDragEnd()"
      onclick="cdfPickIdea('${jsArg(r.id)}')"
      title="${esc(r.attivita||'')}">${tipoIcon(r.tipo)} ${esc((r.attivita||'').slice(0,26))}
      <span class="mono">${fmtDur(cdfNeed(r))}</span></button>`;
  }).join('');
  return `<div class="sheet p-3 mt-3">
    <p class="eyebrow mb-2">💡 Da collocare · ${idee.length}</p>
    <div class="cdf-rail">${chips}</div>
    <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
      ${CDF_PICK ? 'ora tocca il giorno in cui vuoi metterla · <button class="btn btn-ghost btn-sm py-0" onclick="cdfPickIdea(\'\')">annulla</button>'
                 : 'trascina un\'idea su un giorno, oppure toccala e poi tocca il giorno'}
    </p>
  </div>`;
}

function cdfPickIdea(id){
  CDF_PICK = (id && String(CDF_PICK)!==String(id)) ? String(id) : null;
  renderSection('cosedafare', true);
}
function cdfDragStart(ev, id){
  CDF_PICK = String(id);
  try{ ev.dataTransfer.setData('text/plain', String(id)); ev.dataTransfer.effectAllowed='move'; }catch(_){}
}
function cdfDragEnd(){ document.querySelectorAll('.cal-cell.over').forEach(c=>c.classList.remove('over')); }
function cdfDragOver(ev){ if(!CDF_PICK) return; ev.preventDefault(); ev.currentTarget.classList.add('over'); }
function cdfDrop(ev, iso){
  ev.preventDefault();
  ev.currentTarget.classList.remove('over');
  let id = CDF_PICK;
  try{ id = ev.dataTransfer.getData('text/plain') || id; }catch(_){}
  if(id) cdfDropOn(id, iso);
}

// Assegna il giorno e ci mette anche l'ora, se in quel giorno c'è posto.
async function cdfDropOn(id, iso){
  const r = findRow('CoseDaFare', id);
  if(!r) return;
  const slot = cdfSlotFor(r, iso, cdfTravelBounds());
  CDF_PICK = null;
  await cdfApply(id, iso, slot ? slot.start : '',
    slot ? '' : 'quel giorno è pieno: l\'ho messa senza orario');
}

/* ---------- scrittura ---------- */
async function cdfApply(id, iso, startMin, avviso){
  const r = findRow('CoseDaFare', id);
  if(!r) return false;
  const rec = {
    id: r.id, viaggio_id: r.viaggio_id,
    data: iso || '',
    ora: (startMin===''||startMin==null) ? '' : minToHM(startMin)
  };
  try{
    await api('update', { sheet:'CoseDaFare', record: rec });
    applyLocal('CoseDaFare','update', rec);
    if(MODAL) MODAL.hide();
    toast(iso ? `${toITDateLong(iso)}${rec.ora?' · '+rec.ora:''} ✓${avviso?' — '+avviso:''}` : 'Rimessa fra le idee ✓','ok');
    refreshView();
    return true;
  }catch(e){
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
    return false;
  }
}

async function cdfUnschedule(id){
  if(!await askConfirm('Togliere la data e rimetterla fra le idee?')) return;
  await cdfApply(id, '', '');
}

let CDF_PLAN = [];
function cdfPlanAll(tid){

  ensureModal();
  const extra = [], scarti = [];

      CDF_PLAN.push({ r, iso: s.iso, start: s.start, need: s.need });
      extra.push({ id: r.id, data: s.iso, ora: minToHM(s.start), durata: r.durata, tipo: r.tipo, posizione: r.posizione });

    // una sola chiamata: con 'update' riga per riga sarebbero N invocazioni

    const records = picked.map(p=>({ id: p.r.id, data: p.iso, ora: minToHM(p.start) }));
    await api('update_many', { sheet:'CoseDaFare', records });
    records.forEach(rec=>applyLocal('CoseDaFare','update', rec));
    const ok = records.length;
    MODAL.hide();
    toast(`${ok} ${ok===1?'attività messa':'attività messe'} in calendario ✓`,'ok');
    setCdfView('lista');

}

/* ---------- aggiunta rapida delle idee ----------
   Sintassi:  Museo del Prado ~2h @Madrid #cultura !prenota €25        */
function cdfResolveTipo(tok){
  const t = String(tok||'').trim().toLowerCase();
  if(!t) return '';
  return TIPI_ATTIVITA.find(x=>x.toLowerCase()===t)
      || TIPI_ATTIVITA.find(x=>x.toLowerCase().startsWith(t))
      || tok.charAt(0).toUpperCase()+tok.slice(1);
}
function cdfParseLine(txt){
  return String(txt||'').split(/[,\n;]/).map(x=>x.trim()).filter(Boolean).map(part=>{
    let tipo='', pos='', dur='', costo='', pren='';
    part = part.replace(/!\s*(?:prenot\w*|book\w*)/gi, ()=>{ pren='Sì'; return ' '; });
    part = part.replace(/~\s*([\w:.]+)/g,  (m,g)=>{ dur   = g; return ' '; });
    part = part.replace(/#([\wÀ-ÿ'’-]+)/g, (m,g)=>{ tipo  = cdfResolveTipo(g); return ' '; });
    part = part.replace(/€\s*(\d+(?:[.,]\d{1,2})?)/g, (m,g)=>{ costo = parseNum(g); return ' '; });
    part = part.replace(/@([^@#~!€]+)/g,   (m,g)=>{ pos   = g.trim(); return ' '; });
    part = part.replace(/\s+/g,' ').trim();
    return { attivita: part, tipo, posizione: pos, durata: dur, costo, prenotazione_req: pren };
  }).filter(x=>x.attivita);
}

async function cdfAddFromBar(tid){
  const inp = document.getElementById('cdf_newitem');

  if(!inp) return;

  const txt = inp.value;

    viaggio_id: tid, data:'', ora:'',
    tipo: x.tipo || CDF_TIPO || '',
    attivita: x.attivita, posizione: x.posizione, durata: x.durata,
    costo: x.costo, prenotazione_req: x.prenotazione_req,
    quando: '', link:'', note:'', confermata:''
  }));
  try{
    const saved = await api('create_many', { sheet:'CoseDaFare', records });
    applyLocal('CoseDaFare','create_many', saved);
    renderSection('cosedafare', true);
    updateTabBadges();
    toast(saved.length>1 ? `${saved.length} idee aggiunte ✓` : 'Idea aggiunta ✓','ok');
  }catch(e){
    const again = document.getElementById('cdf_newitem');
    if(again){ again.disabled = false; again.value = txt; }
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
    return;
  }

  if(again) again.focus();
}

/* ============================================================
   COSA PORTARE — ripensata
   Cosa è cambiato rispetto a prima, e perché:
   · TUTTA la riga spunta la voce. Prima bisognava centrare un
     cerchietto di 24px con il pollice, in piedi, davanti alla valigia.
   · Barra di aggiunta unica in cima con la categoria a tendina:
     non serve più scorrere fino al blocco giusto per scrivere.
   · MODELLI pronti (mare, montagna, documenti, bimbi…): una lista
     decente in tre secondi invece che venti voci battute a mano.
   · Ricerca istantanea e azioni di categoria (spunta tutte / azzera).
   · Filtro, ricerca e categorie chiuse restano memorizzati sul
     dispositivo: riapri la sezione e ritrovi la tua vista.
   · Sintassi rapida:  2x telo mare @Marco !essenziale
   ============================================================ */
let CP_FILTER = 'tutti';       // 'tutti' | 'dafare' | 'fatti'
let CP_WHO    = null;          // null = non ancora letto da localStorage
let CP_CLOSED = {};            // categoria -> chiusa
let CP_CATS   = [];            // categorie nell'ordine mostrato
let CP_Q      = '';            // testo cercato
let CP_NEWCAT = '';            // categoria selezionata nella barra di aggiunta

  'Abbigliamento':'👕','Accessori':'🎒','Attrezzatura':'🧰','Bagaglio':'🧳','Bambini':'🧸',
  'Casa':'🏠','Cucina':'🍳','Documenti':'🪪','Elettronica':'🔌','Farmacia':'💊','Igiene':'🧴',
  'Intrattenimento':'🎧','Mare':'🏖️','Montagna':'⛰️','Scarpe':'👟','Sport':'⚽',
  'Tecnologia':'💻','Viaggio':'✈️'
};
function cpIcon(c){ return CP_ICON[String(c||'').trim()] || '📦'; }

/* preferenze di vista: restano su questo dispositivo, per viaggio */
function cpPrefKey(){ return 'triphub_cp_' + (CURRENT_TRIP ? CURRENT_TRIP.id : ''); }
function cpReset(){
  CP_FILTER='tutti'; CP_WHO=null; CP_CLOSED={}; CP_Q=''; CP_NEWCAT='';
  try{
    const raw = localStorage.getItem(cpPrefKey());
    if(raw){ const p = JSON.parse(raw); CP_FILTER = p.filter||'tutti'; CP_CLOSED = p.closed||{}; }
  }catch(_){}
}
function cpSavePrefs(){
  try{ localStorage.setItem(cpPrefKey(), JSON.stringify({filter:CP_FILTER, closed:CP_CLOSED})); }catch(_){}
}

function cpWhoKey(){ return 'triphub_who_' + (CURRENT_TRIP ? CURRENT_TRIP.id : ''); }
function cpWho(){
  if(CP_WHO === null){
    try { CP_WHO = localStorage.getItem(cpWhoKey()) || ''; } catch(_){ CP_WHO = ''; }
  }
  return CP_WHO;
}
function cpSetWho(v){
  CP_WHO = v || '';
  try { v ? localStorage.setItem(cpWhoKey(), v) : localStorage.removeItem(cpWhoKey()); } catch(_){}

}
function cpSetFilter(f){ CP_FILTER = f; cpSavePrefs(); renderSection('cosaportare'); }
function cpToggleCat(i){

  CP_CLOSED[c] = !CP_CLOSED[c];

  const el = $('#cp_cat_'+i);
  if(el) el.classList.toggle('closed', !!CP_CLOSED[c]);
  const h = $('#cp_head_'+i);
  if(h) h.setAttribute('aria-expanded', CP_CLOSED[c] ? 'false' : 'true');
}

// ricerca senza ridisegno: nasconde le righe e le categorie rimaste vuote
function cpSearch(q){

  let anyGlobal = 0;
  CP_CATS.forEach((cat,i)=>{
    const box = $('#cp_cat_'+i);
    if(!box) return;
    let vis = 0;
    box.querySelectorAll('.cp-row').forEach(row=>{
      const hit = !CP_Q || (row.getAttribute('data-s')||'').includes(CP_Q);
      row.style.display = hit ? '' : 'none';
      if(hit) vis++;
    });
    box.style.display = (CP_Q && !vis) ? 'none' : '';
    if(vis) anyGlobal++;
    if(CP_Q) box.classList.remove('closed');
    else box.classList.toggle('closed', !!CP_CLOSED[cat]);
  });
  const none = $('#cp_nores');
  if(none) none.style.display = (CP_Q && !anyGlobal) ? 'block' : 'none';
}

// una voce è "mia" se non ha destinatario, se è di tutti, o se mi nomina
function cpMine(r, me){
  if(!me) return true;
  const s = String(r.chi||'').trim();
  if(!s || s.toLowerCase()==='tutti') return true;
  return s.split(',').map(x=>x.trim()).includes(me);
}
function cpPriRank(r){
  const s = String(r.priorita||'').toLowerCase();
  if(s.includes('essenz')) return 0;
  if(s.includes('consig')) return 1;
  return 2;
}
function cpPriClass(r){
  const s = String(r.priorita||'').toLowerCase();
  return s.includes('essenz') ? ' pri-ess' : s.includes('consig') ? ' pri-cons' : '';
}

function cpRing(done, tot){
  const pct = tot ? done/tot : 0;
  const r = 26, c = 2*Math.PI*r;
  return `<svg width="66" height="66" viewBox="0 0 64 64" class="cp-ring" role="img"
      aria-label="${done} di ${tot} preparati">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="7"/>
    <circle id="cp_arc" cx="32" cy="32" r="${r}" fill="none" stroke="${pct>=1?'var(--ok)':'var(--stamp)'}"
      stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" transform="rotate(-90 32 32)"
      style="transition:stroke-dashoffset .3s ease"/>
    <text id="cp_pct" x="32" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace"
      font-size="14" font-weight="500" fill="var(--ink)">${Math.round(pct*100)}%</text>
  </svg>`;
}

function cpKnownCats(rows){
  const seen = {};
  (rows||[]).forEach(r=>{ const c=String(r.categoria||'Varie').trim()||'Varie'; seen[c]=true; });
  CATEGORIE_PORTARE.forEach(c=>seen[c]=true);
  return Object.keys(seen).sort((a,b)=>a.localeCompare(b,'it'));
}

function secCosaPortare(rows, tid){
  rows = rows || [];
  const me = cpWho();
  const people = partList(CURRENT_DATA).map(pName);

  const mine    = rows.filter(r=>cpMine(r, me));
  const done    = mine.filter(r=>truthy(r.spuntato)).length;
  const tot     = mine.length;
  const visible = mine.filter(r=>
    CP_FILTER==='fatti'  ? truthy(r.spuntato) :
    CP_FILTER==='dafare' ? !truthy(r.spuntato) : true);

  const whoSel = people.length ? `
    <select class="form-select form-select-sm" style="max-width:190px" aria-label="Filtra per persona"
      onchange="cpSetWho(this.value)">
      <option value="">Tutta la lista</option>
      ${people.map(n=>`<option value="${esc(n)}"${n===me?' selected':''}>Solo di ${esc(n)}</option>`).join('')}
    </select>` : '';

  const cats = cpKnownCats(rows);
  const addBar = `
    <div class="sheet p-2 p-md-3 mb-3">
      <div class="cp-addbar">
        <select class="form-select form-select-sm" id="cp_newcat" aria-label="Categoria">
          ${cats.map(c=>`<option value="${esc(c)}"${c===CP_NEWCAT?' selected':''}>${cpIcon(c)} ${esc(c)}</option>`).join('')}
        </select>
        <input class="form-control form-control-sm grow" id="cp_newitem"
          placeholder="cosa serve?  es: 2x telo mare, crema solare @Marco !essenziale"
          aria-label="Nuova voce"
          onkeydown="if(event.key==='Enter'){event.preventDefault();cpAddGlobal('${jsArg(tid)}')}">
        <button class="btn btn-stamp btn-sm" onclick="cpAddGlobal('${jsArg(tid)}')">+ Aggiungi</button>
        <button class="btn btn-ghost btn-sm" onclick="cpTemplateModal('${jsArg(tid)}')">✨ Modelli</button>
      </div>
      <div class="cp-hint">separa con la virgola per più voci · <strong>2x</strong> quantità ·
        <strong>@nome</strong> a chi tocca · <strong>!essenziale</strong> priorità</div>
    </div>`;

  const header = `
    <div class="sheet p-3 p-md-4 mb-3">
      <div class="cp-head">
        ${cpRing(done, tot)}
        <div style="flex:1;min-width:140px">
          <div class="cp-count" id="cp_count">${done} di ${tot} ${tot===1?'cosa pronta':'cose pronte'}</div>
          <div class="cp-sub" id="cp_sub">${
            !tot ? 'la lista è ancora vuota'
            : done===tot ? '<span class="cp-done-all">✓ valigia completa, si parte</span>'
            : `mancano ${tot-done} ${tot-done===1?'voce':'voci'}${me?` per ${esc(me)}`:''}`
          }</div>
        </div>
        <div class="d-flex gap-2 flex-wrap align-items-center">
          ${whoSel}
        </div>
      </div>
      ${tot ? `<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mt-3">
        <div class="cp-filters">
          <button class="cp-fil${CP_FILTER==='tutti'?' on':''}" onclick="cpSetFilter('tutti')">Tutte · ${tot}</button>
          <button class="cp-fil${CP_FILTER==='dafare'?' on':''}" onclick="cpSetFilter('dafare')">Da preparare · ${tot-done}</button>
          <button class="cp-fil${CP_FILTER==='fatti'?' on':''}" onclick="cpSetFilter('fatti')">Fatte · ${done}</button>
        </div>
        <input class="form-control form-control-sm cp-search" type="search" placeholder="🔎 cerca nella lista"
          aria-label="Cerca" value="${esc(CP_Q)}" oninput="cpSearch(this.value)">
      </div>` : ''}
    </div>`;

  if(!rows.length){
    CP_CATS = [];
    return header + addBar + `<div class="sheet empty"><div class="big">La valigia è vuota</div>
      <div>Scrivi qui sopra cosa serve, oppure parti da un modello già pronto.</div>
      <button class="btn btn-stamp mt-3" onclick="cpTemplateModal('${jsArg(tid)}')">✨ Parti da un modello</button></div>`;
  }

  // raggruppa per categoria; i conteggi restano su TUTTE le voci della persona,
  // così i numeri non ballano quando cambi filtro
  const byCat = {};
  visible.forEach(r=>{ const k = String(r.categoria||'Varie').trim() || 'Varie'; (byCat[k] = byCat[k] || []).push(r); });
  const allByCat = {};
  mine.forEach(r=>{ const k = String(r.categoria||'Varie').trim() || 'Varie'; (allByCat[k] = allByCat[k] || []).push(r); });

  CP_CATS = Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'it'));

  if(!CP_CATS.length){
    return header + addBar + `<div class="sheet empty"><div class="big">${
      CP_FILTER==='fatti' ? 'Niente di spuntato, per ora' : 'Tutto pronto ✓'}</div>
      <div>Cambia filtro per vedere il resto della lista.</div></div>`;
  }

  const blocks = CP_CATS.map((cat,i)=>{
    const all  = allByCat[cat] || [];
    const dn   = all.filter(r=>truthy(r.spuntato)).length;
    const pct  = all.length ? Math.round(dn/all.length*100) : 0;
    const items = byCat[cat].slice().sort((a,b)=>
      (truthy(a.spuntato)?1:0)-(truthy(b.spuntato)?1:0)
      || cpPriRank(a)-cpPriRank(b)
      || String(a.cosa||'').localeCompare(String(b.cosa||''),'it'));
    const closed = !!CP_CLOSED[cat];
    return `<div class="sheet p-2 p-md-3 cp-cat${closed?' closed':''}" id="cp_cat_${i}">
      <div class="cp-cat-head">
        <button class="cp-cat-toggle" id="cp_head_${i}" onclick="cpToggleCat(${i})"
          aria-expanded="${closed?'false':'true'}" aria-controls="cp_body_${i}">
          <span class="cp-cat-ico">${cpIcon(cat)}</span>
          <span class="cp-cat-name">${esc(cat)}</span>
          <span class="cp-cat-n" id="cp_catn_${i}">${dn}/${all.length}</span>
          <span class="cp-caret">▾</span>
        </button>
        <div class="cp-cat-acts">
          <button class="icon-btn" title="Spunta tutta la categoria" onclick="cpBulk(${i},true)">✓</button>
          <button class="icon-btn" title="Azzera la categoria" onclick="cpBulk(${i},false)">↺</button>
        </div>
      </div>
      <div class="cp-bar${pct===100?' full':''}" id="cp_bar_${i}"><i style="width:${pct}%"></i></div>
      <div class="cp-body" id="cp_body_${i}">
        ${items.map(r=>cpRow(r)).join('')}
        <div class="cp-add">
          <input type="text" id="cp_add_${i}" placeholder="+ aggiungi a ${esc(cat.toLowerCase())}…"
            aria-label="Aggiungi voce a ${esc(cat)}"
            onkeydown="if(event.key==='Enter'){event.preventDefault();cpQuickAdd(${i},'${jsArg(tid)}')}">
        </div>
      </div>
    </div>`;
  }).join('');

  const nores = `<div class="sheet empty" id="cp_nores" style="display:none">
    <div class="big">Nessuna voce trovata</div></div>`;

  return header + addBar + blocks + nores;
}

function cpRow(r){
  const on = truthy(r.spuntato);
  const qta = Math.round(num(r.qta));
  const chi = String(r.chi||'').trim();
  const chiTag = (chi && chi.toLowerCase()!=='tutti')
    ? chi.split(',').map(x=>`<span class="cp-who">${esc(x.trim())}</span>`).join('') : '';
  const pri = String(r.priorita||'').trim();
  const priTag = pri ? `<span class="chip ${cpPriRank(r)===0?'pri-ess':cpPriRank(r)===1?'pri-cons':''}">${esc(pri)}</span>` : '';
  const searchKey = [r.cosa,r.note,chi,pri].map(x=>String(x||'').toLowerCase()).join(' ');
  return `<div class="cp-row${on?' done':''}${cpPriClass(r)}" id="cp_row_${jsArg(r.id)}"
      data-s="${esc(searchKey)}" role="checkbox" aria-checked="${on}" tabindex="0"
      onclick="cpToggle('${jsArg(r.id)}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cpToggle('${jsArg(r.id)}')}">
    <span class="cp-check" aria-hidden="true" id="cp_chk_${jsArg(r.id)}" aria-checked="${on}"></span>
    <div class="cp-main">
      <div class="cp-name">${esc(r.cosa||'(senza nome)')}${qta>1?`<span class="cp-qta">×${qta}</span>`:''}</div>
      ${(chiTag||priTag)?`<div class="cp-tags">${priTag}${chiTag}</div>`:''}
      ${r.note?`<div class="cp-note">${esc(r.note)}</div>`:''}
    </div>
    <div class="cp-acts" onclick="event.stopPropagation()">
      <button class="icon-btn" title="Modifica" aria-label="Modifica ${esc(r.cosa||'voce')}"
        onclick="editRowById('CosaPortare','${jsArg(r.id)}')">✎</button>
      <button class="icon-btn" title="Elimina" aria-label="Elimina ${esc(r.cosa||'voce')}"
        onclick="delRow('CosaPortare','${jsArg(r.id)}')">🗑</button>
    </div>
  </div>`;
}

/* Spunta una voce: aggiorna la riga sul posto (niente salto sotto il dito)
   e ricalcola solo i numeri. */
async function cpToggle(id){
  const r = findRow('CosaPortare', id);
  if(!r) return;
  const prev = r.spuntato;
  const next = truthy(prev) ? '' : 'Sì';
  r.spuntato = next;
  cpPaintRow(r);
  cpPaintCounts();
  updateTabBadges();
  try{
    await api('update', { sheet:'CosaPortare', record:{ id, viaggio_id:r.viaggio_id, spuntato:next } });
  }catch(e){
    r.spuntato = prev;
    cpPaintRow(r); cpPaintCounts(); updateTabBadges();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

function cpPaintRow(r){
  const on = truthy(r.spuntato);
  const row = document.getElementById('cp_row_'+r.id);
  const chk = document.getElementById('cp_chk_'+r.id);
  if(row){ row.classList.toggle('done', on); row.setAttribute('aria-checked', on?'true':'false'); }
  if(chk) chk.setAttribute('aria-checked', on ? 'true' : 'false');
}

/* Ricalcola anello, testo e barre di categoria senza ricostruire le righe. */
function cpPaintCounts(){
  const me = cpWho();
  const mine = (CURRENT_DATA.CosaPortare||[]).filter(r=>cpMine(r, me));
  const tot = mine.length, done = mine.filter(r=>truthy(r.spuntato)).length;

  const arc = document.getElementById('cp_arc');
  if(arc){
    const c = 2*Math.PI*26, pct = tot ? done/tot : 0;
    arc.setAttribute('stroke-dashoffset', (c*(1-pct)).toFixed(1));
    arc.setAttribute('stroke', pct>=1 ? 'var(--ok)' : 'var(--stamp)');
    const t = document.getElementById('cp_pct');
    if(t) t.textContent = Math.round(pct*100)+'%';
  }
  const cnt = document.getElementById('cp_count');
  if(cnt) cnt.textContent = `${done} di ${tot} ${tot===1?'cosa pronta':'cose pronte'}`;
  const sub = document.getElementById('cp_sub');
  if(sub) sub.innerHTML = !tot ? 'la lista è ancora vuota'
    : done===tot ? '<span class="cp-done-all">✓ valigia completa, si parte</span>'
    : `mancano ${tot-done} ${tot-done===1?'voce':'voci'}${me?` per ${esc(me)}`:''}`;

  CP_CATS.forEach((cat,i)=>{
    const all = mine.filter(r=>(String(r.categoria||'Varie').trim()||'Varie')===cat);
    const dn = all.filter(r=>truthy(r.spuntato)).length;
    const n = document.getElementById('cp_catn_'+i);
    if(n) n.textContent = `${dn}/${all.length}`;
    const bar = document.getElementById('cp_bar_'+i);
    if(bar){
      const pct = all.length ? Math.round(dn/all.length*100) : 0;
      bar.classList.toggle('full', pct===100);
      const fill = bar.querySelector('i');
      if(fill) fill.style.width = pct+'%';
    }
  });
}

/* Spunta/azzera un'intera categoria con una sola chiamata */
async function cpBulk(i, on){
  const cat = CP_CATS[i];
  if(!cat) return;
  const me = cpWho();
  const items = (CURRENT_DATA.CosaPortare||[]).filter(r=>
    cpMine(r,me) && (String(r.categoria||'Varie').trim()||'Varie')===cat && truthy(r.spuntato)!==!!on);
  if(!items.length) return;
  const before = items.map(r=>r.spuntato);
  items.forEach(r=>{ r.spuntato = on ? 'Sì' : ''; cpPaintRow(r); });
  cpPaintCounts(); updateTabBadges();
  try{
    await api('set_flags', { sheet:'CosaPortare', field:'spuntato',
      values: items.map(r=>({id:r.id, value: on?'Sì':''})) });
    toast(on?`"${cat}" tutto pronto ✓`:`"${cat}" azzerata`,'ok');
  }catch(e){
    items.forEach((r,k)=>{ r.spuntato = before[k]; cpPaintRow(r); });
    cpPaintCounts(); updateTabBadges();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

/* Aggiunta rapida.
   "2x telo mare @Marco !essenziale, crema" crea due voci ben formate. */
function cpNormPri(s){
  const x = String(s||'').toLowerCase();
  if(x.startsWith('ess')) return 'Essenziale';
  if(x.startsWith('con')) return 'Consigliato';
  if(x.startsWith('opz')) return 'Opzionale';
  return '';
}
function cpResolvePerson(tok){
  const people = partList(CURRENT_DATA).map(pName);
  const t = String(tok||'').toLowerCase();
  const hit = people.find(n=>n.toLowerCase()===t)
           || people.find(n=>n.toLowerCase().split(' ')[0]===t)
           || people.find(n=>n.toLowerCase().startsWith(t));
  return hit || tok;
}
function cpParseLine(txt){
  return String(txt||'').split(/[,\n;]/).map(x=>x.trim()).filter(Boolean).map(part=>{
    let pri = '', chi = [];
    part = part.replace(/!([\wàèéìòù]+)/gi, (m,g)=>{ pri = cpNormPri(g) || pri; return ' '; });
    part = part.replace(/@([\wÀ-ÿ'’.-]+)/g, (m,g)=>{ chi.push(cpResolvePerson(g)); return ' '; });
    part = part.replace(/\s+/g,' ').trim();
    const m = part.match(/^(\d{1,3})\s*[x×]\s*(.+)$/i);
    return {
      cosa: m ? m[2].trim() : part,
      qta:  m ? Number(m[1]) : '',
      priorita: pri,
      chi: chi.join(', ')
    };
  }).filter(x=>x.cosa);
}

async function cpAddItems(tid, cat, parsed, restore){
  const me = cpWho();
  const records = parsed.map(x=>({
    viaggio_id: tid, categoria: cat, cosa: x.cosa, qta: x.qta,
    chi: x.chi || me || '', priorita: x.priorita || '', spuntato: '', note: ''
  }));
  try{
    const saved = await api('create_many', { sheet:'CosaPortare', records });
    applyLocal('CosaPortare','create_many', saved);
    renderSection('cosaportare', true);
    updateTabBadges();
    toast(saved.length>1 ? `${saved.length} voci aggiunte ✓` : 'Aggiunto ✓','ok');
    return saved;
  }catch(e){
    if(restore) restore();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
    return null;
  }
}

async function cpQuickAdd(i, tid){
  const box = document.getElementById('cp_add_'+i);
  if(!box) return;
  const parsed = cpParseLine(box.value);
  if(!parsed.length) return;
  const cat = CP_CATS[i] || 'Varie';
  const txt = box.value;
  box.value = ''; box.disabled = true;
  await cpAddItems(tid, cat, parsed, ()=>{ box.disabled=false; box.value = txt; });
  const again = document.getElementById('cp_add_'+i);
  if(again) again.focus();       // resta pronto per la voce successiva
}

async function cpAddGlobal(tid){
  const inp = document.getElementById('cp_newitem');
  const sel = document.getElementById('cp_newcat');
  if(!inp || !sel) return;
  const parsed = cpParseLine(inp.value);
  if(!parsed.length) return;
  CP_NEWCAT = sel.value || 'Varie';
  const txt = inp.value;
  inp.value = ''; inp.disabled = true;
  await cpAddItems(tid, CP_NEWCAT, parsed, ()=>{ inp.disabled=false; inp.value=txt; });
  const again = document.getElementById('cp_newitem');
  if(again) again.focus();
}

  'Emergenza','Salute','Ambasciata','Alloggio','Trasporti','Noleggio',
  'Tour e guide','Ristorante','Attività','Assicurazione','Banca','Informazioni','Altro'

// Normalizza un numero: tiene solo cifre e un "+" in testa, e traduce
// il prefisso internazionale "00" in "+" (così WhatsApp funziona comunque).
function telDigits(v){
  let s = String(v==null?'':v).trim().replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
  if(/^00\d/.test(s)) s = '+' + s.slice(2);
  return s;
}
function telHref(v){
  const s = telDigits(v);
  return s.length>=3 ? 'tel:'+s : '';
}
function waHref(v){
  const s = telDigits(v);
  return /^\+\d{8,}$/.test(s) ? 'https://wa.me/'+s.slice(1) : '';
}

function secContatti(rows, tid){
  rows = (rows||[]).slice();

  const blocks = cats.map(cat=>{

    return `<div class="sheet p-2 p-md-3 mb-3 cnt-group" data-cat="${esc(cat)}">

  return `

      <p class="eyebrow mb-0">${rows.length} contatt${rows.length===1?'o':'i'}</p>

      </div>

    ${rows.length?`<div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
      <input class="form-control form-control-sm" id="cntSearch" style="max-width:230px"
        placeholder="cerca nome o numero…" oninput="cntApply()">
      <span class="filter-chip${CNT_FILTER===''?' on':''}" onclick="cntFilter('')">tutti</span>
      ${cats.filter(c=>c).map(c=>`<span class="filter-chip${CNT_FILTER===c?' on':''}" onclick="cntFilter('${jsArg(c)}')">${cntIcon(c)} ${esc(c)}</span>`).join('')}
    </div>`:''}
    ${rows.length?blocks:`<div class="sheet empty"><div class="big">Nessun contatto</div>
      <div>Metti qui i numeri che ti servirebbero di corsa: emergenze, host, taxi, assicurazione.</div></div>`}`;

function cntFilter(cat){ CNT_FILTER = cat; renderSection('contatti', true); cntApply(); }

// filtro dal vivo, senza ridisegnare: la casella di ricerca non perde il fuoco
function cntApply(){
  const box = $('#cntSearch');
  const q = box ? box.value.trim().toLowerCase() : '';
  document.querySelectorAll('.cnt-group').forEach(g=>{
    let visible = 0;
    g.querySelectorAll('.cnt-card').forEach(c=>{
      const okCat = !CNT_FILTER || c.getAttribute('data-cat')===CNT_FILTER;
      const okQ   = !q || (c.getAttribute('data-q')||'').includes(q);
      const show  = okCat && okQ;
      c.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    g.style.display = visible ? '' : 'none';
  });
}

function infoEditVal(id){
  const box = document.getElementById('iv_'+id);
  if(!box || box.querySelector('input')) return;
  const rec = findRow('InfoDest', id) || {};
  const old = String(rec.valore||'');
  box.classList.remove('vuoto');
  box.innerHTML = `<input value="${esc(old)}">`;
  const inp = box.querySelector('input');
  inp.focus(); inp.select();
  let done = false;
  const finish = async (save)=>{
    if(done) return; done = true;
    const val = inp.value.trim();
    if(!save || val===old.trim()){ renderSection('info', true); return; }
    try{
      const out = { id, viaggio_id: rec.viaggio_id, sezione: rec.sezione, chiave: rec.chiave, valore: val, link: rec.link||'' };
      await api('update',{sheet:'InfoDest',record:out});
      applyLocal('InfoDest','update',out);
      renderSection('info', true);
    }catch(e){
      if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
      renderSection('info', true);
    }
  };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', ()=>finish(true));
}

/* ---------- conversioni data / ora / numeri ---------- */
function toISODate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))            return m[1]+'-'+m[2]+'-'+m[3];
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){
    let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0');
  }
  return '';
}

function toITDate(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}

function toITDateLong(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
}

function toHM(raw){
  if(!raw) return '';
  const m = String(raw).trim().match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0')+':'+m[2] : '';
}

// somma giorni a una data ISO restando in ora locale (niente drift UTC)
function isoAddDays(iso, days){
  if(!iso) return '';
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function parseNum(raw){
  if(raw === '' || raw == null) return '';
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if(s === '') return '';
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? '' : n;
}

function fmtNumIT(n){
  if(n === '' || n == null || isNaN(n)) return '';
  return Number(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function round2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }

/* -------- AUTO-CALCOLO totale <-> a testa -------- */
function recalc(sheet, changed){
  const g = id => { const el = $('#f_'+id); return el ? parseNum(el.value) : ''; };
  const set = (id,val) => { const el = $('#f_'+id); if(el && document.activeElement!==el) el.value = fmtNumIT(val); };
  const persone = g('persone') || g('n_persone') || 0;

  if(sheet==='CoseDaFare'){
    const cost=g('costo'), pt=g('prezzo_testa');
    let total = cost;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='costo')        set('costo', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  } else {
    const tot=g('totale'), pt=g('prezzo_testa');
    let total = tot;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale')       set('totale', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  }
}

  const totEl = $('#f_totale'); const ptEl = $('#f_prezzo_testa');

  const tot = parseNum(totEl.value);
  const n = payCountInForm(field);

    ptEl.value = fmtNumIT(round2(tot/n));

  return MODAL;
}

// Apre l'editor cercando il record in memoria per id (niente JSON negli onclick)
function editRowById(sheet, id){

    ? (RUBRICA||[]).find(x=>String(x.id)===String(id))

function editRow(sheet, record, tid){
  if(sheet==='Voli') return editVolo(record, tid);
  if(sheet==='Alloggi') return editAlloggio(record, tid);
  ensureModal();
  const isNew = !record || !record.id;
  const rec = record || (sheet==='Rubrica' ? {} : { viaggio_id: tid });
  let fields = (FIELD_ORDER[sheet] || []).slice();
  if(sheet==='Viaggi' && !isAdmin()) fields = fields.filter(f=>f!=='codice');
  $('#mTitle').textContent = (isNew?'Nuovo · ':'Modifica · ') + (sheet==='Rubrica'?'Rubrica':sheet);
  $('#mSave').textContent = 'Salva';
  $('#mBody').innerHTML = fields.map(f=>{
    const v = rec[f] != null ? rec[f] : '';
    if(BOOL_FIELDS.includes(f)){
      return `<div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="f_${f}" ${truthy(v)?'checked':''}>
        <label class="form-check-label" for="f_${f}">${esc(lbl(f))}</label></div>`;
    }
    if(AREA_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <textarea class="form-control" id="f_${f}" rows="2">${esc(v)}</textarea></div>`;
    }
    if(f==='codice'){
      return `<div class="mb-2"><label class="form-label">codice di accesso
        <span style="font-weight:400;color:var(--muted);font-size:.7rem">— con questo si entra SOLO in questo viaggio</span></label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">🔑</span>
          <input class="form-control mono" id="f_codice" value="${esc(v)}" placeholder="lascia vuoto: lo genero io">
          <button class="btn btn-ghost" type="button" onclick="genCodeInto()">genera</button>
        </div></div>`;
    }
    if(f==='data' && sheet==='CoseDaFare'){
      return `<div class="mb-2"><label class="form-label">data
        <span style="font-weight:400;color:var(--muted);font-size:.7rem">— lasciala vuota: resta fra le idee</span></label>
        <input class="form-control" id="f_data" type="date" value="${esc(toISODate(v))}"></div>`;
    }
    if(DATE_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="date" value="${esc(toISODate(v))}"></div>`;
    }
    if(TIME_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="time" value="${esc(toHM(v))}"></div>`;
    }
    const selKey = f==='categoria' && sheet==='CosaPortare' ? 'categoria_portare' : f;
    if(SELECT_LISTS[selKey]){
      const opts = SELECT_LISTS[selKey];
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <select class="form-select" id="f_${f}">
          <option value="">${f==='stato'?'— automatico dalle date —':'— scegli —'}</option>
          ${opts.map(o=>`<option value="${esc(o)}"${String(v)===o?' selected':''}>${esc(o)}</option>`).join('')}
          ${v && !opts.includes(String(v))?`<option value="${esc(v)}" selected>${esc(v)} (attuale)</option>`:''}
        </select></div>`;
    }
    if(f==='pagato_da'){
      return `<div class="mb-2">${pagatoDaSelect('f_'+f, v, lbl(f))}</div>`;
    }
    if(f==='paganti' || f==='chi'){
      const people = partList(CURRENT_DATA).map(pName);
      const selected = payerNames(v, people);
      const allSel = !String(v||'').trim() || String(v).toLowerCase()==='tutti';
      if(!people.length){
        return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
          <input class="form-control" id="f_${f}" type="text" value="${esc(v)}" placeholder="aggiungi prima i partecipanti">

      }
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <div class="sheet p-2" id="f_${f}_box" data-field="${f}">
          <div class="form-check">
            <input class="form-check-input pay-all" type="checkbox" id="f_${f}_all" ${allSel?'checked':''} onchange="togglePayAll(this,'${f}')">
            <label class="form-check-label" for="f_${f}_all"><strong>Tutti</strong></label>
          </div>
          <hr class="my-1" style="border-color:var(--line)">
          ${people.map((n,i)=>`<div class="form-check">
            <input class="form-check-input pay-one" type="checkbox" id="f_${f}_${i}" value="${esc(n)}" ${(!allSel && selected.includes(n))?'checked':''} ${allSel?'disabled':''} onchange="onPayOne('${f}')">
            <label class="form-check-label" for="f_${f}_${i}">${esc(n)}</label></div>`).join('')}
        </div>
        <div class="mono" style="font-size:.68rem;color:var(--muted);margin-top:.2rem">seleziona chi partecipa a questa voce · "Tutti" = alla pari</div>
      </div>`;
    }
    if(AIRLINE_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" list="airlines" value="${esc(v)}" placeholder="scegli o scrivi…"></div>`;
    }
    if(f==='durata'){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_durata" list="dl_durata" value="${esc(v)}" placeholder="es. 2h">
        ${durataDatalist()}</div>`;
    }
    if(LINK_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">🔗</span>
          <input class="form-control" id="f_${f}" type="url" value="${esc(v)}" placeholder="https://…" inputmode="url">
        </div></div>`;
    }
    if(INT_FIELDS.includes(f)){
      const iv = v!=='' ? Math.round(parseNum(v)) : '';
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="number" step="1" min="0" inputmode="numeric" value="${iv!==''&&!isNaN(iv)?iv:''}"></div>`;
    }
    if(CUR_FIELDS.includes(f)){
      const hint = f==='prezzo_testa' ? 'auto dal totale'
                 : f==='totale' ? 'oppure compila "a testa"' : '';
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}${hint?` <span style="font-weight:400;color:var(--muted);font-size:.7rem">— ${hint}</span>`:''}</label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
          <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}" placeholder="0,00">
        </div></div>`;
    }
    if(NUM_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}"></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
      <input class="form-control" id="f_${f}" type="text" value="${esc(v)}"></div>`;
  }).join('')
  + (sheet==='Partecipanti' && isAdmin() ? `
    <div class="form-check mt-2 pt-2" style="border-top:1px solid var(--line)">
      <input class="form-check-input" type="checkbox" id="f_saveRubrica" ${isNew?'checked':''}>
      <label class="form-check-label" for="f_saveRubrica">★ salva anche in rubrica
        <span style="color:var(--muted);font-size:.75rem">— per riusarlo nei prossimi viaggi</span></label>
    </div>` : '')
  + airlineDatalist();

  CALC_TRIGGERS.forEach(t=>{
    const el = $('#f_'+t);
    if(el) el.addEventListener('input', ()=>recalc(sheet, t));
  });

  const payField = fields.includes('paganti') ? 'paganti' : (fields.includes('chi') && fields.includes('totale') ? 'chi' : null);
  if(payField){
    const totEl = $('#f_totale');
    if(totEl) totEl.addEventListener('input', ()=>recalcPay(payField));
    const ptEl = $('#f_prezzo_testa');
    if(ptEl) ptEl.addEventListener('input', ()=>{
      const pt = parseNum(ptEl.value); const n = payCountInForm(payField);
      if(pt!=='' && n && totEl && document.activeElement!==totEl) totEl.value = fmtNumIT(round2(pt*n));
    });
  }

  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    const out = { id: rec.id };
    if(sheet!=='Rubrica') out.viaggio_id = rec.viaggio_id;
    fields.forEach(f=>{
      if(f==='paganti' || f==='chi'){ out[f] = readPayValue(f); return; }
      const el = $('#f_'+f); if(!el) return;
      if(BOOL_FIELDS.includes(f))        out[f] = el.checked ? 'Sì' : '';
      else if(INT_FIELDS.includes(f))    out[f] = el.value!=='' ? Math.round(parseNum(el.value)) : '';
      else if(NUM_FIELDS.includes(f))    out[f] = parseNum(el.value);
      else                               out[f] = el.value.trim();
    });
    let savedRow = out;
    if(rec.id){
      await api('update',{sheet, record:out});
      if(sheet==='Rubrica'){ const i=(RUBRICA||[]).findIndex(x=>String(x.id)===String(out.id)); if(i>=0) Object.assign(RUBRICA[i], out); }
      else applyLocal(sheet, 'update', out);
    } else {
      const saved = await api('create',{sheet, record:out});
      savedRow = saved;
      if(sheet==='Rubrica'){ RUBRICA = (RUBRICA||[]).concat([saved]); }
      else applyLocal(sheet, 'create', saved);
    }
    const rb = $('#f_saveRubrica');
    if(sheet==='Partecipanti' && rb && rb.checked){
      try{ await rubricaUpsert(savedRow); }catch(_){}
    }
    MODAL.hide(); toast('Salvato ✓','ok');
    if(sheet==='Rubrica') openRubrica(RUBRICA_PICK); else refreshView();
  });

  MODAL.show();
}

// genera un codice leggibile lato client (stessa logica del backend)
function genCodeInto(){
  const alpha='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<8;i++) s+=alpha.charAt(Math.floor(Math.random()*alpha.length));
  const el = $('#f_codice');
  if(el) el.value = s;
}

/* Modifica/crea viaggio (usa lo stesso modal) */
function editTrip(trip){
  editRow('Viaggi', trip, null);
  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    let fields = FIELD_ORDER.Viaggi.slice();
    if(!isAdmin()) fields = fields.filter(f=>f!=='codice');
    const out = { id: trip && trip.id };
    fields.forEach(f=>{
      const el=$('#f_'+f); if(!el) return;
      if(INT_FIELDS.includes(f))     out[f] = el.value!=='' ? Math.round(parseNum(el.value)) : '';
      else if(NUM_FIELDS.includes(f))out[f] = parseNum(el.value);
      else                           out[f] = el.value.trim();
    });
    if(trip && trip.id){
      await api('update',{sheet:'Viaggi',record:out});
      invalidateTrips();
      MODAL.hide(); toast('Salvato ✓','ok');
      if(CURRENT_TRIP && trip.id===CURRENT_TRIP.id){
        Object.assign(CURRENT_TRIP, out);
        if(CURRENT_DATA && CURRENT_DATA.Viaggi && CURRENT_DATA.Viaggi[0]) Object.assign(CURRENT_DATA.Viaggi[0], out);
        renderTripShell(currentSection());
      } else viewHome();
    } else {
      const saved = await api('create',{sheet:'Viaggi',record:out});
      invalidateTrips();
      MODAL.hide();
      toast('Viaggio creato ✓ codice: '+(saved.codice||''),'ok');
      location.hash = '#/viaggio/'+saved.id;    // apri subito il nuovo viaggio
    }
  });
}

// Elimina il viaggio corrente E tutte le sue righe collegate (a cascata)
async function delTrip(){
  if(!CURRENT_TRIP) return;
  const nome = CURRENT_TRIP.destinazione || CURRENT_TRIP.nome || 'questo viaggio';
  if(!await askConfirm(`Eliminare "${nome}" con TUTTI i suoi dati (partecipanti, voli, spese…)? L'operazione non è reversibile.`, true)) return;
  showOverlay('Elimino il viaggio…');
  try{
    await api('delete_trip', { id: CURRENT_TRIP.id });
    TRIP_CACHE.delete(String(CURRENT_TRIP.id)); invalidateTrips();
    hideOverlay();
    toast('Viaggio eliminato','ok');
    CURRENT_TRIP = null; CURRENT_DATA = null;
    location.hash = '#/';
  }catch(e){
    hideOverlay();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore: '+e.message,'error');
  }
}

/* Eliminazione con possibilità di annullare. */
async function delRow(sheet, id){
  if(!await askConfirm('Eliminare questa voce?', true)) return;
  const snapshot = Object.assign({}, (sheet==='Rubrica'
    ? (RUBRICA||[]).find(x=>String(x.id)===String(id))
    : findRow(sheet, id)) || {});
  try{
    await api('delete',{sheet,id});
    if(sheet==='Rubrica'){
      RUBRICA = (RUBRICA||[]).filter(x=>String(x.id)!==String(id));
      openRubrica(RUBRICA_PICK);
    } else {
      applyLocal(sheet, 'delete', id);
      refreshView();
    }
    toast('Eliminato', 'ok', snapshot.id ? { label:'Annulla', fn:()=>undoDelRow(sheet, snapshot) } : null);
  }
  catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

async function undoDelRow(sheet, rec){
  try{
    const saved = await api('create', { sheet, record: rec });
    if(sheet==='Rubrica'){ RUBRICA = (RUBRICA||[]).concat([saved]); openRubrica(RUBRICA_PICK); }
    else { applyLocal(sheet, 'create', saved); refreshView(); }
    toast('Ripristinato ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else toast('Non sono riuscito a ripristinare: '+e.message,'error');
  }
}

  algMapHint();

  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    const out = { id: r.id, viaggio_id: r.viaggio_id };
    ['struttura','ora_checkin','ora_checkout','link','indirizzo','mappa_link','pnr','posizione','note']
      .forEach(f=>{ out[f] = $('#a_'+f).value.trim(); });

    ['notti','persone'].forEach(f=>{ out[f] = $('#a_'+f).value!=='' ? Math.round(parseNum($('#a_'+f).value)) : ''; });
    ['totale','extra','prezzo_notte','prezzo_testa','prezzo_testa_notte'].forEach(f=>{ out[f] = parseNum($('#a_'+f).value); });
    out.valutazione = Number($('#alg_stars').dataset.val || '') || '';
    out.scadenza_pag = $('#a_scadenza_pag').value || '';

    if(!out.struttura){ toast('Serve almeno il nome della struttura','error'); return; }
    if(out.checkin && out.checkout && toISODate(out.checkout) <= toISODate(out.checkin)){
      toast('Il check-out deve essere dopo il check-in','error'); return;
    }

    let rowId = r.id;
    if(r.id){
      await api('update', { sheet:'Alloggi', record:out });
      applyLocal('Alloggi','update', out);
    } else {
      const saved = await api('create', { sheet:'Alloggi', record:out });
      applyLocal('Alloggi','create', saved);
      rowId = saved.id;
    }
    if(out.scelto){
      const rows = CURRENT_DATA.Alloggi||[];
      const me = rows.find(x=>String(x.id)===String(rowId));
      if(me){
        const others = algCompeting(me, rows);
        if(others.length){

          await api('set_flags', { sheet:'Alloggi', field:'scelto',
            values: others.map(x=>({id:x.id, value:''})) });
        }
      }
    }
    MODAL.hide(); toast('Salvato ✓','ok');
    refreshView();
  });

  MODAL.show();
}

function algMapHint(){
  const h = $('#a_mapHint'); if(!h) return;
  const link = $('#a_mappa_link') ? $('#a_mappa_link').value.trim() : '';
  const ind  = $('#a_indirizzo') ? $('#a_indirizzo').value.trim() : '';
  if(isUrl(link)) h.textContent = '→ il pulsante 📍 aprirà esattamente questo punto';
  else if(link)   h.textContent = '⚠️ non sembra un link: verrà usato come testo da cercare';
  else if(ind)    h.textContent = '→ senza link, il pulsante 📍 cercherà l\'indirizzo su Maps';
  else            h.textContent = '';
}

function algDatesChanged(){
  const ci = $('#a_checkin').value, co = $('#a_checkout').value;
  const n = nightsBetween(ci, co);
  if(n) $('#a_notti').value = n;
  const t = CURRENT_TRIP || {};
  const s = toISODate(t.data_inizio), e = toISODate(t.data_fine);
  const w = $('#a_dateWarn');
  if(w){
    if(ci && co && toISODate(co) <= toISODate(ci)) w.textContent = '⚠️ check-out prima del check-in';
    else if(s && e && ci && co && (toISODate(ci)<s || toISODate(co)>e)) w.textContent = '⚠️ fuori dal periodo del viaggio';
    else w.textContent = '';
  }
  algRecalc('notti');
}

function algRecalc(src){
  const g = id => { const e=$('#a_'+id); return e ? parseNum(e.value) : ''; };
  const set = (id,v) => { const e=$('#a_'+id); if(e && document.activeElement!==e) e.value = fmtNumIT(v); };
  const P = Math.round(g('persone')) || 0;
  const N = Math.round(g('notti'))   || 0;

  let T = g('totale');
  if(src==='prezzo_notte' && g('prezzo_notte')!=='' && N) T = round2(g('prezzo_notte')*N);
  else if(src==='prezzo_testa' && g('prezzo_testa')!=='' && P) T = round2(g('prezzo_testa')*P);

  if(T!=='' && T!=null && !isNaN(T)){
    if(src!=='totale')       set('totale', T);
    if(src!=='prezzo_notte' && N) set('prezzo_notte', round2(T/N));
    if(src!=='prezzo_testa' && P) set('prezzo_testa', round2(T/P));
    const ptn = $('#a_prezzo_testa_notte');
    if(ptn) ptn.value = (P&&N) ? fmtNumIT(round2(T/P/N)) : '';
  }
  algSummary();
}

function algSummary(){
  const el = $('#a_summary'); if(!el) return;
  const g = id => { const e=$('#a_'+id); return e ? parseNum(e.value) : ''; };
  const T=g('totale'), E=g('extra'), P=Math.round(g('persone'))||0, N=Math.round(g('notti'))||0;
  if(T===''||!T){ el.textContent=''; return; }
  const parts=[];
  if(N) parts.push(`${N} nott${N===1?'e':'i'}`);
  if(P) parts.push(`${eur(T/P)} a testa`);
  if(P&&N) parts.push(`${eur(T/P/N)} a testa/notte`);
  if(E) parts.push(`di cui ${eur(E)} di extra`);
  el.textContent = '→ ' + parts.join(' · ');
}

/* ============================================================
   FORM VOLI — una scheda = una OPZIONE (andata + ritorno)
   Il prezzo è diviso in BIGLIETTO e BAGAGLI perché è così che
   lo trovi sui comparatori: prima la tariffa, poi il supplemento.
   ============================================================ */

function emptyLeg(){
  return {compagnia:'',n_volo:'',da:'',a:'',data_part:'',ora_part:'',ora_arr:'',plus1:false};
}
function isLegEmpty(L){
  return !(String(L.da||'').trim() || String(L.a||'').trim() || String(L.compagnia||'').trim()
        || String(L.n_volo||'').trim() || L.ora_part || L.ora_arr);
}
function legFromRow(r){
  const dp = toISODate(r.data_part), da = toISODate(r.data_arr);
  return {
    compagnia:r.compagnia||'', n_volo:r.n_volo||'', da:r.da||'', a:r.a||'',
    data_part:dp, ora_part:toHM(r.ora_part), ora_arr:toHM(r.ora_arr),
    plus1: !!(dp && da && da>dp)
  };
}
function legArrISO(L){
  const iso = toISODate(L.data_part);
  if(!iso) return '';
  return L.plus1 ? isoAddDays(iso,1) : iso;
}
function legScaloMinsL(prev, next){
  return minsBetween(dtOf(legArrISO(prev), prev.ora_arr, prev.a),
                     dtOf(next.data_part, next.ora_part, next.da));
}
function legDurationL(L){
  return minsBetween(dtOf(L.data_part, L.ora_part, L.da), dtOf(legArrISO(L), L.ora_arr, L.a));
}
function dirDurationL(legs){
  if(!legs.length) return null;
  const L = legs[legs.length-1];
  return minsBetween(dtOf(legs[0].data_part, legs[0].ora_part, legs[0].da),
                     dtOf(legArrISO(L), L.ora_arr, L.a));
}
// "MXP" resta maiuscolo, "Milano Malpensa" no
function normCode(v){
  const s = String(v||'').trim();
  return (s.length<=4 && !/\s/.test(s)) ? s.toUpperCase() : s;
}

function editVolo(group, tid){

  const bagCByDir = {Andata:'', Ritorno:''};
  const bagByDir = {Andata:false, Ritorno:false};
  DIRS.forEach(d=>{
    const rs = (rows||[]).filter(r=>dirOf(r)===d);
    totByDir[d]  = rs.length && num(rs[0].totale) ? num(rs[0].totale) : '';
    bagCByDir[d] = rs.reduce((s,r)=>s+num(r.costo_bagaglio),0) || '';
    bagByDir[d]  = rs.some(r=>truthy(r.bagaglio));
  });
  const dirsPresent = DIRS.filter(d=>legsByDir[d].length);
  if(!legsByDir.Andata.length)  legsByDir.Andata  = [emptyLeg()];
  if(!legsByDir.Ritorno.length) legsByDir.Ritorno = [emptyLeg()];

    isNew,
    viaggio_id: base.viaggio_id || tid || (CURRENT_TRIP && CURRENT_TRIP.id),

    ids       : (rows||[]).map(r=>r.id).filter(Boolean),
    opzione   : String(isNew ? nextOpz() : (Math.round(num(base.opzione))||1)),
    scelto    : truthy(base.scelto),
    pnr       : rows ? groupPnr(rows) : '',
    ar        : isNew ? true : dirsPresent.length===2,
    dir       : (!isNew && dirsPresent[0]==='Ritorno') ? 'Ritorno' : 'Andata',
    prezzoUnico: !(totByDir.Andata!=='' && totByDir.Ritorno!==''),
    totale    : (num(totByDir.Andata)+num(totByDir.Ritorno)) || '',
    bagTot    : (num(bagCByDir.Andata)+num(bagCByDir.Ritorno)) || '',
    prezzo_testa: (rows||[]).reduce((s,r)=>s+num(r.prezzo_testa),0) || '',

    bag       : bagByDir,

      <div class="col-6 col-md-3"><div class="form-check mt-md-3">

        <label class="form-check-label" for="v_ar"><strong>andata e ritorno</strong></label></div></div>
      <div class="col-6 col-md-2"><div class="form-check mt-md-3">

    <div class="mb-2" id="v_dirOnly" style="${VOL.ar?'display:none':''}">

function volLegsClick(e){
  const add = e.target.closest('[data-add]');
  if(add){ volReadForm(); VOL.legs[add.getAttribute('data-add')].push(emptyLeg()); volRenderLegs(); return; }
  const del = e.target.closest('[data-del]');
  if(del){
    volReadForm();
    const parts = del.getAttribute('data-del').split('|');
    VOL.legs[parts[0]].splice(Number(parts[1]),1);
    if(!VOL.legs[parts[0]].length) VOL.legs[parts[0]] = [emptyLeg()];
    volRenderLegs(); return;
  }
  if(e.target.closest('[data-mirror]')){ volReadForm(); volMirror(true); volRenderLegs(); return; }
}

// Precompila il ritorno specchiando l'andata (force = sovrascrive anche se già compilato)
function volMirror(force){
  const A = (VOL.legs.Andata||[]).filter(l=>!isLegEmpty(l));
  if(!A.length) return;
  const R = (VOL.legs.Ritorno||[]).filter(l=>!isLegEmpty(l));
  if(R.length && !force) return;
  const first = A[0], last = A[A.length-1];
  const L = emptyLeg();
  L.da = last.a; L.a = first.da;
  L.compagnia = last.compagnia || first.compagnia;
  L.data_part = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine) || '';
  VOL.legs.Ritorno = [L];
}

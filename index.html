<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripHub — Viaggi di gruppo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2317324d'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23d1622a' stroke-width='2' stroke-dasharray='1.5 4' stroke-linecap='round'/%3E%3Cg transform='translate(32 32) rotate(-40) scale(0.62)' fill='%23f2ede1'%3E%3Cpath d='M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z'/%3E%3C/g%3E%3C/svg%3E">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #17324d;   /* blu inchiostro */
    --ink-soft: #2c4a68;
    --paper:    #f2ede1;   /* carta da mappa */
    --paper-2:  #e7dfcd;
    --stamp:    #d1622a;   /* arancio timbro imbarco */
    --stamp-dk: #b04d1c;
    --line:     #d4c9b2;
    --ok:       #3f7d5c;
    --muted:    #7a6f5a;
  }
  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    margin:0;
    /* trama sottile a griglia da mappa */
    background-image:
      linear-gradient(rgba(23,50,77,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,50,77,.035) 1px, transparent 1px);
    background-size:26px 26px;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'JetBrains Mono',monospace}

  /* --- Topbar --- */
  .topbar{
    background:var(--ink);
    color:var(--paper);
    border-bottom:3px solid var(--stamp);
  }
  .topbar .brand{
    font-family:'Fraunces',serif;font-weight:700;letter-spacing:.5px;
    font-size:1.35rem;color:var(--paper);text-decoration:none;
    display:flex;align-items:center;gap:.5rem;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--stamp);display:inline-block}
  .topbar .mono{color:#b9c6d3;font-size:.72rem}

  /* --- Card / passport look --- */
  .sheet{
    background:#fbf8f0;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 1px 0 #fff inset, 0 8px 24px -18px rgba(23,50,77,.4);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;letter-spacing:.18em;
    font-size:.68rem;color:var(--stamp);font-weight:500;
  }

  /* --- Trip cards --- */
  .trip-card{
    background:#fbf8f0;border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.2rem;cursor:pointer;height:100%;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
    position:relative;overflow:hidden;
  }
  .trip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(23,50,77,.55);border-color:var(--stamp)}
  .trip-card .dest{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;line-height:1.15}
  .trip-card .country{color:var(--muted);font-size:.85rem}
  .stamp{
    position:absolute;top:12px;right:-30px;transform:rotate(12deg);
    background:var(--stamp);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:.62rem;letter-spacing:.15em;padding:3px 34px;text-transform:uppercase;
  }
  .stamp.done{background:var(--ok)}
  .stamp.idea{background:var(--ink-soft)}

  /* --- Tabs --- */
  .navtabs{display:flex;gap:.35rem;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:0}
  .navtabs a{
    text-decoration:none;color:var(--ink-soft);font-weight:500;font-size:.9rem;
    padding:.5rem .85rem;border-radius:8px 8px 0 0;position:relative;top:2px;
    border:2px solid transparent;border-bottom:none;
  }
  .navtabs a.active{background:#fbf8f0;border-color:var(--line);color:var(--ink);border-bottom:2px solid #fbf8f0}

  /* --- Table --- */
  table.data{width:100%;border-collapse:collapse;font-size:.88rem}
  table.data th{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:.66rem;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    text-align:left;padding:.55rem .6rem;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  table.data td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  table.data tr:hover td{background:rgba(209,98,42,.05)}
  .chip{display:inline-block;font-size:.7rem;padding:.12rem .5rem;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);font-weight:500}
  .chip.pick{background:var(--ok);color:#fff}
  .chip.pri-ess{background:#c9432e;color:#fff}
  .chip.pri-cons{background:#e0a422;color:#3a2c00}

  /* --- Buttons --- */
  .btn-stamp{background:var(--stamp);border:none;color:#fff;font-weight:600}
  .btn-stamp:hover{background:var(--stamp-dk);color:#fff}
  .btn-ink{background:var(--ink);border:none;color:var(--paper)}
  .btn-ink:hover{background:var(--ink-soft);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-ghost:hover{border-color:var(--stamp);color:var(--stamp)}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:.15rem .35rem;border-radius:6px}
  .icon-btn:hover{background:var(--paper-2);color:var(--ink)}

  /* --- Budget --- */
  .budget-total{font-family:'Fraunces',serif;font-weight:700;font-size:2rem;color:var(--ink)}
  .budget-line{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px dashed var(--line)}
  .per-person{color:var(--stamp);font-weight:600}

  /* --- Gate / login --- */
  .gate{max-width:420px;margin:8vh auto;}
  .gate .sheet{padding:2rem}

  .form-control,.form-select{border-color:var(--line);background:#fdfbf5}
  .form-control:focus,.form-select:focus{border-color:var(--stamp);box-shadow:0 0 0 .2rem rgba(209,98,42,.15)}
  label.form-label{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:.2rem}

  .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .empty .big{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink-soft);margin-bottom:.3rem}

  .spinner-wrap{display:flex;justify-content:center;padding:3rem}
  .toast-mini{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;
    font-size:.85rem;z-index:2000;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast-mini.show{opacity:1}
  .toast-mini.err{background:#a3341f}
  .toast-mini.ok{background:var(--ok)}
  /* overlay caricamento globale */
  .load-overlay{position:fixed;inset:0;background:rgba(242,237,225,.7);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1900;flex-direction:column;gap:.8rem}
  .load-overlay .mono{color:var(--ink-soft);font-size:.8rem;letter-spacing:.05em}
  /* link icona */
  .link-btn{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);background:#fdfbf5;
    border-radius:7px;padding:.15rem .5rem;font-size:.78rem;color:var(--ink-soft);text-decoration:none;cursor:pointer}
  .link-btn:hover{border-color:var(--stamp);color:var(--stamp)}
  a{color:var(--stamp)}

  /* calendario cose da fare */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-head{margin-bottom:4px}
  .cal-dow{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.66rem;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);padding:.2rem 0}
  .cal-cell{min-height:76px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:#fdfbf5;overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.in-trip{background:#fff5e9;border-color:#f0cba3}
  .cal-num{font-size:.72rem;font-weight:600;color:var(--ink-soft);margin-bottom:2px}
  .cal-ev{font-size:.64rem;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 4px;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal-ev:hover{background:var(--stamp)}
  .cal-more{font-size:.62rem;color:var(--stamp);font-weight:600}
  @media(max-width:640px){
    .cal-cell{min-height:58px}
    .cal-ev{font-size:.56rem}
    .cal-dow{font-size:.58rem}
  }
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<div class="topbar py-2" id="topbar" style="display:none">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="#/" class="brand">
      <svg width="26" height="26" viewBox="0 0 64 64" style="flex:none">
        <circle cx="32" cy="32" r="30" fill="none" stroke="var(--stamp)" stroke-width="3"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="var(--paper)" stroke-width="1.5" stroke-dasharray="1.5 4" stroke-linecap="round" opacity="0.6"/>
        <g transform="translate(32 32) rotate(-40) scale(0.62)" fill="var(--paper)">
          <path d="M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z"/>
        </g>
      </svg> TripHub</a>
    <div class="d-flex align-items-center gap-2">
      <span class="mono d-none d-sm-inline" id="syncState">pronto</span>
      <div class="dropdown">
        <button class="btn btn-sm btn-ghost dropdown-toggle" data-bs-toggle="dropdown">⋯</button>
        <ul class="dropdown-menu dropdown-menu-end" style="background:#fbf8f0;border-color:var(--line)">
          <li><button class="dropdown-item" onclick="doExport()">⬇︎ Esporta backup (JSON)</button></li>
          <li><button class="dropdown-item" onclick="document.getElementById('importFile').click()">⬆︎ Importa backup…</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" onclick="logout()">Esci</button></li>
        </ul>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">
    </div>
  </div>
</div>

<!-- ============ APP ROOT ============ -->
<div id="app" class="container py-4"></div>

<div class="toast-mini" id="toast"></div>

<script>
/* ============================================================
   CONFIG — l'unica cosa da modificare dopo il deploy dell'API
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxN6Xe9meHwq4GsQtkaHPgtXsvE0Hay_1ocL54XvEiZUPY4GcZ8_I5sRuCdM7yx3u3E/exec"; // es: https://script.google.com/macros/s/AKfy.../exec

/* ============================================================
   STATE
   ============================================================ */
let TOKEN = sessionStorage.getItem('triphub_token') || '';

/* ============================================================
   API LAYER
   ============================================================ */
class AuthError extends Error {}
class NetworkError extends Error {}

async function api(action, payload = {}) {
  setSync('sincronizzo…');
  const body = JSON.stringify({ action, token: TOKEN, ...payload });
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000); // 30s timeout
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      signal: ctrl.signal
    });
  } catch(e) {
    setSync('offline');
    throw new NetworkError(e.name==='AbortError' ? 'timeout: il server non ha risposto' : 'connessione assente');
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); }
  catch(e){ setSync('errore'); throw new NetworkError('risposta non valida dal server'); }
  setSync('pronto');
  if (!data.ok) {
    if (data.error === 'unauthorized') throw new AuthError('unauthorized');
    throw new Error(data.error || 'errore sconosciuto');
  }
  return data.data;
}

// Wrapper per gestire in un solo punto la scadenza sessione
async function guard(fn){
  try { return await fn(); }
  catch(e){
    if(e instanceof AuthError){ sessionExpired(); throw e; }
    throw e;
  }
}
function sessionExpired(){
  toast('Sessione scaduta — rientra con il codice');
  renderGate('La sessione è scaduta. Reinserisci il codice del gruppo.');
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => '€ ' + (Number(n) || 0).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => Number(String(n).replace(/[^\d.-]/g,'')) || 0;

function setSync(t){ const e = $('#syncState'); if(e) e.textContent = t; }
function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast-mini show' + (type==='error'?' err':type==='ok'?' ok':'');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), type==='error'?3200:1800);
}
function spinner(msg){
  return `<div class="spinner-wrap"><div class="text-center">
    <div class="spinner-border" style="color:var(--stamp)"></div>
    ${msg?`<div class="mono mt-2" style="font-size:.72rem;color:var(--muted)">${esc(msg)}</div>`:''}
  </div></div>`;
}

// Schermata di errore con possibilità di riprovare
function renderError(titolo, dettaglio, retryFn){
  $('#app').innerHTML = `
    <div class="sheet empty" style="max-width:480px;margin:8vh auto">
      <div class="big">⚠️ ${esc(titolo)}</div>
      <div class="mono mb-3" style="font-size:.78rem;color:var(--muted)">${esc(dettaglio||'')}</div>
      <button class="btn btn-stamp" id="retryBtn">Riprova</button>
    </div>`;
  if(retryFn) $('#retryBtn').onclick = ()=>retryFn();
}
// Gestisce anche la sessione scaduta in modo pulito.
async function withBtnLoading(btn, label, fn){
  if(!btn) return fn();
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(label||'Attendere…')}`;
  try {
    return await fn();
  } catch(e){
    if(e instanceof AuthError){ sessionExpired(); }
    else { toast('Errore: ' + e.message, 'error'); }
    throw e;
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ============================================================
   AUTH GATE
   ============================================================ */
function renderGate(err){
  $('#topbar').style.display = 'none';
  $('#app').innerHTML = `
    <div class="gate">
      <div class="text-center mb-4">
        <svg width="150" height="150" viewBox="0 0 240 240" style="max-width:45vw">
          <circle cx="120" cy="120" r="92" fill="none" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="120" cy="120" r="80" fill="none" stroke="var(--stamp)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
          <path id="logoTop" d="M 120 40 m -66 0 a 66 66 0 0 1 132 0" fill="none"/>
          <path id="logoBot" d="M 120 200 m 66 0 a 66 66 0 0 1 -132 0" fill="none"/>
          <text font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" letter-spacing="4" fill="var(--ink)">
            <textPath href="#logoTop" startOffset="50%" text-anchor="middle">TRIP • HUB</textPath>
          </text>
          <text font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="500" letter-spacing="5" fill="var(--stamp)">
            <textPath href="#logoBot" startOffset="50%" text-anchor="middle">VIAGGI DI GRUPPO</textPath>
          </text>
          <g transform="translate(120 120) rotate(-40) scale(1.15)" fill="var(--ink)">
            <path d="M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z"/>
          </g>
          <g fill="var(--stamp)"><circle cx="120" cy="46" r="2.4"/><circle cx="120" cy="194" r="2.4"/></g>
        </svg>
      </div>
      <div class="sheet">
        <p class="eyebrow mb-1">Accesso</p>
        <h2 style="font-size:1.3rem;margin-bottom:1rem">Inserisci il codice del gruppo</h2>
        ${err ? `<div class="alert alert-danger py-2 small">${esc(err)}</div>` : ''}
        <label class="form-label">Codice</label>
        <input id="tokenInput" type="password" class="form-control mb-3" placeholder="il codice condiviso" value="${esc(TOKEN)}">
        <button class="btn btn-stamp w-100" onclick="doLogin()">Entra</button>
        <p class="mono text-center mt-3 mb-0" style="font-size:.66rem;color:var(--muted)">il codice resta solo su questo dispositivo</p>
      </div>
    </div>`;
  const inp = $('#tokenInput');
  inp.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  inp.focus();
}

async function doLogin(){
  TOKEN = $('#tokenInput').value.trim();
  if(!TOKEN){ return renderGate('Serve il codice.'); }
  try {
    await api('list', { sheet: 'Viaggi' });          // ping autenticato
    sessionStorage.setItem('triphub_token', TOKEN);
    location.hash = '#/';
    boot();
  } catch(e){
    TOKEN = '';
    renderGate('Codice non valido.');
  }
}
function logout(){
  sessionStorage.removeItem('triphub_token'); TOKEN='';
  location.hash = '#/'; renderGate();
}

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = [
  { re:/^#\/$/,                      fn: viewHome },
  { re:/^#\/viaggio\/([^/]+)$/,      fn: (m)=>viewTrip(m[1], 'riepilogo') },
  { re:/^#\/viaggio\/([^/]+)\/([^/]+)$/, fn:(m)=>viewTrip(m[1], m[2]) },
];
async function route(){
  if(!TOKEN){ return renderGate(); }
  const h = location.hash || '#/';
  for(const r of ROUTES){ const m = h.match(r.re); if(m){ return r.fn(m); } }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);

/* ============================================================
   VIEW: HOME (lista viaggi)
   ============================================================ */
async function viewHome(){
  $('#topbar').style.display = 'block';
  $('#app').innerHTML = spinner('carico i viaggi…');
  let trips = [];
  try { trips = await api('list', { sheet:'Viaggi' }); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco a caricare i viaggi', e.message, viewHome);
  }

  const cards = trips.map(t => {
    const stato = (t.stato||'').toLowerCase();
    const stampCls = stato.includes('conclus')||stato.includes('fatto') ? 'done'
                   : stato.includes('idea')||stato.includes('propost') ? 'idea' : '';
    const stampTxt = stato ? stato : 'in programma';
    return `
    <div class="col-12 col-md-6 col-lg-4">
      <div class="trip-card" onclick="location.hash='#/viaggio/${esc(t.id)}'">
        <div class="stamp ${stampCls}">${esc(stampTxt)}</div>
        <p class="eyebrow mb-1">${esc(t.paese||'')}</p>
        <div class="dest">${esc(t.destinazione||t.nome||'Senza nome')}</div>
        <div class="country mb-2">${esc(t.nome||'')}</div>
        <div class="mono" style="font-size:.72rem;color:var(--ink-soft)">
          ${t.data_inizio?toITDate(t.data_inizio):'?'} → ${t.data_fine?toITDate(t.data_fine):'?'} · ${esc(t.n_persone||'?')} pers.
        </div>
      </div>
    </div>`;
  }).join('');

  $('#app').innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <div>
        <p class="eyebrow mb-1">I tuoi viaggi</p>
        <h1 style="font-size:1.8rem;margin:0">Viaggi</h1>
      </div>
      <button class="btn btn-stamp" onclick="editTrip()">+ Nuovo viaggio</button>
    </div>
    ${trips.length ? `<div class="row g-3">${cards}</div>`
      : `<div class="sheet empty"><div class="big">Nessun viaggio ancora</div>
         <div>Crea la prima rotta e inizia a organizzare.</div>
         <button class="btn btn-stamp mt-3" onclick="editTrip()">+ Nuovo viaggio</button></div>`}
  `;
}

/* ============================================================
   VIEW: TRIP (un viaggio, con tab-sezioni)
   ============================================================ */
const SECTIONS = [
  ['riepilogo','Riepilogo'],
  ['alloggi','Alloggi'],
  ['voli','Voli'],
  ['spese','Budget & Spese'],
  ['cosedafare','Cose da fare'],
  ['cosaportare','Cosa portare'],
  ['contatti','Contatti'],
  ['info','Info destinazione'],
];

let CURRENT_TRIP = null;
let CURRENT_DATA = null;

async function viewTrip(id, section){
  $('#topbar').style.display = 'block';
  $('#app').innerHTML = spinner('carico il viaggio…');
  let all;
  try { all = await api('all', { viaggio_id: id }); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco a caricare il viaggio', e.message, ()=>viewTrip(id, section));
  }

  const trip = (all.Viaggi||[])[0];
  if(!trip){ $('#app').innerHTML = `<div class="sheet empty"><div class="big">Viaggio non trovato</div><a href="#/">← torna ai viaggi</a></div>`; return; }
  // reset del mese calendario se è cambiato viaggio
  if(!CURRENT_TRIP || CURRENT_TRIP.id !== trip.id){ CDF_MONTH = null; CDF_VIEW = 'lista'; }
  CURRENT_TRIP = trip; CURRENT_DATA = all;

  const tabs = SECTIONS.map(([k,label]) =>
    `<a href="#/viaggio/${esc(id)}/${k}" class="${k===section?'active':''}">${label}</a>`
  ).join('');

  $('#app').innerHTML = `
    <a href="#/" class="mono" style="font-size:.75rem;text-decoration:none;color:var(--muted)">← tutti i viaggi</a>
    <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mt-2 mb-3">
      <div>
        <p class="eyebrow mb-1">${esc(trip.paese||'')} · ${trip.data_inizio?toITDate(trip.data_inizio):''} → ${trip.data_fine?toITDate(trip.data_fine):''}</p>
        <h1 style="font-size:1.9rem;margin:0">${esc(trip.destinazione||trip.nome)}</h1>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="editTrip(CURRENT_TRIP)">Modifica viaggio</button>
    </div>
    <div class="navtabs mb-3">${tabs}</div>
    <div id="section"></div>
  `;
  renderSection(section);
}

function renderSection(section){
  const box = $('#section');
  const d = CURRENT_DATA, tid = CURRENT_TRIP.id;
  const map = {
    riepilogo:   ()=>secRiepilogo(d),
    alloggi:     ()=>secTable('Alloggi', d.Alloggi, tid),
    voli:        ()=>secVoli(d.Voli, tid),
    spese:       ()=>secSpese(d, tid),
    cosedafare:  ()=>secCoseDaFare(d.CoseDaFare, tid),
    cosaportare: ()=>secTable('CosaPortare', d.CosaPortare, tid),
    contatti:    ()=>secTable('Contatti', d.Contatti, tid),
    info:        ()=>secInfo(d, tid),
  };
  box.innerHTML = (map[section]||map.riepilogo)();
}

/* ---------- RIEPILOGO + BUDGET (calcolato) ---------- */
function computeBudget(d){
  const alloggio = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).reduce((s,a)=>s+num(a.totale),0);
  const voli     = (d.Voli||[]).filter(v=>truthy(v.scelto)).reduce((s,v)=>s+num(v.totale),0);
  const spese    = (d.Spese||[]).reduce((s,x)=>s+num(x.totale),0);
  const tot = alloggio + voli + spese;
  const pers = num(d.Viaggi?.[0]?.n_persone) || 1;
  return { alloggio, voli, spese, tot, pers, perPersona: tot/pers };
}
function truthy(v){ const s = String(v).toLowerCase().trim(); return ['sì','si','true','1','x','yes','✓'].includes(s); }

function secRiepilogo(d){
  const b = computeBudget(d);
  const t = d.Viaggi[0];
  const counts = {
    Alloggi:(d.Alloggi||[]).length, Voli:(d.Voli||[]).length,
    'Cose da fare':(d.CoseDaFare||[]).length, 'Da portare':(d.CosaPortare||[]).length
  };
  const chips = Object.entries(counts).map(([k,v])=>`<span class="chip me-1 mb-1">${k}: ${v}</span>`).join('');
  return `
  <div class="row g-3">
    <div class="col-12 col-lg-7">
      <div class="sheet p-4 h-100">
        <p class="eyebrow mb-1">Budget stimato · opzioni scelte</p>
        <div class="budget-total mb-1">${eur(b.tot)}</div>
        <div class="per-person mb-3">${eur(b.perPersona)} a testa · ${b.pers} persone</div>
        <div class="budget-line"><span>Alloggio</span><span class="mono">${eur(b.alloggio)}</span></div>
        <div class="budget-line"><span>Voli</span><span class="mono">${eur(b.voli)}</span></div>
        <div class="budget-line"><span>Spese extra</span><span class="mono">${eur(b.spese)}</span></div>
        <p class="mono mt-3 mb-0" style="font-size:.68rem;color:var(--muted)">
          calcolato dalle righe con flag "scelto". Cambia la scelta in Alloggi/Voli per aggiornarlo.
        </p>
      </div>
    </div>
    <div class="col-12 col-lg-5">
      <div class="sheet p-4 h-100">
        <p class="eyebrow mb-2">Dettagli viaggio</p>
        <div class="mb-2"><strong>${esc(t.destinazione||'')}</strong> — ${esc(t.paese||'')}</div>
        <div class="mono mb-2" style="font-size:.8rem">${t.data_inizio?toITDate(t.data_inizio):'?'} → ${t.data_fine?toITDate(t.data_fine):'?'}</div>
        ${t.note?`<p class="mb-3" style="font-size:.9rem">${esc(t.note)}</p>`:''}
        <div class="mt-2">${chips}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- TABELLE GENERICHE (Alloggi, Voli, CoseDaFare...) ---------- */
// Colonne mostrate per ciascun tab (le altre restano nel foglio ma non ingombrano)
const COLS = {
  Alloggi:     ['struttura','checkin','checkout','notti','totale','prezzo_testa','prezzo_testa_notte','valutazione','link','scelto'],
  CoseDaFare:  ['data','tipo','attivita','posizione','durata','prenotazione_req','confermata'],
  CosaPortare: ['categoria','cosa','qta','chi','priorita','spuntato'],
  Contatti:    ['categoria','nome','telefono','indirizzo','link'],
};
const LABELS = {
  checkin:'check-in', checkout:'check-out', n_volo:'n° volo', ora_part:'orario',
  prenotazione_req:'prenot.', valutazione:'voto', qta:'q.tà', da:'da', a:'a',
  prezzo_testa:'a testa', prezzo_testa_notte:'a testa/notte', prezzo_notte:'a notte',
  data_part:'data part.', data_arr:'data arr.', ora_arr:'ora arr.'
};
const lbl = k => LABELS[k] || k.replace(/_/g,' ');

function secTable(sheet, rows, tid){
  rows = rows || [];
  const cols = COLS[sheet] || Object.keys((rows[0]||{})).filter(k=>k!=='id'&&k!=='viaggio_id');
  const head = cols.map(c=>`<th>${esc(lbl(c))}</th>`).join('') + '<th></th>';
  const body = rows.map(r=>{
    const tds = cols.map(c=>`<td>${cell(sheet,c,r[c])}</td>`).join('');
    return `<tr>${tds}<td class="text-nowrap">
        <button class="icon-btn" title="Modifica" onclick='editRow(${JSON.stringify(sheet)}, ${JSON.stringify(r)})'>✎</button>
        <button class="icon-btn" title="Elimina" onclick="delRow('${esc(sheet)}','${esc(r.id)}')">🗑</button>
      </td></tr>`;
  }).join('');

  return `
    <div class="d-flex justify-content-between align-items-center mb-2">
      <p class="eyebrow mb-0">${rows.length} voci</p>
      <button class="btn btn-stamp btn-sm" onclick="editRow('${esc(sheet)}', null, '${esc(tid)}')">+ Aggiungi</button>
    </div>
    <div class="sheet p-2 p-md-3" style="overflow-x:auto">
      ${rows.length ? `<table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
        : `<div class="empty"><div class="big">Ancora niente qui</div><div>Aggiungi la prima voce.</div></div>`}
    </div>`;
}

function cell(sheet, col, val){
  if(col==='scelto'||col==='confermata'||col==='spuntato'||col==='prenotazione_req'){
    if(col==='scelto' && truthy(val)) return `<span class="chip pick">✓ scelto</span>`;
    return truthy(val) ? `<span class="chip pick">✓</span>` : `<span class="chip">–</span>`;
  }
  if(col==='priorita'){
    const s=String(val).toLowerCase();
    if(s.includes('essenz')) return `<span class="chip pri-ess">${esc(val)}</span>`;
    if(s.includes('consig')) return `<span class="chip pri-cons">${esc(val)}</span>`;
    return esc(val);
  }
  if(['totale','prezzo_notte','prezzo_testa','prezzo_testa_notte','costo','extra'].includes(col)) return `<span class="mono">${eur(val)}</span>`;
  if(DATE_FIELDS.includes(col)) return `<span class="mono">${toITDate(val)}</span>`;
  if(TIME_FIELDS.includes(col)) return `<span class="mono">${esc(toHM(val))}</span>`;
  if(LINK_FIELDS.includes(col)) return linkCell(val);
  if(col==='valutazione'){ const n=num(val); return n?('★'.repeat(Math.min(5,Math.round(n)))):esc(val); }
  return esc(val);
}

// Link nascosto dietro icona: apri + copia
function linkCell(url){
  url = String(url||'').trim();
  if(!url) return '<span class="chip">–</span>';
  const safe = esc(url);
  return `<span class="d-inline-flex gap-1">
    <a class="link-btn" href="${safe}" target="_blank" rel="noopener" title="${safe}">🔗 apri</a>
    <button class="link-btn" type="button" title="Copia link" onclick="copyLink(this,'${safe.replace(/'/g,"\\'")}')">⧉</button>
  </span>`;
}
function copyLink(btn, url){
  navigator.clipboard.writeText(url).then(()=>{
    const t = btn.textContent; btn.textContent='✓'; toast('Link copiato','ok');
    setTimeout(()=>btn.textContent=t, 1200);
  }).catch(()=>toast('Impossibile copiare','error'));
}

/* ---------- SPESE (tabella + totale) ---------- */
function secSpese(d, tid){
  const rows = d.Spese||[];
  const tot = rows.reduce((s,x)=>s+num(x.totale),0);
  const pers = num(d.Viaggi[0].n_persone)||1;
  const body = rows.map(r=>`<tr>
      <td class="mono">${esc(r.data)}</td>
      <td>${esc(r.descrizione)}</td>
      <td><span class="chip">${esc(r.categoria||'—')}</span></td>
      <td class="mono">${eur(r.totale)}</td>
      <td>${esc(r.note||'')}</td>
      <td class="text-nowrap">
        <button class="icon-btn" onclick='editRow("Spese", ${JSON.stringify(r)})'>✎</button>
        <button class="icon-btn" onclick="delRow('Spese','${esc(r.id)}')">🗑</button>
      </td></tr>`).join('');
  return `
    <div class="d-flex justify-content-between align-items-center mb-2">
      <p class="eyebrow mb-0">spese extra oltre a voli/alloggio</p>

    </div>
    <div class="sheet p-2 p-md-3 mb-3" style="overflow-x:auto">
      ${rows.length?`<table class="data">
        <thead><tr><th>data</th><th>descrizione</th><th>categoria</th><th>totale</th><th>note</th><th></th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr>
          <td colspan="3" class="text-end"><strong>Totale spese</strong></td>
          <td class="mono"><strong>${eur(tot)}</strong></td>
          <td colspan="2" class="per-person">${eur(tot/pers)} a testa</td>
        </tr></tfoot>
      </table>`:`<div class="empty"><div class="big">Nessuna spesa extra</div></div>`}
    </div>`;
}

/* ---------- VOLI (raggruppati per volo, con tratte/scali) ---------- */
function secVoli(rows, tid){
  rows = rows || [];
  const groups = voliGroups(rows);
  const keys = Object.keys(groups);
  // ordina: prima andata, poi ritorno; poi per opzione
  keys.sort((a,b)=>{
    const A=groups[a][0], B=groups[b][0];
    const dir = String(A.direzione||'').localeCompare(String(B.direzione||''));
    return dir!==0 ? dir : num(A.opzione)-num(B.opzione);
  });

  const cards = keys.map(k=>{
    const legs = groups[k];
    const head = legs[0];
    const pick = truthy(head.scelto);
    const totale = num(head.totale);
    const pt = num(head.prezzo_testa);
    const legsHtml = legs.map((l,i)=>`
      <div class="d-flex align-items-center gap-2 py-1" style="border-top:${i?'1px dashed var(--line)':'none'}">
        <span class="chip" style="flex:none">${i+1}</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${esc(l.da||'?')} → ${esc(l.a||'?')}
            <span style="font-weight:400;color:var(--muted);font-size:.8rem">· ${esc(l.compagnia||'')} ${esc(l.n_volo||'')}</span></div>
          <div class="mono" style="font-size:.75rem;color:var(--ink-soft)">
            ${toITDate(l.data_part)} ${esc(toHM(l.ora_part))} → ${toITDate(l.data_arr)} ${esc(toHM(l.ora_arr))}
            ${l.scalo?` · <span style="color:var(--stamp)">scalo ${esc(l.scalo)}</span>`:''}
            ${truthy(l.bagaglio)?' · 🧳':''}
          </div>
        </div>
      </div>`).join('');
    return `
      <div class="col-12 col-lg-6">
        <div class="sheet p-3 h-100" style="${pick?'border-color:var(--ok);border-width:2px':''}">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <span class="chip ${pick?'pick':''}">${esc(head.direzione||'?')}${head.opzione?` · opz. ${esc(head.opzione)}`:''}</span>
              ${pick?'<span class="chip pick ms-1">✓ scelto</span>':''}
            </div>
            <div class="text-nowrap">
              <button class="icon-btn" title="Modifica" onclick='editVolo(${JSON.stringify(legs)}, "${esc(tid)}")'>✎</button>
              <button class="icon-btn" title="Elimina" onclick="delVolo('${esc(head.gruppo_id||head.id)}')">🗑</button>
            </div>
          </div>
          ${legsHtml}
          ${(totale||pt)?`<div class="d-flex justify-content-between mt-2 pt-2" style="border-top:1px solid var(--line)">
            <span class="mono" style="font-size:.85rem">${totale?eur(totale):''}</span>
            <span class="per-person" style="font-size:.85rem">${pt?eur(pt)+' a testa':''}</span>
          </div>`:''}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="d-flex justify-content-between align-items-center mb-2">
      <p class="eyebrow mb-0">${keys.length} voli · ${rows.length} tratte</p>
      <button class="btn btn-stamp btn-sm" onclick="editVolo(null, '${esc(tid)}')">+ Aggiungi volo</button>
    </div>
    ${keys.length ? `<div class="row g-3">${cards}</div>`
      : `<div class="sheet empty"><div class="big">Nessun volo ancora</div>
         <div>Aggiungi un volo, anche con scali.</div></div>`}`;
}

async function delVolo(gruppoId){
  if(!confirm('Eliminare questo volo (tutte le sue tratte)?')) return;
  try{ await api('delete_group',{sheet:'Voli',gruppo_id:gruppoId}); toast('Volo eliminato','ok'); reloadCurrent(); }
  catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

/* ---------- COSE DA FARE (switch calendario / lista) ---------- */
let CDF_VIEW = 'lista';   // vista corrente
let CDF_MONTH = null;      // mese mostrato nel calendario (Date sul 1° del mese)

const TIPO_ICON = {
  'sport acquatico':'🌊','escursione':'🥾','gita':'🚌','cultura':'🏛️','cibo':'🍽️','serata':'🌙','relax':'🏖️'
};
function tipoIcon(t){ return TIPO_ICON[String(t||'').toLowerCase()] || '📍'; }

function secCoseDaFare(rows, tid){
  rows = rows || [];
  ensureCdfMonth();
  const toggle = `
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn ${CDF_VIEW==='lista'?'btn-ink':'btn-ghost'}" onclick="setCdfView('lista')">Lista</button>
      <button class="btn ${CDF_VIEW==='calendario'?'btn-ink':'btn-ghost'}" onclick="setCdfView('calendario')">Calendario</button>
    </div>`;
  const header = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">${toggle}
        <span class="mono" style="font-size:.72rem;color:var(--muted)">${rows.length} attività</span></div>
      <button class="btn btn-stamp btn-sm" onclick="editRow('CoseDaFare', null, '${esc(tid)}')">+ Aggiungi</button>
    </div>`;
  return header + (CDF_VIEW==='calendario' ? cdfCalendar(rows, tid) : cdfList(rows, tid));
}

function setCdfView(v){ CDF_VIEW = v; renderSection('cosedafare'); }
function ensureCdfMonth(){
  if(!CDF_MONTH){
    const iso = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio);
    let base = iso ? new Date(iso+'T12:00:00') : new Date();
    CDF_MONTH = new Date(base.getFullYear(), base.getMonth(), 1);
  }
}
function cdfMonthShift(delta){
  ensureCdfMonth();
  CDF_MONTH = new Date(CDF_MONTH.getFullYear(), CDF_MONTH.getMonth()+delta, 1);
  renderSection('cosedafare');
}

// --- vista LISTA (raggruppata per data, poi senza data) ---
function cdfList(rows, tid){
  const withDate = rows.filter(r=>toISODate(r.data)).sort((a,b)=>toISODate(a.data).localeCompare(toISODate(b.data)));
  const noDate   = rows.filter(r=>!toISODate(r.data));
  const groups = {};
  withDate.forEach(r=>{ const k=toISODate(r.data); (groups[k] ??= []).push(r); });

  const dayBlocks = Object.keys(groups).map(k=>`
    <div class="mb-3">
      <p class="eyebrow mb-2">${toITDateLong(k)}</p>
      ${groups[k].map(r=>cdfItem(r)).join('')}
    </div>`).join('');

  const noDateBlock = noDate.length ? `
    <div class="mb-3">
      <p class="eyebrow mb-2">Senza data</p>
      ${noDate.map(r=>cdfItem(r)).join('')}
    </div>` : '';

  if(!rows.length) return `<div class="sheet empty"><div class="big">Ancora niente da fare</div><div>Aggiungi la prima attività.</div></div>`;
  return `<div class="sheet p-3">${dayBlocks}${noDateBlock}</div>`;
}

function cdfItem(r){
  const conf = truthy(r.confermata);
  return `<div class="d-flex align-items-start gap-2 py-2" style="border-bottom:1px solid var(--line)">
    <span style="font-size:1.1rem;flex:none">${tipoIcon(r.tipo)}</span>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${esc(r.attivita||'')}
        ${conf?'<span class="chip pick ms-1">✓</span>':''}
        ${truthy(r.prenotazione_req)?'<span class="chip pri-cons ms-1">prenota</span>':''}</div>
      <div style="font-size:.82rem;color:var(--ink-soft)">
        ${r.posizione?esc(r.posizione):''}${r.durata?` · ${esc(r.durata)}`:''}${r.quando?` · ${esc(r.quando)}`:''}
      </div>
      ${r.note?`<div style="font-size:.78rem;color:var(--muted);margin-top:.15rem">${esc(r.note)}</div>`:''}
    </div>
    <div class="text-nowrap" style="flex:none">
      ${r.link?linkCell(r.link):''}
      <button class="icon-btn" onclick='editRow("CoseDaFare", ${JSON.stringify(r)})'>✎</button>
      <button class="icon-btn" onclick="delRow('CoseDaFare','${esc(r.id)}')">🗑</button>
    </div>
  </div>`;
}

// --- vista CALENDARIO ---
function cdfCalendar(rows, tid){
  ensureCdfMonth();
  const y = CDF_MONTH.getFullYear(), mo = CDF_MONTH.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay()+6)%7;      // lun=0
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthName = CDF_MONTH.toLocaleDateString('it-IT', {month:'long', year:'numeric'});

  // mappa attività per giorno ISO
  const byDay = {};
  rows.forEach(r=>{ const k=toISODate(r.data); if(k) (byDay[k] ??= []).push(r); });

  // range vacanza per evidenziare
  const vStart = toISODate(CURRENT_TRIP?.data_inizio), vEnd = toISODate(CURRENT_TRIP?.data_fine);

  const dow = ['lun','mar','mer','gio','ven','sab','dom']
    .map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDay[iso]||[];
    const inTrip = vStart && vEnd && iso>=vStart && iso<=vEnd;
    const chips = items.slice(0,3).map(r=>
      `<div class="cal-ev" title="${esc(r.attivita)}" onclick='editRow("CoseDaFare", ${JSON.stringify(r)})'>${tipoIcon(r.tipo)} ${esc((r.attivita||'').slice(0,14))}</div>`).join('');
    const more = items.length>3 ? `<div class="cal-more">+${items.length-3}</div>` : '';
    cells += `<div class="cal-cell${inTrip?' in-trip':''}" ondblclick="cdfQuickAdd('${iso}','${esc(tid)}')">
      <div class="cal-num">${d}</div>${chips}${more}
    </div>`;
  }

  return `
    <div class="sheet p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(-1)">‹</button>
        <strong style="font-family:'Fraunces',serif;text-transform:capitalize">${esc(monthName)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(1)">›</button>
      </div>
      <div class="cal-grid cal-head">${dow}</div>
      <div class="cal-grid">${cells}</div>
      <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
        doppio click su un giorno per aggiungere · giorni evidenziati = durata vacanza
      </p>
    </div>`;
}

function cdfQuickAdd(iso, tid){
  editRow('CoseDaFare', { viaggio_id: tid, data: iso }, tid);
}

/* ---------- INFO DESTINAZIONE (chiave/valore) ---------- */
function secInfo(d, tid){
  const rows = d.InfoDest||[];
  const bySez = {};
  rows.forEach(r=>{ (bySez[r.sezione||'Generale'] ??= []).push(r); });
  const blocks = Object.entries(bySez).map(([sez,items])=>`
    <div class="sheet p-3 mb-3">
      <p class="eyebrow mb-2">${esc(sez)}</p>
      <table class="data"><tbody>

// Porta qualsiasi data in ISO "YYYY-MM-DD" per l'input type=date.
// Accetta: ISO, "04/08/26", "04/08/2026", "2026-08-03T22:00:00Z".
function toISODate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))            return m[1]+'-'+m[2]+'-'+m[3];
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){
    let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0');
  }
  return '';
}
// Da ISO "YYYY-MM-DD" a "gg/mm/aa" per la visualizzazione in tabella.
function toITDate(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}
// Data estesa "lunedì 4 agosto" per intestazioni della lista
function toITDateLong(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
}
// Ora "HH:mm" (accetta anche "06:20:00")
function toHM(raw){
  if(!raw) return '';
  const m = String(raw).trim().match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0')+':'+m[2] : '';
}

// Converte "2027,70" | "2027.70" | "€ 2.027,70" -> 2027.7 (Number).
// Se il campo è vuoto ritorna '' (cella vuota, non 0).
function parseNum(raw){
  if(raw === '' || raw == null) return '';
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if(s === '') return '';
  if(s.includes(',')){
    // formato IT: il punto è separatore migliaia, la virgola è decimale
    s = s.replace(/\./g,'').replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? '' : n;
}

// Formatta un numero per un input testuale (usa virgola IT, niente € ).
function fmtNumIT(n){
  if(n === '' || n == null || isNaN(n)) return '';
  return Number(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function round2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }

/* -------- AUTO-CALCOLO totale <-> a testa --------
   Regola: l'ultimo campo che l'utente tocca è la "sorgente"; gli altri
   si ricalcolano. Persone (e notti, per alloggi) sono i divisori.
   - Alloggi: totale <-> prezzo_testa (÷persone) e prezzo_testa_notte (÷persone÷notti)
              inoltre prezzo_notte = totale ÷ notti
   - Voli/Spese: totale <-> prezzo_testa (÷persone)
*/
function recalc(sheet, changed){
  const g = id => { const el = $('#f_'+id); return el ? parseNum(el.value) : ''; };
  const set = (id,val) => { const el = $('#f_'+id); if(el && document.activeElement!==el) el.value = fmtNumIT(val); };

  const persone = g('persone') || g('n_persone') || 0;
  const notti   = g('notti') || 0;

  if(sheet==='Alloggi'){
    const tot=g('totale'), pt=g('prezzo_testa'), ptn=g('prezzo_testa_notte'), pn=g('prezzo_notte');
    let total = tot;
    // deduci il totale dal campo che l'utente ha appena cambiato
    if(changed==='prezzo_testa' && pt!=='' && persone)          total = round2(pt*persone);
    else if(changed==='prezzo_testa_notte' && ptn!=='' && persone && notti) total = round2(ptn*persone*notti);
    else if(changed==='prezzo_notte' && pn!=='' && notti)        total = round2(pn*notti);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale') set('totale', total);
      if(changed!=='prezzo_testa'        && persone)         set('prezzo_testa', round2(total/persone));
      if(changed!=='prezzo_testa_notte'  && persone && notti) set('prezzo_testa_notte', round2(total/persone/notti));
      if(changed!=='prezzo_notte'        && notti)           set('prezzo_notte', round2(total/notti));
    }
  } else { // Voli, Spese: solo totale <-> prezzo_testa
    const tot=g('totale'), pt=g('prezzo_testa');
    let total = tot;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale')       set('totale', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  }
}
// Campi che, se cambiati, innescano un ricalcolo

        <input class="form-control" id="f_${f}" type="time" value="${esc(toHM(v))}"></div>`;
    }

      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" list="airlines" value="${esc(v)}" placeholder="scegli o scrivi…"></div>`;
    }
    if(LINK_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">🔗</span>
          <input class="form-control" id="f_${f}" type="url" value="${esc(v)}" placeholder="https://…" inputmode="url">
        </div></div>`;
    }
    if(INT_FIELDS.includes(f)){
      const iv = v!=='' ? Math.round(parseNum(v)) : '';
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="number" step="1" min="0" inputmode="numeric" value="${iv!==''&&!isNaN(iv)?iv:''}"></div>`;
    }
    if(CUR_FIELDS.includes(f)){
      const hint = f==='prezzo_testa' ? 'auto dal totale'
                 : f==='prezzo_testa_notte' ? 'auto (÷ persone ÷ notti)'
                 : f==='prezzo_notte' ? 'auto (÷ notti)'
                 : f==='totale' ? 'oppure compila "a testa"' : '';
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}${hint?` <span style="font-weight:400;color:var(--muted);font-size:.7rem">— ${hint}</span>`:''}</label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
          <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}" placeholder="0,00">
        </div></div>`;
    }
    if(NUM_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}"></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
      <input class="form-control" id="f_${f}" type="text" value="${esc(v)}"></div>`;
  }).join('') + airlineDatalist();

  // aggancia il ricalcolo automatico totale <-> a testa
  CALC_TRIGGERS.forEach(t=>{
    const el = $('#f_'+t);
    if(el) el.addEventListener('input', ()=>recalc(sheet, t));
  });

  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    const out = { id: rec.id, viaggio_id: rec.viaggio_id };
    fields.forEach(f=>{
      const el = $('#f_'+f); if(!el) return;
      if(BOOL_FIELDS.includes(f))        out[f] = el.checked ? 'Sì' : '';

      else                               out[f] = el.value.trim();

    else       await api('create',{sheet, record:out});

    reloadCurrent();
  });
  MODAL.show();
}

async function delRow(sheet, id){
  if(!confirm('Eliminare questa voce?')) return;
  try{ await api('delete',{sheet,id}); toast('Eliminato','ok'); reloadCurrent(); }
  catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }

function reloadCurrent(){
  const h = location.hash;
  const m = h.match(/^#\/viaggio\/([^/]+)(?:\/([^/]+))?$/);
  if(m) viewTrip(m[1], m[2]||'riepilogo'); else viewHome();

// Raggruppa le tratte già salvate per gruppo_id (per la modifica)
function voliGroups(rows){
  const g = {};
  (rows||[]).forEach(r=>{
    const k = r.gruppo_id || r.id;   // fallback per righe vecchie senza gruppo
    (g[k] ??= []).push(r);
  });
  Object.values(g).forEach(arr=>arr.sort((a,b)=>num(a.tratta)-num(b.tratta)));
  return g;
}

    });

  $('#v_addLeg').onclick = ()=>{ legs.push(emptyLeg()); renderLegs(); };

  // auto-calcolo totale <-> a testa nel form volo
  const recalcVolo = (src)=>{
    const persone = parseNum($('#v_persone').value)||0;

    const pt  = parseNum($('#v_prezzo_testa').value);

      if(src!=='prezzo_testa' && document.activeElement!==$('#v_prezzo_testa'))
        $('#v_prezzo_testa').value = fmtNumIT(round2(tot/persone));
    }
  };
  $('#v_totale').addEventListener('input', ()=>recalcVolo('totale'));
  $('#v_prezzo_testa').addEventListener('input', ()=>recalcVolo('prezzo_testa'));

      note: ''

    if(isNew) await api('create_many', { sheet:'Voli', records });

    reloadCurrent();

function genGroupId(){ return 'g' + Math.random().toString(36).slice(2,10); }
function truthyEq(a,b){ return String(a||'').toLowerCase()===String(b).toLowerCase(); }

async function doExport(){
  toast('Preparo il backup…');
  try{
    const data = await api('export');
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `triphub-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup scaricato ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore backup: '+e.message,'error');
  }
}

async function doImport(input){
  const file = input.files && input.files[0];
  input.value = '';                 // reset così puoi re-importare lo stesso file
  if(!file) return;
  let payload;
  try { payload = JSON.parse(await file.text()); }
  catch(e){ return toast('File non valido (non è JSON)','error'); }

  const mode = confirm(
    'Come vuoi importare?\n\n' +
    'OK = SOSTITUISCI tutto (svuota e reinserisce dal backup)\n' +
    'Annulla = AGGIUNGI soltanto (unisce ai dati esistenti)'
  ) ? 'replace' : 'merge';

  if(mode==='replace' && !confirm('Confermi? I dati attuali verranno sostituiti con quelli del backup.')) return;

  showOverlay('Importo il backup…');
  try{
    const report = await api('import', { payload, mode });
    hideOverlay();
    const tot = Object.values(report).reduce((s,n)=>s+(Number(n)||0),0);
    toast(`Import completato: ${tot} righe`,'ok');
    reloadCurrent();
  }catch(e){
    hideOverlay();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore import: '+e.message,'error');
  }
}

function showOverlay(msg){
  let ov = $('#loadOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id='loadOverlay'; ov.className='load-overlay';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="spinner-border" style="color:var(--stamp);width:2.5rem;height:2.5rem"></div>
    <div class="mono">${esc(msg||'Attendere…')}</div>`;
  ov.style.display='flex';
}
function hideOverlay(){ const ov=$('#loadOverlay'); if(ov) ov.style.display='none'; }

function boot(){
  if(API_URL.includes('INCOLLA_QUI')){
    $('#app').innerHTML = `<div class="sheet p-4 m-4"><h2>⚙️ Configurazione mancante</h2>
      <p>Apri <code>index.html</code> e incolla l'URL della Web App in <code>API_URL</code>.</p></div>`;
    return;
  }
  if(!TOKEN) renderGate(); else route();
}
document.addEventListener('DOMContentLoaded', boot);
</script>

/* --- lettura del form nello stato VOL --- */
function volReadForm(){
  if(!VOL) return;
  const el = s => $('#'+s);
  if(el('v_opzione'))     VOL.opzione = el('v_opzione').value;
  if(el('v_pnr'))         VOL.pnr = el('v_pnr').value.trim();
  if(el('v_ar'))          VOL.ar = el('v_ar').checked;
  if(el('v_scelto'))      VOL.scelto = el('v_scelto').checked;
  if(el('v_dir'))         VOL.dir = el('v_dir').value;
  if(el('v_prezzoUnico')) VOL.prezzoUnico = el('v_prezzoUnico').checked;
  if(!VOL.ar) VOL.prezzoUnico = true;
  if(el('v_totale'))       VOL.totale = parseNum(el('v_totale').value);
  if(el('v_bagtot'))       VOL.bagTot = parseNum(el('v_bagtot').value);
  if(el('v_prezzo_testa')) VOL.prezzo_testa = parseNum(el('v_prezzo_testa').value);
  VOL.paganti = readPayValue('v_pag');
  if(el('v_scadenza_pag')) VOL.scadenza_pag = el('v_scadenza_pag').value || '';

  DIRS.forEach(d=>{
    const t = el('v_tot_'+dk(d));  if(t) VOL.tot[d]  = parseNum(t.value);
    const c = el('v_bagc_'+dk(d)); if(c) VOL.bagc[d] = parseNum(c.value);
    const b = el('v_bag_'+dk(d));  if(b) VOL.bag[d]  = b.checked;
    VOL.legs[d] = VOL.legs[d].map((L,i)=>{
      const g = f => { const e2 = el(lk(d,i,f)); return e2 ? (e2.type==='checkbox' ? e2.checked : e2.value) : null; };
      const out = Object.assign({}, L);
      const map = {comp:'compagnia', nvolo:'n_volo', da:'da', a:'a',
                   dpart:'data_part', opart:'ora_part', oarr:'ora_arr', plus1:'plus1'};
      Object.keys(map).forEach(f=>{ const v = g(f); if(v!==null) out[map[f]] = v; });
      out.da = normCode(out.da);
      out.a  = normCode(out.a);
      return out;
    });
  });
}

/* --- riempie i buchi: date a catena, aeroporti concatenati, compagnia dal n° volo --- */
function volNormalize(){
  const trip = CURRENT_TRIP || {};
  volDirs().forEach(d=>{
    const legs = VOL.legs[d];
    legs.forEach((L,i)=>{
      if(i===0){
        if(!L.data_part){
          const base = (d==='Ritorno') ? toISODate(trip.data_fine) : toISODate(trip.data_inizio);
          if(base) L.data_part = base;
        }
      } else {
        const p = legs[i-1];
        if(!L.da && p.a) L.da = p.a;
        if(!L.data_part){
          const arr = legArrISO(p);
          if(arr) L.data_part = arr;
        }
      }
      if(!L.compagnia){
        const m = String(L.n_volo||'').trim().toUpperCase().match(/^([A-Z0-9]{2,3})\s*\d/);
        if(m && AIRLINE_BY_CODE[m[1]]) L.compagnia = AIRLINE_BY_CODE[m[1]];
      }
    });
  });
}

/* --- scrive nel DOM solo i campi ancora vuoti + aggiorna scali/durate/prezzi --- */
function volSync(){
  if(!VOL) return;
  volReadForm();
  volNormalize();
  const map = {comp:'compagnia', nvolo:'n_volo', da:'da', a:'a', dpart:'data_part', opart:'ora_part', oarr:'ora_arr'};
  volDirs().forEach(d=>{
    const legs = VOL.legs[d];
    legs.forEach((L,i)=>{
      Object.keys(map).forEach(f=>{
        const e2 = $('#'+lk(d,i,f));
        if(e2 && !e2.value && L[map[f]] && document.activeElement!==e2) e2.value = L[map[f]];
      });
      if(i>0){
        const sc = $('#v_sc_'+dk(d)+'_'+i);
        if(sc){
          const m = legScaloMinsL(legs[i-1], L);
          sc.innerHTML = (m==null)
            ? `↳ scalo a ${esc(L.da||'?')}`
            : `↳ scalo a ${esc(L.da||'?')} · <strong${(m>=0&&m<45)?' style="color:var(--danger)"':''}>${fmtDur(m)}</strong>${m<0?' ⚠️':''}`;
        }
      }
    });
    legs.forEach((L,i)=>{
      const el = $('#v_ld_'+dk(d)+'_'+i);
      if(el){
        const m = legDurationL(L);
        const tzd = tzDiffMin(L.da, L.a, toISODate(L.data_part));
        el.innerHTML = m!=null
          ? `durata volo ${fmtDur(m)}${tzd?` · a ${esc(iataOf(L.a)||L.a)} l'orologio va spostato di <strong>${esc(fmtTzDiff(tzd))}</strong>`:''}`
          : '';
      }
    });
    const dd = $('#v_dur_'+dk(d));
    if(dd){
      const full = legs.filter(l=>!isLegEmpty(l));
      const m = dirDurationL(full);
      const n = full.length;
      const ign = tzUnknown(full.map(l=>l.da).concat(full.length?[full[full.length-1].a]:[]));
      dd.innerHTML = m!=null
        ? `durata ${d.toLowerCase()}: <strong>${fmtDur(m)}</strong> · ${n>1?(n-1)+' scalo':'diretto'}`
          + (ign.length?` <span style="color:var(--danger)">· fuso di ${esc(ign.join(', '))} sconosciuto: durata calcolata senza</span>`:'')
        : '';
    }
  });
  // prezzi: il totale dell'opzione è biglietti + bagagli
  const n = payCountInForm('v_pag');
  const tEl = $('#v_totale'), bEl = $('#v_bagtot'), pEl = $('#v_prezzo_testa');
  const bigl = VOL.prezzoUnico ? num(VOL.totale) : (num(VOL.tot.Andata)+num(VOL.tot.Ritorno));
  const bags = VOL.prezzoUnico ? num(VOL.bagTot) : (num(VOL.bagc.Andata)+num(VOL.bagc.Ritorno));
  const grand = bigl + bags;
  if(VOL.prezzoUnico && tEl && pEl && n){
    if(document.activeElement===pEl){
      const pt = parseNum(pEl.value);
      if(pt!=='') tEl.value = fmtNumIT(round2(Math.max(0, pt*n - bags)));
    } else if(grand){
      pEl.value = fmtNumIT(round2(grand/n));
    }
  }
  const g = $('#v_grand');
  if(g){
    g.textContent = grand
      ? `→ totale opzione ${eur(grand)}${bags?` (${eur(bigl)} volo + ${eur(bags)} bagagli)`:''}${n?` · ${eur(grand/n)} a testa`:''}`
      : '';
  }
}

function volValidate(){
  const e = [];
  volDirs().forEach(d=>{
    const legs = VOL.legs[d].filter(l=>!isLegEmpty(l));
    if(!legs.length){
      e.push(VOL.ar
        ? `Compila almeno una tratta del ${d.toLowerCase()}, oppure togli la spunta "andata e ritorno"`
        : 'Compila almeno una tratta');
      return;
    }
    legs.forEach((L,i)=>{
      const tag = `${d} · tratta ${i+1}`;
      if(!String(L.da||'').trim() || !String(L.a||'').trim()) e.push(`${tag}: indica partenza e arrivo`);
      if(!L.data_part) e.push(`${tag}: manca la data di partenza`);
      const dur = minsBetween(dtOf(L.data_part,L.ora_part), dtOf(legArrISO(L),L.ora_arr));
      if(dur!=null && dur<=0) e.push(`${tag}: l'arrivo precede la partenza — spunta "arriva il giorno dopo"`);
      if(i>0){
        const sc = legScaloMinsL(legs[i-1], L);
        if(sc!=null && sc<0) e.push(`${tag}: parte prima dell'arrivo della tratta precedente`);
      }
    });
  });
  if(VOL.ar){
    const a = VOL.legs.Andata.filter(l=>!isLegEmpty(l));
    const r = VOL.legs.Ritorno.filter(l=>!isLegEmpty(l));
    if(a.length && r.length){
      const A = dtOf(legArrISO(a[a.length-1]), a[a.length-1].ora_arr);
      const R = dtOf(r[0].data_part, r[0].ora_part);
      if(A && R && R<A) e.push('Il ritorno parte prima che l\'andata sia arrivata');
    }
  }
  return e;
}

async function volSave(){
  const dirs = VOL.ar
    ? DIRS.filter(d=>VOL.legs[d].some(l=>!isLegEmpty(l)))
    : [VOL.dir];
  const n = payCountInForm('v_pag');
  const opz = Math.round(parseNum(VOL.opzione)) || 1;
  const scelto = VOL.scelto ? 'Sì' : '';
  const pnr = String(VOL.pnr||'').trim();

  // biglietti e bagagli per direzione: con "prezzo unico" finisce tutto sulla prima
  const totals = {}, bags = {};
  dirs.forEach((d,i)=>{
    totals[d] = VOL.prezzoUnico ? (i===0 ? (VOL.totale===''?'':VOL.totale) : '') : (VOL.tot[d]===''?'':VOL.tot[d]);
    bags[d]   = VOL.prezzoUnico ? (i===0 ? (VOL.bagTot===''?'':VOL.bagTot) : '') : (VOL.bagc[d]===''?'':VOL.bagc[d]);
  });

  const records = [];
  dirs.forEach(d=>{
    const legs = VOL.legs[d].filter(l=>!isLegEmpty(l));
    legs.forEach((L,i)=>{
      const tot = i===0 ? totals[d] : '';
      const bag = i===0 ? bags[d]   : '';
      const somma = num(tot)+num(bag);
      records.push({
        viaggio_id: VOL.viaggio_id, gruppo_id: VOL.gruppo_id,
        opzione: opz, direzione: d, tratta: i+1,
        persone: n, paganti: VOL.paganti,
        pagato_da: VOL.pagato_da, scadenza_pag: VOL.scadenza_pag,
        compagnia: L.compagnia||'', n_volo: L.n_volo||'',
        da: L.da||'', a: L.a||'',
        data_part: L.data_part||'', ora_part: L.ora_part||'',
        data_arr: legArrISO(L),     ora_arr: L.ora_arr||'',
        scalo: i>0 ? (fmtDur(legScaloMinsL(legs[i-1],L))||'') : '',
        totale: tot==='' ? '' : round2(tot),
        costo_bagaglio: bag==='' ? '' : round2(bag),
        prezzo_testa: (i===0 && somma && n) ? round2(somma/n) : '',
        bagaglio: VOL.bag[d] ? 'Sì' : '',
        pnr: pnr,
        scelto, note: ''
      });
    });
  });

  let saved;
  if(VOL.isNew){
    saved = await api('create_many', { sheet:'Voli', records });
  } else {
    saved = await api('replace_group', { sheet:'Voli', gruppo_id: VOL.gruppo_id, ids: VOL.ids, records });
  }

  const oldIds = VOL.ids.map(String);
  CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).filter(r=>
    String(r.gruppo_id||r.id)!==String(VOL.gruppo_id) && !oldIds.includes(String(r.id))
  ).concat(saved);

  if(VOL.scelto){
    // esclusività: toglie la spunta alle altre opzioni sulle stesse direzioni
    const gid = VOL.gruppo_id;
    await api('set_scelta', { sheet:'Voli', viaggio_id: VOL.viaggio_id, gruppo_id: gid, on:true });
    CURRENT_DATA.Voli.forEach(r=>{
      if(String(r.gruppo_id||r.id)!==String(gid) && dirs.includes(dirOf(r))) r.scelto = '';
    });
  }

  MODAL.hide();
  toast('Volo salvato ✓','ok');
  refreshView();
}

/* ============================================================
   RUBRICA VIAGGIATORI
   Anagrafica globale, indipendente dai viaggi: i dati di Marco
   si scrivono una volta e si riusano in tutti i viaggi futuri.
   Visibile solo con il codice amministratore, perché contiene
   documenti di persone che magari a questo viaggio non vengono.
   ============================================================ */
let RUBRICA = null;
let RUBRICA_PICK = false;
const RUBRICA_FIELDS = ['nome','cognome','data_nascita','luogo_nascita','tipo_doc','num_doc',
  'scadenza_doc','nazionalita','cod_fiscale','telefono','email','note'];

async function loadRubrica(force){
  if(RUBRICA && !force) return RUBRICA;
  RUBRICA = await api('list', { sheet:'Rubrica' });
  return RUBRICA;
}

function rubKey(r){ return ((r.nome||'')+' '+(r.cognome||'')).trim().toLowerCase(); }

// Inserisce o aggiorna una persona in rubrica confrontando nome+cognome
async function rubricaUpsert(rec){
  await loadRubrica();
  const out = {};
  RUBRICA_FIELDS.forEach(f=>{ out[f] = rec[f] != null ? rec[f] : ''; });
  const ex = RUBRICA.find(r=>rubKey(r)===rubKey(out));
  if(ex){
    out.id = ex.id;
    await api('update', { sheet:'Rubrica', record: out });
    Object.assign(ex, out);
  } else {
    const saved = await api('create', { sheet:'Rubrica', record: out });
    RUBRICA.push(saved);
  }
}

async function savePersonToRubrica(id){
  const p = findRow('Partecipanti', id);
  if(!p) return;
  try{
    await rubricaUpsert(p);
    toast(`${pName(p)} salvato in rubrica ★`,'ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

          <label class="flex-grow-1 mb-0" ${pick?`for="rub_${i}"`:''} style="min-width:0;cursor:${pick?'pointer':'default'}">
            <div style="font-weight:600">${esc(pName(r))} ${già?'<span class="chip pick">già nel viaggio</span>':''}</div>
            <div class="mono" style="font-size:.72rem;color:var(--muted)">
              ${r.tipo_doc?esc(r.tipo_doc)+' ':''}${r.num_doc?esc(maskDoc(r.num_doc)):''}${r.scadenza_doc?' · scad. '+toITDate(r.scadenza_doc):''}${r.telefono?' · '+esc(r.telefono):''}</div>
          </label>
          <div class="text-nowrap">
            <button class="icon-btn" title="Modifica" onclick="editRowById('Rubrica','${jsArg(r.id)}')">✎</button>
            <button class="icon-btn" title="Elimina dalla rubrica" onclick="delRow('Rubrica','${jsArg(r.id)}')">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${pick?`<button class="btn btn-ghost btn-sm mt-2" onclick="editRow('Rubrica', null)">+ Nuova persona in rubrica</button>`:''}`

async function addFromRubrica(){
  const ids = [...document.querySelectorAll('.rub-one')].filter(c=>c.checked).map(c=>c.value);
  if(!ids.length){ toast('Seleziona almeno una persona','error'); return; }
  const tid = CURRENT_TRIP.id;

    const r = (RUBRICA||[]).find(x=>String(x.id)===String(id)) || {};

    RUBRICA_FIELDS.forEach(f=>{ o[f] = r[f] != null ? r[f] : ''; });

  MODAL.hide();
  toast(`${saved.length} person${saved.length===1?'a aggiunta':'e aggiunte'} ✓`,'ok');

}

            <span class="pd-mono">${eur(groupTotal(legs))}${bag?` (bagagli ${eur(bag)})`:''}</span></div>

          ${groupDirs(legs).map(dd=>{
            const ls = legsOfDir(legs, dd);
            return `<div style="margin-top:4px"><div class="pd-day">${dd==='Ritorno'?'🛬':'🛫'} ${dd} — ${toITDateLong(ls[0].data_part)}</div>
              ${ls.map((l,i)=>`<div class="pd-row"><span class="pd-mono">${esc(toHM(l.ora_part)||'--:--')} ${esc(l.da||'?')} → ${esc(l.a||'?')} ${esc(toHM(l.ora_arr)||'--:--')}${arrDayShift(l)?' (+1)':''}</span>
                <span class="pd-note">${esc(l.compagnia||'')} ${esc(l.n_volo||'')}</span></div>
                ${i<ls.length-1?`<div class="pd-note">↳ scalo a ${esc(ls[i+1].da||'?')}${(()=>{const m=rowScaloMins(l,ls[i+1]);return m!=null?' · '+fmtDur(m):'';})()}</div>`:''}`).join('')}
              </div>`;
          }).join('')}
          ${legs.some(l=>truthy(l.bagaglio))?`<div class="pd-note">🧳 bagaglio in stiva incluso</div>`:''}`);
      }).join('') : `<div class="pd-note">Nessun volo selezionato.</div>`
    }</div>`);
  }

  if(o.alloggi){
    out.push(`<div class="pd-sec"><h2>🏠 Alloggi</h2>${
      alloggi.length ? alloggi.map(a=>{
        const href = mapsHref(a);
        return pdBox(`
          <div class="pd-row"><strong>${esc(a.struttura||'Alloggio')}</strong>
            <span class="pd-mono">${eur(a.totale)}</span></div>
          <div class="pd-row"><span class="pd-mono">${toITDate(a.checkin)} ${esc(toHM(a.ora_checkin)||'')} → ${toITDate(a.checkout)} ${esc(toHM(a.ora_checkout)||'')}</span>
            <span class="pd-note">${algNights(a)} notti</span></div>
          ${a.indirizzo?`<div class="pd-note">📍 ${esc(a.indirizzo)}</div>`:''}
          ${href?`<div class="pd-note"><a href="${esc(href)}">${esc(href.length>60?href.slice(0,60)+'…':href)}</a></div>`:''}
          ${a.pnr?`<div class="pd-row"><span class="pd-k">prenotazione</span><span class="pd-mono"><strong>${esc(a.pnr)}</strong></span></div>`:''}
          ${a.note?`<div class="pd-note">${esc(a.note)}</div>`:''}`);
      }).join('') : `<div class="pd-note">Nessun alloggio selezionato.</div>`
    }</div>`);
  }

  if(o.budget){
    out.push(`<div class="pd-sec"><h2>💶 Budget</h2>${pdBox(`
      <div class="pd-row"><span>Alloggio</span><span class="pd-mono">${eur(b.alloggio)}</span></div>
      <div class="pd-row"><span>Voli${b.voliBagagli?` (di cui ${eur(b.voliBagagli)} bagagli)`:''}</span><span class="pd-mono">${eur(b.voli)}</span></div>
      <div class="pd-row"><span>Spese extra</span><span class="pd-mono">${eur(b.spese)}</span></div>
      <div class="pd-row"><strong>Totale</strong><span class="pd-mono"><strong>${eur(b.tot)}</strong></span></div>
      <div class="pd-row"><span>A testa (${b.pers} persone)</span><span class="pd-mono">${eur(b.perPersona)}</span></div>`)}
      ${balances && balances.length ? pdBox(`<div class="pd-k" style="margin-bottom:3px">quota per persona</div>
        ${balances.map(x=>`<div class="pd-row"><span>${esc(x.nome)}</span><span class="pd-mono">${eur(x.quota)}</span></div>`).join('')}`) : ''}
    </div>`);
  }

  if(o.conti){
    const st = computeSettlement(d);
    const c  = cassa(d);
    if(st){
      const segno = v => v > 0.005 ? 'deve ricevere ' + eur(v)
                      : v < -0.005 ? 'deve dare ' + eur(-v) : 'in pari';
      const mov = st.movimenti.filter(m=>m.valido);
      out.push(`<div class="pd-sec"><h2>🧾 Conti</h2>${pdBox(`
        <div class="pd-row"><span>Costo del viaggio</span><span class="pd-mono">${eur(c.costo)}</span></div>
        <div class="pd-row"><span>Già usciti</span><span class="pd-mono">${eur(c.uscito)}</span></div>
        <div class="pd-row"><strong>Ancora da pagare</strong><span class="pd-mono"><strong>${eur(c.daPagare)}</strong></span></div>`)}
        ${mov.length ? pdBox(`<div class="pd-k" style="margin-bottom:3px">movimenti</div>
          ${mov.map(m=>`<div class="pd-row">
            <span>${m.data?`<span class="pd-mono">${toITDate(m.data)}</span> `:''}${esc(m.chi)}${m.tipo==='rimborso'?' → '+esc(m.verso):''}
              ${m.riferimento?`<span class="pd-note">${esc(m.riferimento)}</span>`:''}</span>
            <span class="pd-mono">${eur(m.importo)}</span></div>`).join('')}`) : ''}
        ${pdBox(`<div class="pd-k" style="margin-bottom:3px">saldi</div>
          ${st.righe.slice().sort((a,b)=>b.saldo-a.saldo).map(r=>`<div class="pd-row">
            <span>${esc(r.nome)}</span><span class="pd-mono">${esc(segno(r.saldo))}</span></div>`).join('')}`)}
        ${st.trasferimenti.length ? pdBox(`<div class="pd-k" style="margin-bottom:3px">per pareggiare</div>
          ${st.trasferimenti.map(t=>`<div class="pd-row"><span>${esc(t.da)} → ${esc(t.a)}</span>
            <span class="pd-mono">${eur(t.importo)}</span></div>`).join('')}`) : ''}
      </div>`);
    }
  }

  if(o.part && people.length){
    out.push(`<div class="pd-sec"><h2>👥 Partecipanti</h2>${pdBox(
      people.map(p=>`<div class="pd-row"><span>${esc(pName(p))}${p.data_nascita?` <span class="pd-note">${toITDate(p.data_nascita)}</span>`:''}</span>
        <span class="pd-mono">${o.doc && p.num_doc ? esc(p.tipo_doc||'doc')+' '+esc(p.num_doc)+(p.scadenza_doc?' · scad. '+toITDate(p.scadenza_doc):'') : esc(p.telefono||'')}</span></div>`).join('')
    )}${o.doc?`<div class="pd-note">⚠️ Questo documento contiene numeri di documenti personali: conservalo con attenzione.</div>`:''}</div>`);
  }

  if(o.att){
    const rows = (d.CoseDaFare||[]).slice();
    const withDate = rows.filter(r=>toISODate(r.data)).sort((a,b)=>{
      const c = toISODate(a.data).localeCompare(toISODate(b.data));
      return c!==0?c:(toHM(a.ora)||'99:99').localeCompare(toHM(b.ora)||'99:99');
    });
    const noDate = rows.filter(r=>!toISODate(r.data));
    const byDay = {};
    withDate.forEach(r=>{ const k=toISODate(r.data); (byDay[k]=byDay[k]||[]).push(r); });
    const item = r=>`<div class="pd-row"><span>${r.ora?`<span class="pd-mono">${esc(toHM(r.ora))}</span> `:''}${esc(r.attivita||'')}${truthy(r.prenotazione_req)&&!truthy(r.confermata)?' <span class="pd-note">(da prenotare)</span>':''}</span>
        <span class="pd-note">${esc(r.posizione||'')}${num(r.costo)?' · '+eur(r.costo):''}</span></div>`;
    if(withDate.length || noDate.length){
      out.push(`<div class="pd-sec"><h2>📅 Programma</h2>
        ${Object.keys(byDay).map(k=>pdBox(`<div class="pd-day">${toITDateLong(k)}</div>${byDay[k].map(item).join('')}`)).join('')}
        ${noDate.length?pdBox(`<div class="pd-day">Da collocare</div>${noDate.map(item).join('')}`):''}
      </div>`);
    }
  }

  if(o.cont && (d.Contatti||[]).length){
    out.push(`<div class="pd-sec"><h2>☎️ Contatti utili</h2>${pdBox(
      (d.Contatti||[]).slice().sort((a,b)=>{
        const w = x => String(x.categoria||'').trim()==='Emergenza' ? 0 : 1;
        return w(a)-w(b) || String(a.categoria||'').localeCompare(String(b.categoria||''),'it');
      }).map(c=>`<div class="pd-row"><span><strong>${esc(c.nome||'')}</strong>${c.categoria?` <span class="pd-note">${esc(c.categoria)}</span>`:''}${c.indirizzo?`<div class="pd-note">${esc(c.indirizzo)}</div>`:''}${c.email?`<div class="pd-note">${esc(c.email)}</div>`:''}</span>
        <span class="pd-mono">${esc(c.telefono||'')}</span></div>`).join('')
    )}</div>`);
  }

  if(o.info && (d.InfoDest||[]).length){
    const bySez = {};
    (d.InfoDest||[]).forEach(r=>{ (bySez[r.sezione||'Generale']=bySez[r.sezione||'Generale']||[]).push(r); });
    out.push(`<div class="pd-sec"><h2>ℹ️ Info destinazione</h2>${
      Object.entries(bySez).map(([s,items])=>pdBox(`<div class="pd-day">${esc(s)}</div>
        ${items.filter(r=>String(r.valore||'').trim()).map(r=>`<div class="pd-row"><span>${esc(r.chiave)}</span><span class="pd-note">${esc(r.valore)}</span></div>`).join('')}`)).join('')
    }</div>`);
  }

  if(o.cp && (d.CosaPortare||[]).length){
    const byCat = {};
    (d.CosaPortare||[]).forEach(r=>{ const k=String(r.categoria||'Varie').trim()||'Varie'; (byCat[k]=byCat[k]||[]).push(r); });
    out.push(`<div class="pd-sec pd-break"><h2>🧳 Cosa portare</h2><div class="pd-cols">${
      Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'it')).map(cat=>`<div class="pd-box">
        <div class="pd-day">${esc(cat)}</div>
        ${byCat[cat].map(r=>`<div>${truthy(r.spuntato)?'☑':'☐'} ${esc(r.cosa||'')}${Math.round(num(r.qta))>1?' ×'+Math.round(num(r.qta)):''}${r.chi&&String(r.chi).toLowerCase()!=='tutti'?` <span class="pd-note">(${esc(r.chi)})</span>`:''}</div>`).join('')}
      </div>`).join('')
    }</div></div>`);
  }

  out.push(`<div class="pd-note" style="margin-top:10px;border-top:1px solid #bbb;padding-top:5px">
    Generato con TripHub · ${esc(t.destinazione||'')} · ${toITDate(todayISO())}</div>`);
  return out.join('');
}

function doPrintDossier(o){
  const el = document.getElementById('printDoc');
  if(!el) return;
  el.innerHTML = buildDossier(o);
  document.body.classList.add('printing');
  const cleanup = ()=>{
    document.body.classList.remove('printing');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{ try{ window.print(); }catch(_){ toast('Il browser ha bloccato la stampa','error'); } }, 80);
  setTimeout(cleanup, 60000);   // rete di sicurezza se afterprint non scatta
}

/* ============================================================
   EXPORT CALENDARIO (.ics)
   ------------------------------------------------------------
   Voli, alloggi e attività programmate finiscono nel calendario del
   telefono senza ricopiarli a mano.

   Gli orari sono scritti come "ora locale fluttuante" (niente Z, niente
   TZID): il calendario li mostra esattamente come li vedi qui. Per i voli
   è anche la lettura giusta, visto che gli orari di partenza e arrivo sono
   già quelli locali dei due aeroporti.
   ============================================================ */
function icsEsc(v){
  const BS = String.fromCharCode(92);            // backslash, scritto così per non litigare con gli escape
  return String(v==null?'':v)
    .split(BS).join(BS+BS)
    .split(';').join(BS+';')
    .split(',').join(BS+',')
    .replace(/\r?\n/g, BS+'n');
}
// l'RFC vuole righe da max 75 ottetti, spezzate con uno spazio a capo
function icsFold(line){
  const out = [];
  let cur = line;
  while(cur.length > 74){ out.push(cur.slice(0,74)); cur = ' ' + cur.slice(74); }
  out.push(cur);
  return out.join('\r\n');
}
function icsStamp(iso, hm){
  const d = String(iso||'').replace(/-/g,'');
  if(!hm) return { key:';VALUE=DATE', val:d };
  return { key:'', val: d + 'T' + String(hm).replace(':','') + '00' };
}
function icsEvent(uid, startISO, startHM, endISO, endHM, titolo, luogo, note){
  if(!startISO) return '';
  const a = icsStamp(startISO, startHM);
  // evento di un giorno intero: DTEND è il giorno DOPO, altrimenti sparisce
  const b = startHM ? icsStamp(endISO || startISO, endHM)
                    : icsStamp(isoAddDays(endISO || startISO, 1), '');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const L = [
    'BEGIN:VEVENT',
    'UID:' + uid + '@triphub',
    'DTSTAMP:' + now,
    'DTSTART' + a.key + ':' + a.val,
    'DTEND'   + b.key + ':' + b.val,
    'SUMMARY:' + icsEsc(titolo)
  ];
  if(luogo) L.push('LOCATION:' + icsEsc(luogo));
  if(note)  L.push('DESCRIPTION:' + icsEsc(note));
  L.push('END:VEVENT');
  return L.map(icsFold).join('\r\n');
}

function buildICS(d, trip){
  const nome = trip.destinazione || trip.nome || 'Viaggio';
  const ev = [];

  (d.Voli||[]).filter(v=>truthy(v.scelto)).forEach(v=>{
    const dep = toISODate(v.data_part);
    if(!dep) return;
    const rotta = [iataOf(v.da)||v.da, iataOf(v.a)||v.a].filter(Boolean).join(' → ');
    ev.push(icsEvent('volo-'+v.id, dep, toHM(v.ora_part), rowArrISO(v), toHM(v.ora_arr),
      '✈️ ' + rotta + (v.n_volo?' · '+v.n_volo:''),
      v.da || '',
      [v.compagnia, v.pnr?('prenotazione '+v.pnr):''].filter(Boolean).join(' · ')));
  });

  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
    const ci = toISODate(a.checkin);
    if(!ci) return;
    ev.push(icsEvent('alg-'+a.id, ci, toHM(a.ora_checkin), toISODate(a.checkout), toHM(a.ora_checkout),
      '🏠 ' + (a.struttura||'Alloggio'),
      a.indirizzo || a.posizione || '',
      [a.pnr?('prenotazione '+a.pnr):'', a.link||''].filter(Boolean).join(' · ')));
  });

  (d.CoseDaFare||[]).forEach(r=>{
    const iso = toISODate(r.data);
    if(!iso) return;                                    // le idee non hanno una data: fuori
    const hm = toHM(r.ora);
    let endISO = iso, endHM = '';
    if(hm){
      const fine = hmToMin(hm) + cdfNeed(r);
      endHM  = minToHM(Math.min(fine, 23*60+59));
      endISO = fine > 23*60+59 ? isoAddDays(iso,1) : iso;   // sfora la mezzanotte
      if(fine > 23*60+59) endHM = minToHM(fine - 24*60);
    }
    ev.push(icsEvent('cdf-'+r.id, iso, hm, endISO, endHM,
      tipoIcon(r.tipo) + ' ' + (r.attivita||'Attività'),
      r.posizione || '',
      [r.note||'', truthy(r.prenotazione_req)&&!truthy(r.confermata)?'da prenotare':''].filter(Boolean).join(' · ')));
  });

  const body = ev.filter(Boolean).join('\r\n');
  if(!body) return null;
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//TripHub//IT',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    icsFold('X-WR-CALNAME:' + icsEsc(nome)),
    body,
    'END:VCALENDAR',
    ''
  ].join('\r\n');
}

function exportICS(){
  if(!CURRENT_TRIP || !CURRENT_DATA){ toast('Apri prima un viaggio','error'); return; }
  const ics = buildICS(CURRENT_DATA, CURRENT_TRIP);
  if(!ics){ toast('Non c\'è ancora niente con una data da esportare','error'); return; }
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = String(CURRENT_TRIP.destinazione || CURRENT_TRIP.nome || 'viaggio')
    .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  a.href = url; a.download = `triphub-${slug||'viaggio'}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Calendario scaricato ✓','ok');
}

/* ============================================================
   BACKUP / RESTORE (solo amministratore)
   ============================================================ */
async function doExport(){
  toast('Preparo il backup…');
  try{
    const data = await api('export');
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `triphub-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup scaricato ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore backup: '+e.message,'error');
  }
}

async function doImport(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  let payload;
  try { payload = JSON.parse(await file.text()); }
  catch(e){ return toast('File non valido (non è JSON)','error'); }

  const mode = await ask('Come vuoi importare il backup?', [
    {label:'Annulla', value:null, cls:'btn-ghost'},
    {label:'Aggiungi soltanto', value:'merge', cls:'btn-ink'},
    {label:'Sostituisci tutto', value:'replace', cls:'btn-del'},
  ]);
  if(!mode) return;
  if(mode==='replace' && !await askConfirm('Confermi? I dati attuali verranno SOSTITUITI con quelli del backup.', true)) return;

  showOverlay('Importo il backup…');
  try{
    const report = await api('import', { payload, mode });
    TRIP_CACHE.clear(); invalidateTrips(); RUBRICA = null;
    hideOverlay();
    const tot = Object.values(report).reduce((s,n)=>s+(Number(n)||0),0);
    toast(`Import completato: ${tot} righe`,'ok');
    reloadCurrent();
  }catch(e){
    hideOverlay();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore import: '+e.message,'error');
  }
}

function showOverlay(msg){
  let ov = $('#loadOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id='loadOverlay'; ov.className='load-overlay';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="spinner-border" style="color:var(--stamp);width:2.5rem;height:2.5rem"></div>
    <div class="mono">${esc(msg||'Attendere…')}</div>`;
  ov.style.display='flex';
}
function hideOverlay(){ const ov=$('#loadOverlay'); if(ov) ov.style.display='none'; }

/* ============================================================
   SCORCIATOIE DA TASTIERA
   ============================================================ */
let WIRED = false;
function initKeyboard(){
  if(WIRED) return; WIRED = true;
  document.addEventListener('keydown', e=>{
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
    if(document.querySelector('.modal.show')) return;

    if(e.key === '/'){
      const box = $('#tripSearch');
      if(box){ e.preventDefault(); box.focus(); box.select(); }
      return;
    }
    if(e.key === 'Escape' && $('#navsheet') && $('#navsheet').classList.contains('open')){
      closeNavSheet(); return;
    }
    if(e.key === 'Escape' && $('#tripSearch') && $('#tripSearch').value){
      $('#tripSearch').value=''; filterTrips(''); return;
    }
    if(/^[1-9]$/.test(e.key) && CURRENT_TRIP && /^#\/viaggio\//.test(location.hash)){
      const sec = SECTIONS[Number(e.key)-1];
      if(sec){ e.preventDefault(); location.hash = `#/viaggio/${CURRENT_TRIP.id}/${sec[0]}`; }
    }
  });
}

/* ============================================================
   STATO DELLA RETE
   ============================================================ */
let NET_WIRED = false;
function initNetwork(){
  const bar = $('#netbar');
  if(NET_WIRED){ bar.classList.toggle('show', !navigator.onLine); return; }
  NET_WIRED = true;
  const paint = ()=>{
    const off = !navigator.onLine;
    bar.classList.toggle('show', off);
    if(off) setSync('offline');
    else if($('#syncState') && $('#syncState').textContent==='offline') setSync('pronto');
  };
  window.addEventListener('online', ()=>{ paint(); toast('Connessione ripristinata','ok'); });
  window.addEventListener('offline', paint);
  paint();
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  if(API_URL.includes('INCOLLA_QUI')){
    $('#app').innerHTML = `<div class="sheet p-4 m-4"><h2>⚙️ Configurazione mancante</h2>
      <p>Apri <code>index.html</code> e incolla l'URL della Web App in <code>API_URL</code>.</p></div>`;
    return;
  }
  initKeyboard();
  initNetwork();
  initVisibility();
  if(!TOKEN) return renderGate();
  buildTopMenu();
  // il ruolo può mancare (tab riaperta): lo richiediamo prima di disegnare,
  // altrimenti mostreremmo pulsanti da amministratore a chi non lo è
  if(!ROLE){
    try { applyRole(await api('auth')); }
    catch(e){
      if(e instanceof NetworkError){ renderError('Nessuna connessione', e.message, boot); return; }
      TOKEN=''; sessionStorage.removeItem('triphub_token');
      return renderGate('Codice non più valido.');
    }
  } else applyRole({ role: ROLE, viaggi: MY_TRIPS });
  route();
}
document.addEventListener('DOMContentLoaded', boot);

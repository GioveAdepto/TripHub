}

/* ============================================================
   VOLI — modello dati
   gruppo_id  = OPZIONE COMPLETA (andata + ritorno insieme)
   direzione  = Andata | Ritorno       tratta = scalo n° dentro la direzione
   totale     = prezzo del BIGLIETTO, valorizzato SOLO sulla prima
                tratta di una direzione.
   costo_bagaglio = supplemento bagagli, stessa regola.
   Il costo di un'opzione è quindi: somma dei biglietti + somma dei
   bagagli di tutte le sue tratte. Tenere i due addendi separati
   serve perché molti siti mostrano prima il volo e poi il bagaglio.
   ============================================================ */
const DIRS = ['Andata','Ritorno'];
const dk     = d => (String(d||'').toLowerCase().indexOf('rit')===0 ? 'R' : 'A');
const isRit  = d => dk(d)==='R';
const dirOf  = r => isRit(r.direzione) ? 'Ritorno' : 'Andata';

function voliGroups(rows){
  const g = {};
  (rows||[]).forEach(r=>{ const k = r.gruppo_id || r.id; (g[k] = g[k] || []).push(r); });
  Object.values(g).forEach(arr=>arr.sort((a,b)=>{
    const d = (isRit(a.direzione)?1:0) - (isRit(b.direzione)?1:0);
    return d!==0 ? d : num(a.tratta)-num(b.tratta);
  }));
  return g;
}
function legsOfDir(legs, dir){ return (legs||[]).filter(l=>dirOf(l)===dir); }
function groupDirs(legs){ return DIRS.filter(d=>legsOfDir(legs,d).length>0); }
function groupBiglietti(legs){ return (legs||[]).reduce((s,l)=>s+num(l.totale),0); }
function groupBag(legs){ return (legs||[]).reduce((s,l)=>s+num(l.costo_bagaglio),0); }
function groupTotal(legs){ return groupBiglietti(legs) + groupBag(legs); }
function groupPTesta(legs){ return (legs||[]).reduce((s,l)=>s+num(l.prezzo_testa),0); }
function groupChosen(legs){ return (legs||[]).some(l=>truthy(l.scelto)); }
function groupOpz(legs){ return Math.round(num(legs && legs[0] && legs[0].opzione))||1; }
function groupPnr(legs){
  const r = (legs||[]).find(l=>String(l.pnr||'').trim());
  return r ? String(r.pnr).trim() : '';
}
function groupKind(legs){
  const ds = groupDirs(legs);
  if(ds.length===2) return 'A/R';
  return ds[0]==='Ritorno' ? 'solo ritorno' : 'solo andata';
}
function routeStr(legs){
  if(!legs || !legs.length) return '';
  return legs.map(l=>String(l.da||'?')).concat(String(legs[legs.length-1].a||'?')).join(' → ');
}
function nextOpz(){
  const groups = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[]);
  const max = Object.values(groups).reduce((m,g)=>Math.max(m, groupOpz(g)), 0);
  return max+1;
}

/* -- date/ore su righe già salvate --
   Gli orari dei voli sono SEMPRE ora locale dell'aeroporto: sommarli
   così com'erano dava durate sbagliate di un'ora o più su ogni tratta
   internazionale. Ora ogni orario viene convertito nell'istante UTC
   reale usando il fuso dell'aeroporto, e la durata torna quella vera. */
const TZ_CACHE = {};
function iataOf(v){
  const m = String(v||'').trim().toUpperCase().match(/^([A-Z]{3})\b/);
  return m ? m[1] : '';
}
function tzOf(place){
  const c = iataOf(place);
  return c ? (AIRPORT_TZ[c] || '') : '';
}
// scarto dall'UTC (minuti) di una zona in un dato istante — tiene conto dell'ora legale
function tzOffsetMin(tz, ms){
  const key = tz + '|' + Math.floor(ms/3600000);
  if(TZ_CACHE[key] != null) return TZ_CACHE[key];
  let off = 0;
  try{
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
      .formatToParts(new Date(ms)).forEach(x=>{ p[x.type] = x.value; });
    const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute);
    off = Math.round((asUTC - Math.floor(ms/60000)*60000) / 60000);
  }catch(e){ off = 0; }
  TZ_CACHE[key] = off;
  return off;
}
// istante UTC di un orario "da parete" letto in una certa zona
function zonedTs(iso, hm, tz){
  const [y,m,d]  = iso.split('-').map(Number);
  const [hh,mi]  = String(hm||'00:00').split(':').map(Number);
  const naive = Date.UTC(y, m-1, d, hh||0, mi||0);
  const off1 = tzOffsetMin(tz, naive);
  const ts   = naive - off1*60000;
  const off2 = tzOffsetMin(tz, ts);        // secondo giro: cambio d'ora legale
  return off2===off1 ? ts : naive - off2*60000;
}
function dtOf(dateRaw, timeRaw, place){
  const iso = toISODate(dateRaw);
  if(!iso) return null;
  const hm = toHM(timeRaw) || '00:00';
  const tz = place ? tzOf(place) : '';
  return tz ? new Date(zonedTs(iso, hm, tz)) : new Date(iso+'T'+hm+':00');
}
// differenza di fuso fra due aeroporti in una data (minuti, 0 se ignota)
function tzDiffMin(fromPlace, toPlace, iso){
  const a = tzOf(fromPlace), b = tzOf(toPlace);
  if(!a || !b || a===b) return 0;
  const ms = iso ? Date.parse(iso+'T12:00:00Z') : Date.now();
  return tzOffsetMin(b, ms) - tzOffsetMin(a, ms);
}
function fmtTzDiff(m){
  if(!m) return '';
  const a = Math.abs(m), h = Math.floor(a/60), mm = a%60;
  return (m>0?'+':'−') + h + (mm?':'+String(mm).padStart(2,'0'):'') + 'h';
}
// aeroporti citati di cui non conosciamo il fuso (per avvisare invece di mentire)
function tzUnknown(places){
  const out = [];
  (places||[]).forEach(p=>{
    const c = iataOf(p);
    if(String(p||'').trim() && !tzOf(p) && !out.includes(c||String(p).trim())) out.push(c||String(p).trim());
  });
  return out;
}
function minsBetween(a,b){ if(!a||!b) return null; return Math.round((b-a)/60000); }
function fmtDur(m){
  if(m==null || isNaN(m)) return '';
  if(m<0) return '—';
  const h = Math.floor(m/60), mm = m%60;
  return (h?h+'h ':'') + (mm?mm+'m':(h?'':'0m'));
}
function rowArrISO(l){ return toISODate(l.data_arr) || toISODate(l.data_part); }
function legDuration(l){
  return minsBetween(dtOf(l.data_part, l.ora_part, l.da), dtOf(rowArrISO(l), l.ora_arr, l.a));
}
function dirDuration(legs){
  if(!legs || !legs.length) return null;
  const L = legs[legs.length-1];
  return minsBetween(dtOf(legs[0].data_part, legs[0].ora_part, legs[0].da),
                     dtOf(rowArrISO(L), L.ora_arr, L.a));
}
function rowScaloMins(prev, next){
  // stesso aeroporto, quindi stesso fuso: passiamo comunque il codice
  return minsBetween(dtOf(rowArrISO(prev), prev.ora_arr, prev.a),
                     dtOf(next.data_part, next.ora_part, next.da));
}
function dirTzDiff(legs){
  if(!legs || !legs.length) return 0;
  return tzDiffMin(legs[0].da, legs[legs.length-1].a, toISODate(legs[0].data_part));
}
function arrDayShift(l){
  const p = toISODate(l.data_part), a = toISODate(l.data_arr);
  return !!(p && a && a>p);
}

/* ---------- VOLI: sezione ---------- */
let VOLI_VIEW = 'schede';   // 'schede' | 'confronto'
function setVoliView(v){ VOLI_VIEW = v; renderSection('voli'); }

function voliCoverageWarn(groups){
  const chosen = Object.keys(groups).filter(k=>groupChosen(groups[k]));
  if(!chosen.length) return '';
  const covered = {};
  chosen.forEach(k=>groupDirs(groups[k]).forEach(d=>covered[d]=true));
  const missing = DIRS.filter(d=>!covered[d]);
  if(!missing.length) return '';
  return `<div class="mono mt-2" style="font-size:.72rem;color:var(--stamp)">
    ⚠️ nessun ${missing.map(m=>m.toLowerCase()).join(' e ')} selezionato</div>`;
}

function secVoli(rows, tid){
  rows = rows || [];
  const groups = voliGroups(rows);
  const keys = Object.keys(groups).sort((a,b)=>{
    const oa = groupOpz(groups[a]), ob = groupOpz(groups[b]);
    if(oa!==ob) return oa-ob;
    return (groupDirs(groups[a])[0]||'').localeCompare(groupDirs(groups[b])[0]||'');
  });

  const toggle = `
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn ${VOLI_VIEW==='schede'?'btn-ink':'btn-ghost'}" onclick="setVoliView('schede')">Schede</button>
      <button class="btn ${VOLI_VIEW==='confronto'?'btn-ink':'btn-ghost'}" onclick="setVoliView('confronto')">Confronto</button>
    </div>`;

  const header = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">${toggle}
        <span class="mono" style="font-size:.72rem;color:var(--muted)">${keys.length} opzioni · ${rows.length} tratte</span></div>
      <button class="btn btn-stamp btn-sm" onclick="editVolo(null, '${jsArg(tid)}')">+ Aggiungi volo</button>
    </div>`;

  if(!keys.length){
    return header + `<div class="sheet empty"><div class="big">Nessun volo ancora</div>
      <div>Aggiungi un'opzione: di default andata e ritorno insieme.</div></div>`;
  }

  const body = VOLI_VIEW==='confronto'
    ? voliTable(groups, keys)
    : `<div class="row g-3">${keys.map(k=>voloCard(k, groups[k], groups)).join('')}</div>`;

  return header + tripDatesBanner(CURRENT_DATA) + voliCoverageWarn(groups) + body;
}

function dirSummary(d, legs){
  const first = legs[0];
  const dur = fmtDur(dirDuration(legs));
  const scali = legs.length-1;
  const tzd = dirTzDiff(legs);
  const detail = legs.map((l,i)=>{
    const pre = i>0
      ? `<div class="scalo-row">↳ scalo a ${esc(l.da||'?')}${(()=>{const m=rowScaloMins(legs[i-1],l);return m!=null?` · <strong${m<45&&m>=0?' style="color:var(--danger)"':''}>${fmtDur(m)}</strong>`:(l.scalo?` · ${esc(l.scalo)}`:'');})()}</div>`
      : '';
    const ld = fmtDur(legDuration(l));
    return pre + `<div class="leg-row">
      <span class="mono leg-time">${esc(toHM(l.ora_part)||'--:--')}</span>
      <span class="leg-mid"><strong>${esc(l.da||'?')} → ${esc(l.a||'?')}</strong>
        <span class="leg-sub">${esc(l.compagnia||'')} ${esc(l.n_volo||'')}${ld?` · ${ld}`:''}</span></span>
      <span class="mono leg-time arr">${esc(toHM(l.ora_arr)||'--:--')}${arrDayShift(l)?'<sup>+1</sup>':''}</span>
    </div>`;
  }).join('');
  return `<div class="dir-block">
    <div class="dir-head">
      <span>${d==='Ritorno'?'🛬':'🛫'} ${d}${tzd?` <span class="tz-chip" title="A destinazione l'orologio va spostato di ${esc(fmtTzDiff(tzd))}">🕓 ${esc(fmtTzDiff(tzd))}</span>`:''}</span>
      <span class="mono">${toITDate(first.data_part)}${dur?` · ${dur}`:''} · ${scali?scali+' scalo'+(scali>1?'i':''):'diretto'}</span>
    </div>${detail}</div>`;
}

function voloCard(key, legs, groups){
  const pick = groupChosen(legs);
  const kind = groupKind(legs);
  const tot = groupTotal(legs), bigl = groupBiglietti(legs), bag = groupBag(legs), pt = groupPTesta(legs);
  const pnr = groupPnr(legs);
  const mono = groupDirs(legs).length===1;
  const canMerge = mono && Object.keys(groups).some(k2=>{
    if(String(k2)===String(key)) return false;
    const g2 = groups[k2];
    return groupDirs(g2).length===1 && groupDirs(g2)[0]!==groupDirs(legs)[0];
  });
  const bagIncl = legs.some(l=>truthy(l.bagaglio));
  return `<div class="col-12 col-lg-6">
    <div class="sheet p-3 h-100 volo-card${pick?' picked':''}">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div class="d-flex align-items-center gap-1 flex-wrap">
          <span class="chip">opz. ${esc(groupOpz(legs))}</span>
          <span class="chip${kind==='A/R'?'':' pri-cons'}">${esc(kind)}</span>
          ${bagIncl?'<span class="chip" title="bagaglio in stiva incluso nel biglietto">🧳 incluso</span>':''}
          ${pick?'<span class="chip pick">✓ scelto</span>':''}
        </div>
        <div class="text-nowrap">
          ${canMerge?`<button class="icon-btn" title="Abbina con l'altra direzione" onclick="abbinaVolo('${jsArg(key)}')">⇄</button>`:''}
          <button class="icon-btn" title="Duplica opzione" onclick="dupVolo('${jsArg(key)}')">⧉</button>
          <button class="icon-btn" title="Modifica" onclick="editVoloById('${jsArg(key)}')">✎</button>
          <button class="icon-btn" title="Elimina" onclick="delVolo('${jsArg(key)}')">🗑</button>
        </div>
      </div>
      ${pnr?`<div class="mb-2">${codeChip('prenotazione', pnr)}</div>`:''}
      ${groupDirs(legs).map(d=>dirSummary(d, legsOfDir(legs,d))).join('')}
      <div class="d-flex justify-content-between align-items-center mt-2 pt-2" style="border-top:1px solid var(--line)">
        <div>
          <span class="mono" style="font-size:.95rem;font-weight:600">${tot?eur(tot):'—'}</span>
          ${pt?`<span class="per-person ms-2" style="font-size:.8rem">${eur(pt)} a testa</span>`:''}
          ${bag?`<div class="price-split">${eur(bigl)} volo + ${eur(bag)} bagagli</div>`:''}
        </div>
        <button class="btn btn-sm ${pick?'btn-ghost':'btn-stamp'}"
          onclick="chooseVolo('${jsArg(key)}',${pick?'false':'true'})">${pick?'✓ scelto':'Scegli'}</button>
      </div>
    </div></div>`;
}

function voliTable(groups, keys){
  const cellDir = ls => ls.length ? `<div class="mono" style="font-size:.72rem;line-height:1.5">
      ${esc(routeStr(ls))}<br>${toITDate(ls[0].data_part)} ${esc(toHM(ls[0].ora_part))} → ${esc(toHM(ls[ls.length-1].ora_arr))}
      ${(()=>{const dd=fmtDur(dirDuration(ls));return dd?' · '+dd:'';})()} · ${ls.length>1?(ls.length-1)+' scalo':'diretto'}
    </div>` : '<span class="chip">–</span>';
  const body = keys.map(k=>{
    const legs = groups[k], pick = groupChosen(legs);
    return `<tr>
      <td><span class="chip">${esc(groupOpz(legs))}</span></td>
      <td>${cellDir(legsOfDir(legs,'Andata'))}</td>
      <td>${cellDir(legsOfDir(legs,'Ritorno'))}</td>
      <td class="mono">${groupBiglietti(legs)?eur(groupBiglietti(legs)):'—'}</td>
      <td class="mono">${groupBag(legs)?eur(groupBag(legs)):'—'}</td>
      <td class="mono"><strong>${groupTotal(legs)?eur(groupTotal(legs)):'—'}</strong></td>
      <td class="mono per-person">${groupPTesta(legs)?eur(groupPTesta(legs)):'—'}</td>
      <td>${codeChip('cod.', groupPnr(legs))||'<span class="chip">–</span>'}</td>
      <td><button class="btn btn-sm ${pick?'btn-ghost':'btn-stamp'}"
        onclick="chooseVolo('${jsArg(k)}',${pick?'false':'true'})">${pick?'✓':'scegli'}</button></td>
      <td class="text-nowrap">
        <button class="icon-btn" onclick="editVoloById('${jsArg(k)}')">✎</button>
        <button class="icon-btn" onclick="delVolo('${jsArg(k)}')">🗑</button></td>
    </tr>`;
  }).join('');
  return `<div class="sheet p-2 p-md-3 scroll-x"><table class="data">
    <thead><tr><th>opz.</th><th>andata</th><th>ritorno</th><th>volo</th><th>bagagli</th><th>totale</th><th>a testa</th><th>prenot.</th><th>scelta</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ---------- VOLI: azioni rapide ---------- */
async function chooseVolo(key, on){
  const rows = (CURRENT_DATA && CURRENT_DATA.Voli) || [];
  const groups = voliGroups(rows);
  const target = groups[key];
  if(!target) return;
  const dirs = groupDirs(target);
  const before = rows.map(r=>r.scelto);
  rows.forEach(r=>{
    const k = String(r.gruppo_id||r.id);
    if(k===String(key)) r.scelto = on ? 'Sì' : '';
    else if(on && dirs.includes(dirOf(r))) r.scelto = '';
  });
  refreshView();
  try{
    await api('set_scelta', { sheet:'Voli', viaggio_id: CURRENT_TRIP.id, gruppo_id: key, on: !!on });
    toast(on?'Volo scelto ✓':'Scelta rimossa','ok');
  }catch(e){
    rows.forEach((r,i)=>{ r.scelto = before[i]; });
    refreshView();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

async function delVolo(key){
  const legs = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[])[key];
  if(!legs) return;
  if(!await askConfirm('Eliminare questa opzione di volo (tutte le sue tratte)?', true)) return;
  const snapshot = legs.map(l=>Object.assign({}, l));
  try{
    await api('delete_group', { sheet:'Voli', gruppo_id:key, ids: legs.map(l=>l.id) });
    CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).filter(r=>String(r.gruppo_id||r.id)!==String(key));
    refreshView();
    toast('Volo eliminato','ok', { label:'Annulla', fn: async ()=>{
      try{
        const saved = await api('create_many', { sheet:'Voli', records: snapshot });
        CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).concat(saved);
        refreshView(); toast('Ripristinato ✓','ok');
      }catch(err){ toast('Non sono riuscito a ripristinare: '+err.message,'error'); }
    }});
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

const VOLO_COPY_FIELDS = ['viaggio_id','direzione','tratta','persone','paganti','compagnia','n_volo',
  'da','a','data_part','ora_part','data_arr','ora_arr','scalo','totale','costo_bagaglio',
  'prezzo_testa','bagaglio','note'];

async function dupVolo(key){
  const legs = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[])[key];
  if(!legs) return;
  const gid = genGroupId(), opz = nextOpz();
  const records = legs.map(r=>{
    const o = {};
    VOLO_COPY_FIELDS.forEach(f=>{ o[f] = r[f] != null ? r[f] : ''; });
    o.gruppo_id = gid; o.opzione = opz; o.scelto = ''; o.pnr = '';
    return o;
  });
  try{
    const saved = await api('create_many', { sheet:'Voli', records });
    CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).concat(saved);
    toast('Opzione duplicata ✓','ok');
    refreshView();
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

// Unisce due opzioni mono-direzione (utile per i voli inseriti prima della v3)
async function abbinaVolo(key){
  const groups = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[]);
  const legs = groups[key];
  if(!legs) return;
  const myDir = groupDirs(legs)[0];
  const cands = Object.keys(groups).filter(k=>{
    if(String(k)===String(key)) return false;
    const g = groups[k];
    return groupDirs(g).length===1 && groupDirs(g)[0]!==myDir;
  });
  if(!cands.length) return toast('Nessuna opzione compatibile da abbinare','error');
  const btns = cands.slice(0,3).map(k=>({
    label: `opz. ${groupOpz(groups[k])} · ${routeStr(groups[k])}`, value:k, cls:'btn-ink'
  }));
  btns.unshift({label:'Annulla', value:null, cls:'btn-ghost'});
  const pick = await ask(`Unisci questo ${myDir.toLowerCase()} con:`, btns);
  if(!pick) return;
  try{
    await api('merge_groups', { sheet:'Voli', viaggio_id: CURRENT_TRIP.id, gruppo_id: key, source_id: pick });
    const opz = groupOpz(legs);
    legs.forEach(r=>{ r.gruppo_id = String(key); r.opzione = opz; });
    groups[pick].forEach(r=>{ r.gruppo_id = String(key); r.opzione = opz; });
    toast('Opzioni unite ✓','ok');
    refreshView();
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

let CDF_MONTH = null;
const TIPO_ICON = {

function tipoIcon(t){ return TIPO_ICON[String(t||'').toLowerCase()] || '📍'; }

function secCoseDaFare(rows, tid){

function setCdfView(v){ CDF_VIEW = v; renderSection('cosedafare'); }

function ensureCdfMonth(){
  if(!CDF_MONTH){
    const iso = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio);
    let base = iso ? new Date(iso+'T12:00:00') : new Date();
    CDF_MONTH = new Date(base.getFullYear(), base.getMonth(), 1);
  }
}

function cdfMonthShift(delta){
  ensureCdfMonth();
  CDF_MONTH = new Date(CDF_MONTH.getFullYear(), CDF_MONTH.getMonth()+delta, 1);
  renderSection('cosedafare');
}

function cdfList(rows, tid){
  const withDate = rows.filter(r=>toISODate(r.data)).sort((a,b)=>{
    const d = toISODate(a.data).localeCompare(toISODate(b.data));
    return d!==0 ? d : (toHM(a.ora)||'99:99').localeCompare(toHM(b.ora)||'99:99');
  });
  const noDate   = rows.filter(r=>!toISODate(r.data));
  const groups = {};
  withDate.forEach(r=>{ const k=toISODate(r.data); (groups[k] = groups[k] || []).push(r); });
  const dayBlocks = Object.keys(groups).map(k=>`
    <div class="mb-3">
      <p class="eyebrow mb-2">${toITDateLong(k)}</p>
      ${groups[k].map(r=>cdfItem(r)).join('')}
    </div>`).join('');
  const noDateBlock = noDate.length ? `
    <div class="mb-3">
      <p class="eyebrow mb-2">Senza data</p>
      ${noDate.map(r=>cdfItem(r)).join('')}
    </div>` : '';
  if(!rows.length) return `<div class="sheet empty"><div class="big">Ancora niente da fare</div><div>Aggiungi la prima attività.</div></div>`;
  return `<div class="sheet p-3">${dayBlocks}${noDateBlock}</div>`;
}

function cdfItem(r){
  const conf = truthy(r.confermata);
  const ora = toHM(r.ora);
  return `<div class="d-flex align-items-start gap-2 py-2" style="border-bottom:1px solid var(--line)">

function cdfCalendar(rows, tid){
  ensureCdfMonth();
  const y = CDF_MONTH.getFullYear(), mo = CDF_MONTH.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay()+6)%7;      // lun=0
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthName = CDF_MONTH.toLocaleDateString('it-IT', {month:'long', year:'numeric'});

  const byDay = {};
  rows.forEach(r=>{ const k=toISODate(r.data); if(k) (byDay[k] = byDay[k] || []).push(r); });

  const vStart = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio), vEnd = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine);

  const dow = ['lun','mar','mer','gio','ven','sab','dom']
    .map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDay[iso]||[];
    const inTrip = vStart && vEnd && iso>=vStart && iso<=vEnd;
    const chips = items.slice(0,3).map(r=>
      `<div class="cal-ev" title="${esc(r.attivita)}" onclick="editRowById('CoseDaFare','${jsArg(r.id)}')">${tipoIcon(r.tipo)} ${esc((r.attivita||'').slice(0,14))}</div>`).join('');
    const more = items.length>3 ? `<div class="cal-more">+${items.length-3}</div>` : '';
    cells += `<div class="cal-cell${inTrip?' in-trip':''}" ondblclick="cdfQuickAdd('${iso}','${jsArg(tid)}')">
      <div class="cal-num">${d}</div>${chips}${more}
    </div>`;
  }

  return `
    <div class="sheet p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(-1)">‹</button>
        <strong style="font-family:'Fraunces',serif;text-transform:capitalize">${esc(monthName)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(1)">›</button>
      </div>
      <div class="cal-grid cal-head">${dow}</div>
      <div class="cal-grid">${cells}</div>
      <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
        doppio click su un giorno per aggiungere · giorni evidenziati = durata vacanza
      </p>
    </div>`;
}

function cdfQuickAdd(iso, tid){
  editRow('CoseDaFare', { viaggio_id: tid, data: iso }, tid);
}

/* ============================================================

   Cosa è cambiato rispetto a prima, e perché:
   · TUTTA la riga spunta la voce. Prima bisognava centrare un
     cerchietto di 24px con il pollice, in piedi, davanti alla valigia.
   · Barra di aggiunta unica in cima con la categoria a tendina:
     non serve più scorrere fino al blocco giusto per scrivere.
   · MODELLI pronti (mare, montagna, documenti, bimbi…): una lista
     decente in tre secondi invece che venti voci battute a mano.
   · Ricerca istantanea e azioni di categoria (spunta tutte / azzera).
   · Filtro, ricerca e categorie chiuse restano memorizzati sul
     dispositivo: riapri la sezione e ritrovi la tua vista.
   · Sintassi rapida:  2x telo mare @Marco !essenziale
   ============================================================ */
let CP_FILTER = 'tutti';       // 'tutti' | 'dafare' | 'fatti'
let CP_WHO    = null;          // null = non ancora letto da localStorage
let CP_CLOSED = {};            // categoria -> chiusa
let CP_CATS   = [];            // categorie nell'ordine mostrato
let CP_Q      = '';            // testo cercato
let CP_NEWCAT = '';            // categoria selezionata nella barra di aggiunta

const CP_ICON = {
  'Abbigliamento':'👕','Accessori':'🎒','Attrezzatura':'🧰','Bagaglio':'🧳','Bambini':'🧸',
  'Casa':'🏠','Cucina':'🍳','Documenti':'🪪','Elettronica':'🔌','Farmacia':'💊','Igiene':'🧴',
  'Intrattenimento':'🎧','Mare':'🏖️','Montagna':'⛰️','Scarpe':'👟','Sport':'⚽',
  'Tecnologia':'💻','Viaggio':'✈️'
};
function cpIcon(c){ return CP_ICON[String(c||'').trim()] || '📦'; }

/* preferenze di vista: restano su questo dispositivo, per viaggio */
function cpPrefKey(){ return 'triphub_cp_' + (CURRENT_TRIP ? CURRENT_TRIP.id : ''); }
function cpReset(){
  CP_FILTER='tutti'; CP_WHO=null; CP_CLOSED={}; CP_Q=''; CP_NEWCAT='';
  try{
    const raw = localStorage.getItem(cpPrefKey());
    if(raw){ const p = JSON.parse(raw); CP_FILTER = p.filter||'tutti'; CP_CLOSED = p.closed||{}; }
  }catch(_){}
}
function cpSavePrefs(){
  try{ localStorage.setItem(cpPrefKey(), JSON.stringify({filter:CP_FILTER, closed:CP_CLOSED})); }catch(_){}
}

function cpWhoKey(){ return 'triphub_who_' + (CURRENT_TRIP ? CURRENT_TRIP.id : ''); }
function cpWho(){
  if(CP_WHO === null){
    try { CP_WHO = localStorage.getItem(cpWhoKey()) || ''; } catch(_){ CP_WHO = ''; }
  }
  return CP_WHO;
}
function cpSetWho(v){
  CP_WHO = v || '';
  try { v ? localStorage.setItem(cpWhoKey(), v) : localStorage.removeItem(cpWhoKey()); } catch(_){}
  renderSection('cosaportare');
}
function cpSetFilter(f){ CP_FILTER = f; cpSavePrefs(); renderSection('cosaportare'); }
function cpToggleCat(i){
  const c = CP_CATS[i]; if(c==null) return;
  CP_CLOSED[c] = !CP_CLOSED[c];
  cpSavePrefs();
  const el = $('#cp_cat_'+i);
  if(el) el.classList.toggle('closed', !!CP_CLOSED[c]);
  const h = $('#cp_head_'+i);
  if(h) h.setAttribute('aria-expanded', CP_CLOSED[c] ? 'false' : 'true');
}

// ricerca senza ridisegno: nasconde le righe e le categorie rimaste vuote
function cpSearch(q){
  CP_Q = String(q||'').toLowerCase().trim();
  let anyGlobal = 0;
  CP_CATS.forEach((cat,i)=>{
    const box = $('#cp_cat_'+i);
    if(!box) return;
    let vis = 0;
    box.querySelectorAll('.cp-row').forEach(row=>{
      const hit = !CP_Q || (row.getAttribute('data-s')||'').includes(CP_Q);
      row.style.display = hit ? '' : 'none';
      if(hit) vis++;
    });
    box.style.display = (CP_Q && !vis) ? 'none' : '';
    if(vis) anyGlobal++;
    if(CP_Q) box.classList.remove('closed');
    else box.classList.toggle('closed', !!CP_CLOSED[cat]);
  });
  const none = $('#cp_nores');
  if(none) none.style.display = (CP_Q && !anyGlobal) ? 'block' : 'none';
}

// una voce è "mia" se non ha destinatario, se è di tutti, o se mi nomina
function cpMine(r, me){
  if(!me) return true;
  const s = String(r.chi||'').trim();
  if(!s || s.toLowerCase()==='tutti') return true;
  return s.split(',').map(x=>x.trim()).includes(me);
}
function cpPriRank(r){
  const s = String(r.priorita||'').toLowerCase();
  if(s.includes('essenz')) return 0;
  if(s.includes('consig')) return 1;
  return 2;
}
function cpPriClass(r){
  const s = String(r.priorita||'').toLowerCase();
  return s.includes('essenz') ? ' pri-ess' : s.includes('consig') ? ' pri-cons' : '';
}

function cpRing(done, tot){
  const pct = tot ? done/tot : 0;
  const r = 26, c = 2*Math.PI*r;
  return `<svg width="66" height="66" viewBox="0 0 64 64" class="cp-ring" role="img"
      aria-label="${done} di ${tot} preparati">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="7"/>
    <circle id="cp_arc" cx="32" cy="32" r="${r}" fill="none" stroke="${pct>=1?'var(--ok)':'var(--stamp)'}"
      stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" transform="rotate(-90 32 32)"
      style="transition:stroke-dashoffset .3s ease"/>
    <text id="cp_pct" x="32" y="37" text-anchor="middle" font-family="'JetBrains Mono',monospace"
      font-size="14" font-weight="500" fill="var(--ink)">${Math.round(pct*100)}%</text>
  </svg>`;
}

function cpKnownCats(rows){
  const seen = {};
  (rows||[]).forEach(r=>{ const c=String(r.categoria||'Varie').trim()||'Varie'; seen[c]=true; });
  CATEGORIE_PORTARE.forEach(c=>seen[c]=true);
  return Object.keys(seen).sort((a,b)=>a.localeCompare(b,'it'));
}

  const header = `

        ${cpRing(done, tot)}

        </div>
        <div class="d-flex gap-2 flex-wrap align-items-center">

      </div>
      ${tot ? `<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mt-3">

          <button class="cp-fil${CP_FILTER==='tutti'?' on':''}" onclick="cpSetFilter('tutti')">Tutte · ${tot}</button>

          <button class="cp-fil${CP_FILTER==='fatti'?' on':''}" onclick="cpSetFilter('fatti')">Fatte · ${done}</button>
        </div>

          aria-label="Cerca" value="${esc(CP_Q)}" oninput="cpSearch(this.value)">

    CP_CATS = [];
    return header + addBar + `<div class="sheet empty"><div class="big">La valigia è vuota</div>

  }

  // raggruppa per categoria; i conteggi restano su TUTTE le voci della persona,
  // così i numeri non ballano quando cambi filtro
  const byCat = {};
  visible.forEach(r=>{ const k = String(r.categoria||'Varie').trim() || 'Varie'; (byCat[k] = byCat[k] || []).push(r); });
  const allByCat = {};
  mine.forEach(r=>{ const k = String(r.categoria||'Varie').trim() || 'Varie'; (allByCat[k] = allByCat[k] || []).push(r); });

  CP_CATS = Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'it'));

  if(!CP_CATS.length){
    return header + addBar + `<div class="sheet empty"><div class="big">${
      CP_FILTER==='fatti' ? 'Niente di spuntato, per ora' : 'Tutto pronto ✓'}</div>
      <div>Cambia filtro per vedere il resto della lista.</div></div>`;
  }

  const blocks = CP_CATS.map((cat,i)=>{
    const all  = allByCat[cat] || [];
    const dn   = all.filter(r=>truthy(r.spuntato)).length;
    const pct  = all.length ? Math.round(dn/all.length*100) : 0;
    const items = byCat[cat].slice().sort((a,b)=>
      (truthy(a.spuntato)?1:0)-(truthy(b.spuntato)?1:0)
      || cpPriRank(a)-cpPriRank(b)
      || String(a.cosa||'').localeCompare(String(b.cosa||''),'it'));
    const closed = !!CP_CLOSED[cat];
    return `<div class="sheet p-2 p-md-3 cp-cat${closed?' closed':''}" id="cp_cat_${i}">
      <div class="cp-cat-head">
        <button class="cp-cat-toggle" id="cp_head_${i}" onclick="cpToggleCat(${i})"
          aria-expanded="${closed?'false':'true'}" aria-controls="cp_body_${i}">
          <span class="cp-cat-ico">${cpIcon(cat)}</span>
          <span class="cp-cat-name">${esc(cat)}</span>
          <span class="cp-cat-n" id="cp_catn_${i}">${dn}/${all.length}</span>
          <span class="cp-caret">▾</span>
        </button>
        <div class="cp-cat-acts">
          <button class="icon-btn" title="Spunta tutta la categoria" onclick="cpBulk(${i},true)">✓</button>
          <button class="icon-btn" title="Azzera la categoria" onclick="cpBulk(${i},false)">↺</button>
        </div>
      </div>
      <div class="cp-bar${pct===100?' full':''}" id="cp_bar_${i}"><i style="width:${pct}%"></i></div>
      <div class="cp-body" id="cp_body_${i}">
        ${items.map(r=>cpRow(r)).join('')}
        <div class="cp-add">
          <input type="text" id="cp_add_${i}" placeholder="+ aggiungi a ${esc(cat.toLowerCase())}…"
            aria-label="Aggiungi voce a ${esc(cat)}"
            onkeydown="if(event.key==='Enter'){event.preventDefault();cpQuickAdd(${i},'${jsArg(tid)}')}">
        </div>
      </div>
    </div>`;
  }).join('');

  const nores = `<div class="sheet empty" id="cp_nores" style="display:none">
    <div class="big">Nessuna voce trovata</div></div>`;

  return header + addBar + blocks + nores;
}

function cpRow(r){
  const on = truthy(r.spuntato);
  const qta = Math.round(num(r.qta));
  const chi = String(r.chi||'').trim();
  const chiTag = (chi && chi.toLowerCase()!=='tutti')
    ? chi.split(',').map(x=>`<span class="cp-who">${esc(x.trim())}</span>`).join('') : '';
  const pri = String(r.priorita||'').trim();
  const priTag = pri ? `<span class="chip ${cpPriRank(r)===0?'pri-ess':cpPriRank(r)===1?'pri-cons':''}">${esc(pri)}</span>` : '';
  const searchKey = [r.cosa,r.note,chi,pri].map(x=>String(x||'').toLowerCase()).join(' ');
  return `<div class="cp-row${on?' done':''}${cpPriClass(r)}" id="cp_row_${jsArg(r.id)}"
      data-s="${esc(searchKey)}" role="checkbox" aria-checked="${on}" tabindex="0"
      onclick="cpToggle('${jsArg(r.id)}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cpToggle('${jsArg(r.id)}')}">
    <span class="cp-check" aria-hidden="true" id="cp_chk_${jsArg(r.id)}" aria-checked="${on}"></span>
    <div class="cp-main">
      <div class="cp-name">${esc(r.cosa||'(senza nome)')}${qta>1?`<span class="cp-qta">×${qta}</span>`:''}</div>
      ${(chiTag||priTag)?`<div class="cp-tags">${priTag}${chiTag}</div>`:''}
      ${r.note?`<div class="cp-note">${esc(r.note)}</div>`:''}
    </div>
    <div class="cp-acts" onclick="event.stopPropagation()">
      <button class="icon-btn" title="Modifica" aria-label="Modifica ${esc(r.cosa||'voce')}"
        onclick="editRowById('CosaPortare','${jsArg(r.id)}')">✎</button>
      <button class="icon-btn" title="Elimina" aria-label="Elimina ${esc(r.cosa||'voce')}"
        onclick="delRow('CosaPortare','${jsArg(r.id)}')">🗑</button>
    </div>
  </div>`;
}

/* Spunta una voce: aggiorna la riga sul posto (niente salto sotto il dito)
   e ricalcola solo i numeri. */
async function cpToggle(id){
  const r = findRow('CosaPortare', id);
  if(!r) return;
  const prev = r.spuntato;
  const next = truthy(prev) ? '' : 'Sì';
  r.spuntato = next;
  cpPaintRow(r);
  cpPaintCounts();
  updateTabBadges();
  try{
    await api('update', { sheet:'CosaPortare', record:{ id, viaggio_id:r.viaggio_id, spuntato:next } });
  }catch(e){
    r.spuntato = prev;
    cpPaintRow(r); cpPaintCounts(); updateTabBadges();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

function cpPaintRow(r){
  const on = truthy(r.spuntato);
  const row = document.getElementById('cp_row_'+r.id);
  const chk = document.getElementById('cp_chk_'+r.id);
  if(row){ row.classList.toggle('done', on); row.setAttribute('aria-checked', on?'true':'false'); }
  if(chk) chk.setAttribute('aria-checked', on ? 'true' : 'false');
}

/* Ricalcola anello, testo e barre di categoria senza ricostruire le righe. */
function cpPaintCounts(){
  const me = cpWho();
  const mine = (CURRENT_DATA.CosaPortare||[]).filter(r=>cpMine(r, me));
  const tot = mine.length, done = mine.filter(r=>truthy(r.spuntato)).length;

  const arc = document.getElementById('cp_arc');
  if(arc){
    const c = 2*Math.PI*26, pct = tot ? done/tot : 0;
    arc.setAttribute('stroke-dashoffset', (c*(1-pct)).toFixed(1));
    arc.setAttribute('stroke', pct>=1 ? 'var(--ok)' : 'var(--stamp)');
    const t = document.getElementById('cp_pct');
    if(t) t.textContent = Math.round(pct*100)+'%';
  }
  const cnt = document.getElementById('cp_count');
  if(cnt) cnt.textContent = `${done} di ${tot} ${tot===1?'cosa pronta':'cose pronte'}`;
  const sub = document.getElementById('cp_sub');
  if(sub) sub.innerHTML = !tot ? 'la lista è ancora vuota'
    : done===tot ? '<span class="cp-done-all">✓ valigia completa, si parte</span>'
    : `mancano ${tot-done} ${tot-done===1?'voce':'voci'}${me?` per ${esc(me)}`:''}`;

  CP_CATS.forEach((cat,i)=>{
    const all = mine.filter(r=>(String(r.categoria||'Varie').trim()||'Varie')===cat);
    const dn = all.filter(r=>truthy(r.spuntato)).length;
    const n = document.getElementById('cp_catn_'+i);
    if(n) n.textContent = `${dn}/${all.length}`;
    const bar = document.getElementById('cp_bar_'+i);
    if(bar){
      const pct = all.length ? Math.round(dn/all.length*100) : 0;
      bar.classList.toggle('full', pct===100);
      const fill = bar.querySelector('i');
      if(fill) fill.style.width = pct+'%';
    }
  });
}

/* Spunta/azzera un'intera categoria con una sola chiamata */
async function cpBulk(i, on){
  const cat = CP_CATS[i];
  if(!cat) return;
  const me = cpWho();
  const items = (CURRENT_DATA.CosaPortare||[]).filter(r=>
    cpMine(r,me) && (String(r.categoria||'Varie').trim()||'Varie')===cat && truthy(r.spuntato)!==!!on);
  if(!items.length) return;
  const before = items.map(r=>r.spuntato);
  items.forEach(r=>{ r.spuntato = on ? 'Sì' : ''; cpPaintRow(r); });
  cpPaintCounts(); updateTabBadges();
  try{
    await api('set_flags', { sheet:'CosaPortare', field:'spuntato',
      values: items.map(r=>({id:r.id, value: on?'Sì':''})) });
    toast(on?`"${cat}" tutto pronto ✓`:`"${cat}" azzerata`,'ok');
  }catch(e){
    items.forEach((r,k)=>{ r.spuntato = before[k]; cpPaintRow(r); });
    cpPaintCounts(); updateTabBadges();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

/* Aggiunta rapida.
   "2x telo mare @Marco !essenziale, crema" crea due voci ben formate. */
function cpNormPri(s){
  const x = String(s||'').toLowerCase();
  if(x.startsWith('ess')) return 'Essenziale';
  if(x.startsWith('con')) return 'Consigliato';
  if(x.startsWith('opz')) return 'Opzionale';
  return '';
}
function cpResolvePerson(tok){
  const people = partList(CURRENT_DATA).map(pName);
  const t = String(tok||'').toLowerCase();
  const hit = people.find(n=>n.toLowerCase()===t)
           || people.find(n=>n.toLowerCase().split(' ')[0]===t)
           || people.find(n=>n.toLowerCase().startsWith(t));
  return hit || tok;
}
function cpParseLine(txt){
  return String(txt||'').split(/[,\n;]/).map(x=>x.trim()).filter(Boolean).map(part=>{
    let pri = '', chi = [];
    part = part.replace(/!([\wàèéìòù]+)/gi, (m,g)=>{ pri = cpNormPri(g) || pri; return ' '; });
    part = part.replace(/@([\wÀ-ÿ'’.-]+)/g, (m,g)=>{ chi.push(cpResolvePerson(g)); return ' '; });
    part = part.replace(/\s+/g,' ').trim();
    const m = part.match(/^(\d{1,3})\s*[x×]\s*(.+)$/i);
    return {
      cosa: m ? m[2].trim() : part,
      qta:  m ? Number(m[1]) : '',
      priorita: pri,
      chi: chi.join(', ')
    };
  }).filter(x=>x.cosa);
}

async function cpAddItems(tid, cat, parsed, restore){
  const me = cpWho();
  const records = parsed.map(x=>({
    viaggio_id: tid, categoria: cat, cosa: x.cosa, qta: x.qta,
    chi: x.chi || me || '', priorita: x.priorita || '', spuntato: '', note: ''
  }));
  try{
    const saved = await api('create_many', { sheet:'CosaPortare', records });
    applyLocal('CosaPortare','create_many', saved);
    renderSection('cosaportare', true);
    updateTabBadges();
    toast(saved.length>1 ? `${saved.length} voci aggiunte ✓` : 'Aggiunto ✓','ok');
    return saved;
  }catch(e){
    if(restore) restore();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
    return null;
  }
}

async function cpQuickAdd(i, tid){
  const box = document.getElementById('cp_add_'+i);
  if(!box) return;
  const parsed = cpParseLine(box.value);
  if(!parsed.length) return;
  const cat = CP_CATS[i] || 'Varie';
  const txt = box.value;
  box.value = ''; box.disabled = true;
  await cpAddItems(tid, cat, parsed, ()=>{ box.disabled=false; box.value = txt; });
  const again = document.getElementById('cp_add_'+i);
  if(again) again.focus();       // resta pronto per la voce successiva
}

async function cpAddGlobal(tid){
  const inp = document.getElementById('cp_newitem');
  const sel = document.getElementById('cp_newcat');
  if(!inp || !sel) return;
  const parsed = cpParseLine(inp.value);
  if(!parsed.length) return;
  CP_NEWCAT = sel.value || 'Varie';
  const txt = inp.value;
  inp.value = ''; inp.disabled = true;
  await cpAddItems(tid, CP_NEWCAT, parsed, ()=>{ inp.disabled=false; inp.value=txt; });
  const again = document.getElementById('cp_newitem');
  if(again) again.focus();
}

/* ============================================================
   CONTATTI — la rubrica del viaggio: numeri che devono essere
   raggiungibili in un tocco, non righe di tabella da leggere.
   ============================================================ */
const CATEGORIE_CONTATTO = [
  'Emergenza','Salute','Ambasciata','Alloggio','Trasporti','Noleggio',
  'Tour e guide','Ristorante','Attività','Assicurazione','Banca','Informazioni','Altro'
];
const CNT_ICONS = {
  'Emergenza':'🚨','Salute':'🏥','Ambasciata':'🏛️','Alloggio':'🏠','Trasporti':'🚌',
  'Noleggio':'🚗','Tour e guide':'🧭','Ristorante':'🍽️','Attività':'⛷️',
  'Assicurazione':'🛡️','Banca':'🏦','Informazioni':'ℹ️','Altro':'📌'
};
const cntIcon = c => CNT_ICONS[String(c||'').trim()] || '📌';
let CNT_FILTER = '';

// Normalizza un numero: tiene solo cifre e un "+" in testa, e traduce
// il prefisso internazionale "00" in "+" (così WhatsApp funziona comunque).
function telDigits(v){
  let s = String(v==null?'':v).trim().replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
  if(/^00\d/.test(s)) s = '+' + s.slice(2);
  return s;
}
function telHref(v){
  const s = telDigits(v);
  return s.length>=3 ? 'tel:'+s : '';
}
function waHref(v){
  const s = telDigits(v);
  return /^\+\d{8,}$/.test(s) ? 'https://wa.me/'+s.slice(1) : '';
}

function secContatti(rows, tid){
  rows = (rows||[]).slice();
  const cats = CATEGORIE_CONTATTO
    .filter(c=>rows.some(r=>String(r.categoria||'').trim()===c))
    .concat([...new Set(rows.map(r=>String(r.categoria||'').trim()).filter(c=>c && !CATEGORIE_CONTATTO.includes(c)))]);
  if(rows.some(r=>!String(r.categoria||'').trim())) cats.push('');

  const blocks = cats.map(cat=>{
    const items = rows.filter(r=>String(r.categoria||'').trim()===cat);
    if(!items.length) return '';
    const sos = cat==='Emergenza';
    return `<div class="sheet p-2 p-md-3 mb-3 cnt-group" data-cat="${esc(cat)}">
      <p class="eyebrow mb-1">${cntIcon(cat)} ${esc(cat||'Senza categoria')}</p>
      ${items.map(r=>cntCard(r, sos)).join('')}
    </div>`;
  }).join('');

  return `
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <p class="eyebrow mb-0">${rows.length} contatt${rows.length===1?'o':'i'}</p>
      <div class="d-flex gap-2">
        <button class="btn btn-ghost btn-sm" onclick="cntTemplateModal('${jsArg(tid)}')">☎️ Numeri utili</button>
        <button class="btn btn-stamp btn-sm" onclick="editContatto(null,'${jsArg(tid)}')">+ Aggiungi</button>
      </div>
    </div>
    ${rows.length?`<div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
      <input class="form-control form-control-sm" id="cntSearch" style="max-width:230px"
        placeholder="cerca nome o numero…" oninput="cntApply()">
      <span class="filter-chip${CNT_FILTER===''?' on':''}" onclick="cntFilter('')">tutti</span>
      ${cats.filter(c=>c).map(c=>`<span class="filter-chip${CNT_FILTER===c?' on':''}" onclick="cntFilter('${jsArg(c)}')">${cntIcon(c)} ${esc(c)}</span>`).join('')}
    </div>`:''}
    ${rows.length?blocks:`<div class="sheet empty"><div class="big">Nessun contatto</div>
      <div>Metti qui i numeri che ti servirebbero di corsa: emergenze, host, taxi, assicurazione.</div></div>`}`;
}

function cntCard(r, sos){
  const tel = telHref(r.telefono), wa = waHref(r.telefono);
  const map = mapsHref({ mappa_link:r.mappa_link, indirizzo:r.indirizzo, struttura:r.nome });
  const q = [r.nome, r.telefono, r.indirizzo, r.note, r.categoria, r.email]
    .map(x=>String(x||'')).join(' ').toLowerCase();
  return `<div class="cnt-card${sos?' cnt-sos':''}" data-cat="${esc(String(r.categoria||'').trim())}" data-q="${esc(q)}">
    <div class="cnt-ico">${cntIcon(r.categoria)}</div>
    <div class="cnt-body">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div class="cnt-name">${esc(r.nome||'—')}</div>
        <div class="text-nowrap">
          <button class="icon-btn" title="Modifica" onclick="editContattoById('${jsArg(r.id)}')">✎</button>
          <button class="icon-btn" title="Elimina" onclick="delRow('Contatti','${jsArg(r.id)}')">🗑</button>
        </div>

function cntFilter(cat){ CNT_FILTER = cat; renderSection('contatti', true); cntApply(); }

// filtro dal vivo, senza ridisegnare: la casella di ricerca non perde il fuoco
function cntApply(){
  const box = $('#cntSearch');
  const q = box ? box.value.trim().toLowerCase() : '';
  document.querySelectorAll('.cnt-group').forEach(g=>{
    let visible = 0;
    g.querySelectorAll('.cnt-card').forEach(c=>{
      const okCat = !CNT_FILTER || c.getAttribute('data-cat')===CNT_FILTER;
      const okQ   = !q || (c.getAttribute('data-q')||'').includes(q);
      const show  = okCat && okQ;
      c.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    g.style.display = visible ? '' : 'none';
  });
}

// modifica in linea del valore: clic, scrivi, Invio
function infoEditVal(id){
  const box = document.getElementById('iv_'+id);
  if(!box || box.querySelector('input')) return;
  const rec = findRow('InfoDest', id) || {};
  const old = String(rec.valore||'');
  box.classList.remove('vuoto');
  box.innerHTML = `<input value="${esc(old)}">`;
  const inp = box.querySelector('input');
  inp.focus(); inp.select();
  let done = false;
  const finish = async (save)=>{
    if(done) return; done = true;
    const val = inp.value.trim();
    if(!save || val===old.trim()){ renderSection('info', true); return; }
    try{
      const out = { id, viaggio_id: rec.viaggio_id, sezione: rec.sezione, chiave: rec.chiave, valore: val, link: rec.link||'' };
      await api('update',{sheet:'InfoDest',record:out});
      applyLocal('InfoDest','update',out);
      renderSection('info', true);
    }catch(e){
      if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
      renderSection('info', true);
    }
  };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', ()=>finish(true));
}

function infoTemplateModal(tid){
  ensureModal();
  const rows = CURRENT_DATA.InfoDest||[];
  const has = (sez,k)=>rows.some(r=>String(r.sezione||'').trim()===sez &&
    String(r.chiave||'').trim().toLowerCase()===k.toLowerCase());
  $('#mTitle').textContent = 'Modelli di informazioni';
  $('#mSave').textContent = 'Aggiungi le voci';
  $('#mBody').innerHTML = `
    <p style="font-size:.88rem;color:var(--ink-soft)">Inserisco le voci vuote, pronte da riempire.
      Quelle che hai già le salto.</p>
    <div class="row g-2">
      ${Object.entries(INFO_TEMPLATES).map(([name,items],i)=>{
        const nuovi = items.filter(([s,k])=>!has(s,k)).length;
        return `<div class="col-12 col-md-6"><label class="tpl-card${nuovi?'':' disabled'}">
          <input class="form-check-input tpl-one" type="checkbox" value="${i}" ${nuovi?'':'disabled'}>
          <div><div style="font-weight:600">${esc(name)}</div>
            <div class="mono" style="font-size:.7rem;color:var(--muted)">
              ${nuovi?`${nuovi} voci da aggiungere`:'già tutte presenti'}</div></div>
        </label></div>`;
      }).join('')}
    </div>`;
  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Aggiungo…', async ()=>{
    const names = Object.keys(INFO_TEMPLATES);
    const picked = [...document.querySelectorAll('.tpl-one')].filter(c=>c.checked && !c.disabled)
      .map(c=>names[Number(c.value)]);
    if(!picked.length){ toast('Scegli almeno un modello','error'); return; }
    const seen = new Set();
    const records = [];
    picked.forEach(n=>INFO_TEMPLATES[n].forEach(([sez,k,v])=>{
      const key = sez+'|'+k.toLowerCase();
      if(has(sez,k) || seen.has(key)) return;
      seen.add(key);
      records.push({ viaggio_id:tid, sezione:sez, chiave:k, valore:v||'', link:'' });
    }));
    if(!records.length){ toast('Hai già tutte queste voci','ok'); MODAL.hide(); return; }
    const saved = await api('create_many',{sheet:'InfoDest',records});
    applyLocal('InfoDest','create_many',saved);
    MODAL.hide(); toast(`${saved.length} voci aggiunte ✓`,'ok'); refreshView();
  });
  MODAL.show();
}

/* ---------- conversioni data / ora / numeri ---------- */
function toISODate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))            return m[1]+'-'+m[2]+'-'+m[3];
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){
    let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0');
  }
  return '';
}

function toITDate(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}

function toITDateLong(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
}

function toHM(raw){
  if(!raw) return '';
  const m = String(raw).trim().match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0')+':'+m[2] : '';
}

// somma giorni a una data ISO restando in ora locale (niente drift UTC)
function isoAddDays(iso, days){
  if(!iso) return '';
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function parseNum(raw){
  if(raw === '' || raw == null) return '';
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if(s === '') return '';
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? '' : n;
}

function fmtNumIT(n){
  if(n === '' || n == null || isNaN(n)) return '';
  return Number(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function round2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }

/* -------- AUTO-CALCOLO totale <-> a testa -------- */
function recalc(sheet, changed){
  const g = id => { const el = $('#f_'+id); return el ? parseNum(el.value) : ''; };
  const set = (id,val) => { const el = $('#f_'+id); if(el && document.activeElement!==el) el.value = fmtNumIT(val); };
  const persone = g('persone') || g('n_persone') || 0;

  if(sheet==='CoseDaFare'){
    const cost=g('costo'), pt=g('prezzo_testa');
    let total = cost;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='costo')        set('costo', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  } else {
    const tot=g('totale'), pt=g('prezzo_testa');
    let total = tot;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale')       set('totale', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  }
}

/* --- gestione selezione paganti / chi --- */
function togglePayAll(chk, field){
  const box = $('#f_'+field+'_box');
  const ones = box.querySelectorAll('.pay-one');
  ones.forEach(o=>{ o.disabled = chk.checked; if(chk.checked) o.checked=false; });
  recalcPay(field);
}

function onPayOne(field){
  const box = $('#f_'+field+'_box');
  const all = box.querySelector('.pay-all');
  const anyOne = [...box.querySelectorAll('.pay-one')].some(o=>o.checked);
  if(anyOne && all.checked){ all.checked=false; box.querySelectorAll('.pay-one').forEach(o=>o.disabled=false); }
  recalcPay(field);
}

function readPayValue(field){
  const box = $('#f_'+field+'_box');
  if(!box){ const el=$('#f_'+field); return el?el.value.trim():''; }
  const all = box.querySelector('.pay-all');
  if(all && all.checked) return 'Tutti';
  const names = [...box.querySelectorAll('.pay-one')].filter(o=>o.checked).map(o=>o.value);
  return names.length ? names.join(', ') : 'Tutti';
}

function payCountInForm(field){
  const box = $('#f_'+field+'_box');
  if(!box) return tripPeople(CURRENT_DATA);
  const all = box.querySelector('.pay-all');
  if(all && all.checked) return tripPeople(CURRENT_DATA);
  const n = [...box.querySelectorAll('.pay-one')].filter(o=>o.checked).length;
  return n>0 ? n : tripPeople(CURRENT_DATA);
}

function recalcPay(field){
  if(field==='v_pag'){ volSync(); return; }
  const totEl = $('#f_totale'); const ptEl = $('#f_prezzo_testa');
  if(!totEl || !ptEl) return;
  const tot = parseNum(totEl.value);
  const n = payCountInForm(field);
  if(tot!=='' && n && document.activeElement!==ptEl){
    ptEl.value = fmtNumIT(round2(tot/n));
  }
}

let MODAL = null;
function ensureModal(){
  if(MODAL) return MODAL;
  const el = document.createElement('div');
  el.className='modal fade'; el.id='editModal'; el.tabIndex=-1;
  el.setAttribute('aria-labelledby','mTitle');
  el.innerHTML=`<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg modal-fullscreen-sm-down">
    <div class="modal-content" style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius)">
      <div class="modal-header" style="border-bottom:1px solid var(--line)">
        <h5 class="modal-title" id="mTitle" style="font-family:'Fraunces',serif"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-footer" style="border-top:1px solid var(--line)">
        <button class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Annulla</button>
        <button class="btn btn-stamp btn-sm" id="mSave">Salva</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);
  // Invio = salva (tranne nelle textarea); autofocus sul primo campo
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.type!=='checkbox'){
      e.preventDefault(); $('#mSave').click();
    }
  });
  el.addEventListener('shown.bs.modal', ()=>{
    const f = el.querySelector('.modal-body input:not([type=checkbox]), .modal-body select, .modal-body textarea');
    if(f) f.focus();
  });
  el.addEventListener('hidden.bs.modal', ()=>{ VOL = null; });
  MODAL = new bootstrap.Modal(el);
  return MODAL;
}

      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}${hint?` <span style="font-weight:400;color:var(--muted);font-size:.7rem">— ${hint}</span>`:''}</label>

          <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}" placeholder="0,00">
        </div></div>`;
    }
    if(NUM_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}"></div>`;
    }
    return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
      <input class="form-control" id="f_${f}" type="text" value="${esc(v)}"></div>`;
  }).join('')
  + (sheet==='Partecipanti' && isAdmin() ? `
    <div class="form-check mt-2 pt-2" style="border-top:1px solid var(--line)">
      <input class="form-check-input" type="checkbox" id="f_saveRubrica" ${isNew?'checked':''}>

        <span style="color:var(--muted);font-size:.75rem">— per riusarlo nei prossimi viaggi</span></label>
    </div>` : '')
  + airlineDatalist();

  CALC_TRIGGERS.forEach(t=>{
    const el = $('#f_'+t);
    if(el) el.addEventListener('input', ()=>recalc(sheet, t));
  });

  const payField = fields.includes('paganti') ? 'paganti' : (fields.includes('chi') && fields.includes('totale') ? 'chi' : null);
  if(payField){
    const totEl = $('#f_totale');
    if(totEl) totEl.addEventListener('input', ()=>recalcPay(payField));
    const ptEl = $('#f_prezzo_testa');
    if(ptEl) ptEl.addEventListener('input', ()=>{
      const pt = parseNum(ptEl.value); const n = payCountInForm(payField);
      if(pt!=='' && n && totEl && document.activeElement!==totEl) totEl.value = fmtNumIT(round2(pt*n));
    });
  }

  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    const out = { id: rec.id };
    if(sheet!=='Rubrica') out.viaggio_id = rec.viaggio_id;
    fields.forEach(f=>{
      if(f==='paganti' || f==='chi'){ out[f] = readPayValue(f); return; }
      const el = $('#f_'+f); if(!el) return;
      if(BOOL_FIELDS.includes(f))        out[f] = el.checked ? 'Sì' : '';
      else if(INT_FIELDS.includes(f))    out[f] = el.value!=='' ? Math.round(parseNum(el.value)) : '';
      else if(NUM_FIELDS.includes(f))    out[f] = parseNum(el.value);
      else                               out[f] = el.value.trim();
    });
    let savedRow = out;
    if(rec.id){
      await api('update',{sheet, record:out});
      if(sheet==='Rubrica'){ const i=(RUBRICA||[]).findIndex(x=>String(x.id)===String(out.id)); if(i>=0) Object.assign(RUBRICA[i], out); }
      else applyLocal(sheet, 'update', out);
    } else {
      const saved = await api('create',{sheet, record:out});
      savedRow = saved;
      if(sheet==='Rubrica'){ RUBRICA = (RUBRICA||[]).concat([saved]); }
      else applyLocal(sheet, 'create', saved);
    }
    const rb = $('#f_saveRubrica');
    if(sheet==='Partecipanti' && rb && rb.checked){
      try{ await rubricaUpsert(savedRow); }catch(_){}
    }
    MODAL.hide(); toast('Salvato ✓','ok');
    if(sheet==='Rubrica') openRubrica(RUBRICA_PICK); else refreshView();
  });

  MODAL.show();
}

// genera un codice leggibile lato client (stessa logica del backend)
function genCodeInto(){
  const alpha='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<8;i++) s+=alpha.charAt(Math.floor(Math.random()*alpha.length));
  const el = $('#f_codice');
  if(el) el.value = s;
}

// Elimina il viaggio corrente E tutte le sue righe collegate (a cascata)
async function delTrip(){
  if(!CURRENT_TRIP) return;
  const nome = CURRENT_TRIP.destinazione || CURRENT_TRIP.nome || 'questo viaggio';
  if(!await askConfirm(`Eliminare "${nome}" con TUTTI i suoi dati (partecipanti, voli, spese…)? L'operazione non è reversibile.`, true)) return;
  showOverlay('Elimino il viaggio…');
  try{
    await api('delete_trip', { id: CURRENT_TRIP.id });
    TRIP_CACHE.delete(String(CURRENT_TRIP.id)); invalidateTrips();
    hideOverlay();
    toast('Viaggio eliminato','ok');
    CURRENT_TRIP = null; CURRENT_DATA = null;
    location.hash = '#/';
  }catch(e){
    hideOverlay();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore: '+e.message,'error');
  }
}

/* Eliminazione con possibilità di annullare. */
async function delRow(sheet, id){
  if(!await askConfirm('Eliminare questa voce?', true)) return;
  const snapshot = Object.assign({}, (sheet==='Rubrica'
    ? (RUBRICA||[]).find(x=>String(x.id)===String(id))
    : findRow(sheet, id)) || {});
  try{
    await api('delete',{sheet,id});
    if(sheet==='Rubrica'){
      RUBRICA = (RUBRICA||[]).filter(x=>String(x.id)!==String(id));
      openRubrica(RUBRICA_PICK);
    } else {
      applyLocal(sheet, 'delete', id);
      refreshView();
    }
    toast('Eliminato', 'ok', snapshot.id ? { label:'Annulla', fn:()=>undoDelRow(sheet, snapshot) } : null);
  }
  catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

async function undoDelRow(sheet, rec){
  try{
    const saved = await api('create', { sheet, record: rec });
    if(sheet==='Rubrica'){ RUBRICA = (RUBRICA||[]).concat([saved]); openRubrica(RUBRICA_PICK); }
    else { applyLocal(sheet, 'create', saved); refreshView(); }
    toast('Ripristinato ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else toast('Non sono riuscito a ripristinare: '+e.message,'error');
  }
}

  else if(ind)    h.textContent = '→ senza link, il pulsante 📍 cercherà l\'indirizzo su Maps';
  else            h.textContent = '';
}

function algDatesChanged(){
  const ci = $('#a_checkin').value, co = $('#a_checkout').value;
  const n = nightsBetween(ci, co);
  if(n) $('#a_notti').value = n;
  const t = CURRENT_TRIP || {};
  const s = toISODate(t.data_inizio), e = toISODate(t.data_fine);
  const w = $('#a_dateWarn');
  if(w){
    if(ci && co && toISODate(co) <= toISODate(ci)) w.textContent = '⚠️ check-out prima del check-in';
    else if(s && e && ci && co && (toISODate(ci)<s || toISODate(co)>e)) w.textContent = '⚠️ fuori dal periodo del viaggio';
    else w.textContent = '';
  }
  algRecalc('notti');
}

function algRecalc(src){
  const g = id => { const e=$('#a_'+id); return e ? parseNum(e.value) : ''; };
  const set = (id,v) => { const e=$('#a_'+id); if(e && document.activeElement!==e) e.value = fmtNumIT(v); };
  const P = Math.round(g('persone')) || 0;
  const N = Math.round(g('notti'))   || 0;

  let T = g('totale');
  if(src==='prezzo_notte' && g('prezzo_notte')!=='' && N) T = round2(g('prezzo_notte')*N);
  else if(src==='prezzo_testa' && g('prezzo_testa')!=='' && P) T = round2(g('prezzo_testa')*P);

  if(T!=='' && T!=null && !isNaN(T)){
    if(src!=='totale')       set('totale', T);
    if(src!=='prezzo_notte' && N) set('prezzo_notte', round2(T/N));
    if(src!=='prezzo_testa' && P) set('prezzo_testa', round2(T/P));
    const ptn = $('#a_prezzo_testa_notte');
    if(ptn) ptn.value = (P&&N) ? fmtNumIT(round2(T/P/N)) : '';
  }
  algSummary();
}

function algSummary(){
  const el = $('#a_summary'); if(!el) return;
  const g = id => { const e=$('#a_'+id); return e ? parseNum(e.value) : ''; };
  const T=g('totale'), E=g('extra'), P=Math.round(g('persone'))||0, N=Math.round(g('notti'))||0;
  if(T===''||!T){ el.textContent=''; return; }
  const parts=[];
  if(N) parts.push(`${N} nott${N===1?'e':'i'}`);
  if(P) parts.push(`${eur(T/P)} a testa`);
  if(P&&N) parts.push(`${eur(T/P/N)} a testa/notte`);
  if(E) parts.push(`di cui ${eur(E)} di extra`);
  el.textContent = '→ ' + parts.join(' · ');
}

function isLegEmpty(L){
  return !(String(L.da||'').trim() || String(L.a||'').trim() || String(L.compagnia||'').trim()
        || String(L.n_volo||'').trim() || L.ora_part || L.ora_arr);
}
function legFromRow(r){
  const dp = toISODate(r.data_part), da = toISODate(r.data_arr);
  return {
    compagnia:r.compagnia||'', n_volo:r.n_volo||'', da:r.da||'', a:r.a||'',
    data_part:dp, ora_part:toHM(r.ora_part), ora_arr:toHM(r.ora_arr),
    plus1: !!(dp && da && da>dp)
  };
}
function legArrISO(L){
  const iso = toISODate(L.data_part);
  if(!iso) return '';
  return L.plus1 ? isoAddDays(iso,1) : iso;
}
function legScaloMinsL(prev, next){
  return minsBetween(dtOf(legArrISO(prev), prev.ora_arr, prev.a),
                     dtOf(next.data_part, next.ora_part, next.da));
}
function legDurationL(L){
  return minsBetween(dtOf(L.data_part, L.ora_part, L.da), dtOf(legArrISO(L), L.ora_arr, L.a));
}
function dirDurationL(legs){
  if(!legs.length) return null;
  const L = legs[legs.length-1];
  return minsBetween(dtOf(legs[0].data_part, legs[0].ora_part, legs[0].da),
                     dtOf(legArrISO(L), L.ora_arr, L.a));
}
// "MXP" resta maiuscolo, "Milano Malpensa" no
function normCode(v){
  const s = String(v||'').trim();
  return (s.length<=4 && !/\s/.test(s)) ? s.toUpperCase() : s;
}

function editVoloById(key){
  const legs = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[])[key];
  if(legs) editVolo(legs, CURRENT_TRIP.id);
}

function editVolo(group, tid){
  ensureModal();
  const rows = (group && group.length) ? group : null;
  const isNew = !rows;
  const base = rows ? rows[0] : {};

  const legsByDir = {Andata:[], Ritorno:[]};
  (rows||[]).forEach(r=>legsByDir[dirOf(r)].push(legFromRow(r)));
  const totByDir = {Andata:'', Ritorno:''};
  const bagCByDir = {Andata:'', Ritorno:''};
  const bagByDir = {Andata:false, Ritorno:false};
  DIRS.forEach(d=>{
    const rs = (rows||[]).filter(r=>dirOf(r)===d);
    totByDir[d]  = rs.length && num(rs[0].totale) ? num(rs[0].totale) : '';
    bagCByDir[d] = rs.reduce((s,r)=>s+num(r.costo_bagaglio),0) || '';
    bagByDir[d]  = rs.some(r=>truthy(r.bagaglio));
  });
  const dirsPresent = DIRS.filter(d=>legsByDir[d].length);
  if(!legsByDir.Andata.length)  legsByDir.Andata  = [emptyLeg()];
  if(!legsByDir.Ritorno.length) legsByDir.Ritorno = [emptyLeg()];

  VOL = {
    isNew,
    viaggio_id: base.viaggio_id || tid || (CURRENT_TRIP && CURRENT_TRIP.id),
    gruppo_id : base.gruppo_id || (rows ? String(base.id) : genGroupId()),
    ids       : (rows||[]).map(r=>r.id).filter(Boolean),
    opzione   : String(isNew ? nextOpz() : (Math.round(num(base.opzione))||1)),
    scelto    : truthy(base.scelto),
    pnr       : rows ? groupPnr(rows) : '',
    ar        : isNew ? true : dirsPresent.length===2,
    dir       : (!isNew && dirsPresent[0]==='Ritorno') ? 'Ritorno' : 'Andata',
    prezzoUnico: !(totByDir.Andata!=='' && totByDir.Ritorno!==''),
    totale    : (num(totByDir.Andata)+num(totByDir.Ritorno)) || '',
    bagTot    : (num(bagCByDir.Andata)+num(bagCByDir.Ritorno)) || '',
    prezzo_testa: (rows||[]).reduce((s,r)=>s+num(r.prezzo_testa),0) || '',
    tot       : totByDir,
    bagc      : bagCByDir,
    bag       : bagByDir,
    paganti   : base.paganti || '',
    legs      : legsByDir
  };

  $('#mTitle').textContent = isNew ? 'Nuovo volo' : ('Modifica volo · opz. ' + VOL.opzione);
  $('#mSave').textContent = 'Salva';
  $('#mBody').innerHTML = `
    <div id="v_err"></div>
    <div class="row g-2 align-items-center mb-2">
      <div class="col-4 col-md-3"><label class="form-label">opzione n°</label>
        <input class="form-control" id="v_opzione" type="text" inputmode="numeric" value="${esc(VOL.opzione)}"></div>
      <div class="col-8 col-md-4"><label class="form-label">n° prenotazione</label>
        <input class="form-control mono" id="v_pnr" value="${esc(VOL.pnr)}" placeholder="es. XK7T2P"></div>
      <div class="col-6 col-md-3"><div class="form-check mt-md-3">
        <input class="form-check-input" type="checkbox" id="v_ar" ${VOL.ar?'checked':''} onchange="volToggleAR()">
        <label class="form-check-label" for="v_ar"><strong>andata e ritorno</strong></label></div></div>
      <div class="col-6 col-md-2"><div class="form-check mt-md-3">
        <input class="form-check-input" type="checkbox" id="v_scelto" ${VOL.scelto?'checked':''}>
        <label class="form-check-label" for="v_scelto">scelto</label></div></div>
    </div>
    <div class="mb-2" id="v_dirOnly" style="${VOL.ar?'display:none':''}">
      <label class="form-label">tipo di viaggio</label>
      <select class="form-select" id="v_dir" onchange="volChangeDir()">
        <option value="Andata"${VOL.dir==='Andata'?' selected':''}>Solo andata</option>
        <option value="Ritorno"${VOL.dir==='Ritorno'?' selected':''}>Solo ritorno</option>
      </select></div>
    ${voliPaganti(VOL)}
    <div class="form-check mb-2" id="v_puBox" style="${VOL.ar?'':'display:none'}">
      <input class="form-check-input" type="checkbox" id="v_prezzoUnico" ${VOL.prezzoUnico?'checked':''} onchange="volTogglePU()">
      <label class="form-check-label" for="v_prezzoUnico">prezzo unico per andata + ritorno</label>
    </div>
    <div class="row g-2" id="v_priceBox" style="${(!VOL.ar||VOL.prezzoUnico)?'':'display:none'}">
      <div class="col-6 col-md-4"><label class="form-label">volo <span style="font-weight:400;color:var(--muted);font-size:.7rem">— biglietti</span></label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
          <input class="form-control" id="v_totale" type="text" inputmode="decimal" value="${VOL.totale!==''?esc(fmtNumIT(VOL.totale)):''}" placeholder="0,00"></div></div>
      <div class="col-6 col-md-4"><label class="form-label">bagagli <span style="font-weight:400;color:var(--muted);font-size:.7rem">— supplemento</span></label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">🧳</span>
          <input class="form-control" id="v_bagtot" type="text" inputmode="decimal" value="${VOL.bagTot!==''?esc(fmtNumIT(VOL.bagTot)):''}" placeholder="0,00"></div></div>
      <div class="col-12 col-md-4"><label class="form-label">a testa <span style="font-weight:400;color:var(--muted);font-size:.7rem">— auto</span></label>
        <div class="input-group">
          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
          <input class="form-control" id="v_prezzo_testa" type="text" inputmode="decimal" value="${VOL.prezzo_testa!==''?esc(fmtNumIT(VOL.prezzo_testa)):''}" placeholder="0,00"></div></div>
    </div>
    <div class="derived mb-3 mt-1" id="v_grand"></div>
    <div id="v_legs"></div>
    ${airlineDatalist()}${airportDatalist()}
  `;

  // un solo set di listener sul contenitore: sopravvive ai re-render interni
  const box = $('#v_legs');
  box.addEventListener('input', volSync);
  box.addEventListener('change', volSync);
  box.addEventListener('click', volLegsClick);
  ['v_totale','v_bagtot','v_prezzo_testa'].forEach(id=>{
    const el = $('#'+id); if(el) el.addEventListener('input', volSync);
  });

  if(isNew) volMirror(true);
  volRenderLegs();

  $('#mSave').onclick = ()=>{
    volReadForm(); volNormalize();
    const errs = volValidate();
    const errBox = $('#v_err');
    if(errs.length){
      errBox.innerHTML = `<div class="alert alert-danger py-2 small mb-3"><ul class="mb-0 ps-3">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
      $('#mBody').scrollTop = 0;
      return;
    }
    errBox.innerHTML = '';
    return withBtnLoading($('#mSave'), 'Salvo…', volSave);
  };

  MODAL.show();

function volToggleAR(){
  volReadForm();
  if(VOL.ar) volMirror(false);
  else VOL.prezzoUnico = true;
  $('#v_dirOnly').style.display = VOL.ar ? 'none' : '';
  $('#v_puBox').style.display   = VOL.ar ? '' : 'none';
  const pu = $('#v_prezzoUnico'); if(pu) pu.checked = VOL.prezzoUnico;
  $('#v_priceBox').style.display = (!VOL.ar || VOL.prezzoUnico) ? '' : 'none';
  volRenderLegs();
}

function volTogglePU(){
  volReadForm();
  if(VOL.prezzoUnico){
    if(VOL.totale===''){
      const s = num(VOL.tot.Andata)+num(VOL.tot.Ritorno);
      if(s){ VOL.totale = s; const t=$('#v_totale'); if(t) t.value = fmtNumIT(s); }
    }
    if(VOL.bagTot===''){
      const s = num(VOL.bagc.Andata)+num(VOL.bagc.Ritorno);
      if(s){ VOL.bagTot = s; const t=$('#v_bagtot'); if(t) t.value = fmtNumIT(s); }
    }
  }
  $('#v_priceBox').style.display = VOL.prezzoUnico ? '' : 'none';
  volRenderLegs();
}

function volChangeDir(){ volReadForm(); volRenderLegs(); }

function volLegsClick(e){
  const add = e.target.closest('[data-add]');
  if(add){ volReadForm(); VOL.legs[add.getAttribute('data-add')].push(emptyLeg()); volRenderLegs(); return; }
  const del = e.target.closest('[data-del]');
  if(del){
    volReadForm();
    const parts = del.getAttribute('data-del').split('|');
    VOL.legs[parts[0]].splice(Number(parts[1]),1);
    if(!VOL.legs[parts[0]].length) VOL.legs[parts[0]] = [emptyLeg()];
    volRenderLegs(); return;
  }
  if(e.target.closest('[data-mirror]')){ volReadForm(); volMirror(true); volRenderLegs(); return; }
}

// Precompila il ritorno specchiando l'andata (force = sovrascrive anche se già compilato)
function volMirror(force){
  const A = (VOL.legs.Andata||[]).filter(l=>!isLegEmpty(l));
  if(!A.length) return;
  const R = (VOL.legs.Ritorno||[]).filter(l=>!isLegEmpty(l));
  if(R.length && !force) return;
  const first = A[0], last = A[A.length-1];
  const L = emptyLeg();
  L.da = last.a; L.a = first.da;
  L.compagnia = last.compagnia || first.compagnia;
  L.data_part = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine) || '';
  VOL.legs.Ritorno = [L];
}

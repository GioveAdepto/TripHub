<script>
/* ============================================================
   CONFIG — l'unica cosa da modificare dopo il deploy dell'API
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxN6Xe9meHwq4GsQtkaHPgtXsvE0Hay_1ocL54XvEiZUPY4GcZ8_I5sRuCdM7yx3u3E/exec";

/* ============================================================
   STATE
   ============================================================ */
let TOKEN = sessionStorage.getItem('triphub_token') || '';
let ROLE  = sessionStorage.getItem('triphub_role')  || '';   // 'admin' | 'trip' | ''
let MY_TRIPS = [];                                           // id dei viaggi consentiti (solo ruolo 'trip')
let CURRENT_TRIP = null;
let CURRENT_DATA = null;
let AUTO_OPENED = false;         // per non rimbalzare sul viaggio unico dopo "torna ai viaggi"
const SORT = {};                 // ordinamento per tab: { sheet: {col, dir} }

const isAdmin = () => ROLE === 'admin';

/* ============================================================
   API LAYER
   ============================================================ */
class AuthError extends Error {}
class NetworkError extends Error {}

async function api(action, payload = {}) {
  setSync('sincronizzo…');
  const body = JSON.stringify({ action, token: TOKEN, ...payload });
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000); // 30s timeout
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      signal: ctrl.signal
    });
  } catch(e) {
    setSync('offline');
    throw new NetworkError(e.name==='AbortError' ? 'timeout: il server non ha risposto' : 'connessione assente');
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); }
  catch(e){ setSync('errore'); throw new NetworkError('risposta non valida dal server'); }
  setSync('pronto');
  if (!data.ok) {
    if (data.error === 'unauthorized') throw new AuthError('unauthorized');
    if (String(data.error).indexOf('forbidden') === 0)
      throw new Error('non hai i permessi per questa operazione con il codice attuale');
    throw new Error(data.error || 'errore sconosciuto');
  }
  return data.data;
}

function sessionExpired(){
  toast('Sessione scaduta — rientra con il codice');
  renderGate('La sessione è scaduta. Reinserisci il codice.');
}

/* ============================================================
   CACHE DI SESSIONE
   Apps Script risponde in 1-3 secondi: tenere in memoria l'ultimo
   payload e ridisegnarlo subito (rivalidando in sottofondo) è ciò
   che cambia di più la sensazione di velocità. La cache conserva
   LO STESSO oggetto usato come CURRENT_DATA, quindi ogni modifica
   ottimistica la aggiorna senza codice extra.
   ============================================================ */
const TRIP_CACHE = new Map();   // viaggio_id -> oggetto "all"
let TRIPS_CACHE = null;         // elenco viaggi
const INFLIGHT = new Map();     // richieste già in volo, per non duplicarle

function cacheTrips(list){ TRIPS_CACHE = list; }
function invalidateTrips(){ TRIPS_CACHE = null; }

// scarica il payload di un viaggio, riusando l'eventuale richiesta già partita
function fetchTrip(id){
  const key = 'all:'+id;
  if(INFLIGHT.has(key)) return INFLIGHT.get(key);
  const pr = api('all', { viaggio_id:id })
    .then(data=>{ TRIP_CACHE.set(String(id), data); return data; })
    .finally(()=>INFLIGHT.delete(key));
  INFLIGHT.set(key, pr);
  return pr;
}

/* Ricarica dal server il viaggio aperto, scavalcando la cache di sessione.
   Serve perché TRIP_CACHE non scade mai da sola: se siete in due a
   pianificare, senza questo non vedreste mai le modifiche dell'altro. */
let LAST_SYNC = 0;
async function refetchCurrent(manuale){
  if(!CURRENT_TRIP) return;
  const id = CURRENT_TRIP.id;
  const btn = $('#refreshBtn');
  if(btn) btn.classList.add('spin');
  try{
    TRIP_CACHE.delete(String(id));
    const data = await fetchTrip(id);
    LAST_SYNC = Date.now();
    if(!CURRENT_TRIP || String(CURRENT_TRIP.id)!==String(id)) return;   // hai cambiato viaggio nel frattempo
    CURRENT_DATA = data;
    CURRENT_TRIP = (data.Viaggi||[])[0] || CURRENT_TRIP;
    renderTripShell(currentSection());
    if(manuale) toast('Dati aggiornati ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else if(manuale) toast('Non sono riuscito ad aggiornare: '+e.message,'error');
  }finally{
    const b = $('#refreshBtn');
    if(b) b.classList.remove('spin');
  }
}

/* Quando torni sull'app dopo un po', ricarica da sola: è il momento in cui
   è più probabile che qualcun altro abbia toccato qualcosa. */
let VIS_WIRED = false;
function initVisibility(){
  if(VIS_WIRED) return; VIS_WIRED = true;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!CURRENT_TRIP || !navigator.onLine) return;
    if(Date.now() - LAST_SYNC < 60000) return;      // sei appena stato via un attimo
    refetchCurrent(false);
  });
}

// chiamata al passaggio del mouse/dito su una card: quando clicchi è già pronto
function prefetchTrip(id){
  if(!id || TRIP_CACHE.has(String(id))) return;
  fetchTrip(id).catch(()=>{});
}

/* ============================================================
   STATO LOCALE — dopo ogni salvataggio aggiorniamo i dati in
   memoria e ridisegniamo SOLO la sezione corrente, senza
   rifare l'intera chiamata "all" (l'app diventa molto reattiva)
   ============================================================ */
function findRow(sheet, id){
  return ((CURRENT_DATA && CURRENT_DATA[sheet]) || []).find(r=>String(r.id)===String(id)) || null;
}

function applyLocal(sheet, op, payload){
  if(!CURRENT_DATA) return;
  const arr = CURRENT_DATA[sheet] || (CURRENT_DATA[sheet] = []);
  if(op==='create'){
    arr.push(payload);
  } else if(op==='create_many'){
    payload.forEach(r=>arr.push(r));
  } else if(op==='update'){
    const i = arr.findIndex(r=>String(r.id)===String(payload.id));
    if(i>=0) arr[i] = Object.assign({}, arr[i], payload);
  } else if(op==='delete'){
    const i = arr.findIndex(r=>String(r.id)===String(payload));
    if(i>=0) arr.splice(i,1);
  } else if(op==='delete_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload));
  } else if(op==='replace_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload.gruppo_id)).concat(payload.records);
  }
}

// Sezione attiva dedotta dall'hash
function currentSection(){
  const m = location.hash.match(/^#\/viaggio\/[^/]+\/?([^/]*)/);
  return (m && m[1]) ? m[1] : 'riepilogo';
}

// Ridisegna la vista corrente usando i dati in memoria (nessuna chiamata rete).
function refreshView(){
  if(CURRENT_TRIP && /^#\/viaggio\//.test(location.hash)){
    renderSection(currentSection(), true);
    updateTabBadges();
  } else viewHome();
}

// Ricarica completa dal server (usata dopo import o quando serve)
function reloadCurrent(){
  const h = location.hash;
  const m = h.match(/^#\/viaggio\/([^/]+)(?:\/([^/]+))?$/);
  if(m) viewTrip(m[1], m[2]||'riepilogo'); else viewHome();
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// per stringhe dentro attributi onclick='...' : niente apici, backslash, tag
const jsArg = s => String(s ?? '').replace(/[\\'"<>&]/g,'');
const eur = n => '€ ' + (Number(n) || 0).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => Number(String(n).replace(/[^\d.-]/g,'')) || 0;

function setSync(t){ const e = $('#syncState'); if(e) e.textContent = t; }

function toast(msg, type, action){
  const t = $('#toast');
  if(!t){ console.warn('toast:', msg); return; }
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  let ms = type==='error' ? 3200 : 1800;
  if(action){
    const b = document.createElement('button');
    b.className = 'undo'; b.type='button'; b.textContent = action.label;
    b.onclick = ()=>{ t.classList.remove('show'); clearTimeout(t._timer); action.fn(); };
    t.appendChild(b);
    ms = 7000;                       // più tempo per accorgersi e annullare
  }
  t.className = 'toast-mini show' + (type==='error'?' err':type==='ok'?' ok':'');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

// copia negli appunti con conferma visiva (usata per PNR, codici, link)
function copyText(txt, msg){
  const done = ()=>toast(msg||'Copiato ✓','ok');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(_){ toast('Impossibile copiare','error'); }
  ta.remove();
}

// chip con codice (prenotazione, accesso): un tocco = copiato
function codeChip(label, value, title){
  if(!String(value||'').trim()) return '';
  return `<span class="code-chip" title="${esc(title||'copia')}" role="button" tabindex="0"
    onclick="copyText('${jsArg(value)}','${jsArg(label)} copiato ✓')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();copyText('${jsArg(value)}','${jsArg(label)} copiato ✓')}"
    ><span class="k">${esc(label)}</span> ${esc(value)} ⧉</span>`;
}

function skeletonTrip(){

    <div class="sk mb-2" style="width:210px;height:1.9rem"></div>

    </div>

      <div class="col-12 col-lg-7"><div class="sk-card"><div class="sk mb-3" style="width:40%;height:.6rem"></div>

      <div class="col-12 col-lg-5"><div class="sk-card"><div class="sk mb-3" style="width:50%;height:.6rem"></div>

function spinner(msg){
  return `<div class="spinner-wrap"><div class="text-center">
    <div class="spinner-border" style="color:var(--stamp)"></div>
    ${msg?`<div class="mono mt-2" style="font-size:.72rem;color:var(--muted)">${esc(msg)}</div>`:''}
  </div></div>`;
}

function renderError(titolo, dettaglio, retryFn){
  $('#app').innerHTML = `
    <div class="sheet empty" style="max-width:480px;margin:8vh auto">
      <div class="big">⚠️ ${esc(titolo)}</div>
      <div class="mono mb-3" style="font-size:.78rem;color:var(--muted)">${esc(dettaglio||'')}</div>
      <button class="btn btn-stamp" id="retryBtn">Riprova</button>
    </div>`;
  if(retryFn) $('#retryBtn').onclick = ()=>retryFn();
}

async function withBtnLoading(btn, label, fn){
  if(!btn) return fn();
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(label||'Attendere…')}`;
  try {
    return await fn();
  } catch(e){
    if(e instanceof AuthError){ sessionExpired(); }
    else { toast('Errore: ' + e.message, 'error'); }
    throw e;
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---------- CONFERME (modal custom al posto di confirm()) ---------- */
let ASK = null;
function ensureAsk(){
  if(ASK) return;
  const el = document.createElement('div');
  el.className='modal fade'; el.id='askModal'; el.tabIndex=-1;
  el.innerHTML = `<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:#fbf8f0;border:1px solid var(--line);border-radius:14px">
      <div class="modal-body" id="askBody" style="font-size:.95rem"></div>
      <div class="modal-footer" id="askFoot" style="border-top:1px solid var(--line)"></div>
    </div></div>`;
  document.body.appendChild(el);
  ASK = { modal:new bootstrap.Modal(el, {backdrop:'static'}), el };
}
// ask(msg, [{label, value, cls}]) → Promise con il value scelto (null se chiuso)
function ask(msg, buttons){
  ensureAsk();
  return new Promise(resolve=>{
    $('#askBody').textContent = msg;
    const foot = $('#askFoot');
    foot.innerHTML = '';
    let resolved = false;
    const done = v => { if(resolved) return; resolved=true; ASK.modal.hide(); resolve(v); };
    buttons.forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (b.cls||'btn-ghost');
      btn.textContent = b.label;
      btn.onclick = ()=>done(b.value);
      foot.appendChild(btn);
    });
    ASK.el.addEventListener('hidden.bs.modal', ()=>done(null), {once:true});
    ASK.modal.show();
  });
}
async function askConfirm(msg, danger){
  const v = await ask(msg, [
    {label:'Annulla', value:false, cls:'btn-ghost'},
    {label: danger?'Elimina':'Conferma', value:true, cls: danger?'btn-del':'btn-stamp'}
  ]);
  return v===true;
}

/* ============================================================

            <textPath href="#logoTop" startOffset="50%" text-anchor="middle">TRIP • HUB</textPath>
          </text>
          <text font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="500" letter-spacing="5" fill="var(--stamp)">
            <textPath href="#logoBot" startOffset="50%" text-anchor="middle">VIAGGI DI GRUPPO</textPath>
          </text>
          <g transform="translate(120 120) rotate(-40) scale(1.15)" fill="var(--ink)">
            <path d="M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z"/>
          </g>
          <g fill="var(--stamp)"><circle cx="120" cy="46" r="2.4"/><circle cx="120" cy="194" r="2.4"/></g>
        </svg>
      </div>
      <div class="sheet">
        <p class="eyebrow mb-1">Accesso</p>
        <h2 style="font-size:1.3rem;margin-bottom:1rem">Inserisci il tuo codice</h2>
        ${err ? `<div class="alert alert-danger py-2 small">${esc(err)}</div>` : ''}
        <label class="form-label">Codice</label>
        <input id="tokenInput" type="password" class="form-control mb-3" placeholder="codice del viaggio" value="${esc(TOKEN)}" autocomplete="current-password">

  const inp = $('#tokenInput');
  inp.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function applyRole(info){
  ROLE = info && info.role ? info.role : '';
  MY_TRIPS = (info && info.viaggi) ? info.viaggi.map(String) : [];
  sessionStorage.setItem('triphub_role', ROLE);
  const b = $('#roleBadge');
  if(b){
    b.style.display = ROLE ? '' : 'none';
    b.textContent = isAdmin() ? 'admin' : 'viaggio';
    b.title = isAdmin() ? 'codice amministratore: accesso completo'
                        : 'codice di viaggio: vedi solo i viaggi collegati a questo codice';
  }
  buildTopMenu();
}

function buildTopMenu(){
  const ul = $('#topMenu');
  if(!ul) return;
  const admin = isAdmin();

async function doLogin(){
  TOKEN = $('#tokenInput').value.trim();
  if(!TOKEN){ return renderGate('Serve il codice.'); }
  try {
    const info = await withBtnLoading($('#loginBtn'), 'Verifico…', ()=>api('auth'));

function logout(){

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = [
  { re:/^#\/$/,                          fn: viewHome },
  { re:/^#\/viaggio\/([^/]+)$/,          fn: (m)=>viewTrip(m[1], 'riepilogo') },
  { re:/^#\/viaggio\/([^/]+)\/([^/]+)$/, fn:(m)=>viewTrip(m[1], m[2]) },
];
async function route(){
  if(!TOKEN){ return renderGate(); }
  const h = location.hash || '#/';
  for(const r of ROUTES){ const m = h.match(r.re); if(m){ return r.fn(m); } }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);

/* ============================================================
   STATO DEL VIAGGIO — dedotto dalle date, salvo stati manuali
   ("idea", "proposta", "annullato") che restano quello che sono.
   ============================================================ */
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const STATI_MANUALI = ['idea','propost','annull','cancell','sospe','forse'];

function tripStato(t){
  const s = String(t.stato||'').toLowerCase().trim();
  if(STATI_MANUALI.some(k=>s.includes(k))) return { txt:s, cls:'draft', hint:'' };

  const oggi = todayISO();
  const a = toISODate(t.data_inizio), b = toISODate(t.data_fine);

  if(b && b < oggi)                      return { txt:'concluso',    cls:'done', hint:'' };
  if(a && b && a<=oggi && oggi<=b)       return { txt:'in corso',    cls:'now',
                                                  hint: b===oggi ? 'ultimo giorno' : `finisce il ${toITDate(b)}` };
  if(a && a > oggi){
    const g = nightsBetween(oggi, a);
    const hint = g===1 ? 'domani' : (g<=400 ? `tra ${g} giorni` : '');
    return { txt:'in programma', cls:'', hint };
  }
  if(a && a === oggi)                    return { txt:'in corso', cls:'now', hint:'si parte oggi' };
  if(s)                                  return { txt:s, cls: s.includes('conclus')||s.includes('fatto') ? 'done' : '', hint:'' };
  return { txt:'senza date', cls:'draft', hint:'' };
}

function tripRank(t){
  const c = tripStato(t).cls;
  return c==='now' ? 0 : c==='done' ? 3 : c==='draft' ? 2 : 1;
}
function tripSort(a,b){
  const ra=tripRank(a), rb=tripRank(b);
  if(ra!==rb) return ra-rb;
  const da=toISODate(a.data_inizio)||'zzz', db=toISODate(b.data_inizio)||'zzz';
  return ra===3 ? db.localeCompare(da) : da.localeCompare(db);   // i conclusi dal più recente
}

/* ============================================================
   VIEW: HOME (lista viaggi + ricerca)
   Con un codice di viaggio si vede SOLO ciò che quel codice apre:
   il filtro è fatto dal server, qui non arriva nemmeno il resto.
   ============================================================ */
async function viewHome(){
  $('#topbar').style.display = 'block';
  if($('#refreshBtn')) $('#refreshBtn').style.display = 'none';
  document.title = 'TripHub — Viaggi';
  CURRENT_TRIP = null; CURRENT_DATA = null;
  buildTopMenu();

  // se abbiamo già l'elenco lo mostriamo subito, poi lo rivalidiamo in sottofondo
  if(TRIPS_CACHE){
    if(autoOpenSingle(TRIPS_CACHE)) return;
    paintHome(TRIPS_CACHE);
    api('list', { sheet:'Viaggi' }).then(fresh=>{
      if(JSON.stringify(fresh)!==JSON.stringify(TRIPS_CACHE) && location.hash.replace('#','')==='/' ){
        cacheTrips(fresh); paintHome(fresh);
      } else cacheTrips(fresh);
    }).catch(()=>{});
    return;
  }

  $('#app').innerHTML = skeletonCards(3);
  let trips = [];
  try { trips = await api('list', { sheet:'Viaggi' }); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco a caricare i viaggi', e.message, viewHome);
  }
  cacheTrips(trips);
  if(autoOpenSingle(trips)) return;
  paintHome(trips);
}

// Chi entra con il codice di un solo viaggio non ha motivo di vedere una lista
// da un elemento: lo portiamo dentro direttamente (ma solo la prima volta,
// altrimenti "torna ai viaggi" rimbalzerebbe indietro).

  if(isAdmin() || AUTO_OPENED || !trips || trips.length!==1) return false;
  AUTO_OPENED = true;
  location.hash = '#/viaggio/'+trips[0].id;
  return true;
}

    return `
    <div class="col-12 col-md-6 col-lg-4 trip-col" data-search="${esc(searchKey)}">
      <div class="trip-card${st.cls==='done'?' past':''}" role="link" tabindex="0"
        onclick="location.hash='#/viaggio/${jsArg(t.id)}'"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/viaggio/${jsArg(t.id)}'}"
        onmouseenter="prefetchTrip('${jsArg(t.id)}')" onfocus="prefetchTrip('${jsArg(t.id)}')"
        ontouchstart="prefetchTrip('${jsArg(t.id)}')"
        aria-label="${esc((t.destinazione||t.nome||'viaggio')+' — '+st.txt)}">
        <div class="stamp ${st.cls}">${esc(st.txt)}</div>
        <p class="eyebrow mb-1">${esc(t.paese||'')}</p>

          ${t.data_inizio?toITDate(t.data_inizio):'?'} → ${t.data_fine?toITDate(t.data_fine):'?'} · ${esc(t.n_persone||'?')} pers.
        </div>
        ${st.hint?`<div class="mono mt-1" style="font-size:.7rem;color:var(--stamp);font-weight:500">${esc(st.hint)}</div>`:''}
        ${(isAdmin()&&t.codice)?`<div class="mt-2">${codeChip('codice', t.codice, 'codice di accesso del viaggio')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  const search = trips.length>3 ? `
    <input class="form-control form-control-sm search-box" id="tripSearch" type="search"
      placeholder="🔎 cerca viaggio…  (premi /)" aria-label="Cerca tra i viaggi"
      oninput="filterTrips(this.value)">` : '';

  $('#app').innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <div>
        <p class="eyebrow mb-1">I tuoi viaggi</p>
        <h1 style="font-size:1.8rem;margin:0">Viaggi</h1>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        ${search}
        ${isAdmin()?`<button class="btn btn-stamp" onclick="editTrip()">+ Nuovo viaggio</button>`:''}
      </div>
    </div>

      <div class="empty" id="noTripMatch" style="display:none"><div class="big">Nessun viaggio trovato</div></div>`
      : `<div class="sheet empty"><div class="big">Nessun viaggio ancora</div>
         ${isAdmin()?`<div>Crea la prima rotta e inizia a organizzare.</div>
         <button class="btn btn-stamp mt-3" onclick="editTrip()">+ Nuovo viaggio</button>`

function filterTrips(q){
  q = String(q||'').toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.trip-col').forEach(col=>{
    const show = !q || (col.getAttribute('data-search')||'').includes(q);
    col.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const empty = $('#noTripMatch');
  if(empty) empty.style.display = visible ? 'none' : 'block';
}

// [chiave, etichetta estesa, icona, etichetta corta, gruppo, in barra inferiore]
const SECTIONS = [
  ['riepilogo',   'Riepilogo',        '📋','Riepilogo','Il viaggio',   true ],
  ['partecipanti','Partecipanti',     '👥','Persone',  'Il viaggio',   false],
  ['voli',        'Voli',             '✈️','Voli',     'Prenotazioni', true ],
  ['alloggi',     'Alloggi',          '🏠','Alloggi',  'Prenotazioni', true ],
  ['spese',       'Budget & Spese',   '💶','Budget',   'Prenotazioni', false],
  ['cosedafare',  'Cose da fare',     '📅','Da fare',  'Sul posto',    true ],
  ['cosaportare', 'Cosa portare',     '🧳','Valigia',  'Sul posto',    false],
  ['contatti',    'Contatti',         '☎️','Contatti', 'Sul posto',    false],
  ['info',        'Info destinazione','ℹ️','Info',     'Sul posto',    false],
];
const NAV_GROUPS = ['Il viaggio','Prenotazioni','Sul posto'];
const PRIMARY_SECTIONS = SECTIONS.filter(x=>x[5]).map(x=>x[0]);

async function viewTrip(id, section){
  $('#topbar').style.display = 'block';
  // se abbiamo già in memoria QUESTO viaggio, cambia solo tab senza rifetch
  if(CURRENT_TRIP && String(CURRENT_TRIP.id)===String(id) && CURRENT_DATA && $('#section')){
    setActiveTab(section);
    renderSection(section);
    return;
  }
  // cache-first: se il viaggio è già stato aperto (o pre-caricato al passaggio
  // del mouse) compare all'istante, e la rete lavora in sottofondo
  const cached = TRIP_CACHE.get(String(id));
  if(cached && (cached.Viaggi||[])[0]){
    mountTrip(cached, section);
    fetchTrip(id).then(fresh=>{
      const stillHere = CURRENT_TRIP && String(CURRENT_TRIP.id)===String(id);
      const editing = !!document.querySelector('.modal.show');
      if(stillHere && !editing && JSON.stringify(fresh)!==JSON.stringify(cached)){
        mountTrip(fresh, currentSection());
      }
    }).catch(()=>{});
    return;
  }

  $('#app').innerHTML = skeletonTrip();
  let all;
  try { all = await fetchTrip(id); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco ad aprire il viaggio', e.message, ()=>viewTrip(id, section));
  }
  if(!(all.Viaggi||[])[0]){
    $('#app').innerHTML = `<div class="sheet empty"><div class="big">Viaggio non trovato</div>
      <div>Potrebbe non essere accessibile con il codice che stai usando.</div>
      <a href="#/">← torna ai viaggi</a></div>`;
    return;
  }
  mountTrip(all, section);
}

function mountTrip(all, section){
  const trip = (all.Viaggi||[])[0];
  // reset delle viste locali se è cambiato viaggio
  if(!CURRENT_TRIP || CURRENT_TRIP.id !== trip.id){
    VOLI_VIEW = 'schede'; ALG_VIEW = 'schede';
    CURRENT_TRIP = trip;
    cpReset(); cdfReset();
  }
  CURRENT_TRIP = trip; CURRENT_DATA = all;
  LAST_SYNC = Date.now();
  TRIP_CACHE.set(String(trip.id), all);
  document.title = (trip.destinazione||trip.nome||'Viaggio') + ' — TripHub';
  renderTripShell(section);
}

/* Contatori e avvisi sulle linguette */
function tabBadge(k, d){
  const len = a => (a||[]).length;
  if(k==='partecipanti') return { n: len(d.Partecipanti) };
  if(k==='alloggi'){
    const tot = len(d.Alloggi), sel = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).length;
    return { n: tot, warn: tot>0 && !sel };
  }
  if(k==='voli'){
    const g = voliGroups(d.Voli||[]), keys = Object.keys(g);
    const sel = keys.filter(x=>groupChosen(g[x])).length;
    return { n: keys.length, warn: keys.length>0 && !sel };
  }
  if(k==='spese')      return { n: len(d.Spese) };
  if(k==='cosedafare'){
    const rows = d.CoseDaFare||[];
    if(!rows.length) return { n:0 };
    const prog = rows.filter(r=>toISODate(r.data)).length;
    return { n: prog===rows.length ? rows.length : `${prog}/${rows.length}` };
  }
  if(k==='cosaportare'){
    const rows = d.CosaPortare||[];
    if(!rows.length) return { n:0 };
    const done = rows.filter(r=>truthy(r.spuntato)).length;
    return { n: `${done}/${rows.length}`, done: done===rows.length };
  }
  if(k==='contatti') return { n: len(d.Contatti) };
  if(k==='info')     return { n: len(d.InfoDest) };
  return { n:0 };
}

function tabsHtml(section){
  const id = CURRENT_TRIP.id, d = CURRENT_DATA || {};
  return SECTIONS.map(([k,label,icona,corta])=>{
    const b = tabBadge(k, d);
    const badge = b.n ? `<span class="tab-badge">${esc(b.n)}</span>` : '';
    const dot   = b.warn ? `<span class="tab-dot" title="niente di scelto"></span>` : '';
    const on = k===section;
    return `<a href="#/viaggio/${jsArg(id)}/${k}" data-tab="${k}" class="${on?'active':''}"
      ${on?'aria-current="page"':''} title="${esc(label)}"><span class="t-ico" aria-hidden="true">${icona}</span><span class="t-full">${esc(label)}</span><span class="t-short">${esc(corta)}</span>${badge}${dot}</a>`;
  }).join('');
}

/* La barra laterale del desktop: c'è spazio in larghezza, non in altezza.
   Etichette per esteso, sezioni raggruppate per momento d'uso. */
function sideNavHtml(section){

          ${on?'aria-current="page"':''}>
          <span class="t-ico" aria-hidden="true">${icona}</span>
          <span class="sn-label">${esc(label)}</span>
          ${b.n?`<span class="tab-badge">${esc(b.n)}</span>`:''}
          ${b.warn?`<span class="tab-dot" title="niente di scelto"></span>`:''}</a>`;
      }).join('')}

}

/* La barra inferiore del telefono: quattro sezioni nella zona del pollice
   più "Altro", che apre le restanti. Non ruba spazio in alto e non
   compete con lo scorrimento della pagina. */
function bottomNavHtml(section){
  const id = CURRENT_TRIP.id, d = CURRENT_DATA || {};
  const items = SECTIONS.filter(x=>x[5]).map(([k,label,icona,corta])=>{
    const b = tabBadge(k, d);
    const on = k===section;
    return `<a href="#/viaggio/${jsArg(id)}/${k}" data-tab="${k}" class="${on?'active':''}"
      ${on?'aria-current="page"':''} title="${esc(label)}">
      <span class="t-ico" aria-hidden="true">${icona}</span><span>${esc(corta)}</span>
      ${b.n?`<span class="tab-badge">${esc(b.n)}</span>`:''}
      ${b.warn?`<span class="tab-dot"></span>`:''}</a>`;
  }).join('');
  const altre = SECTIONS.filter(x=>!x[5]);
  const attesa = altre.some(x=>tabBadge(x[0], d).warn);
  const on = !PRIMARY_SECTIONS.includes(section);
  return items + `<button type="button" id="navMore" class="${on?'active':''}"
    onclick="openNavSheet()" aria-haspopup="true" aria-expanded="false">
    <span class="t-ico" aria-hidden="true">☰</span><span>Altro</span>
    ${attesa?`<span class="tab-dot"></span>`:''}</button>`;
}

function navSheetHtml(section){
  const id = CURRENT_TRIP.id, d = CURRENT_DATA || {};
  return `<div class="backdrop" onclick="closeNavSheet()"></div>
    <div class="panel" role="dialog" aria-label="Altre sezioni">

      ${SECTIONS.filter(x=>!x[5]).map(([k,label,icona])=>{

// giorni che mancano alla partenza (o al rientro se siamo già in viaggio)
function tripCountdown(t){
  const oggi = todayISO();
  const a = toISODate(t.data_inizio), b = toISODate(t.data_fine);
  if(a && a > oggi){
    const g = nightsBetween(oggi, a);
    return g===1 ? '⏳ si parte domani' : `⏳ ${g} giorni alla partenza`;
  }
  if(a && b && a<=oggi && oggi<=b){
    const g = nightsBetween(oggi, b);
    return g===0 ? '🎒 ultimo giorno' : `🌴 in viaggio · ancora ${g} giorn${g===1?'o':'i'}`;
  }
  return '';
}

  const txt = `Ciao! Ecco il piano di "${CURRENT_TRIP.destinazione||CURRENT_TRIP.nome}" su TripHub:\n`
    + `${url}\nCodice di accesso: ${CURRENT_TRIP.codice}`;
  if(navigator.share){
    navigator.share({ title:'TripHub', text:txt }).catch(()=>copyText(txt,'Invito copiato ✓'));
  } else copyText(txt, 'Invito copiato ✓');
}

function setActiveTab(section){
  const more = $('#navMore');
  if(more) more.classList.toggle('active', !PRIMARY_SECTIONS.includes(section));
  document.querySelectorAll('[data-tab]').forEach(a=>{
    const on = a.getAttribute('data-tab')===section;
    a.classList.toggle('active', on);
    if(on){
      a.setAttribute('aria-current','page');
      // serve solo quando i tab sono una striscia orizzontale (desktop stretto):
      // nella griglia del telefono sono tutti visibili e scrollare farebbe saltare la pagina
      const box = a.parentElement;
      if(box && box.scrollWidth > box.clientWidth + 4 && a.scrollIntoView){
        try{ a.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(_){}
      }
    }
    else a.removeAttribute('aria-current');
  });
}

function renderSection(section, keepScroll){
  const box = $('#section');
  if(!box) return;
  const y = keepScroll ? window.scrollY : 0;
  setActiveTab(section);
  const d = CURRENT_DATA, tid = CURRENT_TRIP.id;
  const map = {
    riepilogo:   ()=>secRiepilogo(d),
    partecipanti:()=>secPartecipanti(d.Partecipanti, tid),
    alloggi:     ()=>secAlloggi(d.Alloggi, tid),
    voli:        ()=>secVoli(d.Voli, tid),
    spese:       ()=>secSpese(d, tid),
    cosedafare:  ()=>secCoseDaFare(d.CoseDaFare, tid),
    cosaportare: ()=>secCosaPortare(d.CosaPortare, tid),
    contatti:    ()=>secContatti(d.Contatti, tid),
    info:        ()=>secInfo(d, tid),
  };
  box.innerHTML = (map[section]||map.riepilogo)();
  if(keepScroll) window.scrollTo(0, y);
}

/* ============================================================
   DATE DEL VIAGGIO — le date iniziali sono indicative: appena
   scegli un volo (o, in mancanza, un alloggio) l'app propone di
   allinearle a quelle reali con un click.
   ============================================================ */
function tripDatesSuggestion(d){
  if(!d) return null;
  let start=null, end=null, src=null;

  const groups = voliGroups(d.Voli||[]);
  Object.keys(groups).forEach(k=>{
    const legs = groups[k];
    if(!groupChosen(legs)) return;
    const A = legsOfDir(legs,'Andata'), R = legsOfDir(legs,'Ritorno');
    if(A.length){ const s = toISODate(A[0].data_part); if(s && (!start || s<start)) start = s; }
    if(R.length){ const e = rowArrISO(R[R.length-1]); if(e && (!end || e>end)) end = e; }
  });
  if(start||end) src = 'i voli scelti';

  if(!start && !end){
    (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
      const s = toISODate(a.checkin), e = toISODate(a.checkout);
      if(s && (!start || s<start)) start = s;
      if(e && (!end   || e>end))   end   = e;
    });
    if(start||end) src = 'gli alloggi scelti';
  }
  if(!start && !end) return null;

  const t  = (d.Viaggi||[])[0] || {};
  const cs = toISODate(t.data_inizio), ce = toISODate(t.data_fine);
  const S  = start || cs, E = end || ce;
  return { start:S, end:E, src, diff: (S && S!==cs) || (E && E!==ce) };
}

function tripDatesBanner(d){
  const s = tripDatesSuggestion(d);
  if(!s || !s.diff) return '';
  const t = (d.Viaggi||[])[0] || {};
  return `<div class="sheet p-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2"
      style="border-color:#e0a98f;background:#fdf1ea">
    <div style="font-size:.85rem">📅 Il viaggio è segnato
      <span class="mono">${toITDate(t.data_inizio)||'?'} → ${toITDate(t.data_fine)||'?'}</span>,
      ma ${esc(s.src)} dicono <strong class="mono">${toITDate(s.start)} → ${toITDate(s.end)}</strong></div>
    <button class="btn btn-stamp btn-sm" onclick="alignTripDates('${jsArg(s.start)}','${jsArg(s.end)}')">Allinea le date</button>
  </div>`;
}

// mostrato accanto al titolo finché non c'è un volo scelto a confermare le date
function tripDatesChip(d){
  const groups = voliGroups(d.Voli||[]);
  const chosen = Object.keys(groups).filter(k=>groupChosen(groups[k]));
  if(!chosen.length) return '<span class="chip ms-1" title="nessun volo scelto: le date possono ancora cambiare">date indicative</span>';
  const dirs = {};
  chosen.forEach(k=>groupDirs(groups[k]).forEach(x=>dirs[x]=true));
  if(!dirs.Andata || !dirs.Ritorno) return '<span class="chip ms-1">date parziali</span>';
  return '<span class="chip pick ms-1" title="date confermate dai voli scelti">✓ da volo</span>';
}

async function alignTripDates(start, end){
  if(!CURRENT_TRIP) return;
  const prev = { data_inizio: CURRENT_TRIP.data_inizio, data_fine: CURRENT_TRIP.data_fine };
  const out  = { id: CURRENT_TRIP.id, data_inizio: start, data_fine: end };
  Object.assign(CURRENT_TRIP, out);
  if(CURRENT_DATA && CURRENT_DATA.Viaggi && CURRENT_DATA.Viaggi[0]) Object.assign(CURRENT_DATA.Viaggi[0], out);
  renderTripShell(currentSection());
  try{
    await api('update', { sheet:'Viaggi', record: out });
    invalidateTrips();
    toast('Date del viaggio aggiornate ✓','ok');
  }catch(e){
    Object.assign(CURRENT_TRIP, prev);
    if(CURRENT_DATA && CURRENT_DATA.Viaggi && CURRENT_DATA.Viaggi[0]) Object.assign(CURRENT_DATA.Viaggi[0], prev);
    renderTripShell(currentSection());
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

/* ---------- PARTECIPANTI: helper condivisi ---------- */
function pName(p){ return [p.nome, p.cognome].filter(Boolean).join(' ').trim() || '(senza nome)'; }
function partList(d){ return (d.Partecipanti||[]).slice().sort((a,b)=>pName(a).localeCompare(pName(b),'it')); }
function tripPeople(d){
  const n = (d.Partecipanti||[]).length;
  return n>0 ? n : (num(d.Viaggi && d.Viaggi[0] && d.Viaggi[0].n_persone) || 1);
}
/* Tendina "ha pagato": una sola persona, quella che ha anticipato i soldi.
   Diverso da `paganti`, che dice invece fra quanti si divide la spesa. */
function pagatoDaSelect(id, val, label){
  const people = partList(CURRENT_DATA).map(pName);
  const v = String(val||'');
  if(!people.length){
    return `<label class="form-label">${esc(label||'ha pagato')}</label>
      <input class="form-control" id="${id}" value="${esc(v)}" placeholder="aggiungi prima i partecipanti">`;
  }
  return `<label class="form-label">${esc(label||'ha pagato')}
      <span style="font-weight:400;color:var(--muted);font-size:.68rem">— lascia vuoto se non l'hai ancora pagata</span></label>
    <select class="form-select" id="${id}">
      <option value="">— non indicato —</option>
      ${people.map(n=>`<option value="${esc(n)}"${v===n?' selected':''}>${esc(n)}</option>`).join('')}
      ${v && !people.includes(v)?`<option value="${esc(v)}" selected>${esc(v)} (non è più tra i partecipanti)</option>`:''}
    </select>`;
}

function payerNames(paganti, allNames){
  const s = String(paganti||'').trim();
  if(!s || s.toLowerCase()==='tutti') return allNames.slice();
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function payerCount(paganti, totalPeople, allNames){
  if(!String(paganti||'').trim() || String(paganti).toLowerCase()==='tutti') return totalPeople;
  const n = payerNames(paganti, allNames).length;
  return n>0 ? n : totalPeople;
}

/* ---------- RIEPILOGO + BUDGET (calcolato) ----------
   Nota v4: il costo di un volo è ora "biglietto + bagagli".
   Il budget somma sempre i due addendi, così i totali restano
   corretti anche sui voli inseriti prima di questa versione
   (dove costo_bagaglio è semplicemente vuoto).                */
function computeBudget(d){
  const alloggio = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).reduce((s,a)=>s+num(a.totale),0);
  const voliRows = (d.Voli||[]).filter(v=>truthy(v.scelto));
  const voliBiglietti = voliRows.reduce((s,v)=>s+num(v.totale),0);
  const voliBagagli   = voliRows.reduce((s,v)=>s+num(v.costo_bagaglio),0);
  const voli  = voliBiglietti + voliBagagli;
  const spese = (d.Spese||[]).reduce((s,x)=>s+num(x.totale),0);
  const tot = alloggio + voli + spese;
  const pers = tripPeople(d);
  return { alloggio, voli, voliBiglietti, voliBagagli, spese, tot, pers, perPersona: tot/pers };
}

function computeBalances(d){
  const people = partList(d);
  const allNames = people.map(pName);
  if(!allNames.length) return null;
  const bal = {}; allNames.forEach(n=>bal[n]=0);
  const nAll = allNames.length;
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
    const q = num(a.totale)/nAll;
    allNames.forEach(n=>bal[n]+=q);
  });
  (d.Voli||[]).filter(v=>truthy(v.scelto)).forEach(v=>{
    const names = payerNames(v.paganti, allNames);
    const q = (num(v.totale)+num(v.costo_bagaglio))/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  (d.Spese||[]).forEach(x=>{
    const names = payerNames(x.paganti, allNames);
    const q = num(x.totale)/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  return allNames.map(n=>({ nome:n, quota: round2(bal[n]) }));
}

/* ============================================================
   SOLDI — costi e movimenti sono due cose diverse
   ------------------------------------------------------------
   Un errore facile è confondere «quanto costa» con «chi ha tirato fuori
   i soldi». Sono separati apposta:

     COSTI      voli scelti + alloggi scelti + spese   → il preventivo
     MOVIMENTI  anticipi e rimborsi                    → chi deve a chi

   Un alloggio prenotato che paghi fra tre mesi sta nel preventivo ma NON
   nei saldi: nessuno ha ancora messo soldi, quindi nessuno deve niente.
   Quando lo paghi (anche solo la caparra) registri un ANTICIPO, e da quel
   momento entra nei conti. Quando gli altri ti restituiscono la loro parte
   registri un RIMBORSO, anche parziale.
   ============================================================ */

/* Tutti i movimenti di denaro, da tre sorgenti:
   1. le spese, che sono già di per sé un pagamento (paghi la cena mentre la fai)
   2. il registro Pagamenti, che è il posto vero dove si gestiscono i soldi
   3. il vecchio campo "ha pagato" su voli e alloggi, tenuto per non perdere
      i dati di chi l'aveva già compilato (si converte con un click) */
function movimenti(d){
  const nomi = partList(d).map(pName);
  const noto = n => nomi.indexOf(String(n||'').trim()) >= 0;
  const out = [];

  (d.Spese||[]).forEach(x=>{
    const q = num(x.totale), chi = String(x.pagato_da||'').trim();
    if(!q || !chi) return;                       // spesa segnata ma non ancora pagata
    out.push({ key:'sp-'+x.id, src:'Spese', srcId:x.id, tipo:'anticipo',
      data: toISODate(x.data), chi, verso:'', importo:q, valido: noto(chi),
      riferimento: x.descrizione || 'Spesa', paganti: x.paganti||'' });
  });

  (d.Pagamenti||[]).forEach(p=>{
    const q = num(p.importo);
    if(!q) return;
    const tipo = String(p.tipo||'').toLowerCase()==='rimborso' ? 'rimborso' : 'anticipo';
    const chi = String(p.chi||'').trim(), verso = String(p.verso||'').trim();
    out.push({ key:'pg-'+p.id, src:'Pagamenti', srcId:p.id, tipo,
      data: toISODate(p.data), chi, verso, importo:q,
      valido: noto(chi) && (tipo==='anticipo' || noto(verso)),
      riferimento: p.riferimento||'', paganti: p.paganti||'', note: p.note||'' });
  });

  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
    const chi = String(a.pagato_da||'').trim(), q = num(a.totale);
    if(!chi || !q) return;
    out.push({ key:'lg-al-'+a.id, src:'Alloggi', srcId:a.id, legacy:true, tipo:'anticipo',
      data:'', chi, verso:'', importo:q, valido: noto(chi),
      riferimento: a.struttura || 'Alloggio', paganti:'' });
  });
  (d.Voli||[]).filter(v=>truthy(v.scelto)).forEach(v=>{
    const chi = String(v.pagato_da||'').trim(), q = num(v.totale)+num(v.costo_bagaglio);
    if(!chi || !q) return;
    out.push({ key:'lg-vo-'+v.id, src:'Voli', srcId:v.id, legacy:true, tipo:'anticipo',
      data:'', chi, verso:'', importo:q, valido: noto(chi),
      riferimento: [iataOf(v.da)||v.da, iataOf(v.a)||v.a].filter(Boolean).join(' → ') || 'Volo',
      paganti: v.paganti||'' });
  });

  return out.sort((a,b)=>
    (a.data||'9999-99-99').localeCompare(b.data||'9999-99-99') ||
    String(a.riferimento).localeCompare(String(b.riferimento),'it'));
}

/* Saldo di ciascuno, calcolato SOLO sui movimenti reali.
     anticipo → chi ha pagato sale di tutto, chi ne beneficia scende della sua quota
     rimborso → chi versa sale, chi incassa scende
   Un movimento che nomina qualcuno fuori dai partecipanti viene saltato e
   segnalato: metterlo dentro a metà sbilancerebbe i conti di tutti. */
function computeSettlement(d){
  const nomi = partList(d).map(pName);
  if(!nomi.length) return null;
  const bal = {}; nomi.forEach(n=>bal[n]=0);

  const mov = movimenti(d);
  const ignoti = new Set();
  let uscito = 0;

  mov.forEach(m=>{
    if(!m.valido){
      [m.chi, m.verso].forEach(n=>{ if(n && nomi.indexOf(n)<0) ignoti.add(n); });
      return;
    }
    if(m.tipo === 'rimborso'){
      bal[m.chi]   += m.importo;
      bal[m.verso] -= m.importo;
      return;
    }
    bal[m.chi] += m.importo;
    uscito     += m.importo;
    const fra = payerNames(m.paganti, nomi).filter(n=>n in bal);
    const set = fra.length ? fra : nomi;
    const q = m.importo / set.length;
    set.forEach(n=>bal[n] -= q);
  });

  const righe = nomi.map(n=>({ nome:n, saldo: round2(bal[n]) }));
  return {
    righe,
    movimenti: mov,
    ignoti: [...ignoti],
    legacy: mov.filter(m=>m.legacy),
    uscito: round2(uscito),
    trasferimenti: simplifyDebts(righe)
  };
}

/* Quanto è già uscito di tasca e quanto resta da pagare.
   È il numero che mancava: il totale da solo non dice se i soldi sono
   già stati messi o se devono ancora uscire. */
function cassa(d){
  const b  = computeBudget(d);
  const st = computeSettlement(d);
  const uscito = st ? st.uscito : 0;
  return { costo: b.tot, uscito, daPagare: round2(Math.max(0, b.tot - uscito)) };
}

/* Semplificazione dei debiti, come fa Splitwise.
   Invece di far pagare ognuno a ognuno, si guarda solo il saldo netto:
   chi è in rosso paga direttamente chi è in verde, partendo ogni volta
   dal debito più grosso e dal credito più grosso. Ne escono al massimo
   n−1 bonifici invece dei n×(n−1)/2 possibili.

   Nota onesta: trovare il numero MINIMO assoluto di bonifici è un problema
   NP-difficile; questo è l'algoritmo greedy che usano anche loro, e in
   pratica il risultato coincide quasi sempre con l'ottimo. */
function simplifyDebts(righe){
  const eps = 0.005;                                   // mezzo centesimo
  const cred = righe.filter(r=>r.saldo >  eps).map(r=>({nome:r.nome, v:r.saldo}));
  const debt = righe.filter(r=>r.saldo < -eps).map(r=>({nome:r.nome, v:-r.saldo}));
  // a parità di importo ordino per nome, così la lista non balla a ogni ridisegno
  const bySize = (a,b)=> b.v-a.v || a.nome.localeCompare(b.nome,'it');
  cred.sort(bySize); debt.sort(bySize);

  const out = [];
  let i=0, j=0;
  while(i < debt.length && j < cred.length){
    const q = Math.min(debt[i].v, cred[j].v);
    if(q > eps) out.push({ da: debt[i].nome, a: cred[j].nome, importo: round2(q) });
    debt[i].v -= q; cred[j].v -= q;
    if(debt[i].v <= eps) i++;
    if(cred[j].v <= eps) j++;
  }
  return out;
}

function truthy(v){ const s = String(v).toLowerCase().trim(); return ['sì','si','true','1','x','yes','✓'].includes(s); }

/* ============================================================
   COSA MANCA ANCORA
   ------------------------------------------------------------
   I dati per saperlo c'erano già sparsi ovunque (scelto, prenotazione_req,
   scadenza_doc, notti scoperte...), ma nessuna schermata li metteva insieme.
   Questo riquadro esiste solo finché c'è qualcosa da fare: quando è tutto
   a posto sparisce da solo.
   ============================================================ */
function checklistBox(d){
  const t = (d.Viaggi||[])[0] || {};
  const tid = t.id;
  const go = sez => `location.hash='#/viaggio/${jsArg(tid)}/${sez}'`;
  const items = [];
  const add = (grave, icona, testo, sez, azione) => items.push({grave, icona, testo, sez, azione});

  // voli e alloggi: opzioni buttate giù ma nessuna scelta
  const gruppi = voliGroups(d.Voli||[]);
  const kVoli = Object.keys(gruppi);
  if(kVoli.length && !kVoli.some(k=>groupChosen(gruppi[k])))
    add(true, '✈️', `${kVoli.length} opzion${kVoli.length===1?'e':'i'} di volo, nessuna scelta`, 'voli', 'scegli');
  const alg = d.Alloggi||[];
  if(alg.length && !alg.some(a=>truthy(a.scelto)))
    add(true, '🏠', `${alg.length} opzion${alg.length===1?'e':'i'} di alloggio, nessuna scelta`, 'alloggi', 'scegli');

  const gaps = alloggiGaps(d);
  if(gaps.length && alg.some(a=>truthy(a.scelto)))
    add(true, '🛏', `notti senza alloggio: ${gapsText(gaps)}`, 'alloggi', 'sistema');

  // attività che vanno prenotate e non lo sono ancora
  const daPren = (d.CoseDaFare||[]).filter(r=>truthy(r.prenotazione_req) && !truthy(r.confermata));
  if(daPren.length)
    add(true, '🎟', `${daPren.length} attività da prenotare: ${daPren.slice(0,3).map(r=>r.attivita).filter(Boolean).join(', ')}${daPren.length>3?'…':''}`, 'cosedafare', 'apri');

  // documenti
  const persone = d.Partecipanti||[];
  const scad = persone.filter(p=>docScade(p.scadenza_doc, t.data_fine));
  if(scad.length)
    add(true, '🪪', `documento in scadenza prima del rientro: ${scad.map(pName).join(', ')}`, 'partecipanti', 'controlla');
  const senzaDoc = persone.filter(p=>!String(p.num_doc||'').trim());
  if(senzaDoc.length && persone.length)
    add(false, '📄', `${senzaDoc.length} partecipant${senzaDoc.length===1?'e senza documento':'i senza documento'}`, 'partecipanti', 'completa');

  // idee ancora senza data
  const idee = (d.CoseDaFare||[]).filter(r=>!toISODate(r.data));
  if(idee.length)
    add(false, '💡', `${idee.length} ide${idee.length===1?'a':'e'} ancora senza data`, 'cosedafare', 'programma');

  // scadenze di pagamento: la data si toglie quando la voce è pagata
  const oggi = todayISO();
  const conScadenza = []
    .concat((d.Alloggi||[]).filter(a=>truthy(a.scelto)).map(a=>({nome:a.struttura||'Alloggio', quando:toISODate(a.scadenza_pag), sez:'alloggi'})))
    .concat(Object.values(voliGroups(d.Voli||[])).filter(groupChosen).map(g=>({
      nome:'Volo '+routeStr(g), quando:toISODate(g[0].scadenza_pag), sez:'voli'})))
    .filter(x=>x.quando);
  conScadenza.sort((a,b)=>a.quando.localeCompare(b.quando)).forEach(x=>{
    const giorni = nightsBetween(oggi, x.quando);
    if(x.quando < oggi) add(true, '⏰', `${x.nome}: il pagamento era da fare entro il ${toITDate(x.quando)}`, x.sez, 'apri');
    else if(giorni <= 30) add(giorni <= 7, '⏰', `${x.nome}: da pagare entro il ${toITDate(x.quando)} (${giorni===0?'oggi':giorni+' giorni'})`, x.sez, 'apri');
  });

  // soldi anticipati non attribuiti: senza questo i saldi non tornano
  const st = computeSettlement(d);
  if(st && st.legacy.length)
    add(false, '💶', st.legacy.length===1
      ? 'una voce usa ancora il vecchio campo "ha pagato": convertila in movimento'
      : `${st.legacy.length} voci usano ancora il vecchio campo "ha pagato": convertile in movimenti`, 'spese', 'apri');
  const c = cassa(d);
  if(c.daPagare > 0.005 && c.uscito > 0.005)
    add(false, '💶', `${eur(c.daPagare)} del viaggio non sono ancora stati pagati da nessuno`, 'spese', 'vedi');

  if(!items.length) return '';
  const gravi = items.filter(i=>i.grave).length;
  items.sort((a,b)=>(b.grave?1:0)-(a.grave?1:0));
  return `
    <div class="sheet p-3 mb-3 chk-box">
      <p class="eyebrow mb-2">Prima di partire · ${items.length} cos${items.length===1?'a':'e'}${gravi?` · ${gravi} important${gravi===1?'e':'i'}`:''}</p>
      ${items.map(i=>`<div class="chk-row${i.grave?' grave':''}">
        <span class="chk-ico">${i.icona}</span>
        <span class="chk-txt">${esc(i.testo)}</span>
        <button class="btn btn-ghost btn-sm chk-go" onclick="${go(i.sez)}">${esc(i.azione)} →</button>
      </div>`).join('')}
    </div>`;
}

function secRiepilogo(d){
  const b = computeBudget(d);
  const t = d.Viaggi[0];

function docScade(scadenzaISO, fineViaggioISO){
  const s = toISODate(scadenzaISO), f = toISODate(fineViaggioISO);
  if(!s || !f) return false;
  return s < f;
}
function maskDoc(v){
  const s = String(v||'').trim();
  if(!s) return '';
  if(s.length<=4) return '••••';
  return '••••'+s.slice(-4);
}

};
const lbl = k => LABELS[k] || k.replace(/_/g,' ');

// Colonne non ordinabili (link, azioni)
const NO_SORT = ['link'];

function sortVal(col, v){
  if(DATE_FIELDS.includes(col)) return toISODate(v) || '';
  if(TIME_FIELDS.includes(col)) return toHM(v) || '';
  if(NUM_FIELDS.includes(col) || CUR_FIELDS.includes(col)) return num(v);
  if(BOOL_FIELDS.includes(col)) return truthy(v) ? 1 : 0;
  return String(v||'').toLowerCase();
}

function sortedRows(sheet, rows, cols){
  const s = SORT[sheet];
  if(!s || !cols.includes(s.col)) return rows;
  const dir = s.dir==='desc' ? -1 : 1;
  return rows.slice().sort((a,b)=>{
    const va = sortVal(s.col, a[s.col]), vb = sortVal(s.col, b[s.col]);
    if(va<vb) return -1*dir;
    if(va>vb) return  1*dir;
    return 0;
  });
}

function sortBy(sheet, col){
  const s = SORT[sheet];
  if(s && s.col===col) s.dir = (s.dir==='asc'?'desc':'asc');
  else SORT[sheet] = { col, dir:'asc' };
  refreshView();
}

function thSortable(sheet, col){
  if(NO_SORT.includes(col)) return `<th>${esc(lbl(col))}</th>`;
  const s = SORT[sheet];
  const arrow = (s && s.col===col) ? `<span class="arrow">${s.dir==='asc'?'▲':'▼'}</span>` : '';
  return `<th class="sortable" onclick="sortBy('${jsArg(sheet)}','${jsArg(col)}')">${esc(lbl(col))} ${arrow}</th>`;
}

function linkCell(url){
  url = String(url||'').trim();
  if(!url) return '<span class="chip">–</span>';
  // Solo http/https: esc() protegge il testo ma non lo schema, e un
  // "javascript:" in questo campo verrebbe eseguito da chi ci clicca.
  if(!isUrl(url)) return `<span class="chip" title="non è un link valido">${esc(url.length>28?url.slice(0,28)+'…':url)}</span>`;
  const safe = esc(url);
  return `<span class="d-inline-flex gap-1">
    <a class="link-btn" href="${safe}" target="_blank" rel="noopener" title="${safe}">🔗 apri</a>
    <button class="link-btn" type="button" title="Copia link" onclick="copyLink(this,'${safe.replace(/'/g,"\\'")}')">⧉</button>
  </span>`;
}

function copyLink(btn, url){
  copyText(url, 'Link copiato ✓');
  const t = btn.textContent; btn.textContent='✓';
  setTimeout(()=>btn.textContent=t, 1200);
}

// Le voci di costo a cui un anticipo può fare riferimento (per il datalist)
function vociDiCosto(d){
  const out = [];
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{ if(a.struttura) out.push(String(a.struttura)); });
  const g = voliGroups(d.Voli||[]);
  Object.keys(g).filter(k=>groupChosen(g[k])).forEach(k=>{
    const r = routeStr(g[k]); if(r) out.push('Volo ' + r);
  });
  return [...new Set(out)];
}

function saldoChip(v){
  if(v >  0.005) return `<span class="sal-pos" title="deve rientrare di questa cifra">+ ${eur(v)}</span>`;
  if(v < -0.005) return `<span class="sal-neg" title="deve dare questa cifra">− ${eur(-v)}</span>`;
  return `<span class="sal-zero">in pari</span>`;
}

/* Riquadro "chi deve quanto a chi". Senza partecipanti censiti non c'è
   niente da dividere, quindi non compare nemmeno. */
function saldiBox(d, tid){
  const st = computeSettlement(d);
  if(!st || st.righe.length < 2) return '';

  const righe = st.righe.slice()
    .sort((a,b)=> b.saldo-a.saldo || a.nome.localeCompare(b.nome,'it'))
    .map(r=>`<div class="sal-row">
      <span class="sal-name">${esc(r.nome)}</span>
      <span class="sal-num">${saldoChip(r.saldo)}</span>
    </div>`).join('');

  const tr = st.trasferimenti;
  const bonifici = tr.length
    ? tr.map(t=>`<div class="sal-move">
        <span><strong>${esc(t.da)}</strong> <span class="sal-arrow">→</span> <strong>${esc(t.a)}</strong></span>
        <span class="d-flex align-items-center gap-2">

        </span></div>`).join('')
    : `<div class="mono" style="font-size:.8rem;color:var(--ok)">Siete in pari, nessun bonifico da fare ✓</div>`;

  const avvisi = [];
  if(st.ignoti.length) avvisi.push(`nomi che non sono fra i partecipanti, movimenti ignorati: ${esc(st.ignoti.join(', '))}`);
  if(st.legacy.length) avvisi.push(

          ${avvisi.map(a=>`<div>⚠️ ${a}</div>`).join('')}</div>`:''}

      <div class="col-12 col-lg-7"><div class="sheet p-3 h-100">

function editPagamento(record, tid, preset){
  ensureModal();
  const d = CURRENT_DATA || {};
  const people = partList(d).map(pName);
  if(!people.length){ toast('Aggiungi prima i partecipanti','error'); return; }

/* Porta il vecchio campo "ha pagato" di voli e alloggi dentro il registro,
   così il dato non si perde e smette di stare in due posti diversi. */
async function convertiLegacy(tid){
  const st = computeSettlement(CURRENT_DATA);
  if(!st || !st.legacy.length) return;
  const n = st.legacy.length;
  if(!await askConfirm(`Trasformo ${n} vec${n===1?'chia voce':'chie voci'} "ha pagato" in altrettanti anticipi, e svuoto il vecchio campo. Procedo?`)) return;

  const records = st.legacy.map(m=>({
    viaggio_id: tid, tipo:'anticipo', data:'', chi:m.chi, verso:'',
    importo: m.importo, riferimento: m.riferimento, paganti: m.paganti||'', note:''
  }));
  try{
    const saved = await api('create_many', { sheet:'Pagamenti', records });
    applyLocal('Pagamenti','create_many', saved);
    // svuoto il campo sulle righe di origine, altrimenti conterebbe due volte
    const perFoglio = {};
    st.legacy.forEach(m=>{ (perFoglio[m.src] = perFoglio[m.src] || []).push({ id:m.srcId, pagato_da:'' }); });
    for(const foglio of Object.keys(perFoglio)){
      await api('update_many', { sheet: foglio, records: perFoglio[foglio] });
      perFoglio[foglio].forEach(rec=>applyLocal(foglio,'update',rec));
    }
    toast(`${saved.length} movimenti creati ✓`,'ok');
    refreshView();
  }catch(e){
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

/* Saldi e bonifici come testo semplice, da incollare nel gruppo. */
function contiTesto(d){
  const st = computeSettlement(d);
  if(!st) return '';
  const c = cassa(d);
  const L = [];
  L.push(`💶 ${(CURRENT_TRIP && (CURRENT_TRIP.destinazione||CURRENT_TRIP.nome)) || 'Viaggio'} — conti`);
  L.push(`Costo totale ${eur(c.costo)} · già usciti ${eur(c.uscito)} · da pagare ${eur(c.daPagare)}`);
  L.push('');
  st.righe.slice().sort((a,b)=>b.saldo-a.saldo).forEach(r=>{
    const s = r.saldo > 0.005 ? `deve ricevere ${eur(r.saldo)}`
            : r.saldo < -0.005 ? `deve dare ${eur(-r.saldo)}` : 'in pari';
    L.push(`• ${r.nome}: ${s}`);
  });
  if(st.trasferimenti.length){
    L.push('');
    L.push('Per pareggiare:');
    st.trasferimenti.forEach(t=>L.push(`• ${t.da} → ${t.a}: ${eur(t.importo)}`));
  }
  return L.join('\n');
}

  copyText(t, 'Conti copiati ✓');

/* ============================================================
   ALLOGGI
   Le notti derivano da check-in/check-out; la scelta è esclusiva
   solo tra opzioni che si SOVRAPPONGONO nelle date, così un
   viaggio con due basi diverse resta gestibile.
   ============================================================ */
let ALG_VIEW = 'schede';   // 'schede' | 'confronto'
function setAlgView(v){ ALG_VIEW = v; renderSection('alloggi'); }

function nightsBetween(a,b){
  const A=toISODate(a), B=toISODate(b);
  if(!A||!B) return 0;
  const n = Math.round((new Date(B+'T12:00:00') - new Date(A+'T12:00:00'))/86400000);
  return n>0 ? n : 0;
}
function nightList(a,b){
  const A=toISODate(a), B=toISODate(b), out=[];
  if(!A||!B) return out;
  let cur=A, guard=0;
  while(cur<B && guard++<400){ out.push(cur); cur=isoAddDays(cur,1); }
  return out;
}
function rangesOverlap(a1,a2,b1,b2){
  const A1=toISODate(a1),A2=toISODate(a2),B1=toISODate(b1),B2=toISODate(b2);
  if(!A1||!A2||!B1||!B2) return true;      // senza date: trattale come alternative
  return A1 < B2 && B1 < A2;
}
function algNights(a){ return Math.round(num(a.notti)) || nightsBetween(a.checkin,a.checkout); }
function algOutOfRange(a){
  const s=toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio), e=toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine);
  const ci=toISODate(a.checkin), co=toISODate(a.checkout);
  if(!s||!e||!ci||!co) return false;
  return ci<s || co>e;
}
// notti del viaggio non coperte da nessun alloggio scelto
function alloggiGaps(d){
  const t=(d.Viaggi||[])[0]||{};
  const all=nightList(t.data_inizio, t.data_fine);
  if(!all.length) return [];
  const cov={};
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>nightList(a.checkin,a.checkout).forEach(n=>cov[n]=true));
  return all.filter(n=>!cov[n]);
}
function groupRanges(isoList){
  const out=[];
  isoList.forEach(iso=>{
    const last=out[out.length-1];
    if(last && isoAddDays(last.to,1)===iso) last.to=iso;
    else out.push({from:iso,to:iso});
  });
  return out;
}
function gapsText(gaps){
  return groupRanges(gaps).map(r=> r.from===r.to
    ? `notte del ${toITDate(r.from)}`
    : `${toITDate(r.from)} → ${toITDate(isoAddDays(r.to,1))}`).join(' · ');
}
function starsView(v){
  const n=Math.min(5,Math.round(num(v)));
  if(!n) return '';
  return `<span class="stars-view">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`;
}
function mapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(q||'')); }
function isUrl(v){ return /^https?:\/\//i.test(String(v||'').trim()); }

/* Il pulsante mappa accetta due mondi:
   - un indirizzo scritto a mano  → costruiamo la ricerca su Google Maps
   - il link del tasto "Condividi" di Maps (anche maps.app.goo.gl) → lo apriamo così com'è,
     che è l'unico modo di puntare esattamente al posto giusto quando la via è ambigua. */
function mapsHref(a){
  const l = String((a && a.mappa_link) || '').trim();
  if(isUrl(l)) return l;
  const q = l || (a && a.indirizzo) || (a && a.struttura) || '';
  return q ? mapsUrl(q) : '';
}

const ALG_COLS = ['struttura','checkin','checkout','notti','totale','prezzo_testa','prezzo_testa_notte','valutazione'];

  return header + tripDatesBanner(CURRENT_DATA) + warn + body;

/* ============================================================
   VOLI — modello dati
   gruppo_id  = OPZIONE COMPLETA (andata + ritorno insieme)
   direzione  = Andata | Ritorno       tratta = scalo n° dentro la direzione
   totale     = prezzo del BIGLIETTO, valorizzato SOLO sulla prima
                tratta di una direzione.
   costo_bagaglio = supplemento bagagli, stessa regola.
   Il costo di un'opzione è quindi: somma dei biglietti + somma dei
   bagagli di tutte le sue tratte. Tenere i due addendi separati
   serve perché molti siti mostrano prima il volo e poi il bagaglio.
   ============================================================ */
const DIRS = ['Andata','Ritorno'];
const dk     = d => (String(d||'').toLowerCase().indexOf('rit')===0 ? 'R' : 'A');
const isRit  = d => dk(d)==='R';
const dirOf  = r => isRit(r.direzione) ? 'Ritorno' : 'Andata';

function voliGroups(rows){
  const g = {};
  (rows||[]).forEach(r=>{ const k = r.gruppo_id || r.id; (g[k] = g[k] || []).push(r); });
  Object.values(g).forEach(arr=>arr.sort((a,b)=>{
    const d = (isRit(a.direzione)?1:0) - (isRit(b.direzione)?1:0);
    return d!==0 ? d : num(a.tratta)-num(b.tratta);
  }));
  return g;
}
function legsOfDir(legs, dir){ return (legs||[]).filter(l=>dirOf(l)===dir); }
function groupDirs(legs){ return DIRS.filter(d=>legsOfDir(legs,d).length>0); }
function groupBiglietti(legs){ return (legs||[]).reduce((s,l)=>s+num(l.totale),0); }
function groupBag(legs){ return (legs||[]).reduce((s,l)=>s+num(l.costo_bagaglio),0); }
function groupTotal(legs){ return groupBiglietti(legs) + groupBag(legs); }
function groupPTesta(legs){ return (legs||[]).reduce((s,l)=>s+num(l.prezzo_testa),0); }
function groupChosen(legs){ return (legs||[]).some(l=>truthy(l.scelto)); }
function groupOpz(legs){ return Math.round(num(legs && legs[0] && legs[0].opzione))||1; }
function groupPnr(legs){
  const r = (legs||[]).find(l=>String(l.pnr||'').trim());
  return r ? String(r.pnr).trim() : '';
}
function groupKind(legs){
  const ds = groupDirs(legs);
  if(ds.length===2) return 'A/R';
  return ds[0]==='Ritorno' ? 'solo ritorno' : 'solo andata';
}
function routeStr(legs){
  if(!legs || !legs.length) return '';
  return legs.map(l=>String(l.da||'?')).concat(String(legs[legs.length-1].a||'?')).join(' → ');
}
function nextOpz(){
  const groups = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[]);
  const max = Object.values(groups).reduce((m,g)=>Math.max(m, groupOpz(g)), 0);
  return max+1;
}

/* -- date/ore su righe già salvate --
   Gli orari dei voli sono SEMPRE ora locale dell'aeroporto: sommarli
   così com'erano dava durate sbagliate di un'ora o più su ogni tratta
   internazionale. Ora ogni orario viene convertito nell'istante UTC
   reale usando il fuso dell'aeroporto, e la durata torna quella vera. */
const TZ_CACHE = {};
function iataOf(v){
  const m = String(v||'').trim().toUpperCase().match(/^([A-Z]{3})\b/);
  return m ? m[1] : '';
}
function tzOf(place){
  const c = iataOf(place);
  return c ? (AIRPORT_TZ[c] || '') : '';
}
// scarto dall'UTC (minuti) di una zona in un dato istante — tiene conto dell'ora legale
function tzOffsetMin(tz, ms){
  const key = tz + '|' + Math.floor(ms/3600000);
  if(TZ_CACHE[key] != null) return TZ_CACHE[key];
  let off = 0;
  try{
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
      .formatToParts(new Date(ms)).forEach(x=>{ p[x.type] = x.value; });
    const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute);
    off = Math.round((asUTC - Math.floor(ms/60000)*60000) / 60000);
  }catch(e){ off = 0; }
  TZ_CACHE[key] = off;
  return off;
}
// istante UTC di un orario "da parete" letto in una certa zona
function zonedTs(iso, hm, tz){
  const [y,m,d]  = iso.split('-').map(Number);
  const [hh,mi]  = String(hm||'00:00').split(':').map(Number);
  const naive = Date.UTC(y, m-1, d, hh||0, mi||0);
  const off1 = tzOffsetMin(tz, naive);
  const ts   = naive - off1*60000;
  const off2 = tzOffsetMin(tz, ts);        // secondo giro: cambio d'ora legale
  return off2===off1 ? ts : naive - off2*60000;
}
function dtOf(dateRaw, timeRaw, place){
  const iso = toISODate(dateRaw);
  if(!iso) return null;
  const hm = toHM(timeRaw) || '00:00';
  const tz = place ? tzOf(place) : '';
  return tz ? new Date(zonedTs(iso, hm, tz)) : new Date(iso+'T'+hm+':00');
}
// differenza di fuso fra due aeroporti in una data (minuti, 0 se ignota)
function tzDiffMin(fromPlace, toPlace, iso){
  const a = tzOf(fromPlace), b = tzOf(toPlace);
  if(!a || !b || a===b) return 0;
  const ms = iso ? Date.parse(iso+'T12:00:00Z') : Date.now();
  return tzOffsetMin(b, ms) - tzOffsetMin(a, ms);
}
function fmtTzDiff(m){
  if(!m) return '';
  const a = Math.abs(m), h = Math.floor(a/60), mm = a%60;
  return (m>0?'+':'−') + h + (mm?':'+String(mm).padStart(2,'0'):'') + 'h';
}
// aeroporti citati di cui non conosciamo il fuso (per avvisare invece di mentire)
function tzUnknown(places){
  const out = [];
  (places||[]).forEach(p=>{
    const c = iataOf(p);
    if(String(p||'').trim() && !tzOf(p) && !out.includes(c||String(p).trim())) out.push(c||String(p).trim());
  });
  return out;
}
function minsBetween(a,b){ if(!a||!b) return null; return Math.round((b-a)/60000); }
function fmtDur(m){
  if(m==null || isNaN(m)) return '';
  if(m<0) return '—';
  const h = Math.floor(m/60), mm = m%60;
  return (h?h+'h ':'') + (mm?mm+'m':(h?'':'0m'));
}
function rowArrISO(l){ return toISODate(l.data_arr) || toISODate(l.data_part); }
function legDuration(l){
  return minsBetween(dtOf(l.data_part, l.ora_part, l.da), dtOf(rowArrISO(l), l.ora_arr, l.a));
}
function dirDuration(legs){
  if(!legs || !legs.length) return null;
  const L = legs[legs.length-1];
  return minsBetween(dtOf(legs[0].data_part, legs[0].ora_part, legs[0].da),
                     dtOf(rowArrISO(L), L.ora_arr, L.a));
}
function rowScaloMins(prev, next){
  // stesso aeroporto, quindi stesso fuso: passiamo comunque il codice
  return minsBetween(dtOf(rowArrISO(prev), prev.ora_arr, prev.a),
                     dtOf(next.data_part, next.ora_part, next.da));
}
function dirTzDiff(legs){
  if(!legs || !legs.length) return 0;
  return tzDiffMin(legs[0].da, legs[legs.length-1].a, toISODate(legs[0].data_part));
}
function arrDayShift(l){
  const p = toISODate(l.data_part), a = toISODate(l.data_arr);
  return !!(p && a && a>p);
}

/* ---------- VOLI: sezione ---------- */
let VOLI_VIEW = 'schede';   // 'schede' | 'confronto'
function setVoliView(v){ VOLI_VIEW = v; renderSection('voli'); }

function voliCoverageWarn(groups){
  const chosen = Object.keys(groups).filter(k=>groupChosen(groups[k]));
  if(!chosen.length) return '';
  const covered = {};
  chosen.forEach(k=>groupDirs(groups[k]).forEach(d=>covered[d]=true));
  const missing = DIRS.filter(d=>!covered[d]);
  if(!missing.length) return '';
  return `<div class="mono mt-2" style="font-size:.72rem;color:var(--stamp)">
    ⚠️ nessun ${missing.map(m=>m.toLowerCase()).join(' e ')} selezionato</div>`;
}

function secVoli(rows, tid){
  rows = rows || [];
  const groups = voliGroups(rows);
  const keys = Object.keys(groups).sort((a,b)=>{
    const oa = groupOpz(groups[a]), ob = groupOpz(groups[b]);
    if(oa!==ob) return oa-ob;
    return (groupDirs(groups[a])[0]||'').localeCompare(groupDirs(groups[b])[0]||'');
  });

  const toggle = `
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn ${VOLI_VIEW==='schede'?'btn-ink':'btn-ghost'}" onclick="setVoliView('schede')">Schede</button>
      <button class="btn ${VOLI_VIEW==='confronto'?'btn-ink':'btn-ghost'}" onclick="setVoliView('confronto')">Confronto</button>
    </div>`;

  const header = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">${toggle}
        <span class="mono" style="font-size:.72rem;color:var(--muted)">${keys.length} opzioni · ${rows.length} tratte</span></div>
      <button class="btn btn-stamp btn-sm" onclick="editVolo(null, '${jsArg(tid)}')">+ Aggiungi volo</button>
    </div>`;

  if(!keys.length){
    return header + `<div class="sheet empty"><div class="big">Nessun volo ancora</div>
      <div>Aggiungi un'opzione: di default andata e ritorno insieme.</div></div>`;
  }

  const body = VOLI_VIEW==='confronto'
    ? voliTable(groups, keys)
    : `<div class="row g-3">${keys.map(k=>voloCard(k, groups[k], groups)).join('')}</div>`;

  return header + tripDatesBanner(CURRENT_DATA) + voliCoverageWarn(groups) + body;
}

function dirSummary(d, legs){
  const first = legs[0];
  const dur = fmtDur(dirDuration(legs));
  const scali = legs.length-1;
  const tzd = dirTzDiff(legs);
  const detail = legs.map((l,i)=>{
    const pre = i>0
      ? `<div class="scalo-row">↳ scalo a ${esc(l.da||'?')}${(()=>{const m=rowScaloMins(legs[i-1],l);return m!=null?` · <strong${m<45&&m>=0?' style="color:var(--danger)"':''}>${fmtDur(m)}</strong>`:(l.scalo?` · ${esc(l.scalo)}`:'');})()}</div>`
      : '';
    const ld = fmtDur(legDuration(l));
    return pre + `<div class="leg-row">
      <span class="mono leg-time">${esc(toHM(l.ora_part)||'--:--')}</span>
      <span class="leg-mid"><strong>${esc(l.da||'?')} → ${esc(l.a||'?')}</strong>
        <span class="leg-sub">${esc(l.compagnia||'')} ${esc(l.n_volo||'')}${ld?` · ${ld}`:''}</span></span>
      <span class="mono leg-time arr">${esc(toHM(l.ora_arr)||'--:--')}${arrDayShift(l)?'<sup>+1</sup>':''}</span>
    </div>`;
  }).join('');
  return `<div class="dir-block">
    <div class="dir-head">
      <span>${d==='Ritorno'?'🛬':'🛫'} ${d}${tzd?` <span class="tz-chip" title="A destinazione l'orologio va spostato di ${esc(fmtTzDiff(tzd))}">🕓 ${esc(fmtTzDiff(tzd))}</span>`:''}</span>
      <span class="mono">${toITDate(first.data_part)}${dur?` · ${dur}`:''} · ${scali?scali+' scalo'+(scali>1?'i':''):'diretto'}</span>
    </div>${detail}</div>`;
}

function voloCard(key, legs, groups){
  const pick = groupChosen(legs);
  const kind = groupKind(legs);
  const tot = groupTotal(legs), bigl = groupBiglietti(legs), bag = groupBag(legs), pt = groupPTesta(legs);
  const pnr = groupPnr(legs);
  const mono = groupDirs(legs).length===1;
  const canMerge = mono && Object.keys(groups).some(k2=>{
    if(String(k2)===String(key)) return false;
    const g2 = groups[k2];
    return groupDirs(g2).length===1 && groupDirs(g2)[0]!==groupDirs(legs)[0];
  });
  const bagIncl = legs.some(l=>truthy(l.bagaglio));
  return `<div class="col-12 col-lg-6">
    <div class="sheet p-3 h-100 volo-card${pick?' picked':''}">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div class="d-flex align-items-center gap-1 flex-wrap">
          <span class="chip">opz. ${esc(groupOpz(legs))}</span>
          <span class="chip${kind==='A/R'?'':' pri-cons'}">${esc(kind)}</span>
          ${bagIncl?'<span class="chip" title="bagaglio in stiva incluso nel biglietto">🧳 incluso</span>':''}
          ${pick?'<span class="chip pick">✓ scelto</span>':''}
        </div>
        <div class="text-nowrap">
          ${canMerge?`<button class="icon-btn" title="Abbina con l'altra direzione" onclick="abbinaVolo('${jsArg(key)}')">⇄</button>`:''}
          <button class="icon-btn" title="Duplica opzione" onclick="dupVolo('${jsArg(key)}')">⧉</button>
          <button class="icon-btn" title="Modifica" onclick="editVoloById('${jsArg(key)}')">✎</button>
          <button class="icon-btn" title="Elimina" onclick="delVolo('${jsArg(key)}')">🗑</button>
        </div>
      </div>
      ${pnr?`<div class="mb-2">${codeChip('prenotazione', pnr)}</div>`:''}
      ${groupDirs(legs).map(d=>dirSummary(d, legsOfDir(legs,d))).join('')}
      <div class="d-flex justify-content-between align-items-center mt-2 pt-2" style="border-top:1px solid var(--line)">
        <div>
          <span class="mono" style="font-size:.95rem;font-weight:600">${tot?eur(tot):'—'}</span>
          ${pt?`<span class="per-person ms-2" style="font-size:.8rem">${eur(pt)} a testa</span>`:''}
          ${bag?`<div class="price-split">${eur(bigl)} volo + ${eur(bag)} bagagli</div>`:''}
        </div>
        <button class="btn btn-sm ${pick?'btn-ghost':'btn-stamp'}"
          onclick="chooseVolo('${jsArg(key)}',${pick?'false':'true'})">${pick?'✓ scelto':'Scegli'}</button>
      </div>
    </div></div>`;
}

function voliTable(groups, keys){
  const cellDir = ls => ls.length ? `<div class="mono" style="font-size:.72rem;line-height:1.5">
      ${esc(routeStr(ls))}<br>${toITDate(ls[0].data_part)} ${esc(toHM(ls[0].ora_part))} → ${esc(toHM(ls[ls.length-1].ora_arr))}
      ${(()=>{const dd=fmtDur(dirDuration(ls));return dd?' · '+dd:'';})()} · ${ls.length>1?(ls.length-1)+' scalo':'diretto'}
    </div>` : '<span class="chip">–</span>';
  const body = keys.map(k=>{
    const legs = groups[k], pick = groupChosen(legs);
    return `<tr>
      <td><span class="chip">${esc(groupOpz(legs))}</span></td>
      <td>${cellDir(legsOfDir(legs,'Andata'))}</td>
      <td>${cellDir(legsOfDir(legs,'Ritorno'))}</td>
      <td class="mono">${groupBiglietti(legs)?eur(groupBiglietti(legs)):'—'}</td>
      <td class="mono">${groupBag(legs)?eur(groupBag(legs)):'—'}</td>
      <td class="mono"><strong>${groupTotal(legs)?eur(groupTotal(legs)):'—'}</strong></td>
      <td class="mono per-person">${groupPTesta(legs)?eur(groupPTesta(legs)):'—'}</td>
      <td>${codeChip('cod.', groupPnr(legs))||'<span class="chip">–</span>'}</td>
      <td><button class="btn btn-sm ${pick?'btn-ghost':'btn-stamp'}"
        onclick="chooseVolo('${jsArg(k)}',${pick?'false':'true'})">${pick?'✓':'scegli'}</button></td>
      <td class="text-nowrap">
        <button class="icon-btn" onclick="editVoloById('${jsArg(k)}')">✎</button>
        <button class="icon-btn" onclick="delVolo('${jsArg(k)}')">🗑</button></td>
    </tr>`;
  }).join('');
  return `<div class="sheet p-2 p-md-3 scroll-x"><table class="data">
    <thead><tr><th>opz.</th><th>andata</th><th>ritorno</th><th>volo</th><th>bagagli</th><th>totale</th><th>a testa</th><th>prenot.</th><th>scelta</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ---------- VOLI: azioni rapide ---------- */
async function chooseVolo(key, on){
  const rows = (CURRENT_DATA && CURRENT_DATA.Voli) || [];
  const groups = voliGroups(rows);
  const target = groups[key];
  if(!target) return;
  const dirs = groupDirs(target);
  const before = rows.map(r=>r.scelto);
  rows.forEach(r=>{
    const k = String(r.gruppo_id||r.id);
    if(k===String(key)) r.scelto = on ? 'Sì' : '';
    else if(on && dirs.includes(dirOf(r))) r.scelto = '';
  });
  refreshView();
  try{
    await api('set_scelta', { sheet:'Voli', viaggio_id: CURRENT_TRIP.id, gruppo_id: key, on: !!on });
    toast(on?'Volo scelto ✓':'Scelta rimossa','ok');
  }catch(e){
    rows.forEach((r,i)=>{ r.scelto = before[i]; });
    refreshView();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

async function delVolo(key){
  const legs = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[])[key];
  if(!legs) return;
  if(!await askConfirm('Eliminare questa opzione di volo (tutte le sue tratte)?', true)) return;
  const snapshot = legs.map(l=>Object.assign({}, l));
  try{
    await api('delete_group', { sheet:'Voli', gruppo_id:key, ids: legs.map(l=>l.id) });
    CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).filter(r=>String(r.gruppo_id||r.id)!==String(key));
    refreshView();
    toast('Volo eliminato','ok', { label:'Annulla', fn: async ()=>{
      try{
        const saved = await api('create_many', { sheet:'Voli', records: snapshot });
        CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).concat(saved);
        refreshView(); toast('Ripristinato ✓','ok');
      }catch(err){ toast('Non sono riuscito a ripristinare: '+err.message,'error'); }
    }});
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

const VOLO_COPY_FIELDS = ['viaggio_id','direzione','tratta','persone','paganti','compagnia','n_volo',
  'da','a','data_part','ora_part','data_arr','ora_arr','scalo','totale','costo_bagaglio',
  'prezzo_testa','bagaglio','note','pagato_da'];

async function dupVolo(key){
  const legs = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[])[key];
  if(!legs) return;
  const gid = genGroupId(), opz = nextOpz();
  const records = legs.map(r=>{
    const o = {};
    VOLO_COPY_FIELDS.forEach(f=>{ o[f] = r[f] != null ? r[f] : ''; });
    o.gruppo_id = gid; o.opzione = opz; o.scelto = ''; o.pnr = '';
    return o;
  });
  try{
    const saved = await api('create_many', { sheet:'Voli', records });
    CURRENT_DATA.Voli = (CURRENT_DATA.Voli||[]).concat(saved);
    toast('Opzione duplicata ✓','ok');
    refreshView();

// Unisce due opzioni mono-direzione (utile per i voli inseriti prima della v3)
async function abbinaVolo(key){
  const groups = voliGroups((CURRENT_DATA && CURRENT_DATA.Voli)||[]);
  const legs = groups[key];
  if(!legs) return;
  const myDir = groupDirs(legs)[0];
  const cands = Object.keys(groups).filter(k=>{
    if(String(k)===String(key)) return false;
    const g = groups[k];
    return groupDirs(g).length===1 && groupDirs(g)[0]!==myDir;
  });
  if(!cands.length) return toast('Nessuna opzione compatibile da abbinare','error');
  const btns = cands.slice(0,3).map(k=>({
    label: `opz. ${groupOpz(groups[k])} · ${routeStr(groups[k])}`, value:k, cls:'btn-ink'
  }));
  btns.unshift({label:'Annulla', value:null, cls:'btn-ghost'});
  const pick = await ask(`Unisci questo ${myDir.toLowerCase()} con:`, btns);
  if(!pick) return;
  try{
    await api('merge_groups', { sheet:'Voli', viaggio_id: CURRENT_TRIP.id, gruppo_id: key, source_id: pick });
    const opz = groupOpz(legs);
    legs.forEach(r=>{ r.gruppo_id = String(key); r.opzione = opz; });
    groups[pick].forEach(r=>{ r.gruppo_id = String(key); r.opzione = opz; });
    toast('Opzioni unite ✓','ok');
    refreshView();
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

/* ============================================================
   COSE DA FARE — prima le idee, poi il calendario
   ------------------------------------------------------------

   (cosa è, che tipo, quanto dura, in che fascia oraria ha senso), poi
   si decide QUANDO farla guardando quello che c'è già in agenda.

   Tre viste:
     · Idee       → il taccuino: aggiunta rapida, nessuna data
     · Programma  → solo le cose collocate, giorno per giorno
     · Calendario → il mese, con la striscia delle idee da piazzare
                    (trascina un'idea su un giorno, oppure toccala e poi
                    tocca il giorno: sui telefoni il drag non esiste)

   "✨ Suggerisci" propone giorno e ora incrociando: date del viaggio,
   orari dei voli scelti, buchi liberi della giornata, quanto è già
   carico quel giorno, fascia oraria preferita, luogo e tipo delle
   attività già fissate.
   ============================================================ */

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripHub — Viaggi di gruppo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2317324d'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23d1622a' stroke-width='2' stroke-dasharray='1.5 4' stroke-linecap='round'/%3E%3Cg transform='translate(32 32) rotate(-40) scale(0.62)' fill='%23f2ede1'%3E%3Cpath d='M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#17324d">
<meta name="color-scheme" content="light">
<meta name="description" content="TripHub — organizza viaggi di gruppo: voli, alloggi, budget e attività in un posto solo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TripHub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<!-- preconnect: apre le connessioni ai CDN mentre l'HTML è ancora in parsing -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #17324d;   /* blu inchiostro */
    --ink-soft: #2c4a68;
    --paper:    #f2ede1;   /* carta da mappa */
    --paper-2:  #e7dfcd;
    --stamp:    #d1622a;   /* arancio timbro imbarco */
    --stamp-dk: #b04d1c;
    --line:     #d4c9b2;
    --ok:       #3f7d5c;
    --danger:   #a3341f;
    --muted:    #7a6f5a;
    --card:     #fbf8f0;
    --card-2:   #fdfbf5;
    --shadow:   0 8px 24px -18px rgba(23,50,77,.4);
    --shadow-up:0 14px 30px -20px rgba(23,50,77,.55);
    --radius:   14px;
    --topbar-h: 52px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    margin:0;
    -webkit-text-size-adjust:100%;
    text-rendering:optimizeLegibility;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-wrap:break-word;
    background-image:
      linear-gradient(rgba(23,50,77,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,50,77,.035) 1px, transparent 1px);
    background-size:26px 26px;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'JetBrains Mono',monospace}
  /* --- Topbar --- */
  .topbar{background:var(--ink);color:var(--paper);border-bottom:3px solid var(--stamp);
    position:sticky;top:0;z-index:1035;padding-top:env(safe-area-inset-top)}
  .topbar .brand{
    font-family:'Fraunces',serif;font-weight:700;letter-spacing:.5px;
    font-size:1.35rem;color:var(--paper);text-decoration:none;
    display:flex;align-items:center;gap:.5rem;
  }
  .topbar .mono{color:#b9c6d3;font-size:.72rem}
  .role-badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;
    text-transform:uppercase;background:rgba(255,255,255,.14);color:var(--paper);
    border-radius:20px;padding:.1rem .5rem}
  /* --- Card / passport look --- */
  .sheet{
    background:#fbf8f0;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 0 #fff inset, 0 8px 24px -18px rgba(23,50,77,.4);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.18em;
    font-size:.68rem;color:var(--stamp);font-weight:500;
  }
  /* --- Trip cards --- */
  .trip-card{
    background:#fbf8f0;border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.2rem;cursor:pointer;height:100%;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
    position:relative;overflow:hidden;
  }
  @media (hover:hover){
    .trip-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-up);border-color:var(--stamp)}
  }
  .trip-card:active{transform:translateY(-1px)}
  .trip-card .dest{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;line-height:1.15}
  .trip-card .country{color:var(--muted);font-size:.85rem}
  .stamp{
    position:absolute;top:12px;right:-30px;transform:rotate(12deg);
    background:var(--stamp);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:.62rem;letter-spacing:.15em;padding:3px 34px;text-transform:uppercase;
  }
  .stamp.done{background:var(--ok)}
  .stamp.idea,.stamp.draft{background:var(--muted)}
  .stamp.now{background:var(--stamp)}
  .stamp:not(.done):not(.draft):not(.idea):not(.now){background:var(--ink-soft)}
  .trip-card.past{opacity:.72}
  .trip-card.past:hover{opacity:1}
  /* --- Tabs --- */
  .navtabs-wrap{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top));z-index:1020;
    background:var(--paper);margin:0 -12px;padding:0 12px}
  .navtabs-wrap::after{content:'';position:absolute;right:12px;top:0;bottom:2px;width:28px;pointer-events:none;
    background:linear-gradient(90deg,rgba(242,237,225,0),var(--paper))}
  .navtabs{display:flex;gap:.35rem;flex-wrap:nowrap;overflow-x:auto;border-bottom:2px solid var(--line);padding-bottom:0;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .navtabs::-webkit-scrollbar{display:none}
  .navtabs a{
    text-decoration:none;color:var(--ink-soft);font-weight:500;font-size:.9rem;
    padding:.5rem .85rem;border-radius:8px 8px 0 0;position:relative;top:2px;
    border:2px solid transparent;border-bottom:none;white-space:nowrap;flex:none;
    display:inline-flex;align-items:center;gap:.35rem;transition:color .12s,background .12s;
  }
  .navtabs a:hover{color:var(--stamp)}
  .navtabs a.active{background:var(--card);border-color:var(--line);color:var(--ink);border-bottom:2px solid var(--card)}
  .tab-badge{font-family:'JetBrains Mono',monospace;font-size:.62rem;background:var(--paper-2);
    color:var(--ink-soft);border-radius:20px;padding:.05rem .35rem;line-height:1.4}
  .navtabs a.active .tab-badge{background:var(--paper)}
  .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--stamp);flex:none}
  .t-ico{font-size:.95rem;line-height:1}
  .t-short{display:none}

  /* --- Impaginazione del viaggio: contenuto + navigazione laterale --- */
  .trip-layout{display:flex;gap:1.6rem;align-items:flex-start}
  .trip-main{flex:1;min-width:0}
  .sidenav{display:none}
  .sidenav .sn-grp{margin-bottom:1rem}
  .sidenav a{display:flex;align-items:center;gap:.55rem;padding:.4rem .55rem;margin-bottom:.1rem;
    border-radius:8px;text-decoration:none;color:var(--ink-soft);font-size:.88rem;font-weight:500;
    position:relative;transition:background .12s,color .12s}
  .sidenav a:hover{background:var(--paper-2);color:var(--stamp)}
  .sidenav a.active{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:inset 0 0 0 1px var(--line)}
  .sidenav a.active::before{content:'';position:absolute;left:-6px;top:7px;bottom:7px;width:3px;
    border-radius:2px;background:var(--stamp)}
  .sidenav .sn-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(min-width:992px){
    .sidenav{display:block;flex:0 0 196px;position:sticky;
      top:calc(var(--topbar-h) + env(safe-area-inset-top) + 14px)}
    .navtabs-wrap{display:none}
  }

  /* --- Barra inferiore del telefono --- */
  .bottomnav{display:none}
  .nav-sheet{display:none}
  @media(max-width:640px){
    .navtabs-wrap{display:none}
    #app{padding-bottom:5.6rem !important}
    .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);
      position:fixed;left:0;right:0;bottom:0;z-index:1030;
      background:var(--card);border-top:2px solid var(--line);
      box-shadow:0 -2px 10px rgba(23,50,77,.07);
      padding-bottom:env(safe-area-inset-bottom)}
    .bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:.12rem;min-height:54px;padding:.3rem .1rem;position:relative;
      font-size:.6rem;line-height:1.1;font-weight:500;text-decoration:none;
      color:var(--ink-soft);background:none;border:0;-webkit-tap-highlight-color:transparent}
    .bottomnav a.active,.bottomnav button.active{color:var(--stamp);font-weight:700}
    .bottomnav a.active::before,.bottomnav button.active::before{content:'';position:absolute;
      top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--stamp)}
    .bottomnav .t-ico{font-size:1.2rem}
    .bottomnav .tab-badge{position:absolute;top:3px;right:calc(50% - 1.4rem);font-size:.55rem;
      padding:0 .22rem;border:1px solid var(--card)}
    .bottomnav .tab-dot{position:absolute;top:6px;right:calc(50% - 1.1rem);width:5px;height:5px}

    .nav-sheet{display:block;position:fixed;inset:0;z-index:1040;visibility:hidden}
    .nav-sheet.open{visibility:visible}
    .nav-sheet .backdrop{position:absolute;inset:0;background:rgba(23,50,77,.4);
      opacity:0;transition:opacity .2s}
    .nav-sheet.open .backdrop{opacity:1}
    .nav-sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--card);
      border-top:2px solid var(--line);border-radius:16px 16px 0 0;
      padding:.5rem .7rem calc(.7rem + env(safe-area-inset-bottom));
      transform:translateY(100%);transition:transform .22s ease;max-height:72vh;overflow:auto}
    .nav-sheet.open .panel{transform:translateY(0)}
    .nav-sheet .grabber{width:38px;height:4px;border-radius:2px;background:var(--line);
      margin:.2rem auto .6rem}
    .nav-sheet a{display:flex;align-items:center;gap:.7rem;padding:.7rem .5rem;
      text-decoration:none;color:var(--ink);font-size:.95rem;font-weight:500;
      border-bottom:1px solid var(--line)}
    .nav-sheet a:last-child{border-bottom:0}
    .nav-sheet a.active{color:var(--stamp);font-weight:700}
    .nav-sheet .t-ico{font-size:1.15rem}
  }
  /* --- Table --- */
  table.data{width:100%;border-collapse:collapse;font-size:.88rem}
  table.data th{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:.66rem;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    text-align:left;padding:.55rem .6rem;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  table.data th.sortable{cursor:pointer;user-select:none}
  table.data th.sortable:hover{color:var(--stamp)}
  table.data th .arrow{color:var(--stamp);font-size:.7rem}
  table.data td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  table.data tr:hover td{background:rgba(209,98,42,.05)}
  .chip{display:inline-block;font-size:.7rem;padding:.12rem .5rem;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);font-weight:500}
  .chip.pick{background:var(--ok);color:#fff}
  .chip.pri-ess{background:#c9432e;color:#fff}
  .chip.pri-cons{background:#e0a422;color:#3a2c00}
  .chip.toggle{cursor:pointer;transition:transform .08s ease}
  .chip.toggle:hover{transform:scale(1.08);outline:1px solid var(--stamp)}
  /* codici di prenotazione e di accesso */
  .code-chip{display:inline-flex;align-items:center;gap:.35rem;font-family:'JetBrains Mono',monospace;
    font-size:.74rem;letter-spacing:.06em;background:var(--paper-2);color:var(--ink);
    border:1px dashed var(--line);border-radius:7px;padding:.1rem .45rem;cursor:pointer}
  .code-chip:hover{border-color:var(--stamp);border-style:solid;color:var(--stamp)}
  .code-chip .k{color:var(--muted);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
  /* --- Buttons --- */
  .btn-stamp{background:var(--stamp);border:none;color:#fff;font-weight:600}
  .btn-stamp:hover{background:var(--stamp-dk);color:#fff}
  .btn-ink{background:var(--ink);border:none;color:var(--paper)}
  .btn-ink:hover{background:var(--ink-soft);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-ghost:hover{border-color:var(--stamp);color:var(--stamp)}
  .btn-del{background:var(--danger);border:none;color:#fff;font-weight:600}
  .btn-del:hover{background:#872a18;color:#fff}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:.25rem .4rem;
    border-radius:7px;min-width:32px;min-height:32px;transition:background .12s,color .12s}
  .icon-btn:hover{background:var(--paper-2);color:var(--ink)}
  .icon-btn:active{transform:scale(.94)}
  /* --- Budget --- */
  .budget-total{font-family:'Fraunces',serif;font-weight:700;font-size:2rem;color:var(--ink)}
  .budget-line{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px dashed var(--line)}
  .budget-line .sub{color:var(--muted);font-size:.72rem}
  .per-person{color:var(--stamp);font-weight:600}
  /* --- Gate / login --- */
  .gate{max-width:420px;margin:8vh auto;}
  .gate .sheet{padding:2rem}
  .form-control,.form-select{border-color:var(--line);background:#fdfbf5}
  .form-control:focus,.form-select:focus{border-color:var(--stamp);box-shadow:0 0 0 .2rem rgba(209,98,42,.15)}
  label.form-label{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:.2rem}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .empty .big{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink-soft);margin-bottom:.3rem}
  .spinner-wrap{display:flex;justify-content:center;padding:3rem}
  .toast-mini{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;
    font-size:.85rem;z-index:2000;box-shadow:0 10px 30px -12px rgba(0,0,0,.55);opacity:0;
    transition:opacity .22s ease, transform .22s ease;pointer-events:none;max-width:92vw;
    display:flex;align-items:center;gap:.75rem}
  .toast-mini.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast-mini.err{background:var(--danger)}
  .toast-mini.ok{background:var(--ok)}
  .toast-mini .undo{pointer-events:auto;background:rgba(255,255,255,.16);border:none;color:#fff;
    font-weight:600;font-size:.8rem;border-radius:7px;padding:.2rem .6rem;cursor:pointer;flex:none}
  .toast-mini .undo:hover{background:rgba(255,255,255,.3)}

  /* ==========================================================
     COSA PORTARE — lista di spunta
     ========================================================== */
  .cp-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .cp-ring{flex:none}
  .cp-count{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;line-height:1.2}
  .cp-sub{font-size:.8rem;color:var(--muted)}
  .cp-done-all{color:var(--ok);font-weight:600}

  .cp-cat{margin-bottom:.9rem}
  .cp-cat-head{display:flex;align-items:center;gap:.6rem;width:100%;padding:.3rem .1rem;
    border-bottom:1px solid var(--line)}
  .cp-cat-toggle{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;background:none;
    border:none;text-align:left;padding:.25rem .2rem;cursor:pointer;color:inherit}
  .cp-cat-toggle:hover .cp-cat-name{color:var(--stamp)}
  .cp-cat-ico{font-size:1.1rem;flex:none;width:1.6rem;text-align:center}
  .cp-cat-name{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;flex:1;min-width:0}
  .cp-cat-n{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);flex:none}
  .cp-caret{color:var(--muted);font-size:.7rem;flex:none;transition:transform .15s}
  .cp-cat.closed .cp-caret{transform:rotate(-90deg)}
  .cp-cat.closed .cp-body{display:none}
  .cp-cat-acts{flex:none;display:flex;gap:.1rem}
  .cp-bar{height:3px;border-radius:3px;background:var(--paper-2);overflow:hidden;margin:.25rem 0 .15rem}
  .cp-bar i{display:block;height:100%;background:var(--stamp);border-radius:3px;transition:width .25s ease}
  .cp-bar.full i{background:var(--ok)}

  .cp-row{display:flex;align-items:flex-start;gap:.65rem;padding:.55rem .35rem;cursor:pointer;
    border-bottom:1px solid rgba(212,201,178,.5);transition:opacity .15s,background .12s;
    border-radius:8px;-webkit-tap-highlight-color:transparent;user-select:none}
  .cp-row:last-child{border-bottom:none}
  .cp-row.pri-ess{box-shadow:inset 3px 0 0 -1px #c9432e}
  .cp-row.pri-cons{box-shadow:inset 3px 0 0 -1px #e0a422}
  .cp-row.done{opacity:.5}
  .cp-row.done .cp-name{text-decoration:line-through}
  .cp-row:active{background:rgba(209,98,42,.12)}
  @media (hover:hover){ .cp-row:hover{background:rgba(209,98,42,.06)} }

  .cp-check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    background:var(--card-2);padding:0;position:relative;margin-top:1px;pointer-events:none;
    transition:background .12s,border-color .12s}
  .cp-row:hover .cp-check{border-color:var(--stamp)}
  .cp-check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
  .cp-check[aria-checked="true"]::after{content:'✓';position:absolute;inset:0;color:#fff;
    font-size:.85rem;line-height:22px;text-align:center;font-weight:700}

  .cp-main{flex:1;min-width:0}
  .cp-name{font-size:.95rem;font-weight:500;line-height:1.35}
  .cp-qta{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--stamp);
    background:rgba(209,98,42,.1);border-radius:5px;padding:0 .3rem;margin-left:.3rem}
  .cp-note{font-size:.76rem;color:var(--muted);margin-top:.1rem}
  .cp-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
  .cp-who{font-size:.68rem;background:var(--ink-soft);color:var(--paper);border-radius:20px;padding:.05rem .45rem}
  .cp-acts{flex:none;display:flex;align-items:center;opacity:.55;transition:opacity .12s}
  .cp-row:hover .cp-acts,.cp-acts:focus-within{opacity:1}

  .cp-add{display:flex;gap:.4rem;padding:.45rem .3rem .1rem}
  .cp-add input{border:1px dashed var(--line);background:transparent;border-radius:8px;
    padding:.35rem .6rem;font-size:.85rem;flex:1;min-width:0;color:var(--ink)}
  .cp-add input:focus{outline:none;border-color:var(--stamp);border-style:solid;background:var(--card-2)}
  .cp-add input::placeholder{color:var(--muted);opacity:.8}

  .cp-addbar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
  .cp-addbar .form-select{max-width:190px}
  .cp-addbar .grow{flex:1;min-width:170px}
  .cp-hint{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--muted);margin-top:.35rem}

  .cp-filters{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
  .cp-fil{border:1px solid var(--line);background:var(--card-2);border-radius:20px;
    font-size:.75rem;padding:.15rem .7rem;color:var(--ink-soft);cursor:pointer}
  .cp-fil:hover{border-color:var(--stamp);color:var(--stamp)}
  .cp-fil.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .cp-search{max-width:200px}
  .tpl-card{border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;cursor:pointer;
    background:var(--card-2);height:100%}
  .tpl-card:hover{border-color:var(--stamp)}
  .tpl-card.on{border-color:var(--ok);background:#f1f6f2}
  .tpl-card.disabled{opacity:.5;cursor:not-allowed}
  .tpl-name{font-weight:600;font-size:.9rem}
  .tpl-list{font-size:.72rem;color:var(--muted);line-height:1.35}
  @media(max-width:640px){
    .cp-check{width:30px;height:30px}
    .cp-check[aria-checked="true"]::after{line-height:26px;font-size:.95rem}
    .cp-acts{opacity:1}
    .cp-search{max-width:100%}
  }

  /* --- SCHELETRI DI CARICAMENTO (velocità percepita) --- */
  .sk{background:linear-gradient(90deg,var(--paper-2) 25%,#f0e9d9 37%,var(--paper-2) 63%);
    background-size:400% 100%;animation:skShine 1.3s ease infinite;border-radius:7px;height:.85rem}
  @keyframes skShine{0%{background-position:100% 50%}100%{background-position:0 50%}}

<!-- ============ APP ROOT ============ -->
<main id="app" class="container py-4"></main>
<div id="printDoc" aria-hidden="true"></div>
<div class="toast-mini" id="toast" role="status" aria-live="polite"></div>
<div class="netbar" id="netbar">Sei offline — le modifiche non vengono salvate finché non torna la rete</div>

<script>
/* ============================================================
   CONFIG — l'unica cosa da modificare dopo il deploy dell'API
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxN6Xe9meHwq4GsQtkaHPgtXsvE0Hay_1ocL54XvEiZUPY4GcZ8_I5sRuCdM7yx3u3E/exec";

/* ============================================================
   STATE
   ============================================================ */
let TOKEN = sessionStorage.getItem('triphub_token') || '';
let ROLE  = sessionStorage.getItem('triphub_role')  || '';   // 'admin' | 'trip' | ''
let MY_TRIPS = [];                                           // id dei viaggi consentiti (solo ruolo 'trip')
let CURRENT_TRIP = null;
let CURRENT_DATA = null;
let AUTO_OPENED = false;         // per non rimbalzare sul viaggio unico dopo "torna ai viaggi"
const SORT = {};                 // ordinamento per tab: { sheet: {col, dir} }

const isAdmin = () => ROLE === 'admin';

/* ============================================================
   API LAYER
   ============================================================ */
class AuthError extends Error {}
class NetworkError extends Error {}

async function api(action, payload = {}) {
  setSync('sincronizzo…');
  const body = JSON.stringify({ action, token: TOKEN, ...payload });
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000); // 30s timeout
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      signal: ctrl.signal
    });
  } catch(e) {
    setSync('offline');
    throw new NetworkError(e.name==='AbortError' ? 'timeout: il server non ha risposto' : 'connessione assente');
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); }
  catch(e){ setSync('errore'); throw new NetworkError('risposta non valida dal server'); }
  setSync('pronto');
  if (!data.ok) {
    if (data.error === 'unauthorized') throw new AuthError('unauthorized');
    if (String(data.error).indexOf('forbidden') === 0)
      throw new Error('non hai i permessi per questa operazione con il codice attuale');
    throw new Error(data.error || 'errore sconosciuto');
  }
  return data.data;
}

function sessionExpired(){
  toast('Sessione scaduta — rientra con il codice');
  renderGate('La sessione è scaduta. Reinserisci il codice.');
}

/* ============================================================
   CACHE DI SESSIONE
   Apps Script risponde in 1-3 secondi: tenere in memoria l'ultimo
   payload e ridisegnarlo subito (rivalidando in sottofondo) è ciò
   che cambia di più la sensazione di velocità. La cache conserva
   LO STESSO oggetto usato come CURRENT_DATA, quindi ogni modifica
   ottimistica la aggiorna senza codice extra.
   ============================================================ */
const TRIP_CACHE = new Map();   // viaggio_id -> oggetto "all"
let TRIPS_CACHE = null;         // elenco viaggi
const INFLIGHT = new Map();     // richieste già in volo, per non duplicarle

function cacheTrips(list){ TRIPS_CACHE = list; }
function invalidateTrips(){ TRIPS_CACHE = null; }

// scarica il payload di un viaggio, riusando l'eventuale richiesta già partita
function fetchTrip(id){
  const key = 'all:'+id;
  if(INFLIGHT.has(key)) return INFLIGHT.get(key);
  const pr = api('all', { viaggio_id:id })
    .then(data=>{ TRIP_CACHE.set(String(id), data); return data; })
    .finally(()=>INFLIGHT.delete(key));
  INFLIGHT.set(key, pr);
  return pr;
}

// chiamata al passaggio del mouse/dito su una card: quando clicchi è già pronto
function prefetchTrip(id){
  if(!id || TRIP_CACHE.has(String(id))) return;
  fetchTrip(id).catch(()=>{});
}

/* ============================================================
   STATO LOCALE — dopo ogni salvataggio aggiorniamo i dati in
   memoria e ridisegniamo SOLO la sezione corrente, senza
   rifare l'intera chiamata "all" (l'app diventa molto reattiva)
   ============================================================ */
function findRow(sheet, id){
  return ((CURRENT_DATA && CURRENT_DATA[sheet]) || []).find(r=>String(r.id)===String(id)) || null;
}

function applyLocal(sheet, op, payload){
  if(!CURRENT_DATA) return;
  const arr = CURRENT_DATA[sheet] || (CURRENT_DATA[sheet] = []);
  if(op==='create'){
    arr.push(payload);
  } else if(op==='create_many'){
    payload.forEach(r=>arr.push(r));
  } else if(op==='update'){
    const i = arr.findIndex(r=>String(r.id)===String(payload.id));
    if(i>=0) arr[i] = Object.assign({}, arr[i], payload);
  } else if(op==='delete'){
    const i = arr.findIndex(r=>String(r.id)===String(payload));
    if(i>=0) arr.splice(i,1);
  } else if(op==='delete_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload));
  } else if(op==='replace_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload.gruppo_id)).concat(payload.records);
  }
}

// Sezione attiva dedotta dall'hash
function currentSection(){
  const m = location.hash.match(/^#\/viaggio\/[^/]+\/?([^/]*)/);
  return (m && m[1]) ? m[1] : 'riepilogo';
}

// Ridisegna la vista corrente usando i dati in memoria (nessuna chiamata rete).
function refreshView(){
  if(CURRENT_TRIP && /^#\/viaggio\//.test(location.hash)){
    renderSection(currentSection(), true);
    updateTabBadges();
  } else viewHome();
}

// Ricarica completa dal server (usata dopo import o quando serve)
function reloadCurrent(){
  const h = location.hash;
  const m = h.match(/^#\/viaggio\/([^/]+)(?:\/([^/]+))?$/);
  if(m) viewTrip(m[1], m[2]||'riepilogo'); else viewHome();
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// per stringhe dentro attributi onclick='...' : niente apici, backslash, tag
const jsArg = s => String(s ?? '').replace(/[\\'"<>&]/g,'');
const eur = n => '€ ' + (Number(n) || 0).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => Number(String(n).replace(/[^\d.-]/g,'')) || 0;

function setSync(t){ const e = $('#syncState'); if(e) e.textContent = t; }

function toast(msg, type, action){
  const t = $('#toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  let ms = type==='error' ? 3200 : 1800;
  if(action){
    const b = document.createElement('button');
    b.className = 'undo'; b.type='button'; b.textContent = action.label;
    b.onclick = ()=>{ t.classList.remove('show'); clearTimeout(t._timer); action.fn(); };
    t.appendChild(b);
    ms = 7000;                       // più tempo per accorgersi e annullare
  }
  t.className = 'toast-mini show' + (type==='error'?' err':type==='ok'?' ok':'');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

// copia negli appunti con conferma visiva (usata per PNR, codici, link)
function copyText(txt, msg){
  const done = ()=>toast(msg||'Copiato ✓','ok');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(_){ toast('Impossibile copiare','error'); }
  ta.remove();
}

// chip con codice (prenotazione, accesso): un tocco = copiato
function codeChip(label, value, title){
  if(!String(value||'').trim()) return '';
  return `<span class="code-chip" title="${esc(title||'copia')}" role="button" tabindex="0"
    onclick="copyText('${jsArg(value)}','${jsArg(label)} copiato ✓')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();copyText('${jsArg(value)}','${jsArg(label)} copiato ✓')}"
    ><span class="k">${esc(label)}</span> ${esc(value)} ⧉</span>`;
}

/* ---------- SCHELETRI: struttura finta mentre arrivano i dati ---------- */
function skeletonCards(n){
  const one = `<div class="col-12 col-md-6 col-lg-4"><div class="sk-card">
      <div class="sk mb-2" style="width:32%;height:.6rem"></div>

async function withBtnLoading(btn, label, fn){
  if(!btn) return fn();
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(label||'Attendere…')}`;
  try {
    return await fn();
  } catch(e){
    if(e instanceof AuthError){ sessionExpired(); }
    else { toast('Errore: ' + e.message, 'error'); }
    throw e;
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---------- CONFERME (modal custom al posto di confirm()) ---------- */
let ASK = null;
function ensureAsk(){
  if(ASK) return;
  const el = document.createElement('div');
  el.className='modal fade'; el.id='askModal'; el.tabIndex=-1;
  el.innerHTML = `<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:#fbf8f0;border:1px solid var(--line);border-radius:14px">
      <div class="modal-body" id="askBody" style="font-size:.95rem"></div>
      <div class="modal-footer" id="askFoot" style="border-top:1px solid var(--line)"></div>
    </div></div>`;
  document.body.appendChild(el);
  ASK = { modal:new bootstrap.Modal(el, {backdrop:'static'}), el };
}
// ask(msg, [{label, value, cls}]) → Promise con il value scelto (null se chiuso)
function ask(msg, buttons){
  ensureAsk();
  return new Promise(resolve=>{
    $('#askBody').textContent = msg;
    const foot = $('#askFoot');
    foot.innerHTML = '';
    let resolved = false;
    const done = v => { if(resolved) return; resolved=true; ASK.modal.hide(); resolve(v); };
    buttons.forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (b.cls||'btn-ghost');
      btn.textContent = b.label;
      btn.onclick = ()=>done(b.value);
      foot.appendChild(btn);
    });
    ASK.el.addEventListener('hidden.bs.modal', ()=>done(null), {once:true});
    ASK.modal.show();
  });
}
async function askConfirm(msg, danger){
  const v = await ask(msg, [
    {label:'Annulla', value:false, cls:'btn-ghost'},
    {label: danger?'Elimina':'Conferma', value:true, cls: danger?'btn-del':'btn-stamp'}
  ]);
  return v===true;
}

const ROUTES = [

  { re:/^#\/viaggio\/([^/]+)$/,          fn: (m)=>viewTrip(m[1], 'riepilogo') },
  { re:/^#\/viaggio\/([^/]+)\/([^/]+)$/, fn:(m)=>viewTrip(m[1], m[2]) },

/* ============================================================
   STATO DEL VIAGGIO — dedotto dalle date, salvo stati manuali
   ("idea", "proposta", "annullato") che restano quello che sono.
   ============================================================ */
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const STATI_MANUALI = ['idea','propost','annull','cancell','sospe','forse'];

function tripStato(t){
  const s = String(t.stato||'').toLowerCase().trim();
  if(STATI_MANUALI.some(k=>s.includes(k))) return { txt:s, cls:'draft', hint:'' };

  const oggi = todayISO();
  const a = toISODate(t.data_inizio), b = toISODate(t.data_fine);

  if(b && b < oggi)                      return { txt:'concluso',    cls:'done', hint:'' };
  if(a && b && a<=oggi && oggi<=b)       return { txt:'in corso',    cls:'now',
                                                  hint: b===oggi ? 'ultimo giorno' : `finisce il ${toITDate(b)}` };
  if(a && a > oggi){
    const g = nightsBetween(oggi, a);
    const hint = g===1 ? 'domani' : (g<=400 ? `tra ${g} giorni` : '');
    return { txt:'in programma', cls:'', hint };
  }
  if(a && a === oggi)                    return { txt:'in corso', cls:'now', hint:'si parte oggi' };
  if(s)                                  return { txt:s, cls: s.includes('conclus')||s.includes('fatto') ? 'done' : '', hint:'' };
  return { txt:'senza date', cls:'draft', hint:'' };
}

function tripRank(t){
  const c = tripStato(t).cls;
  return c==='now' ? 0 : c==='done' ? 3 : c==='draft' ? 2 : 1;
}
function tripSort(a,b){
  const ra=tripRank(a), rb=tripRank(b);
  if(ra!==rb) return ra-rb;
  const da=toISODate(a.data_inizio)||'zzz', db=toISODate(b.data_inizio)||'zzz';
  return ra===3 ? db.localeCompare(da) : da.localeCompare(db);   // i conclusi dal più recente
}

/* ============================================================

   Con un codice di viaggio si vede SOLO ciò che quel codice apre:
   il filtro è fatto dal server, qui non arriva nemmeno il resto.
   ============================================================ */
async function viewHome(){
  $('#topbar').style.display = 'block';
  document.title = 'TripHub — Viaggi';
  CURRENT_TRIP = null; CURRENT_DATA = null;

  // se abbiamo già l'elenco lo mostriamo subito, poi lo rivalidiamo in sottofondo
  if(TRIPS_CACHE){
    if(autoOpenSingle(TRIPS_CACHE)) return;
    paintHome(TRIPS_CACHE);
    api('list', { sheet:'Viaggi' }).then(fresh=>{
      if(JSON.stringify(fresh)!==JSON.stringify(TRIPS_CACHE) && location.hash.replace('#','')==='/' ){
        cacheTrips(fresh); paintHome(fresh);
      } else cacheTrips(fresh);
    }).catch(()=>{});
    return;
  }

  $('#app').innerHTML = skeletonCards(3);
  let trips = [];
  try { trips = await api('list', { sheet:'Viaggi' }); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco a caricare i viaggi', e.message, viewHome);
  }
  cacheTrips(trips);
  if(autoOpenSingle(trips)) return;
  paintHome(trips);
}

// Chi entra con il codice di un solo viaggio non ha motivo di vedere una lista
// da un elemento: lo portiamo dentro direttamente (ma solo la prima volta,
// altrimenti "torna ai viaggi" rimbalzerebbe indietro).
function autoOpenSingle(trips){
  if(isAdmin() || AUTO_OPENED || !trips || trips.length!==1) return false;
  AUTO_OPENED = true;
  location.hash = '#/viaggio/'+trips[0].id;
  return true;
}

    const st = tripStato(t);

    <div class="col-12 col-md-6 col-lg-4 trip-col" data-search="${esc(searchKey)}">
      <div class="trip-card${st.cls==='done'?' past':''}" role="link" tabindex="0"

        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='#/viaggio/${jsArg(t.id)}'}"
        onmouseenter="prefetchTrip('${jsArg(t.id)}')" onfocus="prefetchTrip('${jsArg(t.id)}')"
        ontouchstart="prefetchTrip('${jsArg(t.id)}')"
        aria-label="${esc((t.destinazione||t.nome||'viaggio')+' — '+st.txt)}">
        <div class="stamp ${st.cls}">${esc(st.txt)}</div>
        <p class="eyebrow mb-1">${esc(t.paese||'')}</p>
        <div class="dest">${esc(t.destinazione||t.nome||'Senza nome')}</div>

        <div class="mono" style="font-size:.72rem;color:var(--ink-soft)">
          ${t.data_inizio?toITDate(t.data_inizio):'?'} → ${t.data_fine?toITDate(t.data_fine):'?'} · ${esc(t.n_persone||'?')} pers.
        </div>
        ${st.hint?`<div class="mono mt-1" style="font-size:.7rem;color:var(--stamp);font-weight:500">${esc(st.hint)}</div>`:''}
        ${(isAdmin()&&t.codice)?`<div class="mt-2">${codeChip('codice', t.codice, 'codice di accesso del viaggio')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  const search = trips.length>3 ? `
    <input class="form-control form-control-sm search-box" id="tripSearch" type="search"
      placeholder="🔎 cerca viaggio…  (premi /)" aria-label="Cerca tra i viaggi"
      oninput="filterTrips(this.value)">` : '';

  $('#app').innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <div>
        <p class="eyebrow mb-1">I tuoi viaggi</p>
        <h1 style="font-size:1.8rem;margin:0">Viaggi</h1>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        ${search}
        ${isAdmin()?`<button class="btn btn-stamp" onclick="editTrip()">+ Nuovo viaggio</button>`:''}
      </div>
    </div>
    ${trips.length ? `<div class="row g-3" id="tripGrid">${cards}</div>
      <div class="empty" id="noTripMatch" style="display:none"><div class="big">Nessun viaggio trovato</div></div>`
      : `<div class="sheet empty"><div class="big">Nessun viaggio ancora</div>
         ${isAdmin()?`<div>Crea la prima rotta e inizia a organizzare.</div>
         <button class="btn btn-stamp mt-3" onclick="editTrip()">+ Nuovo viaggio</button>`
         :`<div>Il codice che hai usato non è collegato a nessun viaggio attivo.</div>`}</div>`}
  `;
}

function filterTrips(q){
  q = String(q||'').toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.trip-col').forEach(col=>{
    const show = !q || (col.getAttribute('data-search')||'').includes(q);
    col.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const empty = $('#noTripMatch');
  if(empty) empty.style.display = visible ? 'none' : 'block';
}

   VIEW: TRIP (un viaggio, con tab-sezioni)

// [chiave, etichetta estesa, icona, etichetta corta, gruppo, in barra inferiore]
const SECTIONS = [
  ['riepilogo',   'Riepilogo',        '📋','Riepilogo','Il viaggio',   true ],
  ['partecipanti','Partecipanti',     '👥','Persone',  'Il viaggio',   false],
  ['voli',        'Voli',             '✈️','Voli',     'Prenotazioni', true ],
  ['alloggi',     'Alloggi',          '🏠','Alloggi',  'Prenotazioni', true ],
  ['spese',       'Budget & Spese',   '💶','Budget',   'Prenotazioni', false],
  ['cosedafare',  'Cose da fare',     '📅','Da fare',  'Sul posto',    true ],
  ['cosaportare', 'Cosa portare',     '🧳','Valigia',  'Sul posto',    false],
  ['contatti',    'Contatti',         '☎️','Contatti', 'Sul posto',    false],
  ['info',        'Info destinazione','ℹ️','Info',     'Sul posto',    false],
];
const NAV_GROUPS = ['Il viaggio','Prenotazioni','Sul posto'];
const PRIMARY_SECTIONS = SECTIONS.filter(x=>x[5]).map(x=>x[0]);

async function viewTrip(id, section){
  $('#topbar').style.display = 'block';
  // se abbiamo già in memoria QUESTO viaggio, cambia solo tab senza rifetch
  if(CURRENT_TRIP && String(CURRENT_TRIP.id)===String(id) && CURRENT_DATA && $('#section')){
    setActiveTab(section);
    renderSection(section);
    return;
  }
  // cache-first: se il viaggio è già stato aperto (o pre-caricato al passaggio
  // del mouse) compare all'istante, e la rete lavora in sottofondo
  const cached = TRIP_CACHE.get(String(id));
  if(cached && (cached.Viaggi||[])[0]){
    mountTrip(cached, section);
    fetchTrip(id).then(fresh=>{
      const stillHere = CURRENT_TRIP && String(CURRENT_TRIP.id)===String(id);
      const editing = !!document.querySelector('.modal.show');
      if(stillHere && !editing && JSON.stringify(fresh)!==JSON.stringify(cached)){
        mountTrip(fresh, currentSection());
      }
    }).catch(()=>{});
    return;
  }

  $('#app').innerHTML = skeletonTrip();
  let all;
  try { all = await fetchTrip(id); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco ad aprire il viaggio', e.message, ()=>viewTrip(id, section));
  }
  if(!(all.Viaggi||[])[0]){
    $('#app').innerHTML = `<div class="sheet empty"><div class="big">Viaggio non trovato</div>
      <div>Potrebbe non essere accessibile con il codice che stai usando.</div>
      <a href="#/">← torna ai viaggi</a></div>`;
    return;
  }
  mountTrip(all, section);
}

function mountTrip(all, section){
  const trip = (all.Viaggi||[])[0];
  // reset delle viste locali se è cambiato viaggio
  if(!CURRENT_TRIP || CURRENT_TRIP.id !== trip.id){
    CDF_MONTH = null; CDF_VIEW = 'lista'; VOLI_VIEW = 'schede'; ALG_VIEW = 'schede';
    CURRENT_TRIP = trip;
    cpReset();
  }
  CURRENT_TRIP = trip; CURRENT_DATA = all;
  TRIP_CACHE.set(String(trip.id), all);
  document.title = (trip.destinazione||trip.nome||'Viaggio') + ' — TripHub';
  renderTripShell(section);
}

/* Contatori e avvisi sulle linguette */
function tabBadge(k, d){
  const len = a => (a||[]).length;
  if(k==='partecipanti') return { n: len(d.Partecipanti) };
  if(k==='alloggi'){
    const tot = len(d.Alloggi), sel = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).length;
    return { n: tot, warn: tot>0 && !sel };
  }
  if(k==='voli'){
    const g = voliGroups(d.Voli||[]), keys = Object.keys(g);
    const sel = keys.filter(x=>groupChosen(g[x])).length;
    return { n: keys.length, warn: keys.length>0 && !sel };
  }
  if(k==='spese')      return { n: len(d.Spese) };
  if(k==='cosedafare') return { n: len(d.CoseDaFare) };
  if(k==='cosaportare'){
    const rows = d.CosaPortare||[];
    if(!rows.length) return { n:0 };
    const done = rows.filter(r=>truthy(r.spuntato)).length;
    return { n: `${done}/${rows.length}`, done: done===rows.length };
  }
  if(k==='contatti') return { n: len(d.Contatti) };
  if(k==='info')     return { n: len(d.InfoDest) };
  return { n:0 };
}

function tabsHtml(section){
  const id = CURRENT_TRIP.id, d = CURRENT_DATA || {};
  return SECTIONS.map(([k,label,icona,corta])=>{
    const b = tabBadge(k, d);
    const badge = b.n ? `<span class="tab-badge">${esc(b.n)}</span>` : '';
    const dot   = b.warn ? `<span class="tab-dot" title="niente di scelto"></span>` : '';
    const on = k===section;
    return `<a href="#/viaggio/${jsArg(id)}/${k}" data-tab="${k}" class="${on?'active':''}"
      ${on?'aria-current="page"':''} title="${esc(label)}"><span class="t-ico" aria-hidden="true">${icona}</span><span class="t-full">${esc(label)}</span><span class="t-short">${esc(corta)}</span>${badge}${dot}</a>`;
  }).join('');
}

/* La barra laterale del desktop: c'è spazio in larghezza, non in altezza.

// giorni che mancano alla partenza (o al rientro se siamo già in viaggio)
function tripCountdown(t){
  const oggi = todayISO();
  const a = toISODate(t.data_inizio), b = toISODate(t.data_fine);
  if(a && a > oggi){
    const g = nightsBetween(oggi, a);
    return g===1 ? '⏳ si parte domani' : `⏳ ${g} giorni alla partenza`;
  }
  if(a && b && a<=oggi && oggi<=b){
    const g = nightsBetween(oggi, b);
    return g===0 ? '🎒 ultimo giorno' : `🌴 in viaggio · ancora ${g} giorn${g===1?'o':'i'}`;
  }
  return '';
}

function setActiveTab(section){
  const more = $('#navMore');
  if(more) more.classList.toggle('active', !PRIMARY_SECTIONS.includes(section));
  document.querySelectorAll('[data-tab]').forEach(a=>{
    const on = a.getAttribute('data-tab')===section;
    a.classList.toggle('active', on);
    if(on){
      a.setAttribute('aria-current','page');
      // serve solo quando i tab sono una striscia orizzontale (desktop stretto):
      // nella griglia del telefono sono tutti visibili e scrollare farebbe saltare la pagina
      const box = a.parentElement;
      if(box && box.scrollWidth > box.clientWidth + 4 && a.scrollIntoView){
        try{ a.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(_){}
      }
    }
    else a.removeAttribute('aria-current');
  });
}

/* ============================================================
   DATE DEL VIAGGIO — le date iniziali sono indicative: appena
   scegli un volo (o, in mancanza, un alloggio) l'app propone di
   allinearle a quelle reali con un click.
   ============================================================ */
function tripDatesSuggestion(d){
  if(!d) return null;
  let start=null, end=null, src=null;

  const groups = voliGroups(d.Voli||[]);
  Object.keys(groups).forEach(k=>{
    const legs = groups[k];
    if(!groupChosen(legs)) return;
    const A = legsOfDir(legs,'Andata'), R = legsOfDir(legs,'Ritorno');
    if(A.length){ const s = toISODate(A[0].data_part); if(s && (!start || s<start)) start = s; }
    if(R.length){ const e = rowArrISO(R[R.length-1]); if(e && (!end || e>end)) end = e; }
  });
  if(start||end) src = 'i voli scelti';

  if(!start && !end){
    (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
      const s = toISODate(a.checkin), e = toISODate(a.checkout);
      if(s && (!start || s<start)) start = s;
      if(e && (!end   || e>end))   end   = e;
    });
    if(start||end) src = 'gli alloggi scelti';
  }
  if(!start && !end) return null;

  const t  = (d.Viaggi||[])[0] || {};
  const cs = toISODate(t.data_inizio), ce = toISODate(t.data_fine);
  const S  = start || cs, E = end || ce;
  return { start:S, end:E, src, diff: (S && S!==cs) || (E && E!==ce) };
}

function tripDatesBanner(d){
  const s = tripDatesSuggestion(d);
  if(!s || !s.diff) return '';
  const t = (d.Viaggi||[])[0] || {};
  return `<div class="sheet p-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2"
      style="border-color:#e0a98f;background:#fdf1ea">
    <div style="font-size:.85rem">📅 Il viaggio è segnato
      <span class="mono">${toITDate(t.data_inizio)||'?'} → ${toITDate(t.data_fine)||'?'}</span>,
      ma ${esc(s.src)} dicono <strong class="mono">${toITDate(s.start)} → ${toITDate(s.end)}</strong></div>
    <button class="btn btn-stamp btn-sm" onclick="alignTripDates('${jsArg(s.start)}','${jsArg(s.end)}')">Allinea le date</button>
  </div>`;
}

// mostrato accanto al titolo finché non c'è un volo scelto a confermare le date
function tripDatesChip(d){
  const groups = voliGroups(d.Voli||[]);
  const chosen = Object.keys(groups).filter(k=>groupChosen(groups[k]));
  if(!chosen.length) return '<span class="chip ms-1" title="nessun volo scelto: le date possono ancora cambiare">date indicative</span>';
  const dirs = {};
  chosen.forEach(k=>groupDirs(groups[k]).forEach(x=>dirs[x]=true));
  if(!dirs.Andata || !dirs.Ritorno) return '<span class="chip ms-1">date parziali</span>';
  return '<span class="chip pick ms-1" title="date confermate dai voli scelti">✓ da volo</span>';
}

async function alignTripDates(start, end){
  if(!CURRENT_TRIP) return;
  const prev = { data_inizio: CURRENT_TRIP.data_inizio, data_fine: CURRENT_TRIP.data_fine };
  const out  = { id: CURRENT_TRIP.id, data_inizio: start, data_fine: end };
  Object.assign(CURRENT_TRIP, out);
  if(CURRENT_DATA && CURRENT_DATA.Viaggi && CURRENT_DATA.Viaggi[0]) Object.assign(CURRENT_DATA.Viaggi[0], out);
  renderTripShell(currentSection());
  try{
    await api('update', { sheet:'Viaggi', record: out });
    invalidateTrips();
    toast('Date del viaggio aggiornate ✓','ok');
  }catch(e){
    Object.assign(CURRENT_TRIP, prev);
    if(CURRENT_DATA && CURRENT_DATA.Viaggi && CURRENT_DATA.Viaggi[0]) Object.assign(CURRENT_DATA.Viaggi[0], prev);
    renderTripShell(currentSection());
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

/* ---------- PARTECIPANTI: helper condivisi ---------- */
function pName(p){ return [p.nome, p.cognome].filter(Boolean).join(' ').trim() || '(senza nome)'; }
function partList(d){ return (d.Partecipanti||[]).slice().sort((a,b)=>pName(a).localeCompare(pName(b),'it')); }
function tripPeople(d){
  const n = (d.Partecipanti||[]).length;
  return n>0 ? n : (num(d.Viaggi && d.Viaggi[0] && d.Viaggi[0].n_persone) || 1);
}
function payerNames(paganti, allNames){
  const s = String(paganti||'').trim();
  if(!s || s.toLowerCase()==='tutti') return allNames.slice();
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function payerCount(paganti, totalPeople, allNames){
  if(!String(paganti||'').trim() || String(paganti).toLowerCase()==='tutti') return totalPeople;
  const n = payerNames(paganti, allNames).length;
  return n>0 ? n : totalPeople;
}

/* ---------- RIEPILOGO + BUDGET (calcolato) ----------
   Nota v4: il costo di un volo è ora "biglietto + bagagli".
   Il budget somma sempre i due addendi, così i totali restano
   corretti anche sui voli inseriti prima di questa versione
   (dove costo_bagaglio è semplicemente vuoto).                */
function computeBudget(d){
  const alloggio = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).reduce((s,a)=>s+num(a.totale),0);
  const voliRows = (d.Voli||[]).filter(v=>truthy(v.scelto));
  const voliBiglietti = voliRows.reduce((s,v)=>s+num(v.totale),0);
  const voliBagagli   = voliRows.reduce((s,v)=>s+num(v.costo_bagaglio),0);
  const voli  = voliBiglietti + voliBagagli;
  const spese = (d.Spese||[]).reduce((s,x)=>s+num(x.totale),0);
  const tot = alloggio + voli + spese;
  const pers = tripPeople(d);
  return { alloggio, voli, voliBiglietti, voliBagagli, spese, tot, pers, perPersona: tot/pers };
}

function computeBalances(d){
  const people = partList(d);
  const allNames = people.map(pName);
  if(!allNames.length) return null;
  const bal = {}; allNames.forEach(n=>bal[n]=0);
  const nAll = allNames.length;
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
    const q = num(a.totale)/nAll;
    allNames.forEach(n=>bal[n]+=q);
  });
  (d.Voli||[]).filter(v=>truthy(v.scelto)).forEach(v=>{
    const names = payerNames(v.paganti, allNames);
    const q = (num(v.totale)+num(v.costo_bagaglio))/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  (d.Spese||[]).forEach(x=>{
    const names = payerNames(x.paganti, allNames);
    const q = num(x.totale)/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  return allNames.map(n=>({ nome:n, quota: round2(bal[n]) }));
}

function truthy(v){ const s = String(v).toLowerCase().trim(); return ['sì','si','true','1','x','yes','✓'].includes(s); }

  const s = toISODate(scadenzaISO), f = toISODate(fineViaggioISO);
  if(!s || !f) return false;
  return s < f;
}
function maskDoc(v){
  const s = String(v||'').trim();
  if(!s) return '';
  if(s.length<=4) return '••••';
  return '••••'+s.slice(-4);
}

const LABELS = {

  n_volo:'n° volo', ora_part:'orario', ora:'orario',

  codice:'codice di accesso',
  stato:'stato — lascia vuoto per calcolarlo dalle date'
};
const lbl = k => LABELS[k] || k.replace(/_/g,' ');

// I bool con toggle rapido (click sul chip = cambia e salva)
const QUICK_TOGGLE = ['scelto','confermata','spuntato','prenotazione_req'];
// Colonne non ordinabili (link, azioni)
const NO_SORT = ['link'];

function sortVal(col, v){
  if(DATE_FIELDS.includes(col)) return toISODate(v) || '';
  if(TIME_FIELDS.includes(col)) return toHM(v) || '';
  if(NUM_FIELDS.includes(col) || CUR_FIELDS.includes(col)) return num(v);
  if(BOOL_FIELDS.includes(col)) return truthy(v) ? 1 : 0;
  return String(v||'').toLowerCase();
}

function sortedRows(sheet, rows, cols){
  const s = SORT[sheet];
  if(!s || !cols.includes(s.col)) return rows;
  const dir = s.dir==='desc' ? -1 : 1;
  return rows.slice().sort((a,b)=>{
    const va = sortVal(s.col, a[s.col]), vb = sortVal(s.col, b[s.col]);
    if(va<vb) return -1*dir;
    if(va>vb) return  1*dir;
    return 0;
  });
}

function sortBy(sheet, col){
  const s = SORT[sheet];
  if(s && s.col===col) s.dir = (s.dir==='asc'?'desc':'asc');
  else SORT[sheet] = { col, dir:'asc' };
  refreshView();
}

function thSortable(sheet, col){
  if(NO_SORT.includes(col)) return `<th>${esc(lbl(col))}</th>`;
  const s = SORT[sheet];
  const arrow = (s && s.col===col) ? `<span class="arrow">${s.dir==='asc'?'▲':'▼'}</span>` : '';
  return `<th class="sortable" onclick="sortBy('${jsArg(sheet)}','${jsArg(col)}')">${esc(lbl(col))} ${arrow}</th>`;
}

function secTable(sheet, rows, tid){
  rows = rows || [];
  const cols = COLS[sheet] || Object.keys((rows[0]||{})).filter(k=>k!=='id'&&k!=='viaggio_id');
  rows = sortedRows(sheet, rows, cols);
  const head = cols.map(c=>thSortable(sheet,c)).join('') + '<th></th>';
  const body = rows.map(r=>{
    const tds = cols.map(c=>`<td>${cell(sheet,c,r[c],r.id)}</td>`).join('');
    return `<tr>${tds}<td class="text-nowrap">
        <button class="icon-btn" title="Modifica" onclick="editRowById('${jsArg(sheet)}','${jsArg(r.id)}')">✎</button>
        <button class="icon-btn" title="Elimina" onclick="delRow('${jsArg(sheet)}','${jsArg(r.id)}')">🗑</button>
      </td></tr>`;
  }).join('');
  return `
    <div class="d-flex justify-content-between align-items-center mb-2">
      <p class="eyebrow mb-0">${rows.length} voci</p>
      <button class="btn btn-stamp btn-sm" onclick="editRow('${jsArg(sheet)}', null, '${jsArg(tid)}')">+ Aggiungi</button>
    </div>
    <div class="sheet p-2 p-md-3 scroll-x">
      ${rows.length ? `<table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
        : `<div class="empty"><div class="big">Ancora niente qui</div><div>Aggiungi la prima voce.</div></div>`}
    </div>`;
}

function cell(sheet, col, val, rowId){
  if(BOOL_FIELDS.includes(col)){
    const on = truthy(val);
    const toggleAttr = QUICK_TOGGLE.includes(col) && rowId
      ? ` onclick="toggleBool('${jsArg(sheet)}','${jsArg(rowId)}','${jsArg(col)}',event)"`
        + ` onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleBool('${jsArg(sheet)}','${jsArg(rowId)}','${jsArg(col)}',event)}"`
        + ` role="button" tabindex="0" aria-pressed="${on?'true':'false'}" title="clicca per cambiare"` : '';
    const cls = toggleAttr ? ' toggle' : '';
    if(col==='scelto' && on) return `<span class="chip pick${cls}"${toggleAttr}>✓ scelto</span>`;
    return on ? `<span class="chip pick${cls}"${toggleAttr}>✓</span>` : `<span class="chip${cls}"${toggleAttr}>–</span>`;
  }
  if(col==='priorita'){
    const s=String(val).toLowerCase();
    if(s.includes('essenz')) return `<span class="chip pri-ess">${esc(val)}</span>`;
    if(s.includes('consig')) return `<span class="chip pri-cons">${esc(val)}</span>`;
    return esc(val);
  }
  if(col==='telefono'){
    const v = String(val||'').trim();
    return telHref(v) ? `<a href="${esc(telHref(v))}">${esc(v)}</a>` : (v ? esc(v) : '<span class="chip">–</span>');
  }
  if(col==='pnr') return codeChip('cod.', val) || '<span class="chip">–</span>';
  if(CUR_FIELDS.includes(col)) return `<span class="mono">${eur(val)}</span>`;
  if(DATE_FIELDS.includes(col)) return `<span class="mono">${toITDate(val)}</span>`;
  if(TIME_FIELDS.includes(col)) return `<span class="mono">${esc(toHM(val))}</span>`;
  if(LINK_FIELDS.includes(col)) return linkCell(val);
  if(col==='valutazione'){ const n=num(val); return n?('★'.repeat(Math.min(5,Math.round(n)))):esc(val); }
  return esc(val);
}

function paintBoolChip(el, sheet, col, on){
  if(!el) return;
  el.className = 'chip toggle' + (on ? ' pick' : '');
  el.textContent = (col==='scelto' && on) ? '✓ scelto' : (on ? '✓' : '–');
  el.setAttribute('aria-pressed', on ? 'true' : 'false');
}

async function toggleBool(sheet, id, field, ev){
  if(ev) ev.stopPropagation();
  const r = findRow(sheet, id);
  if(!r) return;
  const el = ev && ev.currentTarget;
  const prev = r[field];
  const next = truthy(prev) ? '' : 'Sì';
  r[field] = next;

  const heavy = (field === 'scelto');
  if(heavy) refreshView(); else { paintBoolChip(el, sheet, field, truthy(next)); updateTabBadges(); }

  try {
    await api('update', { sheet, record: { id, viaggio_id: r.viaggio_id, [field]: next } });
  } catch(e){
    r[field] = prev;
    if(heavy) refreshView(); else { paintBoolChip(el, sheet, field, truthy(prev)); updateTabBadges(); }
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore: '+e.message,'error');
  }
}

function linkCell(url){
  url = String(url||'').trim();
  if(!url) return '<span class="chip">–</span>';
  const safe = esc(url);
  return `<span class="d-inline-flex gap-1">
    <a class="link-btn" href="${safe}" target="_blank" rel="noopener" title="${safe}">🔗 apri</a>
    <button class="link-btn" type="button" title="Copia link" onclick="copyLink(this,'${safe.replace(/'/g,"\\'")}')">⧉</button>
  </span>`;
}

function copyLink(btn, url){
  copyText(url, 'Link copiato ✓');
  const t = btn.textContent; btn.textContent='✓';
  setTimeout(()=>btn.textContent=t, 1200);
}

/* ============================================================
   ALLOGGI
   Le notti derivano da check-in/check-out; la scelta è esclusiva
   solo tra opzioni che si SOVRAPPONGONO nelle date, così un
   viaggio con due basi diverse resta gestibile.
   ============================================================ */
let ALG_VIEW = 'schede';   // 'schede' | 'confronto'
function setAlgView(v){ ALG_VIEW = v; renderSection('alloggi'); }

function nightsBetween(a,b){
  const A=toISODate(a), B=toISODate(b);
  if(!A||!B) return 0;
  const n = Math.round((new Date(B+'T12:00:00') - new Date(A+'T12:00:00'))/86400000);
  return n>0 ? n : 0;
}
function nightList(a,b){
  const A=toISODate(a), B=toISODate(b), out=[];
  if(!A||!B) return out;
  let cur=A, guard=0;
  while(cur<B && guard++<400){ out.push(cur); cur=isoAddDays(cur,1); }
  return out;
}
function rangesOverlap(a1,a2,b1,b2){
  const A1=toISODate(a1),A2=toISODate(a2),B1=toISODate(b1),B2=toISODate(b2);
  if(!A1||!A2||!B1||!B2) return true;      // senza date: trattale come alternative
  return A1 < B2 && B1 < A2;
}
function algNights(a){ return Math.round(num(a.notti)) || nightsBetween(a.checkin,a.checkout); }
function algOutOfRange(a){
  const s=toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio), e=toISODate(CURRENT_TRIP && CURRENT_TRIP.data_fine);
  const ci=toISODate(a.checkin), co=toISODate(a.checkout);
  if(!s||!e||!ci||!co) return false;
  return ci<s || co>e;
}
// notti del viaggio non coperte da nessun alloggio scelto
function alloggiGaps(d){
  const t=(d.Viaggi||[])[0]||{};
  const all=nightList(t.data_inizio, t.data_fine);
  if(!all.length) return [];
  const cov={};
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>nightList(a.checkin,a.checkout).forEach(n=>cov[n]=true));
  return all.filter(n=>!cov[n]);
}
function groupRanges(isoList){
  const out=[];
  isoList.forEach(iso=>{
    const last=out[out.length-1];
    if(last && isoAddDays(last.to,1)===iso) last.to=iso;
    else out.push({from:iso,to:iso});
  });
  return out;
}
function gapsText(gaps){
  return groupRanges(gaps).map(r=> r.from===r.to
    ? `notte del ${toITDate(r.from)}`
    : `${toITDate(r.from)} → ${toITDate(isoAddDays(r.to,1))}`).join(' · ');
}
function starsView(v){
  const n=Math.min(5,Math.round(num(v)));
  if(!n) return '';
  return `<span class="stars-view">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`;
}
function mapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(q||'')); }
function isUrl(v){ return /^https?:\/\//i.test(String(v||'').trim()); }

/* Il pulsante mappa accetta due mondi:
   - un indirizzo scritto a mano  → costruiamo la ricerca su Google Maps
   - il link del tasto "Condividi" di Maps (anche maps.app.goo.gl) → lo apriamo così com'è,
     che è l'unico modo di puntare esattamente al posto giusto quando la via è ambigua. */
function mapsHref(a){
  const l = String((a && a.mappa_link) || '').trim();
  if(isUrl(l)) return l;
  const q = l || (a && a.indirizzo) || (a && a.struttura) || '';
  return q ? mapsUrl(q) : '';
}

const ALG_COLS = ['struttura','checkin','checkout','notti','totale','prezzo_testa','prezzo_testa_notte','valutazione'];

function secAlloggi(rows, tid){
  rows = rows || [];
  const sorted = sortedRows('Alloggi', rows, ALG_COLS);
  const gaps = alloggiGaps(CURRENT_DATA);
  const nSel = rows.filter(a=>truthy(a.scelto)).length;

  const warn = (gaps.length && nSel) ? `
    <div class="sheet p-2 px-3 mb-3" style="border-color:#e0a98f;background:#fdf1ea;font-size:.85rem">
      🛏 Notti senza alloggio: <strong>${esc(gapsText(gaps))}</strong>
    </div>` : '';

  const toggle = `
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn ${ALG_VIEW==='schede'?'btn-ink':'btn-ghost'}" onclick="setAlgView('schede')">Schede</button>
      <button class="btn ${ALG_VIEW==='confronto'?'btn-ink':'btn-ghost'}" onclick="setAlgView('confronto')">Confronto</button>
    </div>`;

  const header = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">${toggle}
        <span class="mono" style="font-size:.72rem;color:var(--muted)">${rows.length} opzioni · ${nSel} scelt${nSel===1?'a':'e'}</span></div>
      <button class="btn btn-stamp btn-sm" onclick="editAlloggio(null, '${jsArg(tid)}')">+ Aggiungi alloggio</button>
    </div>`;

  if(!rows.length){
    return header + `<div class="sheet empty"><div class="big">Nessun alloggio ancora</div>
      <div>Aggiungi la prima opzione: date e prezzi si compilano quasi da soli.</div></div>`;
  }

  const body = ALG_VIEW==='confronto'
    ? alloggiTable(sorted)
    : `<div class="row g-3">${sorted.map(a=>alloggioCard(a)).join('')}</div>`;

  return header + tripDatesBanner(CURRENT_DATA) + warn + body;
}

function alloggioCard(a){
  const pick = truthy(a.scelto);
  const n = algNights(a);

/* ---------- ALLOGGI: azioni rapide ---------- */
function algCompeting(a, rows){
  return (rows||[]).filter(r=>String(r.id)!==String(a.id)
    && truthy(r.scelto) && rangesOverlap(a.checkin,a.checkout,r.checkin,r.checkout));
}

async function chooseAlloggio(id, on){
  const rows = (CURRENT_DATA && CURRENT_DATA.Alloggi) || [];
  const a = rows.find(r=>String(r.id)===String(id));
  if(!a) return;
  const before = rows.map(r=>r.scelto);
  const values = [{ id:a.id, value: on?'Sì':'' }];
  a.scelto = on ? 'Sì' : '';
  if(on) algCompeting(a, rows).forEach(r=>{ r.scelto=''; values.push({id:r.id, value:''}); });
  refreshView();
  try{
    await api('set_flags', { sheet:'Alloggi', field:'scelto', values });
    toast(on?'Alloggio scelto ✓':'Scelta rimossa','ok');
  }catch(e){
    rows.forEach((r,i)=>{ r.scelto = before[i]; });
    refreshView();
    if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error');
  }
}

const ALG_COPY_FIELDS = ['viaggio_id','struttura','checkin','ora_checkin','checkout','ora_checkout',
  'notti','persone','prezzo_notte','extra','totale','prezzo_testa','prezzo_testa_notte',
  'link','indirizzo','mappa_link','posizione','valutazione','note'];

async function dupAlloggio(id){
  const a = findRow('Alloggi', id);
  if(!a) return;
  const rec = {};
  ALG_COPY_FIELDS.forEach(f=>{ rec[f] = a[f] != null ? a[f] : ''; });
  rec.struttura = (a.struttura||'Alloggio') + ' (copia)';
  rec.scelto = ''; rec.pnr = '';
  try{
    const saved = await api('create', { sheet:'Alloggi', record:rec });
    applyLocal('Alloggi','create', saved);

    refreshView();

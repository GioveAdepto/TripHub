<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripHub — Viaggi di gruppo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2317324d'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23d1622a' stroke-width='2' stroke-dasharray='1.5 4' stroke-linecap='round'/%3E%3Cg transform='translate(32 32) rotate(-40) scale(0.62)' fill='%23f2ede1'%3E%3Cpath d='M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #17324d;   /* blu inchiostro */
    --ink-soft: #2c4a68;
    --paper:    #f2ede1;   /* carta da mappa */
    --paper-2:  #e7dfcd;
    --stamp:    #d1622a;   /* arancio timbro imbarco */
    --stamp-dk: #b04d1c;
    --line:     #d4c9b2;
    --ok:       #3f7d5c;
    --danger:   #a3341f;
    --muted:    #7a6f5a;
  }
  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    margin:0;
    background-image:
      linear-gradient(rgba(23,50,77,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,50,77,.035) 1px, transparent 1px);
    background-size:26px 26px;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'JetBrains Mono',monospace}
  /* --- Topbar --- */
  .topbar{background:var(--ink);color:var(--paper);border-bottom:3px solid var(--stamp)}
  .topbar .brand{
    font-family:'Fraunces',serif;font-weight:700;letter-spacing:.5px;
    font-size:1.35rem;color:var(--paper);text-decoration:none;
    display:flex;align-items:center;gap:.5rem;
  }
  .topbar .mono{color:#b9c6d3;font-size:.72rem}
  /* --- Card / passport look --- */
  .sheet{
    background:#fbf8f0;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 0 #fff inset, 0 8px 24px -18px rgba(23,50,77,.4);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.18em;
    font-size:.68rem;color:var(--stamp);font-weight:500;
  }
  /* --- Trip cards --- */
  .trip-card{
    background:#fbf8f0;border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.2rem;cursor:pointer;height:100%;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
    position:relative;overflow:hidden;
  }
  .trip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(23,50,77,.55);border-color:var(--stamp)}
  .trip-card .dest{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;line-height:1.15}
  .trip-card .country{color:var(--muted);font-size:.85rem}
  .stamp{
    position:absolute;top:12px;right:-30px;transform:rotate(12deg);
    background:var(--stamp);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:.62rem;letter-spacing:.15em;padding:3px 34px;text-transform:uppercase;
  }
  .stamp.done{background:var(--ok)}
  .stamp.idea{background:var(--ink-soft)}
  /* --- Tabs --- */
  .navtabs{display:flex;gap:.35rem;flex-wrap:nowrap;overflow-x:auto;border-bottom:2px solid var(--line);padding-bottom:0;
    scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .navtabs a{
    text-decoration:none;color:var(--ink-soft);font-weight:500;font-size:.9rem;
    padding:.5rem .85rem;border-radius:8px 8px 0 0;position:relative;top:2px;
    border:2px solid transparent;border-bottom:none;white-space:nowrap;flex:none;
  }
  .navtabs a.active{background:#fbf8f0;border-color:var(--line);color:var(--ink);border-bottom:2px solid #fbf8f0}
  /* --- Table --- */
  table.data{width:100%;border-collapse:collapse;font-size:.88rem}
  table.data th{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:.66rem;
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    text-align:left;padding:.55rem .6rem;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  table.data th.sortable{cursor:pointer;user-select:none}
  table.data th.sortable:hover{color:var(--stamp)}
  table.data th .arrow{color:var(--stamp);font-size:.7rem}
  table.data td{padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  table.data tr:hover td{background:rgba(209,98,42,.05)}
  table.data tr.picked td{background:rgba(63,125,92,.09)}
  .chip{display:inline-block;font-size:.7rem;padding:.12rem .5rem;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);font-weight:500}
  .chip.pick{background:var(--ok);color:#fff}
  .chip.dir{background:var(--ink);color:var(--paper)}
  .chip.pri-ess{background:#c9432e;color:#fff}
  .chip.pri-cons{background:#e0a422;color:#3a2c00}
  .chip.toggle{cursor:pointer;transition:transform .08s ease}
  .chip.toggle:hover{transform:scale(1.08);outline:1px solid var(--stamp)}
  /* --- Buttons --- */
  .btn-stamp{background:var(--stamp);border:none;color:#fff;font-weight:600}
  .btn-stamp:hover{background:var(--stamp-dk);color:#fff}
  .btn-ink{background:var(--ink);border:none;color:var(--paper)}
  .btn-ink:hover{background:var(--ink-soft);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
  .btn-ghost:hover{border-color:var(--stamp);color:var(--stamp)}
  .btn-ok{background:var(--ok);border:none;color:#fff;font-weight:600}
  .btn-ok:hover{background:#33654a;color:#fff}
  .btn-del{background:var(--danger);border:none;color:#fff;font-weight:600}
  .btn-del:hover{background:#872a18;color:#fff}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:.15rem .35rem;border-radius:6px}
  .icon-btn:hover{background:var(--paper-2);color:var(--ink)}
  /* --- Budget --- */
  .budget-total{font-family:'Fraunces',serif;font-weight:700;font-size:2rem;color:var(--ink)}
  .budget-line{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px dashed var(--line)}
  .per-person{color:var(--stamp);font-weight:600}
  /* --- Gate / login --- */
  .gate{max-width:420px;margin:8vh auto;}
  .gate .sheet{padding:2rem}
  .form-control,.form-select{border-color:var(--line);background:#fdfbf5}
  .form-control:focus,.form-select:focus{border-color:var(--stamp);box-shadow:0 0 0 .2rem rgba(209,98,42,.15)}
  label.form-label{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:.2rem}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .empty .big{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ink-soft);margin-bottom:.3rem}
  .spinner-wrap{display:flex;justify-content:center;padding:3rem}
  .toast-mini{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;
    font-size:.85rem;z-index:2000;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast-mini.show{opacity:1}
  .toast-mini.err{background:var(--danger)}
  .toast-mini.ok{background:var(--ok)}
  /* overlay caricamento globale */
  .load-overlay{position:fixed;inset:0;background:rgba(242,237,225,.7);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1900;flex-direction:column;gap:.8rem}
  .load-overlay .mono{color:var(--ink-soft);font-size:.8rem;letter-spacing:.05em}
  /* link icona */
  .link-btn{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);background:#fdfbf5;
    border-radius:7px;padding:.15rem .5rem;font-size:.78rem;color:var(--ink-soft);text-decoration:none;cursor:pointer}
  .link-btn:hover{border-color:var(--stamp);color:var(--stamp)}
  a{color:var(--stamp)}
  /* --- Voli --- */
  .volo-card{position:relative}
  .volo-card.picked{border-color:var(--ok);border-width:2px;box-shadow:0 10px 26px -20px rgba(63,125,92,.9)}
  .dirrow{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem 0;border-top:1px dashed var(--line)}
  .dirrow:first-of-type{border-top:none}
  .route{font-weight:600;font-size:.95rem}
  .route .arrow{color:var(--stamp);margin:0 .25rem}
  .dirtag{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);min-width:56px;padding-top:.15rem;flex:none}
  .derived{background:var(--paper-2);border:1px dashed var(--line);border-radius:.375rem;
    padding:.375rem .75rem;font-size:.9rem;color:var(--ink-soft);min-height:38px;display:flex;align-items:center}
  .legbox{background:#fdfbf5;border:1px solid var(--line);border-radius:10px}
  .legbox + .legbox{margin-top:.5rem}
  .errbox{background:#fdf1ea;border:1px solid #e0a98f;border-radius:10px;padding:.6rem .8rem;font-size:.82rem;color:var(--danger)}
  .warnline{font-size:.72rem;color:#8a6a1f}
  /* calendario cose da fare */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-head{margin-bottom:4px}
  .cal-dow{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.66rem;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);padding:.2rem 0}
  .cal-cell{min-height:76px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:#fdfbf5;overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.in-trip{background:#fff5e9;border-color:#f0cba3}
  .cal-num{font-size:.72rem;font-weight:600;color:var(--ink-soft);margin-bottom:2px}
  .cal-ev{font-size:.64rem;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 4px;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal-ev:hover{background:var(--stamp)}
  .cal-more{font-size:.62rem;color:var(--stamp);font-weight:600}
  /* ricerca home */
  .search-box{max-width:280px}
  @media(max-width:640px){
    .cal-cell{min-height:58px}
    .cal-ev{font-size:.56rem}
    .cal-dow{font-size:.58rem}
    .search-box{max-width:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<div class="topbar py-2" id="topbar" style="display:none">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="#/" class="brand">
      <svg width="26" height="26" viewBox="0 0 64 64" style="flex:none">
        <circle cx="32" cy="32" r="30" fill="none" stroke="var(--stamp)" stroke-width="3"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="var(--paper)" stroke-width="1.5" stroke-dasharray="1.5 4" stroke-linecap="round" opacity="0.6"/>
        <g transform="translate(32 32) rotate(-40) scale(0.62)" fill="var(--paper)">
          <path d="M 0 -30 C 3 -30 4.5 -24 4.5 -16 L 4.5 -8 L 30 6 L 30 12 L 4.5 4 L 4.5 16 L 12 22 L 12 26 L 0 22 L -12 26 L -12 22 L -4.5 16 L -4.5 4 L -30 12 L -30 6 L -4.5 -8 L -4.5 -16 C -4.5 -24 -3 -30 0 -30 Z"/>
        </g>
      </svg> TripHub</a>
    <div class="d-flex align-items-center gap-2">
      <span class="mono d-none d-sm-inline" id="syncState">pronto</span>
      <div class="dropdown">
        <button class="btn btn-sm btn-ghost dropdown-toggle" data-bs-toggle="dropdown">⋯</button>
        <ul class="dropdown-menu dropdown-menu-end" style="background:#fbf8f0;border-color:var(--line)">
          <li><button class="dropdown-item" onclick="doExport()">⬇︎ Esporta backup (JSON)</button></li>
          <li><button class="dropdown-item" onclick="document.getElementById('importFile').click()">⬆︎ Importa backup…</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" onclick="logout()">Esci</button></li>
        </ul>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">
    </div>
  </div>
</div>

<!-- ============ APP ROOT ============ -->
<div id="app" class="container py-4"></div>
<div class="toast-mini" id="toast"></div>

<script>
/* ============================================================
   CONFIG — l'unica cosa da modificare dopo il deploy dell'API
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxN6Xe9meHwq4GsQtkaHPgtXsvE0Hay_1ocL54XvEiZUPY4GcZ8_I5sRuCdM7yx3u3E/exec";

/* ============================================================
   STATE
   ============================================================ */
let TOKEN = sessionStorage.getItem('triphub_token') || '';
let CURRENT_TRIP = null;
let CURRENT_DATA = null;
const SORT = {};                 // ordinamento per tab: { sheet: {col, dir} }

/* ============================================================
   API LAYER
   ============================================================ */
class AuthError extends Error {}
class NetworkError extends Error {}

async function api(action, payload = {}) {
  setSync('sincronizzo…');
  const body = JSON.stringify({ action, token: TOKEN, ...payload });
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000); // 30s timeout
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      signal: ctrl.signal
    });
  } catch(e) {
    setSync('offline');
    throw new NetworkError(e.name==='AbortError' ? 'timeout: il server non ha risposto' : 'connessione assente');
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); }
  catch(e){ setSync('errore'); throw new NetworkError('risposta non valida dal server'); }
  setSync('pronto');
  if (!data.ok) {
    if (data.error === 'unauthorized') throw new AuthError('unauthorized');
    throw new Error(data.error || 'errore sconosciuto');
  }
  return data.data;
}

function sessionExpired(){
  toast('Sessione scaduta — rientra con il codice');
  renderGate('La sessione è scaduta. Reinserisci il codice del gruppo.');
}

/* ============================================================
   STATO LOCALE — dopo ogni salvataggio aggiorniamo i dati in
   memoria e ridisegniamo SOLO la sezione corrente, senza
   rifare l'intera chiamata "all" (l'app diventa molto reattiva)
   ============================================================ */
function findRow(sheet, id){
  return ((CURRENT_DATA && CURRENT_DATA[sheet]) || []).find(r=>String(r.id)===String(id)) || null;
}

function applyLocal(sheet, op, payload){
  if(!CURRENT_DATA) return;
  const arr = CURRENT_DATA[sheet] || (CURRENT_DATA[sheet] = []);
  if(op==='create'){
    arr.push(payload);
  } else if(op==='create_many'){
    payload.forEach(r=>arr.push(r));
  } else if(op==='update'){
    const i = arr.findIndex(r=>String(r.id)===String(payload.id));
    if(i>=0) arr[i] = Object.assign({}, arr[i], payload);
  } else if(op==='delete'){
    const i = arr.findIndex(r=>String(r.id)===String(payload));
    if(i>=0) arr.splice(i,1);
  } else if(op==='delete_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload));
  } else if(op==='replace_group'){
    CURRENT_DATA[sheet] = arr.filter(r=>String(r.gruppo_id||r.id)!==String(payload.gruppo_id)).concat(payload.records);
  }
}

// Sezione attiva dedotta dall'hash
function currentSection(){
  const m = location.hash.match(/^#\/viaggio\/[^/]+\/?([^/]*)/);
  return (m && m[1]) ? m[1] : 'riepilogo';
}

// Ridisegna la vista corrente usando i dati in memoria (nessuna chiamata rete)
function refreshView(){
  if(CURRENT_TRIP && /^#\/viaggio\//.test(location.hash)) renderSection(currentSection());
  else viewHome();
}

// Ricarica completa dal server (usata dopo import o quando serve)
function reloadCurrent(){
  const h = location.hash;
  const m = h.match(/^#\/viaggio\/([^/]+)(?:\/([^/]+))?$/);
  if(m) viewTrip(m[1], m[2]||'riepilogo'); else viewHome();
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// per stringhe dentro attributi onclick='...' : niente apici, backslash, tag
const jsArg = s => String(s ?? '').replace(/[\\'"<>&]/g,'');
const eur = n => '€ ' + (Number(n) || 0).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => Number(String(n).replace(/[^\d.-]/g,'')) || 0;

function setSync(t){ const e = $('#syncState'); if(e) e.textContent = t; }

function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast-mini show' + (type==='error'?' err':type==='ok'?' ok':'');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), type==='error'?3200:1800);
}

function spinner(msg){
  return `<div class="spinner-wrap"><div class="text-center">
    <div class="spinner-border" style="color:var(--stamp)"></div>
    ${msg?`<div class="mono mt-2" style="font-size:.72rem;color:var(--muted)">${esc(msg)}</div>`:''}
  </div></div>`;
}

function renderError(titolo, dettaglio, retryFn){
  $('#app').innerHTML = `
    <div class="sheet empty" style="max-width:480px;margin:8vh auto">
      <div class="big">⚠️ ${esc(titolo)}</div>
      <div class="mono mb-3" style="font-size:.78rem;color:var(--muted)">${esc(dettaglio||'')}</div>
      <button class="btn btn-stamp" id="retryBtn">Riprova</button>
    </div>`;
  if(retryFn) $('#retryBtn').onclick = ()=>retryFn();
}

async function withBtnLoading(btn, label, fn){
  if(!btn) return fn();
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(label||'Attendere…')}`;
  try {
    return await fn();
  } catch(e){
    if(e instanceof AuthError){ sessionExpired(); }
    else { toast('Errore: ' + e.message, 'error'); }
    throw e;
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---------- CONFERME (modal custom al posto di confirm()) ---------- */
let ASK = null;
function ensureAsk(){
  if(ASK) return;
  const el = document.createElement('div');
  el.className='modal fade'; el.id='askModal'; el.tabIndex=-1;
  el.innerHTML = `<div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="background:#fbf8f0;border:1px solid var(--line);border-radius:14px">
      <div class="modal-body" id="askBody" style="font-size:.95rem"></div>
      <div class="modal-footer" id="askFoot" style="border-top:1px solid var(--line)"></div>
    </div></div>`;
  document.body.appendChild(el);
  ASK = { modal:new bootstrap.Modal(el, {backdrop:'static'}), el };
}
// ask(msg, [{label, value, cls}]) → Promise con il value scelto (null se chiuso)
function ask(msg, buttons){
  ensureAsk();
  return new Promise(resolve=>{
    $('#askBody').textContent = msg;
    const foot = $('#askFoot');
    foot.innerHTML = '';
    let resolved = false;
    const done = v => { if(resolved) return; resolved=true; ASK.modal.hide(); resolve(v); };
    buttons.forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (b.cls||'btn-ghost');
      btn.textContent = b.label;
      btn.onclick = ()=>done(b.value);
      foot.appendChild(btn);
    });
    ASK.el.addEventListener('hidden.bs.modal', ()=>done(null), {once:true});
    ASK.modal.show();
  });
}
async function askConfirm(msg, danger){
  const v = await ask(msg, [
    {label:'Annulla', value:false, cls:'btn-ghost'},
    {label: danger?'Elimina':'Conferma', value:true, cls: danger?'btn-del':'btn-stamp'}
  ]);
  return v===true;
}

/* ============================================================
   AUTH GATE
   ============================================================ */
function renderGate(err){
  $('#topbar').style.display = 'none';
  $('#app').innerHTML = `
    <div class="gate">
      <div class="text-center mb-4">
        <svg width="150" height="150" viewBox="0 0 240 240" style="max-width:45vw">
          <circle cx="120" cy="120" r="92" fill="none" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="120" cy="120" r="80" fill="none" stroke="var(--stamp)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
          <path id="logoTop" d="M 120 40 m -66 0 a 66 66 0 0 1 132 0" fill="none"/>
          <path id="logoBot" d="M 120 200 m 66 0 a 66 66 0 0 1 -132 0" fill="none"/>
          <text font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" letter-spacing="4" fill="var(--ink)">
            <textPath href="#logoTop" startOffset="50%" text-anchor="middle">TRIP • HUB</textPath>
          </text>

async function doLogin(){
  TOKEN = $('#tokenInput').value.trim();
  if(!TOKEN){ return renderGate('Serve il codice.'); }
  try {
    await withBtnLoading($('#loginBtn'), 'Verifico…', ()=>api('list', { sheet:'Viaggi' }));
    sessionStorage.setItem('triphub_token', TOKEN);
    location.hash = '#/';
    boot();
  } catch(e){
    TOKEN = '';
    if(!(e instanceof AuthError) && !(e instanceof NetworkError)) renderGate('Codice non valido.');
    else if(e instanceof AuthError) renderGate('Codice non valido.');
    // NetworkError: withBtnLoading ha già mostrato il toast, resta sul gate
  }
}

function logout(){
  sessionStorage.removeItem('triphub_token'); TOKEN='';
  CURRENT_TRIP = null; CURRENT_DATA = null;
  location.hash = '#/'; renderGate();
}

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = [
  { re:/^#\/$/,                          fn: viewHome },
  { re:/^#\/viaggio\/([^/]+)$/,          fn: (m)=>viewTrip(m[1], 'riepilogo') },
  { re:/^#\/viaggio\/([^/]+)\/([^/]+)$/, fn:(m)=>viewTrip(m[1], m[2]) },
];
async function route(){
  if(!TOKEN){ return renderGate(); }
  const h = location.hash || '#/';
  for(const r of ROUTES){ const m = h.match(r.re); if(m){ return r.fn(m); } }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);

function filterTrips(q){
  q = String(q||'').toLowerCase().trim();

  });
  const empty = $('#noTripMatch');
  if(empty) empty.style.display = visible ? 'none' : 'block';
}

async function viewTrip(id, section){
  $('#topbar').style.display = 'block';
  // se abbiamo già in memoria QUESTO viaggio, cambia solo tab senza rifetch
  if(CURRENT_TRIP && String(CURRENT_TRIP.id)===String(id) && CURRENT_DATA && $('#section')){
    setActiveTab(section);
    renderSection(section);
    return;
  }
  $('#app').innerHTML = spinner('carico il viaggio…');
  let all;
  try { all = await api('all', { viaggio_id: id }); }
  catch(e){
    if(e instanceof AuthError) return renderGate('La sessione è scaduta. Reinserisci il codice.');
    return renderError('Non riesco a caricare il viaggio', e.message, ()=>viewTrip(id, section));
  }
  const trip = (all.Viaggi||[])[0];

/* ---------- PARTECIPANTI: helper condivisi ---------- */
function pName(p){ return [p.nome, p.cognome].filter(Boolean).join(' ').trim() || '(senza nome)'; }
function partList(d){ return (d.Partecipanti||[]).slice().sort((a,b)=>pName(a).localeCompare(pName(b),'it')); }
function tripPeople(d){
  const n = (d.Partecipanti||[]).length;
  return n>0 ? n : (num(d.Viaggi?.[0]?.n_persone) || 1);
}
function payerNames(paganti, allNames){
  const s = String(paganti||'').trim();
  if(!s || s.toLowerCase()==='tutti') return allNames.slice();
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function payerCount(paganti, totalPeople, allNames){
  if(!String(paganti||'').trim() || String(paganti).toLowerCase()==='tutti') return totalPeople;
  const n = payerNames(paganti, allNames).length;
  return n>0 ? n : totalPeople;
}

/* ---------- RIEPILOGO + BUDGET (calcolato) ---------- */
function computeBudget(d){
  const alloggio = (d.Alloggi||[]).filter(a=>truthy(a.scelto)).reduce((s,a)=>s+num(a.totale),0);
  const voli     = (d.Voli||[]).filter(v=>truthy(v.scelto)).reduce((s,v)=>s+num(v.totale),0);
  const spese    = (d.Spese||[]).reduce((s,x)=>s+num(x.totale),0);
  const tot = alloggio + voli + spese;
  const pers = tripPeople(d);
  return { alloggio, voli, spese, tot, pers, perPersona: tot/pers };
}

function computeBalances(d){
  const people = partList(d);
  const allNames = people.map(pName);
  if(!allNames.length) return null;
  const bal = {}; allNames.forEach(n=>bal[n]=0);
  const nAll = allNames.length;
  (d.Alloggi||[]).filter(a=>truthy(a.scelto)).forEach(a=>{
    const q = num(a.totale)/nAll;
    allNames.forEach(n=>bal[n]+=q);
  });
  (d.Voli||[]).filter(v=>truthy(v.scelto)).forEach(v=>{
    if(!num(v.totale)) return;
    const names = payerNames(v.paganti, allNames);
    const q = num(v.totale)/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  (d.Spese||[]).forEach(x=>{
    const names = payerNames(x.paganti, allNames);
    const q = num(x.totale)/(names.length||nAll);
    (names.length?names:allNames).forEach(n=>{ if(n in bal) bal[n]+=q; });
  });
  return allNames.map(n=>({ nome:n, quota: round2(bal[n]) }));
}

function truthy(v){ const s = String(v).toLowerCase().trim(); return ['sì','si','true','1','x','yes','✓'].includes(s); }

      </div>

      <div class="sheet p-4 h-100">
        <p class="eyebrow mb-2">Dettagli viaggio</p>

// Blocco voli del riepilogo: mostra le opzioni scelte e avvisa se manca una direzione
function riepVoli(d){
  const groups = voliGroups((d.Voli||[]).filter(v=>truthy(v.scelto)));
  const keys = Object.keys(groups);
  if(!keys.length){
    return `<div class="mono" style="font-size:.8rem;color:var(--muted)">
      Nessun volo scelto — premi <strong>Scegli</strong> su un'opzione nel tab Voli.</div>`;
  }
  const covered = new Set();
  const blocks = keys.map(k=>{
    const legs = groups[k];
    groupDirs(legs).forEach(x=>covered.add(x));
    const a = legsOf(legs,'andata'), r = legsOf(legs,'ritorno');
    const tot = groupTotal(legs), pt = groupPT(legs, d);
    return `<div class="mb-2">
      <div class="d-flex justify-content-between align-items-baseline">
        <span style="font-weight:600">Opzione ${esc(legs[0].opzione||'')}</span>
        <span class="mono" style="font-size:.82rem">${tot?eur(tot):''}${pt?` · <span class="per-person">${eur(pt)} a testa</span>`:''}</span>
      </div>
      ${a.length?riepDirLine('Andata',a):''}
      ${r.length?riepDirLine('Ritorno',r):''}
    </div>`;
  }).join('');
  const missing = ['andata','ritorno'].filter(x=>!covered.has(x));
  const warn = missing.length===1 ? `<div class="warnline mt-1">⚠️ manca la scelta del volo di ${missing[0]}</div>` : '';
  return blocks + warn;
}

function riepDirLine(label, legs){
  const first = legs[0], last = legs[legs.length-1];
  const scali = legs.length-1;
  return `<div class="mono" style="font-size:.78rem;color:var(--ink-soft)">
    <span class="dirtag">${esc(label)}</span>
    ${esc(first.da||'?')} → ${esc(last.a||'?')} · ${toITDate(first.data_part)} ${esc(toHM(first.ora_part))}
    ${scali?` · ${scali} scalo${scali>1?'i':''}`:' · diretto'}
  </div>`;
}

/* ---------- PARTECIPANTI (anagrafica viaggiatori) ---------- */
function docScade(scadenzaISO, fineViaggioISO){
  const s = toISODate(scadenzaISO), f = toISODate(fineViaggioISO);
  if(!s || !f) return false;
  return s < f;
}
function maskDoc(v){
  const s = String(v||'').trim();
  if(!s) return '';
  if(s.length<=4) return '••••';
  return '••••'+s.slice(-4);
}

function secPartecipanti(rows, tid){
  rows = (rows||[]).slice().sort((a,b)=>pName(a).localeCompare(pName(b),'it'));
  const fine = CURRENT_TRIP?.data_fine;
  const cards = rows.map(p=>{
    const scade = docScade(p.scadenza_doc, fine);
    return `
    <div class="col-12 col-md-6">
      <div class="sheet p-3 h-100">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div style="font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem">${esc(pName(p))}</div>
            ${p.data_nascita?`<div class="mono" style="font-size:.75rem;color:var(--ink-soft)">${toITDate(p.data_nascita)}${p.luogo_nascita?' · '+esc(p.luogo_nascita):''}</div>`:''}
          </div>
          <div class="text-nowrap">
            <button class="icon-btn" onclick="editRowById('Partecipanti','${jsArg(p.id)}')">✎</button>
            <button class="icon-btn" onclick="delRow('Partecipanti','${jsArg(p.id)}')">🗑</button>
          </div>
        </div>
        <div class="mt-2" style="font-size:.82rem">
          ${p.tipo_doc||p.num_doc?`<div class="d-flex align-items-center gap-2 mb-1">
            <span class="chip">${esc(p.tipo_doc||'documento')}</span>
            ${p.num_doc?`<span class="mono" data-doc="${esc(p.num_doc)}">${esc(maskDoc(p.num_doc))}</span>
              <button class="link-btn" type="button" onclick="revealDoc(this)">mostra</button>`:''}
          </div>`:''}
          ${p.scadenza_doc?`<div class="mono" style="font-size:.78rem;${scade?'color:var(--danger);font-weight:600':'color:var(--ink-soft)'}">
            scad. ${toITDate(p.scadenza_doc)} ${scade?'⚠️ scade prima/durante il viaggio':''}</div>`:''}
          ${p.nazionalita?`<div style="font-size:.78rem;color:var(--muted)">${esc(p.nazionalita)}</div>`:''}
          ${p.cod_fiscale?`<div class="d-flex align-items-center gap-2 mt-1">
            <span class="mono" style="font-size:.72rem" data-doc="${esc(p.cod_fiscale)}">${esc(maskDoc(p.cod_fiscale))}</span>
            <button class="link-btn" type="button" onclick="revealDoc(this)">mostra</button></div>`:''}
          ${(p.telefono||p.email)?`<div style="font-size:.78rem;color:var(--ink-soft);margin-top:.3rem">
            ${p.telefono?esc(p.telefono):''}${p.telefono&&p.email?' · ':''}${p.email?esc(p.email):''}</div>`:''}
          ${p.note?`<div style="font-size:.76rem;color:var(--muted);margin-top:.3rem">${esc(p.note)}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  const anyScade = rows.some(p=>docScade(p.scadenza_doc, fine));
  const alertScad = anyScade ? `
    <div class="sheet p-3 mb-3" style="border-color:#e0a98f;background:#fdf1ea">
      ⚠️ <strong>Attenzione:</strong> uno o più documenti scadono prima o durante il viaggio. Controlla i rinnovi.
    </div>` : '';

  return `
    <div class="sheet p-3 mb-3" style="border-color:#d9cfa8;background:#fbf6e3">
      🔒 <strong>Dati sensibili.</strong> Questa sezione contiene documenti personali. I numeri sono mascherati
      di default; chiunque abbia il codice del gruppo può comunque vederli. Condividi il codice solo con i partecipanti.

};
const lbl = k => LABELS[k] || k.replace(/_/g,' ');

// I bool con toggle rapido (click sul chip = cambia e salva)
const QUICK_TOGGLE = ['scelto','confermata','spuntato','prenotazione_req'];
// Colonne non ordinabili (link, azioni)
const NO_SORT = ['link'];

function sortVal(col, v){
  if(DATE_FIELDS.includes(col)) return toISODate(v) || '';
  if(TIME_FIELDS.includes(col)) return toHM(v) || '';
  if(NUM_FIELDS.includes(col) || CUR_FIELDS.includes(col)) return num(v);
  if(BOOL_FIELDS.includes(col)) return truthy(v) ? 1 : 0;
  return String(v||'').toLowerCase();
}

function sortedRows(sheet, rows, cols){
  const s = SORT[sheet];
  if(!s || !cols.includes(s.col)) return rows;
  const dir = s.dir==='desc' ? -1 : 1;
  return rows.slice().sort((a,b)=>{
    const va = sortVal(s.col, a[s.col]), vb = sortVal(s.col, b[s.col]);
    if(va<vb) return -1*dir;
    if(va>vb) return  1*dir;
    return 0;
  });
}

function sortBy(sheet, col){
  const s = SORT[sheet];
  if(s && s.col===col) s.dir = (s.dir==='asc'?'desc':'asc');
  else SORT[sheet] = { col, dir:'asc' };
  refreshView();
}

function thSortable(sheet, col){
  if(NO_SORT.includes(col)) return `<th>${esc(lbl(col))}</th>`;
  const s = SORT[sheet];
  const arrow = (s && s.col===col) ? `<span class="arrow">${s.dir==='asc'?'▲':'▼'}</span>` : '';
  return `<th class="sortable" onclick="sortBy('${jsArg(sheet)}','${jsArg(col)}')">${esc(lbl(col))} ${arrow}</th>`;
}

function secTable(sheet, rows, tid){
  rows = rows || [];
  const cols = COLS[sheet] || Object.keys((rows[0]||{})).filter(k=>k!=='id'&&k!=='viaggio_id');
  rows = sortedRows(sheet, rows, cols);
  const head = cols.map(c=>thSortable(sheet,c)).join('') + '<th></th>';
  const body = rows.map(r=>{

  return `
    <div class="d-flex justify-content-between align-items-center mb-2">

      <button class="btn btn-stamp btn-sm" onclick="editRow('${jsArg(sheet)}', null, '${jsArg(tid)}')">+ Aggiungi</button>
    </div>

      ${rows.length ? `<table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
        : `<div class="empty"><div class="big">Ancora niente qui</div><div>Aggiungi la prima voce.</div></div>`}
    </div>`;
}

function cell(sheet, col, val, rowId){
  if(BOOL_FIELDS.includes(col)){
    const on = truthy(val);
    const toggleAttr = QUICK_TOGGLE.includes(col) && rowId
      ? ` onclick="toggleBool('${jsArg(sheet)}','${jsArg(rowId)}','${jsArg(col)}',event)" title="clicca per cambiare"` : '';
    const cls = toggleAttr ? ' toggle' : '';
    if(col==='scelto' && on) return `<span class="chip pick${cls}"${toggleAttr}>✓ scelto</span>`;
    return on ? `<span class="chip pick${cls}"${toggleAttr}>✓</span>` : `<span class="chip${cls}"${toggleAttr}>–</span>`;
  }
  if(col==='priorita'){
    const s=String(val).toLowerCase();
    if(s.includes('essenz')) return `<span class="chip pri-ess">${esc(val)}</span>`;
    if(s.includes('consig')) return `<span class="chip pri-cons">${esc(val)}</span>`;
    return esc(val);
  }
  if(CUR_FIELDS.includes(col)) return `<span class="mono">${eur(val)}</span>`;
  if(DATE_FIELDS.includes(col)) return `<span class="mono">${toITDate(val)}</span>`;
  if(TIME_FIELDS.includes(col)) return `<span class="mono">${esc(toHM(val))}</span>`;
  if(LINK_FIELDS.includes(col)) return linkCell(val);
  if(col==='valutazione'){ const n=num(val); return n?('★'.repeat(Math.min(5,Math.round(n)))):esc(val); }
  return esc(val);
}

// Toggle rapido di un booleano: salva subito, aggiorna in locale (ottimistico)
async function toggleBool(sheet, id, field, ev){
  if(ev) ev.stopPropagation();
  const r = findRow(sheet, id);
  if(!r) return;
  const prev = r[field];
  const next = truthy(prev) ? '' : 'Sì';
  r[field] = next;                 // ottimistico: UI subito aggiornata
  refreshView();
  try {
    await api('update', { sheet, record: { id, viaggio_id: r.viaggio_id, [field]: next } });

  } catch(e){
    r[field] = prev;               // rollback
    refreshView();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore: '+e.message,'error');
  }
}

/* ============================================================
   VOLI
   ------------------------------------------------------------
   MODELLO: gruppo_id identifica un'OPZIONE COMPLETA, che può
   contenere sia le tratte di andata sia quelle di ritorno.
   Il totale dell'opzione è la SOMMA dei "totale" delle sue righe:
   - prezzo unico A/R  → valorizzato solo sulla 1ª tratta andata
   - prezzi separati   → valorizzato sulla 1ª tratta di ognuna
   Così il riepilogo somma e basta, senza casi speciali.
   ============================================================ */
let VOLI_VIEW = 'schede';   // 'schede' | 'confronto'

const DIR_RANK = { andata:0, ritorno:1 };
function dirKeyOf(r){ return String(r.direzione||'').toLowerCase().trim(); }
function dirRank(r){ const k=dirKeyOf(r); return (k in DIR_RANK) ? DIR_RANK[k] : 2; }
function legsOf(legs, dir){ return legs.filter(l=>dirKeyOf(l)===dir); }
function groupDirs(legs){ return [...new Set(legs.map(dirKeyOf).filter(Boolean))]; }
function groupTotal(legs){ return legs.reduce((s,l)=>s+num(l.totale),0); }
function groupPT(legs, d){
  const explicit = legs.reduce((s,l)=>s+num(l.prezzo_testa),0);
  if(explicit) return round2(explicit);
  const tot = groupTotal(legs);
  if(!tot) return 0;
  const names = partList(d||CURRENT_DATA).map(pName);
  const n = payerCount(legs[0].paganti, tripPeople(d||CURRENT_DATA), names);
  return n ? round2(tot/n) : 0;
}
function groupScali(legs){
  return Math.max(0, legsOf(legs,'andata').length-1) + Math.max(0, legsOf(legs,'ritorno').length-1);
}

function voliGroups(rows){
  const g = {};
  (rows||[]).forEach(r=>{
    const k = r.gruppo_id || r.id;
    (g[k] ??= []).push(r);
  });
  Object.values(g).forEach(arr=>arr.sort((a,b)=>dirRank(a)-dirRank(b) || num(a.tratta)-num(b.tratta)));
  return g;
}

function voliKeysSorted(groups){
  return Object.keys(groups).sort((a,b)=>{
    const A=groups[a][0], B=groups[b][0];
    return num(A.opzione)-num(B.opzione) || String(A.direzione||'').localeCompare(String(B.direzione||''));
  });
}

function secVoli(rows, tid){
  rows = rows || [];

  const keys = voliKeysSorted(groups);
  const toggle = `
    <div class="btn-group btn-group-sm" role="group">

    </div>`;
  const header = `

      <div class="d-flex align-items-center gap-2">${toggle}
        <span class="mono" style="font-size:.72rem;color:var(--muted)">${keys.length} opzion${keys.length===1?'e':'i'} · ${rows.length} tratte</span></div>
      <button class="btn btn-stamp btn-sm" onclick="editVolo(null, '${jsArg(tid)}')">+ Nuova opzione</button>

}

function setVoliView(v){ VOLI_VIEW = v; renderSection('voli'); }

function voliCards(groups, keys){
  const cards = keys.map(k=>{
    const legs = groups[k];
    const head = legs[0];
    const pick = truthy(head.scelto);
    const dirs = groupDirs(legs);
    const isAR = dirs.length>1;
    const a = legsOf(legs,'andata'), r = legsOf(legs,'ritorno');
    const altre = a.length&&r.length ? [] : legs.filter(l=>!dirKeyOf(l)||!(dirKeyOf(l) in DIR_RANK));
    const tot = groupTotal(legs), pt = groupPT(legs);
    const tipo = isAR ? 'andata e ritorno'
              : (a.length ? 'solo andata' : r.length ? 'solo ritorno' : 'volo');
    return `
      <div class="col-12 col-lg-6">
        <div class="sheet volo-card p-3 h-100 ${pick?'picked':''}">
          <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
            <div class="d-flex align-items-center gap-1 flex-wrap">
              <span class="chip dir">opz. ${esc(head.opzione||'?')}</span>
              <span class="chip">${tipo}</span>
              ${pick?'<span class="chip pick">✓ scelto</span>':''}
            </div>
            <div class="text-nowrap" style="flex:none">
              <button class="icon-btn" title="Modifica" onclick="editVoloById('${jsArg(k)}')">✎</button>
              <button class="icon-btn" title="Duplica opzione" onclick="dupVolo('${jsArg(k)}')">⧉</button>
              ${!isAR?`<button class="icon-btn" title="Abbina a un'altra opzione" onclick="abbinaVolo('${jsArg(k)}')">⇄</button>`:''}
              <button class="icon-btn" title="Elimina" onclick="delVolo('${jsArg(k)}')">🗑</button>
            </div>
          </div>
          ${a.length?voloDirRow('Andata',a):''}
          ${r.length?voloDirRow('Ritorno',r):''}
          ${altre.length?voloDirRow('Tratte',altre):''}
          <div class="d-flex justify-content-between align-items-center mt-2 pt-2 gap-2" style="border-top:1px solid var(--line)">
            <button class="btn btn-sm ${pick?'btn-ok':'btn-ghost'}" onclick="toggleScelta('${jsArg(k)}')">
              ${pick?'✓ Scelto':'Scegli'}</button>
            <span class="text-end">
              <span class="mono" style="font-size:.9rem">${tot?eur(tot):'—'}</span>
              ${pt?`<span class="per-person" style="font-size:.82rem"> · ${eur(pt)} a testa</span>`:''}
            </span>
          </div>
        </div>
      </div>`;
  }).join('');
  return `<div class="row g-3">${cards}</div>`;
}

function voloDirRow(label, legs){
  const first = legs[0], last = legs[legs.length-1];
  const detail = legs.map((l,i)=>{
    const scalo = l.scalo && i<legs.length-1 ? ` · <span style="color:var(--stamp)">scalo ${esc(l.scalo)}</span>` : '';
    return `<div class="mono" style="font-size:.72rem;color:var(--muted)">

      ${l.compagnia?' · '+esc(l.compagnia):''}${l.n_volo?' '+esc(l.n_volo):''}${truthy(l.bagaglio)?' · 🧳':''}${scalo}
    </div>`;
  }).join('');
  return `<div class="dirrow">
    <span class="dirtag">${esc(label)}</span>
    <div style="flex:1;min-width:0">
      <div class="route">${esc(first.da||'?')}<span class="arrow">→</span>${esc(last.a||'?')}
        <span style="font-weight:400;color:var(--muted);font-size:.8rem">${toITDate(first.data_part)}${legs.length>1?` · ${legs.length-1} scalo${legs.length>2?'i':''}`:' · diretto'}</span></div>
      ${detail}
    </div>
  </div>`;
}

function voliCompare(groups, keys){
  const body = keys.map(k=>{
    const legs = groups[k], head = legs[0], pick = truthy(head.scelto);
    const a = legsOf(legs,'andata'), r = legsOf(legs,'ritorno');
    const tot = groupTotal(legs), pt = groupPT(legs);
    const scali = groupScali(legs);
    const cellDir = arr => arr.length
      ? `<span class="mono">${esc(arr[0].da||'?')}→${esc(arr[arr.length-1].a||'?')}</span><br>
         <span class="mono" style="font-size:.72rem;color:var(--muted)">${toITDate(arr[0].data_part)} ${esc(toHM(arr[0].ora_part))}</span>`
      : '<span class="chip">–</span>';
    return `<tr class="${pick?'picked':''}">
      <td><button class="btn btn-sm ${pick?'btn-ok':'btn-ghost'}" onclick="toggleScelta('${jsArg(k)}')">${pick?'✓':'scegli'}</button></td>
      <td class="mono">${esc(head.opzione||'?')}</td>
      <td>${cellDir(a)}</td>
      <td>${cellDir(r)}</td>
      <td class="mono">${scali?scali:'diretto'}</td>
      <td class="mono">${tot?eur(tot):'—'}</td>
      <td class="mono per-person">${pt?eur(pt):'—'}</td>
      <td class="text-nowrap">
        <button class="icon-btn" title="Modifica" onclick="editVoloById('${jsArg(k)}')">✎</button>
        <button class="icon-btn" title="Duplica" onclick="dupVolo('${jsArg(k)}')">⧉</button>
        <button class="icon-btn" title="Elimina" onclick="delVolo('${jsArg(k)}')">🗑</button>
      </td></tr>`;
  }).join('');
  return `<div class="sheet p-2 p-md-3" style="overflow-x:auto">
    <table class="data">
      <thead><tr><th></th><th>opz.</th><th>andata</th><th>ritorno</th><th>scali</th><th>totale</th><th>a testa</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
      scegliendo un'opzione le altre che coprono le stesse direzioni vengono despuntate automaticamente
    </p>
  </div>`;
}

/* --- scelta rapida (esclusiva per direzione), ottimistica --- */
async function toggleScelta(gid){
  const groups = voliGroups(CURRENT_DATA?.Voli||[]);
  const legs = groups[gid];
  if(!legs) return;
  const on = !truthy(legs[0].scelto);
  const dirs = new Set(groupDirs(legs));
  const rows = CURRENT_DATA.Voli||[];
  const prev = rows.map(r=>r.scelto);
  rows.forEach(r=>{
    const k = String(r.gruppo_id||r.id);
    if(k===String(gid)) r.scelto = on ? 'Sì' : '';
    else if(on && dirs.has(dirKeyOf(r))) r.scelto = '';
  });
  refreshView();
  try{
    await api('set_scelta', { viaggio_id: CURRENT_TRIP.id, gruppo_id: gid, scelto: on, esclusivo: true });
    toast(on?'Volo scelto ✓':'Scelta rimossa','ok');
  }catch(e){
    rows.forEach((r,i)=>r.scelto = prev[i]);
    refreshView();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore: '+e.message,'error');
  }
}

/* --- duplica un'opzione (per confrontare varianti) --- */
async function dupVolo(gid){
  const groups = voliGroups(CURRENT_DATA?.Voli||[]);
  const legs = groups[gid];
  if(!legs) return;
  const ng = genGroupId();
  const maxOpz = Object.values(groups).reduce((m,g)=>Math.max(m, num(g[0].opzione)), 0);
  const records = legs.map(l=>{
    const c = Object.assign({}, l);
    delete c.id;
    c.gruppo_id = ng; c.opzione = maxOpz+1; c.scelto = '';
    return c;
  });
  try{
    const saved = await api('create_many', { sheet:'Voli', records });
    applyLocal('Voli','create_many', saved);
    toast('Opzione duplicata ✓','ok');
    refreshView();
  }catch(e){ if(e instanceof AuthError) sessionExpired(); else toast('Errore: '+e.message,'error'); }
}

/* --- abbina un'andata e un ritorno in un'unica opzione --- */
async function abbinaVolo(gid){
  const groups = voliGroups(CURRENT_DATA?.Voli||[]);
  const me = groups[gid];
  if(!me) return;
  const myDirs = new Set(groupDirs(me));
  const cands = Object.keys(groups).filter(k=>{
    if(k===gid) return false;
    const dirs = groupDirs(groups[k]);
    return dirs.length===1 && !myDirs.has(dirs[0]);
  });
  if(!cands.length) return toast('Nessuna opzione compatibile da abbinare','error');
  const buttons = cands.slice(0,6).map(k=>{
    const g = groups[k];
    return { label:`opz. ${g[0].opzione||'?'} · ${g[0].da||'?'}→${g[g.length-1].a||'?'} ${toITDate(g[0].data_part)}`, value:k, cls:'btn-ink' };
  });
  buttons.unshift({label:'Annulla', value:null, cls:'btn-ghost'});
  const pick = await ask('Con quale opzione vuoi abbinare questo volo?', buttons);
  if(!pick) return;

function secCoseDaFare(rows, tid){

function setCdfView(v){ CDF_VIEW = v; renderSection('cosedafare'); }

function ensureCdfMonth(){
  if(!CDF_MONTH){
    const iso = toISODate(CURRENT_TRIP && CURRENT_TRIP.data_inizio);
    let base = iso ? new Date(iso+'T12:00:00') : new Date();
    CDF_MONTH = new Date(base.getFullYear(), base.getMonth(), 1);
  }
}

function cdfMonthShift(delta){
  ensureCdfMonth();
  CDF_MONTH = new Date(CDF_MONTH.getFullYear(), CDF_MONTH.getMonth()+delta, 1);
  renderSection('cosedafare');
}

function cdfList(rows, tid){
  const withDate = rows.filter(r=>toISODate(r.data)).sort((a,b)=>{
    const d = toISODate(a.data).localeCompare(toISODate(b.data));
    return d!==0 ? d : (toHM(a.ora)||'99:99').localeCompare(toHM(b.ora)||'99:99');   // dentro il giorno: per ora
  });
  const noDate   = rows.filter(r=>!toISODate(r.data));
  const groups = {};
  withDate.forEach(r=>{ const k=toISODate(r.data); (groups[k] ??= []).push(r); });
  const dayBlocks = Object.keys(groups).map(k=>`
    <div class="mb-3">
      <p class="eyebrow mb-2">${toITDateLong(k)}</p>
      ${groups[k].map(r=>cdfItem(r)).join('')}
    </div>`).join('');
  const noDateBlock = noDate.length ? `
    <div class="mb-3">
      <p class="eyebrow mb-2">Senza data</p>
      ${noDate.map(r=>cdfItem(r)).join('')}
    </div>` : '';
  if(!rows.length) return `<div class="sheet empty"><div class="big">Ancora niente da fare</div><div>Aggiungi la prima attività.</div></div>`;
  return `<div class="sheet p-3">${dayBlocks}${noDateBlock}</div>`;
}

function cdfItem(r){

function cdfCalendar(rows, tid){
  ensureCdfMonth();
  const y = CDF_MONTH.getFullYear(), mo = CDF_MONTH.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay()+6)%7;      // lun=0
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const monthName = CDF_MONTH.toLocaleDateString('it-IT', {month:'long', year:'numeric'});

  const byDay = {};
  rows.forEach(r=>{ const k=toISODate(r.data); if(k) (byDay[k] ??= []).push(r); });

  const vStart = toISODate(CURRENT_TRIP?.data_inizio), vEnd = toISODate(CURRENT_TRIP?.data_fine);

  const dow = ['lun','mar','mer','gio','ven','sab','dom']
    .map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDay[iso]||[];
    const inTrip = vStart && vEnd && iso>=vStart && iso<=vEnd;
    const chips = items.slice(0,3).map(r=>
      `<div class="cal-ev" title="${esc(r.attivita)}" onclick="editRowById('CoseDaFare','${jsArg(r.id)}')">${tipoIcon(r.tipo)} ${esc((r.attivita||'').slice(0,14))}</div>`).join('');
    const more = items.length>3 ? `<div class="cal-more">+${items.length-3}</div>` : '';
    cells += `<div class="cal-cell${inTrip?' in-trip':''}" ondblclick="cdfQuickAdd('${iso}','${jsArg(tid)}')">
      <div class="cal-num">${d}</div>${chips}${more}
    </div>`;
  }

  return `
    <div class="sheet p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(-1)">‹</button>
        <strong style="font-family:'Fraunces',serif;text-transform:capitalize">${esc(monthName)}</strong>
        <button class="btn btn-ghost btn-sm" onclick="cdfMonthShift(1)">›</button>
      </div>
      <div class="cal-grid cal-head">${dow}</div>
      <div class="cal-grid">${cells}</div>
      <p class="mono mt-2 mb-0" style="font-size:.68rem;color:var(--muted)">
        doppio click su un giorno per aggiungere · giorni evidenziati = durata vacanza
      </p>
    </div>`;
}

/* ---------- conversioni data / ora / numeri ---------- */
function toISODate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))            return m[1]+'-'+m[2]+'-'+m[3];
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){
    let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0');
  }
  return '';
}

function toITDate(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}

function toITDateLong(raw){
  const iso = toISODate(raw);
  if(!iso) return esc(raw||'');
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
}

function toHM(raw){
  if(!raw) return '';
  const m = String(raw).trim().match(/(\d{1,2}):(\d{2})/);
  return m ? m[1].padStart(2,'0')+':'+m[2] : '';
}

// aritmetica date in ISO (mezzogiorno = niente sorprese con l'ora legale)
function addDays(iso, n){
  const s = toISODate(iso);
  if(!s) return '';
  const d = new Date(s+'T12:00:00');
  d.setDate(d.getDate() + (Number(n)||0));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function minutesBetween(d1,t1,d2,t2){
  d1=toISODate(d1); d2=toISODate(d2); t1=toHM(t1); t2=toHM(t2);
  if(!d1||!d2||!t1||!t2) return null;
  const a = new Date(d1+'T'+t1+':00'), b = new Date(d2+'T'+t2+':00');
  return Math.round((b-a)/60000);
}

function fmtDur(min){
  if(min==null || isNaN(min)) return '';
  const sign = min<0 ? '−' : '';
  min = Math.abs(min);
  const h = Math.floor(min/60), m = min%60;
  return sign + (h?h+'h ':'') + (m||!h ? m+'m' : '');
}

function parseNum(raw){
  if(raw === '' || raw == null) return '';
  let s = String(raw).trim().replace(/[€\s]/g,'');
  if(s === '') return '';
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? '' : n;
}

function fmtNumIT(n){
  if(n === '' || n == null || isNaN(n)) return '';
  return Number(n).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function round2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }

/* -------- AUTO-CALCOLO totale <-> a testa -------- */
function recalc(sheet, changed){
  const g = id => { const el = $('#f_'+id); return el ? parseNum(el.value) : ''; };
  const set = (id,val) => { const el = $('#f_'+id); if(el && document.activeElement!==el) el.value = fmtNumIT(val); };
  const persone = g('persone') || g('n_persone') || 0;
  const notti   = g('notti') || 0;

  if(sheet==='Alloggi'){
    const tot=g('totale'), pt=g('prezzo_testa'), ptn=g('prezzo_testa_notte'), pn=g('prezzo_notte');
    let total = tot;
    if(changed==='prezzo_testa' && pt!=='' && persone)          total = round2(pt*persone);
    else if(changed==='prezzo_testa_notte' && ptn!=='' && persone && notti) total = round2(ptn*persone*notti);
    else if(changed==='prezzo_notte' && pn!=='' && notti)        total = round2(pn*notti);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale') set('totale', total);
      if(changed!=='prezzo_testa'        && persone)         set('prezzo_testa', round2(total/persone));
      if(changed!=='prezzo_testa_notte'  && persone && notti) set('prezzo_testa_notte', round2(total/persone/notti));
      if(changed!=='prezzo_notte'        && notti)           set('prezzo_notte', round2(total/notti));
    }
  } else if(sheet==='CoseDaFare'){
    const cost=g('costo'), pt=g('prezzo_testa');
    let total = cost;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='costo')        set('costo', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  } else {
    const tot=g('totale'), pt=g('prezzo_testa');
    let total = tot;
    if(changed==='prezzo_testa' && pt!=='' && persone) total = round2(pt*persone);
    if(total!=='' && total!=null && !isNaN(total)){
      if(changed!=='totale')       set('totale', total);
      if(changed!=='prezzo_testa' && persone) set('prezzo_testa', round2(total/persone));
    }
  }
}

function togglePayAll(chk, field){

  ones.forEach(o=>{ o.disabled = chk.checked; if(chk.checked) o.checked=false; });
  recalcPay(field);
}

function onPayOne(field){
  const box = $('#f_'+field+'_box');
  const all = box.querySelector('.pay-all');
  const anyOne = [...box.querySelectorAll('.pay-one')].some(o=>o.checked);
  if(anyOne && all.checked){ all.checked=false; box.querySelectorAll('.pay-one').forEach(o=>o.disabled=false); }
  recalcPay(field);
}

function readPayValue(field){
  const box = $('#f_'+field+'_box');
  if(!box){ const el=$('#f_'+field); return el?el.value.trim():''; }
  const all = box.querySelector('.pay-all');
  if(all && all.checked) return 'Tutti';
  const names = [...box.querySelectorAll('.pay-one')].filter(o=>o.checked).map(o=>o.value);
  return names.length ? names.join(', ') : 'Tutti';
}

function payCountInForm(field){
  const box = $('#f_'+field+'_box');
  if(!box) return tripPeople(CURRENT_DATA);
  const all = box.querySelector('.pay-all');
  if(all && all.checked) return tripPeople(CURRENT_DATA);
  const n = [...box.querySelectorAll('.pay-one')].filter(o=>o.checked).length;
  return n>0 ? n : tripPeople(CURRENT_DATA);
}

function recalcPay(field){
  if(field==='v_pag') return volRecalcPrice('paganti');
  const totEl = $('#f_totale'); const ptEl = $('#f_prezzo_testa');
  if(!totEl || !ptEl) return;
  const tot = parseNum(totEl.value);
  const n = payCountInForm(field);
  if(tot!=='' && n && document.activeElement!==ptEl){
    ptEl.value = fmtNumIT(round2(tot/n));
  }
}

let MODAL = null;
function ensureModal(){
  if(MODAL) return MODAL;
  const el = document.createElement('div');
  el.className='modal fade'; el.id='editModal'; el.tabIndex=-1;
  el.innerHTML=`<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content" style="background:#fbf8f0;border:1px solid var(--line);border-radius:14px">
      <div class="modal-header" style="border-bottom:1px solid var(--line)">
        <h5 class="modal-title" id="mTitle" style="font-family:'Fraunces',serif"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-footer" style="border-top:1px solid var(--line)">
        <button class="btn btn-ghost btn-sm" data-bs-dismiss="modal">Annulla</button>
        <button class="btn btn-stamp btn-sm" id="mSave">Salva</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);
  // Invio = salva (tranne nelle textarea); autofocus sul primo campo
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.type!=='checkbox'){
      e.preventDefault(); $('#mSave').click();
    }
  });
  el.addEventListener('shown.bs.modal', ()=>{
    const f = el.querySelector('.modal-body input:not([type=checkbox]), .modal-body select, .modal-body textarea');
    if(f) f.focus();
  });
  MODAL = new bootstrap.Modal(el);
  return MODAL;
}

          <input class="form-control" id="f_${f}" type="text" value="${esc(v)}" placeholder="aggiungi prima i partecipanti">

        <div class="sheet p-2" id="f_${f}_box" data-field="${f}">
          <div class="form-check">
            <input class="form-check-input pay-all" type="checkbox" id="f_${f}_all" ${allSel?'checked':''} onchange="togglePayAll(this,'${f}')">
            <label class="form-check-label" for="f_${f}_all"><strong>Tutti</strong></label>
          </div>
          <hr class="my-1" style="border-color:var(--line)">
          ${people.map((n,i)=>`<div class="form-check">
            <input class="form-check-input pay-one" type="checkbox" id="f_${f}_${i}" value="${esc(n)}" ${(!allSel && selected.includes(n))?'checked':''} ${allSel?'disabled':''} onchange="onPayOne('${f}')">
            <label class="form-check-label" for="f_${f}_${i}">${esc(n)}</label></div>`).join('')}
        </div>
        <div class="mono" style="font-size:.68rem;color:var(--muted);margin-top:.2rem">seleziona chi partecipa a questa voce · "Tutti" = alla pari</div>
      </div>`;
    }
    if(AIRLINE_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" list="airlines" value="${esc(v)}" placeholder="scegli o scrivi…"></div>`;
    }
    if(LINK_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>

    }
    if(CUR_FIELDS.includes(f)){
      const hint = f==='prezzo_testa' ? 'auto dal totale'
                 : f==='prezzo_testa_notte' ? 'auto (÷ persone ÷ notti)'
                 : f==='prezzo_notte' ? 'auto (÷ notti)'
                 : f==='totale' ? 'oppure compila "a testa"' : '';
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}${hint?` <span style="font-weight:400;color:var(--muted);font-size:.7rem">— ${hint}</span>`:''}</label>

          <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>

        </div></div>`;
    }
    if(NUM_FIELDS.includes(f)){
      return `<div class="mb-2"><label class="form-label">${esc(lbl(f))}</label>
        <input class="form-control" id="f_${f}" type="text" inputmode="decimal" value="${v!==''?esc(fmtNumIT(parseNum(v))):''}"></div>`;

  }).join('') + airlineDatalist() + airportDatalist();

  CALC_TRIGGERS.forEach(t=>{
    const el = $('#f_'+t);
    if(el) el.addEventListener('input', ()=>recalc(sheet, t));
  });

  const payField = fields.includes('paganti') ? 'paganti' : (fields.includes('chi') && fields.includes('totale') ? 'chi' : null);
  if(payField){
    const totEl = $('#f_totale');
    if(totEl) totEl.addEventListener('input', ()=>recalcPay(payField));
    const ptEl = $('#f_prezzo_testa');
    if(ptEl) ptEl.addEventListener('input', ()=>{
      const pt = parseNum(ptEl.value); const n = payCountInForm(payField);
      if(pt!=='' && n && totEl && document.activeElement!==totEl) totEl.value = fmtNumIT(round2(pt*n));
    });
  }

  $('#mSave').onclick = ()=> withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
    const out = { id: rec.id, viaggio_id: rec.viaggio_id };
    fields.forEach(f=>{
      if(f==='paganti' || f==='chi'){ out[f] = readPayValue(f); return; }
      const el = $('#f_'+f); if(!el) return;
      if(BOOL_FIELDS.includes(f))        out[f] = el.checked ? 'Sì' : '';
      else if(INT_FIELDS.includes(f))    out[f] = el.value!=='' ? Math.round(parseNum(el.value)) : '';
      else if(NUM_FIELDS.includes(f))    out[f] = parseNum(el.value);
      else                               out[f] = el.value.trim();
    });
    if(rec.id){
      await api('update',{sheet, record:out});
      applyLocal(sheet, 'update', out);
    } else {
      const saved = await api('create',{sheet, record:out});
      applyLocal(sheet, 'create', saved);
    }
    MODAL.hide(); toast('Salvato ✓','ok');
    refreshView();
  });

  MODAL.show();
}

function editTrip(trip){
  editRow('Viaggi', trip, null);

// Stato dell'editor volo (le tratte vivono qui, non nel DOM)
let VE = null;

function emptyLeg(dataPart){
  return { compagnia:'', n_volo:'', da:'', a:'', data_part: toISODate(dataPart)||'',
           ora_part:'', ora_arr:'', plus1:false, gap1:false, bagaglio:'' };
}

// Da righe del foglio a tratte dell'editor (ricava i flag "+1 giorno")
function legsFromRows(rows){
  return rows.map((r,i)=>{
    const dp = toISODate(r.data_part), da = toISODate(r.data_arr);
    const prevArr = i>0 ? toISODate(rows[i-1].data_arr) : '';
    return {
      compagnia:r.compagnia||'', n_volo:r.n_volo||'', da:r.da||'', a:r.a||'',
      data_part: dp, ora_part: toHM(r.ora_part), ora_arr: toHM(r.ora_arr),
      plus1: !!(dp && da && da>dp),
      gap1:  !!(i>0 && prevArr && dp && dp>prevArr),
      bagaglio: r.bagaglio||''
    };
  });
}

function veLegs(dk){ return dk==='a' ? VE.A : VE.R; }
function veSetLegs(dk, arr){ if(dk==='a') VE.A = arr; else VE.R = arr; }
function veDirName(dk){ return dk==='a' ? (VE.AR ? 'Andata' : VE.soloDir) : 'Ritorno'; }

// Legge le tratte dal DOM nello stato (mai perdere quello che si sta scrivendo)
function volReadLegs(dk){
  const arr = veLegs(dk);
  const out = arr.map((L,i)=>{
    const g = k => document.getElementById(dk+'_'+k+'_'+i);
    if(!g('comp')) return L;
    return {
      compagnia: g('comp').value,
      n_volo:    g('nvolo').value,
      da: (g('da').value||'').trim().toUpperCase(),
      a:  (g('a').value ||'').trim().toUpperCase(),
      data_part: i===0 && g('dpart') ? g('dpart').value : '',
      ora_part:  g('opart').value,
      ora_arr:   g('oarr').value,
      plus1: g('plus1').checked,
      gap1:  i>0 && g('gap1') ? g('gap1').checked : false,
      bagaglio: g('bag').checked ? 'Sì' : ''
    };
  });
  veSetLegs(dk, out);
  return out;
}

// Catena delle date: la partenza di ogni tratta deriva dall'arrivo della precedente
function volChain(dk){
  const arr = veLegs(dk);
  const out = []; let prevArr = '';
  arr.forEach((L,i)=>{
    const dp = i===0 ? (toISODate(L.data_part)||'') : (prevArr ? addDays(prevArr, L.gap1?1:0) : '');
    const da = dp ? addDays(dp, L.plus1?1:0) : '';
    out.push({ dp, da });
    prevArr = da;
  });
  return out;
}

// Aggiorna SOLO le parti calcolate (date derivate, durate, scali): niente re-render,
// così non si perde mai il focus mentre si digita
function volChainRefresh(dk){
  if(!VE) return;
  volReadLegs(dk);
  const arr = veLegs(dk), chain = volChain(dk);
  arr.forEach((L,i)=>{
    const dv = document.getElementById(dk+'_dpv_'+i);
    if(dv) dv.textContent = chain[i].dp ? toITDateLong(chain[i].dp) : '—';
    const info = document.getElementById(dk+'_info_'+i);
    if(!info) return;
    const parts = [];
    const dur = minutesBetween(chain[i].dp, L.ora_part, chain[i].da, L.ora_arr);
    if(dur!=null) parts.push(dur<0 ? '⚠️ arrivo prima della partenza' : 'volo '+fmtDur(dur));
    const nx = arr[i+1];
    if(nx){
      const lay = minutesBetween(chain[i].da, L.ora_arr, chain[i+1].dp, nx.ora_part);
      if(lay!=null) parts.push('scalo '+fmtDur(lay)+(lay<45?' ⚠️ stretto':''));
    }
    info.textContent = parts.join(' · ');
  });
  volWarnDates();
}

// Avviso non bloccante: date fuori dal periodo del viaggio
function volWarnDates(){
  const box = document.getElementById('v_warn');
  if(!box) return;
  const s = toISODate(CURRENT_TRIP?.data_inizio), e = toISODate(CURRENT_TRIP?.data_fine);
  if(!s || !e){ box.textContent=''; return; }
  const out = [];
  ['a','r'].forEach(dk=>{
    if(dk==='r' && !VE.AR) return;
    const chain = volChain(dk);
    chain.forEach(c=>{ if(c.dp && (c.dp<s || c.dp>e)) out.push(c.dp); });
  });
  box.textContent = out.length ? `⚠️ alcune date sono fuori dal periodo del viaggio (${toITDate(s)} → ${toITDate(e)})` : '';
}

function volFromFlightNo(dk, i){
  const el = document.getElementById(dk+'_nvolo_'+i);
  const comp = document.getElementById(dk+'_comp_'+i);
  if(!el || !comp || comp.value.trim()) return;
  const m = String(el.value||'').trim().toUpperCase().match(/^([A-Z0-9]{2})\s*\d/);
  if(m && AIRLINE_BY_CODE[m[1]]) comp.value = AIRLINE_BY_CODE[m[1]];
}

function volAddLeg(dk){
  volReadLegs(dk);
  const arr = veLegs(dk);
  const prev = arr[arr.length-1];
  const L = emptyLeg('');
  if(prev) L.da = prev.a || '';
  arr.push(L);
  volRenderLegs(dk);
}

function volDelLeg(dk, i){
  volReadLegs(dk);
  const arr = veLegs(dk);
  arr.splice(i,1);
  volRenderLegs(dk);
}

// Copia l'andata al contrario nel ritorno (rotta invertita, data = fine viaggio)
function volMirror(){
  volReadLegs('a'); volReadLegs('r');
  const src = veLegs('a');
  if(!src.length) return;
  const mirrored = src.slice().reverse().map((L,i)=>({
    compagnia: L.compagnia, n_volo:'', da: L.a, a: L.da,
    data_part: i===0 ? (toISODate(CURRENT_TRIP?.data_fine)||'') : '',
    ora_part:'', ora_arr:'', plus1:false, gap1:false, bagaglio: L.bagaglio
  }));
  veSetLegs('r', mirrored);
  volRenderLegs('r');
  toast('Ritorno compilato dall\'andata','ok');
}

  volReadLegs('a'); volReadLegs('r');

function volToggleSep(chk){

function volRecalcPrice(src){
  const tA = document.getElementById('v_totale');
  const tR = document.getElementById('v_totale_r');
  const pt = document.getElementById('v_prezzo_testa');
  if(!tA || !pt) return;
  const n = payCountInForm('v_pag');
  if(src==='prezzo_testa'){
    const v = parseNum(pt.value);
    if(v!=='' && n && !VE.sep && document.activeElement!==tA) tA.value = fmtNumIT(round2(v*n));
    return;
  }
  const tot = (parseNum(tA.value)||0) + (VE.sep ? (parseNum(tR?.value)||0) : 0);
  if(tot && n && document.activeElement!==pt) pt.value = fmtNumIT(round2(tot/n));
  const sum = document.getElementById('v_tot_sum');
  if(sum) sum.textContent = tot ? eur(tot) : '—';
}

function volRenderLegs(dk){
  const box = document.getElementById('v_legs_'+dk);
  if(!box) return;
  const arr = veLegs(dk), chain = volChain(dk);
  box.innerHTML = arr.map((L,i)=>volLegCard(L,i,arr.length,dk,chain[i])).join('');
  volChainRefresh(dk);
}

function editVolo(group, tid){
  ensureModal();
  const isNew = !group;
  const base = (group && group[0]) || { viaggio_id: tid };
  const gruppo_id = base.gruppo_id || genGroupId();
  const viaggio_id = base.viaggio_id || tid;

  const rowsA = group ? legsOf(group,'andata')  : [];
  const rowsR = group ? legsOf(group,'ritorno') : [];
  // righe senza direzione riconosciuta: trattale come andata
  const rowsX = group ? group.filter(l=>!(dirKeyOf(l) in DIR_RANK)) : [];

  const headA = rowsA[0] || rowsX[0], headR = rowsR[0];

  VE = {
    AR:  isNew ? true : (rowsA.length>0 && rowsR.length>0),
    soloDir: rowsR.length && !rowsA.length ? 'Ritorno' : 'Andata',
    sep: !!(headA && headR && num(headR.totale)>0),
    A: (rowsA.length||rowsX.length) ? legsFromRows(rowsA.length?rowsA:rowsX) : [ emptyLeg(CURRENT_TRIP?.data_inizio) ],
    R: rowsR.length ? legsFromRows(rowsR) : [ emptyLeg(CURRENT_TRIP?.data_fine) ]
  };

  // numero opzione: il prossimo libero se è nuova
  const groups = voliGroups(CURRENT_DATA?.Voli||[]);
  const nextOpz = Object.values(groups).reduce((m,g)=>Math.max(m, num(g[0].opzione)), 0) + 1;
  const opzVal = base.opzione || (isNew ? nextOpz : 1);

  const totA = headA ? parseNum(headA.totale) : '';
  const totR = headR ? parseNum(headR.totale) : '';
  const ptV  = (num(headA?.prezzo_testa) + num(headR?.prezzo_testa)) || '';

  $('#mTitle').textContent = isNew ? 'Nuova opzione di volo' : 'Modifica opzione di volo';
  $('#mBody').innerHTML = `
    <div class="row g-2 align-items-end mb-2">
      <div class="col-4"><label class="form-label">opzione n°</label>
        <input class="form-control" id="v_opzione" type="number" min="1" step="1" inputmode="numeric" value="${esc(opzVal)}"></div>
      <div class="col-8 d-flex gap-3 pb-1">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="v_ar" ${VE.AR?'checked':''} onchange="volToggleAR(this)">
          <label class="form-check-label" for="v_ar"><strong>andata e ritorno</strong></label></div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="v_scelto" ${truthy(base.scelto)?'checked':''}>
          <label class="form-check-label" for="v_scelto">scelto</label></div>
      </div>
      <div class="col-12" id="v_solodir_wrap" style="display:${VE.AR?'none':''}">
        <label class="form-label">tipo di viaggio</label>
        <select class="form-select" id="v_solodir" onchange="volSoloDir(this)">
          <option value="Andata"${VE.soloDir==='Andata'?' selected':''}>solo andata</option>
          <option value="Ritorno"${VE.soloDir==='Ritorno'?' selected':''}>solo ritorno</option>
        </select>
      </div>
    </div>

    ${volPaganti(base)}

    <div class="sheet p-2 p-md-3 mb-2" style="background:#fdfbf5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <p class="eyebrow mb-0">Prezzo</p>
        <div class="form-check m-0" id="v_sep_wrap" style="display:${VE.AR?'':'none'}">
          <input class="form-check-input" type="checkbox" id="v_sep" ${VE.sep?'checked':''} onchange="volToggleSep(this)">
          <label class="form-check-label" style="font-size:.78rem" for="v_sep">biglietti separati A / R</label>
        </div>
      </div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label" id="v_tot_a_label">${VE.sep?'totale andata':'totale volo'}</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
            <input class="form-control" id="v_totale" type="text" inputmode="decimal" value="${totA!==''?esc(fmtNumIT(totA)):''}" placeholder="0,00" oninput="volRecalcPrice('totale')"></div></div>
        <div class="col-6" id="v_tot_r_wrap" style="display:${VE.sep?'':'none'}"><label class="form-label">totale ritorno</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
            <input class="form-control" id="v_totale_r" type="text" inputmode="decimal" value="${totR!==''?esc(fmtNumIT(totR)):''}" placeholder="0,00" oninput="volRecalcPrice('totale')"></div></div>
        <div class="col-6"><label class="form-label">a testa <span style="font-weight:400;color:var(--muted);font-size:.7rem">— auto</span></label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--paper-2);border-color:var(--line)">€</span>
            <input class="form-control" id="v_prezzo_testa" type="text" inputmode="decimal" value="${ptV!==''?esc(fmtNumIT(ptV)):''}" placeholder="0,00" oninput="volRecalcPrice('prezzo_testa')"></div></div>
        <div class="col-6 d-flex align-items-end">
          <div class="mono" style="font-size:.8rem;color:var(--ink-soft)">totale opzione: <strong id="v_tot_sum">—</strong></div>
        </div>
      </div>
    </div>

    <div id="v_err" class="errbox mb-2" style="display:none"></div>
    <div id="v_warn" class="warnline mb-1"></div>

    <div id="v_block_a">${volDirBlock('a', VE.AR?'Andata':VE.soloDir)}</div>
    <div id="v_block_r" style="display:${VE.AR?'':'none'}">${volDirBlock('r','Ritorno')}</div>
    ${airlineDatalist()}${airportDatalist()}
  `;

  volRenderLegs('a');
  volRenderLegs('r');
  volRecalcPrice('totale');

  $('#mSave').onclick = ()=>{
    volReadLegs('a'); if(VE.AR) volReadLegs('r');
    const errs = volValidate();
    const box = $('#v_err');
    if(errs.length){
      box.style.display='';
      box.innerHTML = '<strong>Controlla questi punti:</strong><ul class="mb-0 ps-3">'+errs.map(e=>`<li>${esc(e)}</li>`).join('')+'</ul>';
      box.scrollIntoView({block:'nearest'});
      return;
    }
    box.style.display='none';

    return withBtnLoading($('#mSave'), 'Salvo…', async ()=>{
      const opzione = Math.max(1, Math.round(parseNum($('#v_opzione').value)||1));
      const paganti = readPayValue('v_pag');
      const persone = payCountInForm('v_pag');
      const scelto  = $('#v_scelto').checked ? 'Sì' : '';
      const totA2   = parseNum($('#v_totale').value);
      const totR2   = VE.sep ? parseNum($('#v_totale_r').value) : '';
      const totale  = (num(totA2) + num(totR2)) || 0;
      const ptTot   = parseNum($('#v_prezzo_testa').value);
      // ripartizione del "a testa" coerente con come è spezzato il totale
      const ptA = VE.sep && totale ? round2(ptTot * (num(totA2)/totale)) : ptTot;
      const ptR = VE.sep && totale ? round2(ptTot - ptA) : '';

      const common = { viaggio_id, gruppo_id, opzione, persone, paganti, scelto };
      let records = volBuildRecords('a', veDirName('a'), common, totA2, ptA);
      if(VE.AR) records = records.concat(volBuildRecords('r', 'Ritorno', common, VE.sep?totR2:'', VE.sep?ptR:''));

      let saved;
      if(isNew){
        saved = await api('create_many', { sheet:'Voli', records });
        applyLocal('Voli','create_many', saved);
      } else {
        saved = await api('replace_group', { sheet:'Voli', gruppo_id, records });
        applyLocal('Voli','replace_group', { gruppo_id, records: saved });
      }
      MODAL.hide(); toast('Volo salvato ✓','ok');
      refreshView();
    });
  };

  MODAL.show();
}

function volBuildRecords(dk, direzione, common, priceTot, pricePT){
  const arr = veLegs(dk), chain = volChain(dk);
  return arr.map((L,i)=>{
    // scalo = attesa tra questa tratta e la successiva (calcolato, non digitato)
    let scalo = '';
    const nx = arr[i+1];
    if(nx){
      const lay = minutesBetween(chain[i].da, L.ora_arr, chain[i+1].dp, nx.ora_part);
      if(lay!=null) scalo = fmtDur(lay);
    }
    return Object.assign({}, common, {
      direzione, tratta: i+1,
      compagnia: (L.compagnia||'').trim(), n_volo: (L.n_volo||'').trim(),
      da: (L.da||'').trim().toUpperCase(), a: (L.a||'').trim().toUpperCase(),
      data_part: chain[i].dp, ora_part: L.ora_part,
      data_arr:  chain[i].da, ora_arr:  L.ora_arr,
      scalo,
      totale:       i===0 ? (priceTot===''?'':priceTot) : '',
      prezzo_testa: i===0 ? (pricePT ===''?'':pricePT)  : '',
      bagaglio: L.bagaglio, note: ''
    });
  });
}

function volValidate(){
  const errs = [];
  const check = (dk, label)=>{
    const arr = veLegs(dk), chain = volChain(dk);
    if(!arr.length){ errs.push(`${label}: nessuna tratta`); return; }
    arr.forEach((L,i)=>{
      const t = arr.length>1 ? `${label} tratta ${i+1}` : label;
      if(!L.da || !L.a) errs.push(`${t}: manca l'aeroporto di partenza o di arrivo`);
      if(i===0 && !chain[0].dp) errs.push(`${label}: manca la data di partenza`);
      const dur = minutesBetween(chain[i].dp, L.ora_part, chain[i].da, L.ora_arr);
      if(dur!=null && dur<0) errs.push(`${t}: l'arrivo precede la partenza (serve "+1 giorno"?)`);
      if(i>0){
        const lay = minutesBetween(chain[i-1].da, arr[i-1].ora_arr, chain[i].dp, L.ora_part);
        if(lay!=null && lay<0) errs.push(`${t}: parte prima dell'arrivo della tratta precedente`);
      }
    });
  };
  check('a', veDirName('a'));
  if(VE.AR){
    check('r', 'Ritorno');
    const ca = volChain('a'), cr = volChain('r');
    const lastA = ca[ca.length-1]?.da, firstR = cr[0]?.dp;
    if(lastA && firstR && firstR < lastA) errs.push('Il ritorno parte prima che sia arrivata l\'andata');
  }
  return errs;
}

function genGroupId(){ return 'g' + Math.random().toString(36).slice(2,10); }
function truthyEq(a,b){ return String(a||'').toLowerCase()===String(b).toLowerCase(); }

/* ============================================================
   BACKUP / RESTORE
   ============================================================ */
async function doExport(){
  toast('Preparo il backup…');
  try{
    const data = await api('export');
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `triphub-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup scaricato ✓','ok');
  }catch(e){
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore backup: '+e.message,'error');
  }
}

async function doImport(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  let payload;
  try { payload = JSON.parse(await file.text()); }
  catch(e){ return toast('File non valido (non è JSON)','error'); }

  const mode = await ask('Come vuoi importare il backup?', [
    {label:'Annulla', value:null, cls:'btn-ghost'},
    {label:'Aggiungi soltanto', value:'merge', cls:'btn-ink'},
    {label:'Sostituisci tutto', value:'replace', cls:'btn-del'},
  ]);
  if(!mode) return;
  if(mode==='replace' && !await askConfirm('Confermi? I dati attuali verranno SOSTITUITI con quelli del backup.', true)) return;

  showOverlay('Importo il backup…');
  try{
    const report = await api('import', { payload, mode });
    hideOverlay();
    const tot = Object.values(report).reduce((s,n)=>s+(Number(n)||0),0);
    toast(`Import completato: ${tot} righe`,'ok');
    reloadCurrent();               // dopo un import serve ricaricare tutto dal server
  }catch(e){
    hideOverlay();
    if(e instanceof AuthError) sessionExpired();
    else toast('Errore import: '+e.message,'error');
  }
}

function showOverlay(msg){
  let ov = $('#loadOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id='loadOverlay'; ov.className='load-overlay';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="spinner-border" style="color:var(--stamp);width:2.5rem;height:2.5rem"></div>
    <div class="mono">${esc(msg||'Attendere…')}</div>`;
  ov.style.display='flex';
}
function hideOverlay(){ const ov=$('#loadOverlay'); if(ov) ov.style.display='none'; }
